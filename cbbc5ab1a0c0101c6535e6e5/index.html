<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF8F3">
<title>集客管理コンソール｜Dubai Shiogensui</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF8F3' stroke='%23EBE4D7' stroke-width='2'/%3E%3Cpath d='M13 28h38c0 11.5-8.5 20-19 20S13 39.5 13 28Z' fill='none' stroke='%23B93D28' stroke-width='3.4'/%3E%3Cpath d='M24 21c0-4 4-4 4-8M32 21c0-4 4-4 4-8M40 21c0-4 4-4 4-8' fill='none' stroke='%238A6210' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Dubai Shiogensui（ドバイ JLT）集客管理コンソール
   ・日本（Yui）とドバイ（Ai・Ryuki）の双方向タスク管理
   ・1画面＝1ファイル。バックエンド無し（費用ゼロ）。
     データは各端末の localStorage、受け渡しは「共有コード」のコピペ。
   ・操作者は個別アカウント（暗証番号つき）。端末を複数人で共有する前提。
   ・配色は黒基調＋朱＋金。他案件（保険ハブ＝ネイビー／クリーム）とは別系統
   ============================================================ */
:root{
  /* 地は生成り。飲食店なので濃い面は置かない。
     濃色を許すのは、文字・1pxの線・押すためのボタンだけ（主ボタンと送信は朱で高さ46px）。
     面（カード・帯・見出しの背景）には一切使わない */
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#F7F3EB; --surface3:#F1EBE0;
  --line:#EBE4D7; --line2:#DCD3C4;
  --ink:#33302B;                      /* 主ボタン・タブ選択に使う墨。面には使わない */
  --tx:#33302B; --tx2:#6F675D; --tx3:#9A9186;
  /* 朱＝この画面でいちばん強い色。「止まっている」「今日やる」「強調」だけに使う */
  --accent:#C4452E; --accent-d:#A73722; --accent-bg:#FBEDE8;
  --gold:#9A6E12; --gold-bg:#FAF1DC;
  --ok:#2F7D5B; --ok-bg:#E9F4EE;
  --warn:#A8741A; --warn-bg:#FBF2DF;
  --info:#1F5C8B; --info-bg:#E9F1F7;
  --violet:#63488F; --violet-bg:#F1ECF8;
  --fs-xs:.75rem; --fs-sm:.86rem; --fs-base:.97rem; --fs-md:1.06rem; --fs-lg:1.2rem; --fs-xl:1.55rem; --fs-2xl:2.15rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r:12px; --r-sm:9px;
}
/* 上書き追記（:root の差し替えは禁止。上の --fs-* --sp-* --r が消えると全画面が壊れる）。
   淡地の上で AA(4.5:1) に乗らない色を実測で詰め直したもの。--tx3 は49か所で使われており最優先 */
:root{
  --tx2:#665E54; --tx3:#6F6659;
  --ink:#B93D28;                       /* 主ボタン・FAB・送信。墨のままだと濃い面が残る */
  --accent:#B93D28; --accent-d:#9C2F1C; --accent-bg:#FBEBE6;
  --gold:#8A6210; --gold-bg:#FAF1DC;
  --ok:#1F6B4A; --ok-bg:#E9F4EE;
  --warn:#8B6009; --warn-bg:#FBF2DF;
  --info:#1B5680; --info-bg:#E9F1F7;
  --violet:#59407F; --violet-bg:#F1ECF8;
  /* 拠点の識別。彩度のある色は与えない（彩度は「状態」専用）。必ず文字ラベルを併記する */
  --jp-bg:#ECF2F8; --jp-ed:#C6DAEA;
  --db-bg:#FBF3E6; --db-ed:#EBD9BB;
  --track:#EDE6D9;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;font-size:16px;}
@media(min-width:900px){ html{font-size:16.5px;} }
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",system-ui,sans-serif;
  background:var(--bg); color:var(--tx); font-size:var(--fs-base); line-height:1.7;
  letter-spacing:.015em; overflow-wrap:break-word; padding-bottom:98px;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
svg{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;color:inherit;}
a{color:var(--info);}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px;}
.hide{display:none !important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- ヘッダー ---------- */
.hd{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.hd-in{display:flex;align-items:center;gap:var(--sp-3);padding:13px 16px;max-width:1020px;margin:0 auto;}
.hd-logo{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);}
.hd-logo svg{width:20px;height:20px;}
.hd-t b{display:block;font-size:var(--fs-md);font-weight:700;line-height:1.25;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-t{text-align:left;min-width:0;min-height:44px;}
.hd-t span{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--tx2);font-weight:700;
  min-width:0;letter-spacing:.02em;line-height:1.5;white-space:nowrap;overflow:hidden;margin-top:2px;}
.hd-t span svg{width:12px;height:12px;flex:none;color:var(--tx3);}
.hd-t .ava{width:20px;height:20px;font-size:.7rem;flex:none;}
.hd-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);flex:none;}
.hbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;
  padding:8px 13px;min-height:44px;white-space:nowrap;flex:none;
  font-size:var(--fs-sm);font-weight:600;letter-spacing:.03em;color:var(--tx2);transition:.15s;}
.hbtn:hover{border-color:var(--tx3);color:var(--tx);}
.hbtn svg{width:16px;height:16px;}
.hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.hbtn .n{font-variant-numeric:tabular-nums;}

/* ---------- アバター ---------- */
.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;
  width:32px;height:32px;font-size:.8rem;letter-spacing:0;color:#fff;}
.ava.s{width:24px;height:24px;font-size:.7rem;}
.ava.l{width:44px;height:44px;font-size:1.05rem;}
/* 白文字とのコントラスト実測：5.48〜8.52（すべて AA 4.5:1 以上）。
   朱は「止まっている」の合図に使うので、人の色には入れない */
.c0{background:#1B5680;} .c1{background:#1F6B4A;} .c2{background:#59407F;}
.c3{background:#8A6210;} .c4{background:#9A5410;} .c5{background:#7A4A34;}

/* ---------- タブ ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.nav-in{display:flex;max-width:1020px;margin:0 auto;}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;
  color:var(--tx3);font-size:.7rem;font-weight:600;letter-spacing:.06em;position:relative;
  border-top:2px solid transparent;transition:.15s;}
.nav button svg{width:21px;height:21px;}
.nav button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent);}
.nav .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:19px;height:19px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;
  justify-content:center;padding:0 5px;line-height:1;letter-spacing:0;}
@media(min-width:768px){
  body{padding-bottom:48px;}
  .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);}
  .nav button{flex-direction:row;gap:9px;padding:15px 6px;font-size:var(--fs-sm);border-top:0;border-bottom:2px solid transparent;}
  .nav button[aria-selected="true"]{border-bottom-color:var(--accent);}
  .nav .dot{position:static;margin-left:3px;}
}

/* ---------- 見出し・カード ---------- */
.sec{margin:28px 0 13px;}
.sec-tight{margin:16px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec-tight h2{font-size:1.16rem;}
.sec-aim{margin-left:auto;display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;
  border-radius:999px;background:var(--surface2);border:1px solid var(--line2);
  font-size:.72rem;font-weight:700;color:var(--gold);letter-spacing:.02em;}
.sec-aim svg{width:13px;height:13px;}
.sec-aim svg:last-child{color:var(--tx3);}
.sheet-bd .sec{margin:18px 0 9px;}
.sheet-bd .sec h2{font-size:1.02rem;} .sheet-bd .sec h2 svg{width:16px;height:16px;}
.sheet-bd .sec .sub{font-size:.74rem;margin-top:5px;}
.sec h2{font-size:1.32rem;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:9px;line-height:1.45;}
.sec h2 svg{width:19px;height:19px;color:var(--tx3);}
.sec .sub{font-size:var(--fs-sm);color:var(--tx2);margin-top:6px;line-height:1.75;max-width:46em;}
.card{background:var(--surface);border:0;border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(31,27,24,.06),0 6px 16px rgba(31,27,24,.03);}
.card + .card{margin-top:10px;}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);
  padding:11px 17px;font-size:var(--fs-sm);font-weight:700;letter-spacing:.05em;border:1px solid transparent;
  transition:.15s;min-height:44px;}
.btn svg{width:16px;height:16px;}
.btn-main{background:var(--ink);color:#fff;} /* スマホではタップで :hover が入り、次にどこかを触るまで残る。黒い面は出さない */
.btn-main:hover{background:var(--accent-d);}
.btn-line{border-color:var(--line2);color:var(--tx);} .btn-line:hover{border-color:var(--tx3);background:var(--surface2);}
.btn-ghost{color:var(--tx2);} .btn-ghost:hover{color:var(--tx);background:var(--surface2);}
.btn-sm{padding:7px 12px;min-height:44px;font-size:var(--fs-xs);border-radius:8px;}
.btn-sm svg{width:14px;height:14px;}
.btn-full{width:100%;}

/* ---------- ピル ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 8px;font-size:.7rem;
  font-weight:700;letter-spacing:.05em;line-height:1.7;white-space:nowrap;border:1px solid;}
.pill svg{width:12px;height:12px;}
.p-accent{color:var(--accent);border-color:rgba(226,72,58,.35);background:var(--accent-bg);}
.p-gold{color:var(--gold);border-color:rgba(201,162,39,.35);background:var(--gold-bg);}
.p-ok{color:var(--ok);border-color:rgba(87,176,131,.35);background:var(--ok-bg);}
.p-info{color:var(--info);border-color:rgba(106,169,222,.35);background:var(--info-bg);}
.p-warn{color:var(--warn);border-color:rgba(217,164,65,.35);background:var(--warn-bg);}
.p-violet{color:var(--violet);border-color:rgba(155,123,212,.35);background:var(--violet-bg);}
.p-mute{color:var(--tx3);border-color:var(--line2);}
/* 拠点は「状態」ではないので彩度を与えない。朱は「止まっている」専用に戻す */
.p-db{color:var(--tx2);background:var(--db-bg);border-color:var(--db-ed);}
.p-jp{color:var(--tx2);background:var(--jp-bg);border-color:var(--jp-ed);}
.mute{color:var(--tx2);} .mute3{color:var(--tx3);} .fs-xs{font-size:var(--fs-xs);} .fs-sm{font-size:var(--fs-sm);}

/* ---------- 操作者 ---------- */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.acc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r);padding:12px;text-align:left;transition:.15s;}
.acc:hover{border-color:var(--line2);background:var(--surface2);}
.acc.on{border-color:var(--accent);background:var(--accent-bg);}
.acc .b{min-width:0;}
.acc .n{font-size:var(--fs-sm);font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc .r{font-size:.72rem;color:var(--tx3);letter-spacing:.05em;}
.acc .lk{margin-left:auto;color:var(--tx3);} .acc .lk svg{width:13px;height:13px;}
.acc.add{justify-content:center;border-style:dashed;color:var(--tx2);font-weight:700;font-size:var(--fs-sm);}
.pinbox{display:flex;gap:8px;justify-content:center;margin:var(--sp-4) 0;}
.pinbox input{width:52px;height:60px;text-align:center;font-size:1.5rem;font-weight:700;border:1px solid var(--line2);
  border-radius:var(--r-sm);background:var(--surface2);letter-spacing:0;}
.pinbox input:focus{outline:none;border-color:var(--accent);}

/* ---------- 絞り込み ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
/* 指でタップするものは44px。厨房で濡れた手・移動中のどちらでも外さない大きさ */
.chip{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;min-height:44px;
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;
  letter-spacing:.05em;color:var(--tx2);white-space:nowrap;transition:.15s;}
.chip b{font-size:.76rem;color:var(--tx3);font-weight:700;}
.chip[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:#fff;}
.chip[aria-pressed="true"] b{color:#fff;}

/* ---------- タスク ---------- */
.tlist{display:flex;flex-direction:column;gap:9px;}
.task{background:var(--surface);border:0;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(31,27,24,.06);
  display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tx3);}
.task.st-late::before{background:var(--accent);} .task.st-today::before{background:var(--warn);}
.task.st-wait::before{background:var(--info);} .task.st-done::before{background:var(--ok);}
/* 終わったものは目立たせない。ただし薄くすると、
   この道具でいちばん大事な「誰が何月何日に確認したか」が読めなくなる */
.task.st-done{background:var(--surface2);box-shadow:none;}
.tcheck{width:62px;min-height:56px;border-radius:var(--r);border:1px solid var(--line2);flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tx3);transition:.15s;padding:6px 2px;}
.tcheck svg{width:20px;height:20px;stroke-width:2.6;}
.tcheck .lb{font-size:.7rem;font-weight:700;letter-spacing:0;line-height:1.2;text-align:center;}
.tcheck:hover{border-color:var(--ok);color:var(--ok);}
.tcheck.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.tcheck.ack{background:var(--info);border-color:var(--info);color:#fff;}
.tcheck[disabled]{opacity:1;cursor:default;color:var(--tx3);
  border-color:var(--line);background:var(--surface2);}
/* いま押せないものは、押せない見た目にする。同じ色のまま黙って無反応だと、
   押した人は「壊れている」と受け取って、そこで手が止まる */
.btn[disabled],.seg button[disabled]{cursor:default;box-shadow:none;
  color:var(--tx3);border-color:var(--line);background:var(--surface2);}
.btn-main[disabled],.btn-main[disabled]:hover{background:var(--surface3);color:var(--tx3);border-color:var(--line2);}
.btn-line[disabled]:hover{border-color:var(--line);background:var(--surface2);}
.seg button[disabled]:hover{background:var(--surface2);border-color:var(--line);}
/* いま選ばれているものは薄くしない。押せるかどうかより、
   どの状態なのかを読めることが先（押せない理由は下に書いてある） */
.seg button[disabled][aria-pressed="true"]{opacity:1;}
.tmain{flex:1;min-width:0;}
.tmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.ttl{font-size:var(--fs-md);font-weight:700;line-height:1.42;letter-spacing:.02em;
  display:flex;align-items:flex-start;gap:7px;}
.ttl>svg{width:15px;height:15px;flex:none;margin-top:4px;color:var(--tx3);}
.tmeta{margin-top:6px;}
/* 何のためにやるのか。ここを削ると、日本の意図が現地に届かない */
.twhy{font-size:.76rem;color:var(--tx2);margin-top:8px;padding-left:11px;border-left:2px solid var(--line2);
  line-height:1.6;}
/* 帯は状態だけを表す。担当まで同じ帯に載せると、カードごとに帯の意味が変わって読めない */
.tflow{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:var(--fs-xs);font-weight:700;
  line-height:1.5;letter-spacing:.02em;}
.tflow>span{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;}
.tflow svg{width:12px;height:12px;flex:none;align-self:center;}
.tflow .nx-b{min-height:44px;width:100%;justify-content:flex-start;}
.tflow .nx{color:var(--tx3);flex-wrap:nowrap;}
.tflow .nx>span{min-width:0;}
.tflow .nx svg{align-self:center;}
.tflow .dn{color:var(--ok);}
.tflow .ak{color:var(--info);}
.tflow .tt{font-weight:600;color:var(--tx2);font-size:var(--fs-xs);}
.tflow .pv{color:var(--tx3);}
.thist{margin-top:9px;}
.thist summary{font-size:.76rem;font-weight:700;color:var(--tx2);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:5px;min-height:44px;}
.thist summary::-webkit-details-marker{display:none;}
.thist summary::before{content:'＋';font-size:.7rem;color:var(--tx3);}
.thist[open] summary::before{content:'−';}
.thist-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;
  border-top:1px solid var(--line);font-size:.74rem;line-height:1.6;}
.thist-r b{color:var(--ok);font-weight:700;}
.thist-r i{font-style:normal;font-weight:700;color:var(--tx2);}
.thist-r span{color:var(--tx2);font-weight:600;font-size:.72rem;}
.step .tt{display:block;font-size:.72rem;font-weight:600;opacity:.8;letter-spacing:.02em;}
.tside{flex:none;display:flex;flex-direction:column;gap:6px;}
.tedit{color:var(--tx3);} .tedit svg{width:17px;height:17px;}
.tchat{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);position:relative;
  display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.15s;}
.tchat svg{width:19px;height:19px;}
.tchat:hover{border-color:var(--line2);color:var(--tx);}
.tchat .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.empty{text-align:center;color:var(--tx3);padding:var(--sp-8) var(--sp-4);font-size:var(--fs-sm);}
.empty svg{width:34px;height:34px;display:block;margin:0 auto var(--sp-2);opacity:.5;}

/* ---------- 通知バー ---------- */
.notice{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-3);
  background:var(--accent-bg);border:1px solid rgba(226,72,58,.3);border-radius:var(--r);padding:11px 14px;font-size:var(--fs-sm);}
.notice svg{width:17px;height:17px;color:var(--accent);}
.notice b{color:var(--accent);}
.notice .go{margin-left:auto;}

/* ---------- 企画比較表 ---------- */
.seg-top{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;margin:var(--sp-4) 0 var(--sp-3);}
.seg-top button{flex:1;border-radius:6px;padding:10px 6px;min-height:44px;font-weight:700;font-size:var(--fs-xs);letter-spacing:.08em;
  color:var(--tx3);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;}
.seg-top button svg{width:15px;height:15px;}
.seg-top button[aria-selected="true"]{background:var(--surface2);color:var(--tx);}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;background:var(--surface);box-shadow:0 1px 3px rgba(31,27,24,.06);}
.mx{border-collapse:separate;border-spacing:0;}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:11px 12px;vertical-align:top;text-align:left;}
.mx tr:last-child th,.mx tr:last-child td{border-bottom:0;}
.mx th.rh{position:sticky;left:0;z-index:2;background:var(--surface2);width:72px;min-width:72px;
  font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--tx2);}
.mx th.rh svg{width:14px;height:14px;display:block;margin-bottom:4px;color:var(--gold);}
.mx thead th.ch{background:var(--surface3);min-width:216px;width:216px;}
.mx thead th.rh{background:var(--surface3);}
.mx td{min-width:216px;width:216px;font-size:var(--fs-xs);line-height:1.8;color:var(--tx2);}
.mx td .cell{white-space:pre-wrap;}
.mx td .cell.none{color:var(--tx3);}
.mx td.ed{cursor:pointer;} .mx td.ed:hover{background:var(--surface2);}
.mx .sname{font-size:var(--fs-md);font-weight:700;line-height:1.4;display:block;color:var(--tx);letter-spacing:.03em;}
.mx .tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.hint{font-size:var(--fs-xs);color:var(--tx3);margin-top:var(--sp-2);display:flex;align-items:flex-start;gap:6px;line-height:1.7;}
/* 注意書きに続けて置くボタン。中に入れると文章に押し潰されて3行に折れる */
.hint-b{margin:8px 0 11px 20px;}
/* 住所になっていない書き込み。開けないので、リンクの見た目にはしない */
.urlmemo{display:inline-flex;align-items:flex-start;gap:6px;font-size:var(--fs-sm);color:var(--tx2);
  background:var(--surface2);border:1px dashed var(--line2);border-radius:var(--r-sm);padding:9px 12px;
  line-height:1.6;word-break:break-all;}
.urlmemo svg{width:14px;height:14px;color:var(--gold);flex:none;margin-top:3px;}
.ttp-memo{display:flex;align-items:flex-start;gap:5px;font-size:var(--fs-xs);color:var(--tx2);
  line-height:1.6;margin-top:4px;word-break:break-all;}
.ttp-memo svg{width:13px;height:13px;color:var(--gold);flex:none;margin-top:3px;}
.hint svg{width:14px;height:14px;color:var(--gold);margin-top:4px;}

/* ---------- 撮影素材 ---------- */
.vcard{cursor:pointer;background:var(--surface);border:0;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(31,27,24,.06);
  display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tx3);}
.v-shot::before{background:var(--gold);} .v-review::before{background:var(--info);}
.v-redo::before{background:var(--accent);} .v-ok::before{background:var(--ok);} .v-posted::before{background:var(--violet);}
.vcard .vic{width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line2);display:flex;
  align-items:center;justify-content:center;flex:none;color:var(--tx2);}
.vcard .vic svg{width:20px;height:20px;}
.vcard .vb{flex:1;min-width:0;}
.vcard .vt{font-size:var(--fs-md);font-weight:700;line-height:1.5;letter-spacing:.02em;}
.stepbar{display:flex;gap:3px;margin-top:10px;}
.stepbar i{height:3px;flex:1;border-radius:2px;background:var(--surface3);}
.stepbar i.on{background:var(--ok);} .stepbar i.bad{background:var(--accent);}
.vflow{font-size:.72rem;color:var(--tx3);letter-spacing:.06em;margin-top:6px;}

/* ---------- カレンダー ---------- */
.cal-hd{display:flex;align-items:center;gap:var(--sp-2);justify-content:space-between;margin:var(--sp-4) 0 var(--sp-3);}
.cal-hd h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:.06em;}
.cal-nav{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line2);display:flex;
  align-items:center;justify-content:center;color:var(--tx2);flex:none;}
.cal-nav svg{width:18px;height:18px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(31,27,24,.06);}
.cal-dow{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--tx3);padding:7px 0;background:var(--surface2);}
.cal-dow.sun{color:var(--accent);} .cal-dow.sat{color:var(--info);}
.cal-cell{background:var(--surface);min-height:96px;padding:6px 5px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:.12s;}
.cal-cell:hover{background:var(--surface2);}
.cal-cell.pad{background:var(--bg);pointer-events:none;}
.cal-cell .dnum{font-size:.72rem;font-weight:700;color:var(--tx2);line-height:1.5;align-self:flex-start;padding:0 3px;}
.cal-cell.sun .dnum{color:var(--accent);} .cal-cell.sat .dnum{color:var(--info);}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-cell.today .dnum{background:var(--tx);color:#fff;border-radius:5px;padding:0 6px;}
.cal-cell.future .dnum{color:var(--tx3);}
/* 日付の中に入る予定・実績のラベル（保険営業ダッシュボードと同じ形） */
.cal-dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center;}
.cal-chs{display:flex;flex-direction:column;gap:3px;min-width:0;}
.cal-ch{display:block;font-size:.7rem;font-weight:700;line-height:1.75;padding:0 6px;border-radius:5px;
  border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;}
.cal-more{font-size:.7rem;font-weight:700;color:var(--tx3);line-height:1.6;padding-left:4px;}
/* 狭い画面でも「ラベル型チップ」のまま。色の点に落としたところ、実測で
   8×8px・背景8%・枠線0＝白地とのコントラスト1.06:1（AA 3.0:1 の1/3）になり、
   いつ何を投稿したのかカレンダーから読み取れなくなっていた */
@media(max-width:639px){
  .cal-cell{min-height:74px;padding:5px 4px 4px;}
  .cal-chs{gap:3px;}
  .cal-ch.nar{display:flex;align-items:center;justify-content:center;
    height:18px;border-radius:4px;border-width:0;padding:0;
    font-size:.7rem;font-weight:700;line-height:1;color:#fff;letter-spacing:0;}
}
/* カレンダーの直下に出す「今週の投稿」。セルでは読めない題名をここで読む */
.wkp{margin-top:14px;display:flex;flex-direction:column;gap:1px;background:var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(74,60,48,.06);}
.wkp-r{display:flex;align-items:center;gap:10px;background:var(--surface);padding:12px 14px;
  width:100%;text-align:left;min-height:50px;}
.wkp-d{flex:none;width:42px;font-size:.72rem;font-weight:700;color:var(--tx2);letter-spacing:.02em;}
.wkp-c{flex:none;width:6px;height:26px;border-radius:3px;}
.wkp-t{flex:1;min-width:0;font-size:var(--fs-sm);font-weight:700;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wkp-k{flex:none;font-size:.72rem;font-weight:700;color:var(--tx3);}
.wkp-r.sub{background:var(--surface2);}
.wkp-t.un{font-weight:600;color:var(--tx3);}
.wkp-e{background:var(--surface);padding:16px 14px;text-align:center;font-size:var(--fs-sm);color:var(--tx3);}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-3);font-size:var(--fs-xs);font-weight:600;}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--tx3);}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.legend .lg-h{font-size:.7rem;font-weight:700;color:var(--tx2);letter-spacing:.04em;
  display:inline-flex;align-items:center;margin-right:1px;}
.legend .lg-h:not(:first-child){margin-left:8px;}
.legend .lch{border:1px solid;border-radius:5px;padding:3px 9px;font-size:.7rem;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;}
.legend .lch-k{width:18px;height:18px;border-radius:5px;color:#fff;font-style:normal;font-size:.7rem;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.legend .lch-d{width:8px;height:8px;border-radius:50%;flex:none;}
.ptype-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px;}
.ptype{border:1px solid var(--line2);border-radius:var(--r);padding:12px 6px;display:flex;flex-direction:column;
  align-items:center;gap:5px;font-weight:700;font-size:var(--fs-xs);letter-spacing:.04em;min-height:86px;justify-content:center;transition:.15s;}
.ptype:hover{background:var(--surface2);}
.ptype svg{width:21px;height:21px;} .ptype .cnt{font-size:var(--fs-xl);line-height:1;font-weight:300;}
.plist{display:flex;flex-direction:column;gap:6px;}
.pitem{display:flex;flex-wrap:wrap;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 8px 8px 11px;font-size:var(--fs-sm);background:var(--surface);}
.pitem i{width:9px;height:9px;border-radius:2px;flex:none;}
.pitem .rm{margin-left:auto;color:var(--tx3);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:9px;flex:none;}
.pitem .rm:hover{background:var(--accent-bg);color:var(--accent);}
.menu-chips{display:flex;flex-wrap:wrap;gap:6px;}
.menu-chips button{border:1px solid var(--line2);border-radius:999px;padding:8px 13px;font-size:var(--fs-xs);
  font-weight:700;min-height:44px;color:var(--tx2);transition:.15s;}
.menu-chips button[aria-pressed="true"]{background:var(--gold-bg);border-color:rgba(201,162,39,.5);color:var(--gold);}

/* ---------- 連絡 ---------- */
.thread{display:flex;flex-direction:column;gap:14px;padding:var(--sp-2) 0 var(--sp-4);}
.msg{display:flex;gap:10px;max-width:90%;min-width:0;}
/* 内側に min-width:0 が無いと、切れ目の無いURL1本で吹き出しが画面外へ飛ぶ */
.msg>div{min-width:0;flex:1;}
.msg .tx{overflow-wrap:anywhere;word-break:break-word;}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:3px 12px 12px 12px;padding:10px 13px;}
.msg .nm{font-size:.74rem;font-weight:700;color:var(--tx3);margin-bottom:3px;letter-spacing:.06em;}
.msg .tx{font-size:var(--fs-sm);line-height:1.75;white-space:pre-wrap;}
.msg .tx .lnk{color:var(--info);text-decoration:underline;text-underline-offset:2px;word-break:break-all;}
.msg .ts{font-size:.72rem;color:var(--tx3);margin-top:4px;letter-spacing:.03em;}
.msg.me{margin-left:auto;flex-direction:row-reverse;}
.msg.me .bub{background:var(--surface2);border-color:var(--line2);border-radius:12px 3px 12px 12px;}
.msg.me .nm,.msg.me .ts{text-align:right;}
.daysep{text-align:center;font-size:.72rem;font-weight:700;color:var(--tx3);letter-spacing:.14em;margin:var(--sp-3) 0;}
.daysep span{border-top:1px solid var(--line);display:block;padding-top:var(--sp-2);}
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 22%);padding:16px 0 6px;}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.quick button{border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font-size:var(--fs-xs);
  font-weight:600;white-space:nowrap;min-height:44px;color:var(--tx2);}
.quick button:hover{border-color:var(--tx3);color:var(--tx);}
/* 質問だけは、答えが付くまで消えずに相手の番に残る。ほかの定型文と見分けがつくようにする */
.quick .qask{border-color:var(--info);color:var(--info);background:var(--info-bg);}
/* シートの中では地が --surface。--bg のままだと後ろのカットが透けて重なる。
   sheet-bd の下パディング24px分を負マージンで食わないと、本文がその隙間を通り抜ける */
.sheet .composer{background:var(--surface);padding-top:12px;
  padding-bottom:var(--sp-6);
  box-shadow:0 -10px 14px -10px rgba(74,60,48,.16);}
/* 入力欄があるシートは下パディングを composer 側に移す。
   sticky は親のコンテンツボックスの外へ出られないため、
   下パディングを残すとその24pxを本文が通り抜けて見える */
.sheet-bd.has-comp{padding-bottom:0;}
.cbox{display:flex;gap:8px;align-items:flex-end;}
.cbox textarea{flex:1;border:1px solid var(--line2);border-radius:var(--r);padding:11px 13px;background:var(--surface);
  resize:none;min-height:46px;max-height:140px;line-height:1.65;font-size:var(--fs-sm);}
.cbox textarea:focus{outline:none;border-color:var(--tx3);}
.cbox .send{width:48px;height:46px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;
  align-items:center;justify-content:center;flex:none;}
.cbox .send svg{width:20px;height:20px;}

/* ---------- 分析 ---------- */
.kv.na{color:var(--tx3);font-weight:300;}
.wchart .g.na{color:var(--tx3);}
.na-big{font-size:3.4rem;font-weight:200;color:var(--tx3);line-height:1;letter-spacing:-.04em;}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(74,60,48,.06);}
.kpi{background:var(--surface);padding:16px 14px;}
.kpi .kl{font-size:.72rem;font-weight:700;color:var(--tx3);letter-spacing:.1em;display:flex;align-items:center;gap:5px;}
.kpi .kl svg{width:12px;height:12px;}
.kpi .kv{font-size:var(--fs-xl);font-weight:300;line-height:1.3;letter-spacing:-.02em;}
.kpi .kv i{font-size:.7rem;font-style:normal;color:var(--tx3);margin-left:2px;font-weight:600;}
.kpi .kd{font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:3px;letter-spacing:.03em;}
.kpi .kd.up{color:var(--ok);} .kpi .kd.dn{color:var(--accent);} .kpi .kd.fl{color:var(--tx3);}
.kpi .kd svg{width:11px;height:11px;}
.wchart{display:flex;gap:5px;align-items:flex-end;justify-content:space-between;margin-top:var(--sp-4);}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
.wcol .g{font-size:.72rem;font-weight:700;color:var(--info);letter-spacing:.02em;white-space:nowrap;}
.wcol .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-height:3px;}
.wcol .wseg{display:block;width:100%;}
.wcol .tot{font-size:.76rem;font-weight:700;}
.wcol .lb{font-size:.7rem;font-weight:600;color:var(--tx3);white-space:nowrap;letter-spacing:.02em;}
.rank{display:flex;flex-direction:column;gap:10px;}
.rank-row{display:grid;grid-template-columns:minmax(76px,auto) 1fr auto;gap:10px;align-items:center;}
.rank-row .nm{font-size:var(--fs-xs);font-weight:700;color:var(--tx2);}
.rank-row .tr{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;}
.rank-row .fl{height:100%;background:var(--gold);border-radius:3px;transition:width .5s;}
.rank-row .vl{font-size:var(--fs-xs);font-weight:700;color:var(--gold);white-space:nowrap;}

/* ---------- フォーム ---------- */
.frm{display:grid;gap:var(--sp-4);}
/* 英字の飾りは生成をやめたので、ラベルは日本語をそのまま読める大きさにする */
.frm label{display:flex;flex-direction:column;gap:7px;font-size:var(--fs-sm);font-weight:700;letter-spacing:.02em;color:var(--tx2);}
.frm .jp{font-size:var(--fs-sm);letter-spacing:.04em;color:var(--tx2);text-transform:none;font-weight:700;}
.frm input[type=text],.frm input[type=date],.frm input[type=password],.frm select,.frm textarea{
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 13px;background:var(--surface);
  color:var(--tx);font-weight:400;min-height:46px;font-size:var(--fs-sm);letter-spacing:.02em;}
.frm input:focus,.frm textarea:focus,.frm select:focus{outline:none;border-color:var(--accent);}
.frm textarea{min-height:82px;resize:vertical;line-height:1.75;}
.seg{display:flex;gap:7px;flex-wrap:wrap;}
.seg button{border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 14px;font-weight:700;
  font-size:var(--fs-xs);letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--tx2);transition:.15s;}
.seg button svg{width:15px;height:15px;}
.seg button[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:#fff;}

/* ---------- シート ---------- */
.ov{position:fixed;inset:0;background:rgba(27,25,23,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);}
@media(min-width:640px){ .ov{align-items:center;padding:24px;} }
.sheet{background:var(--bg);box-shadow:0 -8px 40px rgba(27,25,23,.14);width:100%;max-width:660px;max-height:92vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line2);border-bottom:0;}
@media(min-width:640px){ .sheet{border-radius:16px;max-height:88vh;border-bottom:1px solid var(--line2);} }
.sheet-hd{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);}
.sheet-hd h2{font-size:var(--fs-md);font-weight:700;flex:1;min-width:0;line-height:1.45;letter-spacing:.03em;}
.sheet-x{min-width:44px;min-height:44px;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--tx3);flex:none;}
.sheet-x:hover{background:var(--surface2);color:var(--tx);}
.sheet-bd{padding:var(--sp-5) 16px var(--sp-6);overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.sheet-ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;}
.sheet-ft .btn{flex:1;}

/* ---------- 追加ボタン ---------- */

/* ---------- 同期 ---------- */
.sync-step{display:flex;gap:12px;align-items:flex-start;padding:var(--sp-4) 0;border-bottom:1px solid var(--line);}
.sync-step:last-child{border-bottom:0;}
.sync-n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);color:var(--tx2);font-weight:700;
  font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;}
.sync-b{flex:1;min-width:0;}
.sync-b b{font-size:var(--fs-sm);letter-spacing:.04em;}
.code{width:100%;border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px;background:var(--surface);
  color:var(--tx2);font-size:.72rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  line-height:1.6;word-break:break-all;min-height:90px;resize:vertical;margin-top:10px;}
.res{border-radius:var(--r-sm);padding:11px 13px;font-size:var(--fs-xs);font-weight:700;margin-top:10px;line-height:1.7;}
.res.ok{background:var(--ok-bg);border:1px solid rgba(87,176,131,.35);color:var(--ok);}
.res.ng{background:var(--accent-bg);border:1px solid rgba(226,72,58,.35);color:var(--accent);}
.res.info{background:var(--info-bg);border:1px solid rgba(106,169,222,.35);color:var(--info);}

/* ============================================================
   残っていた濃色の面と、読めない英語の飾りを潰す。
   ここは <style> の末尾。前方に置くと同じ詳細度の既存ルールに負けて効かない
   ============================================================ */
/* 絞り込みの「選んでいる」は、止まっていることでも期限すぎでもない。
   朱の面をここで使うと、本当に朱を出したい行が埋もれる（実測 4.79:1） */
.chip[aria-pressed="true"]{background:#F6EFE3;border-color:var(--gold);color:var(--gold);}
.chip[aria-pressed="true"] b{color:var(--gold);}
.seg button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-d);}
.cal-cell.today .dnum{background:var(--accent);color:#fff;}
.ov{background:rgba(74,60,48,.30);}
.acc-hd{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--tx2);}
.stepbar i,.rank-row .tr{background:var(--track);}

/* ============================================================
   上部ブロック「日本と現地の差」＝旧 .hero の置き換え
   ============================================================ */
.gap{background:var(--surface);border-radius:16px;margin-top:16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(74,60,48,.07),0 8px 20px rgba(74,60,48,.04);}

.gv{background:var(--surface2);border-radius:14px;padding:15px 16px;margin-bottom:13px;}
.gv-lb{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;
  letter-spacing:.1em;color:var(--gold);} .gv-lb svg{width:14px;height:14px;}
.gv-t{font-size:1.06rem;font-weight:700;line-height:1.65;letter-spacing:.015em;margin-top:8px;}
.gv-t em{font-style:normal;color:var(--gold);}
.gv-s{font-size:.8rem;color:var(--tx2);line-height:1.85;margin-top:10px;}
.gap-ed{margin-left:auto;flex:none;min-height:34px;padding:6px 11px;border:1px solid var(--line2);
  border-radius:8px;font-size:.7rem;font-weight:700;color:var(--tx2);background:var(--surface);}
.gap-ed:hover{border-color:var(--tx3);color:var(--tx);}

.gap-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 16px 0;}
.gap-wk{display:inline-flex;align-items:center;gap:5px;margin-left:auto;min-height:44px;padding:0 12px;
  border-radius:999px;background:var(--surface3);color:var(--tx2);
  font-size:.74rem;font-weight:700;letter-spacing:.02em;}
.gap-wk svg{width:13px;height:13px;color:var(--tx3);}
.gap-wk b{font-size:.86rem;color:var(--tx);}
.gap-wk.ok{background:var(--ok-bg);color:var(--ok);} .gap-wk.ok b{color:var(--ok);}
.gap-wk.ok svg{color:var(--ok);}
.gap-hd h2{font-size:.96rem;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:7px;line-height:1.4;}
.gap-hd h2 svg{width:17px;height:17px;color:var(--tx3);}
.gap-clock{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--tx2);line-height:1.6;}

/* 受け渡し盤。375px でも 2列を保つ（縦に積んだ時点で比較ではなくなる） */
.gap-board{display:flex;flex-direction:column;gap:7px;padding:10px 16px 0;}
.brow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:12px;
  padding:10px 11px;min-height:56px;}
.brow-jp{background:var(--jp-bg);box-shadow:inset 0 0 0 1px var(--jp-ed);}
.brow-ans{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok);}
.brow-ans .brow-t{display:flex;align-items:center;gap:6px;color:var(--ok);}
.brow-ans .brow-t svg{width:14px;height:14px;}
.brow-ans .brow-n b{color:var(--ok);}
.brow-db{background:var(--db-bg);box-shadow:inset 0 0 0 1px var(--db-ed);}
.brow-b{flex:1;min-width:0;}
.brow-t{display:block;font-size:.82rem;font-weight:700;letter-spacing:.03em;line-height:1.45;}
.brow-s{display:block;font-size:.73rem;font-weight:700;color:var(--tx2);line-height:1.5;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow-s b{color:var(--tx);}
.brow.is-stop .brow-s b{color:var(--accent);}
.brow-n{flex:none;display:flex;align-items:baseline;gap:3px;}
.brow-n b{font-size:1.5rem;font-weight:300;line-height:1.1;letter-spacing:-.03em;color:var(--tx);}
.brow-n i{font-style:normal;font-size:.7rem;font-weight:700;color:var(--tx2);}
.brow.is-stop .brow-n b{color:var(--accent);}
.brow-k{flex:none;color:var(--tx3);display:flex;} .brow-k svg{width:16px;height:16px;}
.gap-sync{display:flex;align-items:flex-start;gap:6px;font-size:.73rem;font-weight:700;color:var(--tx2);
  line-height:1.65;padding:0 16px 13px;background:var(--surface2);}
.gap-sync svg{width:13px;height:13px;flex:none;margin-top:3px;}
.gap-sync.old{color:var(--warn);}

/* 件数ボタンの飛び先（全件の一覧） */
.gap-row{display:flex;align-items:center;gap:9px;width:100%;min-height:52px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;}
.gap-row+.gap-row{margin-top:7px;}
.gap-row .t{flex:1;min-width:0;font-size:var(--fs-xs);font-weight:700;line-height:1.55;}
.gap-row .d{flex:none;font-size:var(--fs-xs);font-weight:700;color:var(--accent);}
.gap-row .d.w{color:var(--warn);}
.gap-row .lk{flex:none;display:flex;color:var(--tx3);}
.gap-row .lk svg{width:16px;height:16px;}

@media(max-width:400px){
  .gap-hd{padding:13px 13px 0;} .gap-board{padding:10px 13px 0;gap:6px;}
  .brow{padding:9px 9px;} .brow-n b{font-size:1.4rem;}
  .gap-sync{padding:0 13px 12px;}
}

/* 比較表の「参考｜うちの場合」行。真似る対象と自店版を物理的に隣り合わせる */
.ttp{padding-left:9px;border-left:2px solid var(--line2);margin-bottom:9px;}
.ttp.own{min-height:44px;cursor:pointer;padding-top:3px;padding-bottom:3px;}
.ttp.own{border-left-color:var(--gold);}
.ttp-l{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--tx2);}
.ttp.own .ttp-l{color:var(--gold);}
.ttp-n{font-size:.7rem;line-height:1.7;margin-top:2px;color:var(--tx2);}
.ttp-n.none{color:var(--tx3);}
.ttp a{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;min-height:44px;color:var(--info);}
.ttp a svg{width:14px;height:14px;}

.pitem .pvid{flex-basis:100%;order:9;margin-top:7px;display:flex;align-items:center;gap:6px;
  min-height:44px;border:1px dashed var(--line2);border-radius:10px;padding:6px 11px;
  font-size:var(--fs-xs);font-weight:700;color:var(--tx2);text-align:left;}
.pitem .pvid svg{width:14px;height:14px;flex:none;}
.pitem .pvid:hover{border-color:var(--accent);color:var(--accent-d);}
.addrow{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:12px;border:1px dashed var(--line2);border-radius:14px;background:transparent;
  font-size:var(--fs-sm);font-weight:700;color:var(--tx2);}
.addrow:hover{border-color:var(--accent);color:var(--accent-d);background:var(--accent-bg);}
.addrow svg{width:16px;height:16px;}
/* ---------- 撮影の指示（カット割り） ---------- */
.cuts{margin-top:10px;}
.cut{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
.cut:first-child{border-top:0;padding-top:4px;}
.cut-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent-d);
  font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.cut-b{flex:1;min-width:0;}
.cut-t{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.05em;color:var(--tx2);
  background:var(--surface3);border-radius:4px;padding:2px 7px;margin-bottom:5px;font-variant-numeric:tabular-nums;}
.cut-d{font-size:var(--fs-sm);line-height:1.72;}
.past{display:flex;flex-direction:column;gap:7px;}
.past-avg{display:flex;align-items:baseline;gap:6px;background:var(--surface2);border-radius:11px;
  padding:11px 13px;font-size:.72rem;font-weight:700;color:var(--tx2);}
.past-avg b{font-size:1.36rem;font-weight:300;letter-spacing:-.02em;color:var(--tx);}
.past-avg i{font-style:normal;font-size:.7rem;}
.past-avg .past-n{margin-left:auto;color:var(--tx3);font-size:.7rem;}
.past-r{background:var(--surface);border-radius:11px;padding:11px 13px;box-shadow:0 1px 3px rgba(74,60,48,.06);}
.past-k{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.past-m.no{color:var(--warn);}
.res-n{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:6px;}
.res-n b{font-size:1.2rem;font-weight:300;letter-spacing:-.02em;color:var(--tx);}
.res-n i{font-style:normal;font-size:.7rem;font-weight:700;color:var(--tx3);margin-right:8px;}
.past-t{display:block;font-size:var(--fs-sm);font-weight:700;line-height:1.5;}
.past-m{display:block;font-size:.7rem;font-weight:700;color:var(--tx3);margin-top:4px;}
.past-m b{color:var(--tx2);}
.past-s{display:flex;align-items:flex-start;gap:5px;font-size:.7rem;color:var(--tx2);
  line-height:1.65;margin-top:6px;}
.past-s svg{width:12px;height:12px;flex:none;margin-top:3px;color:var(--tx3);}
.cut-ad{display:flex;align-items:flex-start;gap:6px;margin-top:7px;padding:7px 9px;border-radius:8px;
  background:var(--ok-bg);font-size:.72rem;line-height:1.7;color:var(--tx);}
.cut-ad svg{width:13px;height:13px;flex:none;margin-top:3px;color:var(--ok);}
.cut-ad b{display:block;font-size:.7rem;color:var(--ok);letter-spacing:.03em;margin-bottom:1px;}
.cut-ng{display:flex;gap:5px;align-items:flex-start;font-size:var(--fs-xs);color:var(--accent-d);
  line-height:1.65;margin-top:5px;}
.cut-ng svg{width:13px;height:13px;flex:none;margin-top:3px;}
.cut-a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.qbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;
  padding:6px 14px;font-size:.72rem;font-weight:700;color:var(--tx2);background:var(--surface);min-height:44px;}
.qbtn svg{width:13px;height:13px;}
.qbtn:hover{border-color:var(--info);color:var(--info);}
.qbtn.on{border-color:var(--accent);color:var(--accent-d);background:var(--accent-bg);}
/* 待っているのは自分。相手を待たせているわけではないので朱は使わない */
.qbtn.on.waiting{border-color:var(--line2);color:var(--tx3);background:var(--surface2);}
/* ---------- 質問 ---------- */
.qquote{border-left:3px solid var(--info);background:var(--info-bg);border-radius:0 8px 8px 0;
  padding:11px 13px;font-size:var(--fs-sm);line-height:1.7;margin-bottom:14px;}
.q-tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--info);
  letter-spacing:.06em;margin-bottom:4px;}
.q-tag svg{width:12px;height:12px;}
.q-ref{display:flex;align-items:baseline;gap:6px;background:var(--surface2);border-radius:7px;
  padding:6px 9px;margin-bottom:6px;font-size:.72rem;line-height:1.55;}
.q-ref b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-bg);color:var(--accent-d);
  font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:center;}
.q-ref i{flex:none;font-style:normal;font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums;}
.q-ref span{min-width:0;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg.isq .bub{border-color:var(--info);background:var(--info-bg);}
.q-wait{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:.73rem;font-weight:700;color:var(--tx3);}
.q-wait svg{width:13px;height:13px;}
.sec-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface3);color:var(--tx);
  border:1px solid var(--line2);border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:700;
  letter-spacing:.04em;margin-bottom:5px;font-variant-numeric:tabular-nums;}
.ansmk{display:flex;align-items:center;gap:6px;background:var(--info-bg);border-radius:8px;padding:8px 11px;
  font-size:var(--fs-xs);font-weight:700;color:var(--info);margin-bottom:8px;}
.ansmk svg{width:14px;height:14px;flex:none;}
.ansmk .x{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;color:var(--tx2);}
.csec{flex:none;width:62px;border:1px solid var(--line2);border-radius:var(--r);padding:11px 8px;
