  margin-bottom:9px;}
.chint svg{width:13px;height:13px;color:var(--gold);flex:none;margin-top:3px;}
/* ---------- やり取りの受信箱 ---------- */
.pres{background:var(--surface2);border-radius:12px;padding:12px 13px;margin-bottom:9px;}
.pres-h{display:flex;align-items:center;gap:8px;}
.pres-c{flex:none;width:6px;height:18px;border-radius:3px;}
.pres-h b{font-size:var(--fs-sm);font-weight:700;}
.pres-k{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--tx3);}
.pres-r{font-size:var(--fs-sm);line-height:1.7;margin-top:8px;}
.pres-n{font-size:.7rem;font-weight:700;color:var(--tx3);margin-top:7px;line-height:1.6;}
.shoot{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;
  overflow:hidden;box-shadow:0 1px 3px rgba(74,60,48,.06);}
.shoot-r{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);
  padding:13px 14px;min-height:64px;}
.shoot-i{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:var(--surface3);color:var(--tx2);}
.shoot-i svg{width:17px;height:17px;}
.shoot-b{flex:1;min-width:0;}
.shoot-t{display:block;font-size:var(--fs-sm);font-weight:700;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shoot-m{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap;}
.shoot-d{font-size:.72rem;font-weight:700;color:var(--tx2);}
.shoot-d.late{color:var(--accent);}
.shoot-c{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--tx2);}
.shoot-c svg{width:12px;height:12px;}
.shoot-c.no{color:var(--warn);}
.shoot-c.ans{color:var(--ok);}
.shoot-k{flex:none;color:var(--tx3);display:flex;} .shoot-k svg{width:16px;height:16px;}
.ibx-c{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.02em;color:var(--tx2);
  background:var(--surface3);border-radius:4px;padding:1px 5px;margin-right:5px;}
.ibx{display:flex;flex-direction:column;gap:9px;}
.ibx-row{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);
  border-radius:14px;padding:13px 14px;box-shadow:0 1px 2px rgba(74,60,48,.06);}
.ibx-row.turn{box-shadow:inset 3px 0 0 var(--line2),0 1px 2px rgba(74,60,48,.06);}
.ibx-row.hasq{box-shadow:0 0 0 1.5px var(--accent),0 1px 3px rgba(74,60,48,.08);}
.ibx-i{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface3);color:var(--tx2);}
.ibx-i svg{width:17px;height:17px;}
.ibx-b{flex:1;min-width:0;}
.ibx-t{font-size:var(--fs-sm);font-weight:700;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ibx-p{font-size:var(--fs-xs);color:var(--tx2);line-height:1.62;margin-top:3px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
.ibx-m{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;}
.ibx-d{font-size:.72rem;font-weight:700;color:var(--tx3);letter-spacing:.03em;}
.ibx-n{flex:none;min-width:21px;height:21px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 7px;}
/* ---------- 印刷 ---------- */
@media print{
  body{background:#fff;color:#000;padding:0;}
  .nav,.composer,.hd-right,.tchat,.tcheck,.sheet-x,.seg,.chips,.quick,.cut-a,.thread{display:none !important;}
  /* シートを開いたまま刷ると背景のページだけが出て、厨房に貼る台本が出なかった */
  body.has-sheet #main,body.has-sheet .hd{display:none !important;}
  .ov{position:static !important;background:none !important;padding:0 !important;display:block !important;}
  .sheet{position:static !important;max-height:none !important;box-shadow:none !important;
    border-radius:0 !important;width:auto !important;max-width:none !important;transform:none !important;}
  .sheet-bd{overflow:visible !important;max-height:none !important;}
  .card,.task,.vcard,.mx-wrap{background:#fff;border-color:#ccc;break-inside:avoid;}
  /* 薄い地色はモノクロで飛ぶ。厨房に貼る紙では、注意と答えが消えては困る */
  .cut-ad,.cut-ng{background:#fff !important;border:1px solid #999;break-inside:avoid;}
  .cut-ad b{color:#000 !important;}
  .mx td,.mx th{color:#000;}
}

/* ============================================================
   仕上げ ── 見た目の作り直し
   これを毎日開くのは、店と厨房を行き来しながら片手で触る人。
   業務システムに見えないこと、自分の道具に見えることを優先する。
   ・囲まない。線を引かず、面と余白で区切る
   ・小さな札を並べない。読む順に、大きさで差をつける
   ・色は彩度を落として、意味のあるところだけに置く
   ============================================================ */
/* ------------------------------------------------------------
   色 ── 毎日開く道具として
   ・地60／面30／効かせる色10 の割合で組む
   ・意味の決まった色（完了＝緑、注意＝金、止まっている＝朱）は動かさない。
     そのかわり彩度を落として、ひとつの色が画面を支配しないようにする
   ・すべての組み合わせを実測し、読ませる文字は4.5:1 以上にしてある
   ------------------------------------------------------------ */
:root{
  --bg:#FAF8F6; --surface:#FFFFFF; --surface2:#F5F2EE; --surface3:#EDE9E4;
  --line:#EBE6E0; --line2:#DDD6CE;
  /* 黒は置かない。わずかに暖かい墨にすると、紙の地と喧嘩しない */
  --ink:#A05442;
  --tx:#38332F; --tx2:#6B645C; --tx3:#756E65;
  /* 朱はレンガ寄りに落とす。赤が前に出すぎると、画面が警告だらけに見える */
  --accent:#A05442; --accent-d:#85402F; --accent-bg:#F7EAE6;
  --gold:#7E6124; --gold-bg:#F8F1E2;
  --ok:#477157; --ok-bg:#EBF2EE;
  --warn:#7E6124; --warn-bg:#F8F1E2;
  --info:#456884; --info-bg:#EBF1F5;
  --violet:#6E5B87; --violet-bg:#F1EDF6;
  /* 拠点の識別。彩度は与えない（彩度は「状態」専用）。必ず文字ラベルを併記する */
  /* 担当の色。Yui は薄い緑、Ai は薄いオレンジ。
     文字の色は実測でAA(4.5:1)を通したものだけ */
  --jp-bg:#EFF7F1; --jp-ed:#CFE5D6; --jp-tx:#38684A;
  --db-bg:#FEF3EA; --db-ed:#F2D9C2; --db-tx:#95521F;
  --track:#EDE9E4;
  /* 文字の大きさ。時間のない人が片手で読むので、本文は16pxを下限にする */
  --fs-xs:.78rem; --fs-sm:.88rem; --fs-base:1rem; --fs-md:1.08rem;
  --fs-lg:1.22rem; --fs-xl:1.6rem; --fs-2xl:2.2rem;
  --r:18px; --r-sm:13px;
  /* 影はほとんど見えない。カードが紙のように、地からわずかに浮いていればいい */
  --lift:0 1px 2px rgba(56,51,47,.04), 0 16px 30px -24px rgba(56,51,47,.36);
}

/* ------------------------------------------------------------
   文字 ── 外から読み込まない（電波の悪い厨房でも、同じ形で出る）
   ・数字と英字は端末のUIフォント。和文より先に置くと数字が締まる
   ・Windowsの游ゴシックは標準の太さだと細く見えるので、本文を500で組む
   ------------------------------------------------------------ */
body,button,input,select,textarea{
  font-family:system-ui,-apple-system,"Segoe UI",
    "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",
    "Yu Gothic UI","Yu Gothic Medium","Yu Gothic",YuGothic,Meiryo,sans-serif;
}
body{letter-spacing:.02em;line-height:1.8;font-weight:500;font-size:1rem;color:var(--tx);}
h1,h2,h3,.ttl,.kpi b,.brow-n b,.fl-t{font-feature-settings:"palt" 1;font-weight:700;}
/* 数字は幅をそろえる。表と並んだ数字が1桁ずれて見えるのを防ぐ */
.kpi .kv,.brow-n b,.na-big,.mx td,.wcol .tot,.tt,.t-sub{font-variant-numeric:tabular-nums;}

/* ---- 面 ---- */
.card,.gap,.shoot,.wkp,.acc,.pres,.mx-wrap,.ibx,.sum,.rank{
  border-radius:20px;box-shadow:var(--lift);border:0;background:var(--surface);}
.card{padding:22px 20px;}

/* ---- 見出し ---- */
.sec,.sec-tight{align-items:baseline;margin-bottom:14px;}
.sec h2,.sec-tight h2{font-size:1.28rem;font-weight:700;letter-spacing:.05em;line-height:1.45;color:var(--tx);}
.sec h2 svg,.sec-tight h2 svg{width:19px;height:19px;color:var(--tx3);}
.sec .sub{font-size:.84rem;color:var(--tx3);letter-spacing:.03em;}

/* ---- 札（残っているところ） ---- */
.pill{border:0;padding:5px 12px;border-radius:999px;font-size:.76rem;font-weight:700;
  letter-spacing:.04em;background:var(--surface2);color:var(--tx2);}
.pill svg{display:none;}
.pill.p-accent{background:var(--accent-bg);color:var(--accent-d);}
.pill.p-ok{background:var(--ok-bg);color:var(--ok);}
.pill.p-warn{background:var(--warn-bg);color:var(--warn);}
.pill.p-info{background:var(--info-bg);color:var(--info);}
.pill.p-jp{background:var(--jp-bg);color:var(--jp-tx);}
.pill.p-db{background:var(--db-bg);color:var(--db-tx);}

/* ============================================================
   タスクカード
   左にボタン・右にボタン・真ん中に本文、では題名に170pxしか残らず、
   どのカードも三行に折れた同じ高さの壁になっていた。
   上から下へ、状態 → やること → なぜ → 経過 → 押すもの、と読ませる。
   ============================================================ */
.tlist{display:flex;flex-direction:column;gap:14px;}
/* 状態ごとの見出し。どこまでが今日の話で、どこからが終わった話かを分ける */
.tgrp{display:flex;align-items:baseline;gap:9px;padding:2px 4px 0;}
.tgrp:not(:first-child){margin-top:12px;}
.tgrp-l{font-size:.87rem;font-weight:700;letter-spacing:.09em;color:var(--tx2);}
.tgrp-l.st-late{color:var(--accent-d);}
.tgrp-l.st-today{color:var(--warn);}
.tgrp-l.st-wait{color:var(--info);}
.tgrp-l.st-done{color:var(--ok);}
.tgrp-n{font-size:.81rem;font-weight:700;color:var(--tx3);}
.task{display:block;position:relative;overflow:hidden;padding:19px 19px 16px 22px;
  border:0;border-radius:20px;background:var(--surface);box-shadow:var(--lift);}
/* 状態は左の細い帯。札を増やさずに、一覧を流し見して止まっているものが拾える */
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2);}
.task.st-late::before{background:var(--accent);}
.task.st-today::before{background:var(--warn);}
.task.st-wait::before{background:var(--info);}
.task.st-done::before{background:var(--ok);}
.task.st-done{box-shadow:0 1px 2px rgba(56,51,47,.03);background:#FBF9F7;}

.task .tmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 13px;}
.t-who{font-size:.82rem;font-weight:700;letter-spacing:.08em;padding:4px 12px;border-radius:8px;}
.t-who{background:var(--surface);}
.t-who.jp{color:var(--jp-tx);box-shadow:inset 0 0 0 1px var(--jp-ed);}
.t-who.db{color:var(--db-tx);box-shadow:inset 0 0 0 1px var(--db-ed);}
.t-st{font-size:.82rem;font-weight:700;letter-spacing:.05em;color:var(--tx2);}
.st-late .t-st{color:var(--accent-d);}
.st-today .t-st{color:var(--warn);}
.st-wait .t-st{color:var(--info);}
.st-done .t-st{color:var(--ok);}
/* くりかえしと期限は、一覧でいちばん先に読む手がかり。小さくしない */
.t-sub{font-size:.88rem;font-weight:700;color:var(--tx2);letter-spacing:.03em;}

.task .ttl{margin:0 0 11px;font-size:1.17rem;font-weight:700;line-height:1.52;
  letter-spacing:.025em;color:var(--tx);}
.task .ttl>svg{display:none;}
.st-done .ttl{color:var(--tx2);}

.task .twhy{margin:0 0 13px;padding:1px 0 1px 13px;border:0;border-left:2px solid var(--line2);
  border-radius:0;background:none;font-size:.88rem;line-height:1.85;color:var(--tx2);
  letter-spacing:.02em;}

.task .tflow{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;}
.task .tflow:empty{display:none;}
.tflow .nx,.tflow .dn,.tflow .ak,.tflow .pv{font-size:.81rem;letter-spacing:.03em;color:var(--tx2);}
.tflow .dn,.tflow .ak{color:var(--ok);}
.tflow svg{width:14px;height:14px;}

/* 押すものは下へ。いちばん押すボタンに幅と言葉を与える */
.task .tact{display:flex;gap:9px;align-items:stretch;}
.task .tcheck{flex:1 1 auto;width:auto;min-width:0;min-height:52px;flex-direction:row;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:14px;border:1px solid var(--line2);background:var(--surface2);
  color:var(--tx);font-size:.95rem;font-weight:700;letter-spacing:.05em;}
.task .tcheck svg{width:19px;height:19px;}
.task .tcheck .lb{font-size:.95rem;font-weight:700;letter-spacing:.05em;}
.task .tcheck.on{background:var(--ok-bg);border-color:#BBD2C4;color:var(--ok);}
.task .tcheck.ack{background:var(--ok);border-color:var(--ok);color:#fff;}
.task .tcheck[disabled]{background:var(--surface2);border-color:var(--line);color:var(--tx2);opacity:1;}
.task .tside{display:none;}
.task .tact .tchat{flex:0 0 auto;width:52px;min-height:52px;border-radius:14px;
  border:1px solid var(--line2);background:var(--surface);color:var(--tx2);position:relative;}
.task .tact .tchat svg{width:20px;height:20px;}
.task .tact .tedit{color:var(--tx3);}
.task .tact .tchat .dot{position:absolute;top:-5px;right:-5px;}

/* 朱にするのは、期限を過ぎたものだけ。
   毎日・毎週のタスクは常に「本日」なので、本日まで朱にすると画面が朱で埋まり、
   どれから触ればいいのか、かえって決められなくなる */
.task.st-late .tcheck:not([disabled]):not(.on):not(.ack){
  background:var(--accent);border-color:var(--accent);color:#fff;}

/* ============================================================
   タスクのページ（1タスク＝1ページ）
   カード（見るだけ）とやり取り（書くだけ）に割れていたものを、
   ひとつづきにする。聞きたくなった場所で、そのまま聞ける。
   ============================================================ */
/* 題名を押せばページが開く。見た目は文字のまま */
.task .ttl-b{display:block;width:100%;border:0;background:none;padding:0;margin:0;
  text-align:left;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;}
.task .ttl-b:hover{text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:var(--line2);text-decoration-thickness:1.5px;}

.props{display:flex;flex-direction:column;}
.prop{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);}
.prop:first-child{padding-top:0;}
.prop:last-child{border-bottom:0;padding-bottom:0;}
.prop-l{flex:0 0 66px;font-size:.79rem;font-weight:700;color:var(--tx3);letter-spacing:.08em;}
.prop-v{flex:1;min-width:0;font-size:.96rem;font-weight:700;color:var(--tx);line-height:1.6;}

.tp-act{display:flex;gap:10px;margin-bottom:4px;}
.tp-check{flex:1 1 auto;min-width:0;min-height:56px;border-radius:15px;
  border:1px solid var(--line2);background:var(--surface2);color:var(--tx);
  font-size:1rem;font-weight:700;letter-spacing:.05em;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;}
.tp-check svg{width:20px;height:20px;}
.tp-check.on{background:var(--ok-bg);border-color:#BBD2C4;color:var(--ok);}
.tp-check.ack{background:var(--ok);border-color:var(--ok);color:#fff;}
.tp-check[disabled]{background:var(--surface2);border-color:var(--line);color:var(--tx2);opacity:1;}
.tp-act .btn{flex:0 0 auto;}

.tp-why{padding:2px 0 2px 14px;border-left:2px solid var(--line2);white-space:pre-wrap;
  font-size:.95rem;line-height:1.9;color:var(--tx2);letter-spacing:.02em;}

/* メモ。二人とも書ける自由欄。タスクに付く細かい話が連絡に流れて埋もれていた */
.tp-memo textarea{width:100%;min-height:112px;box-sizing:border-box;resize:vertical;
  border:1px solid var(--line2);border-radius:14px;padding:14px 15px;background:var(--surface);
  font-size:.95rem;line-height:1.85;color:var(--tx);letter-spacing:.02em;}
.tp-memo textarea::placeholder{color:var(--tx3);}
.tp-memo textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
.tp-memo .btn{margin-top:10px;}
.tp-hist{margin-top:4px;}

/* ============================================================
   盤（日本と現地の差）
   横一杯の帯を2本並べると、それだけで190px。主役であるはずの
   「今から撮るもの」とタスクが、どちらも初画面の外へ出ていた。
   2列に畳み、朱は「自分が待たせている数」の1か所だけに残す。
   ============================================================ */
.gap{border-radius:20px;margin-top:14px;}
.gap-hd{padding:16px 16px 0;gap:9px;}
.gap-hd h2{font-size:1.06rem;letter-spacing:.05em;}
.gap-wk{min-height:38px;padding:0 12px;border-radius:999px;font-size:.78rem;}
.gap-clock{font-size:.76rem;color:var(--tx3);letter-spacing:.02em;margin:0;padding:11px 16px 0;}
.gap-clock + .gap-sync{padding-top:5px;}
.gap-sync:last-child,.gap-clock:last-child{padding-bottom:15px;}
/* 1fr は中身の最小幅より縮まない。列がカードからはみ出して右端で切れていた */
.gap-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;padding:11px 16px 0;}
.brow{display:block;position:relative;width:100%;text-align:left;border:0;
  padding:13px 30px 12px 14px;min-height:0;border-radius:14px;
  background:var(--surface2);box-shadow:none;}
/* 盤の札も、一覧と同じ担当の色で敷く。どちらの持ち場かを先に見せる */
.brow-jp{background:var(--jp-bg);}
.brow-db{background:var(--db-bg);}
/* いま自分が動く側だけ、縁を立てて一枚起こす */
.brow.is-me{box-shadow:inset 0 0 0 1.5px var(--line2);}
.brow-jp.is-me{box-shadow:inset 0 0 0 1.5px var(--jp-ed);}
.brow-db.is-me{box-shadow:inset 0 0 0 1.5px var(--db-ed);}
.brow-jp .brow-t{color:var(--jp-tx);}
.brow-db .brow-t{color:var(--db-tx);}
.brow-jp .brow-add{border-top-color:var(--jp-ed);}
.brow-db .brow-add{border-top-color:var(--db-ed);}
.brow-t{display:block;font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--tx2);
  line-height:1.5;margin:0;}
.brow-n{display:flex;align-items:baseline;gap:3px;margin:5px 0 3px;}
.brow-n b{font-size:2.05rem;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--tx);}
.brow-n i{font-style:normal;font-size:.76rem;font-weight:700;color:var(--tx2);}
/* 朱は「自分が相手を待たせている」ときだけ。相手待ちまで朱にすると、どちらを見ればいいのか決められない */
.brow.is-stop.is-me .brow-n b{color:var(--accent-d);}
.brow.is-stop:not(.is-me) .brow-n b{color:var(--tx);}
.brow-s{display:block;font-size:.76rem;font-weight:700;color:var(--tx3);letter-spacing:.02em;
  line-height:1.55;margin:0;}
.brow-k{position:absolute;top:13px;right:11px;color:var(--tx3);}
.brow-k svg{width:15px;height:15px;}
.brow-ans{grid-column:1 / -1;background:var(--ok-bg);box-shadow:none;
  display:flex;align-items:center;gap:10px;padding:12px 30px 12px 14px;}
.brow-ans .brow-t{flex:1;color:var(--ok);display:flex;align-items:center;gap:6px;}
.brow-ans .brow-n{margin:0;}
.brow-ans .brow-n b{font-size:1.5rem;color:var(--ok);}
.brow-ans .brow-s{display:none;}
/* 拠点の札には役目が二つある。開いて読むのと、その場で足すの。
   ボタンの中にボタンは置けないので、外側を器にして、下に足す行をぶら下げる */
.brow-hit{display:block;width:100%;padding:0;border:0;background:none;color:inherit;
  font:inherit;text-align:left;cursor:pointer;}
.brow-add{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  min-height:34px;margin-top:9px;padding-top:8px;border:0;border-top:1px solid var(--line);
  background:none;color:var(--tx2);font-size:.76rem;font-weight:700;letter-spacing:.04em;
  cursor:pointer;}
.brow-add:hover{color:var(--accent-d);}
.brow-add svg{width:14px;height:14px;}
.brow-ans .brow-hit{cursor:default;}
/* 止まっている一覧に、いつ足したか・いつまでかを添える */
.gap-row .t{display:block;}
.gap-row .s{display:block;margin-top:3px;font-size:.72rem;font-weight:600;
  letter-spacing:.02em;color:var(--tx3);}
/* 状態は、右端の言葉そのものに色を持たせる。ここだけ黒だと、どれが急ぎか読み取れない */
.gap-row .d.st-late{color:var(--accent-d);}
.gap-row .d.st-today{color:var(--warn);}
.gap-row .d.st-wait{color:var(--info);}
.gap-row .d.st-plan{color:var(--tx3);}
/* 長押しはスマホの作法で、パソコンでは誰も気づけない。つまみを常に出しておく */
/* 掴むつまみ。掴めるものだと分かる形にしておかないと、誰も触らない */
.chmv{display:flex;align-items:center;justify-content:center;
  margin:9px auto 0;min-height:34px;width:58px;border:0;border-radius:10px;
  background:var(--surface3);color:var(--tx2);cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;}
.chmv:hover{background:var(--accent-bg);color:var(--accent-d);}
.chmv:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.chmv svg{width:16px;height:16px;}
.gap-sync{padding:11px 16px 14px;font-size:.76rem;line-height:1.6;color:var(--tx3);}
.gap-sync.old{color:var(--tx2);}
.gap-sync svg{color:var(--tx3);}

/* ============================================================
   相手からの更新
   同期しても、画面のどこかの数字が静かに変わるだけだった。
   何が足され、どれが終わったのかを、開いて読める場所にする。
   ============================================================ */
.fbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  margin-top:14px;padding:14px 14px 14px 15px;border-radius:18px;
  background:var(--info-bg);box-shadow:inset 0 0 0 1.5px var(--jp-ed);}
.fbar-i{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:var(--surface);color:var(--info);}
.fbar-i svg{width:18px;height:18px;}
.fbar-b{flex:1;min-width:0;}
.fbar-t{display:block;font-size:.98rem;font-weight:700;letter-spacing:.03em;color:var(--info);
  line-height:1.45;}
.fbar-s{display:block;font-size:.79rem;font-weight:700;color:var(--tx2);margin-top:3px;
  letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fbar-k{flex:none;color:var(--info);display:flex;}
.fbar-k svg{width:17px;height:17px;}

.fl{display:flex;flex-direction:column;gap:10px;}
.fl-r{display:flex;gap:12px;width:100%;text-align:left;border:0;align-items:flex-start;
  padding:14px 13px 14px 15px;border-radius:15px;background:var(--surface2);}
.fl-k{flex:none;color:var(--tx3);display:flex;align-self:center;}
.fl-k svg{width:16px;height:16px;}
.fl-add{background:var(--info-bg);}
.fl-ack{background:var(--ok-bg);}
.fl-i{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:var(--surface);color:var(--tx2);}
.fl-i svg{width:15px;height:15px;}
.fl-add .fl-i{color:var(--info);} .fl-ack .fl-i{color:var(--ok);}
.fl-b{flex:1;min-width:0;}
.fl-w{font-size:.83rem;font-weight:700;letter-spacing:.04em;color:var(--tx2);}
.fl-add .fl-w{color:var(--info);} .fl-ack .fl-w{color:var(--ok);}
/* きかれていること・撮り方の指示は、この道具でいちばん先に読んでほしい */
.fl-ask{background:var(--warn-bg);}
.fl-ask .fl-i,.fl-ask .fl-w{color:var(--warn);}
.fl-t{font-size:1.02rem;font-weight:700;line-height:1.5;letter-spacing:.02em;color:var(--tx);
  margin-top:3px;}
/* どのカット・何秒の話か。ここが無いと、長い動画のどこを直すのか伝わらない */
.fl-c{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:7px;
  background:var(--surface);font-size:.75rem;font-weight:700;color:var(--tx2);
  vertical-align:middle;letter-spacing:.03em;}
/* 言われた中身。開かないと分からないのでは、時間のない人はどれも開かない */
.fl-x{margin-top:7px;padding-left:11px;border-left:2px solid var(--line2);
  font-size:.87rem;line-height:1.8;color:var(--tx2);letter-spacing:.02em;}
.fl-m{font-size:.77rem;color:var(--tx3);margin-top:5px;letter-spacing:.02em;}
/* 名前と日時を続けて書くと、狭い画面では日時が二行に割れて読めない */
.fl-m .tt{display:block;margin:2px 0 0;}

/* ---- 今から撮るもの ---- */
.shoot{border-radius:18px;gap:1px;}
.shoot-r{padding:14px 15px;gap:12px;}
.shoot-i{width:34px;height:34px;border-radius:10px;}
.shoot-t{font-size:1.02rem;letter-spacing:.025em;line-height:1.45;}
.shoot-m{margin-top:5px;gap:8px;flex-wrap:nowrap;overflow:hidden;}
.shoot-d,.shoot-c{font-size:.77rem;white-space:nowrap;}
.shoot-m .pill{padding:4px 10px;font-size:.73rem;flex:none;}
.sec-aim{min-height:38px;padding:0 13px;border-radius:999px;font-size:.78rem;
  background:var(--surface2);border:0;color:var(--tx2);}
.sec-aim svg{color:var(--tx3);}

/* ---- 絞り込みチップ ---- */
.chips{gap:8px;}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--tx2);
  border-radius:999px;padding:8px 15px;font-size:.83rem;font-weight:700;letter-spacing:.04em;}
.chip b{font-size:.78rem;color:var(--tx2);}
.chip[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:#fff;}
/* 選んでいるチップの中の件数が、地の色のまま薄く残って読めなかった */
.chip[aria-pressed="true"] b{color:rgba(255,255,255,.82);}

/* ---- 下のタブ ---- */
/* 5つ並ぶので字は小さくなるが、11pxは読ませる字の下限を割っている */
.nav button{font-size:.77rem;letter-spacing:.02em;gap:4px;padding:9px 2px 8px;}
.nav button svg{width:22px;height:22px;}

/* ---- ボタン ---- */
.btn{border-radius:13px;min-height:46px;padding:11px 18px;letter-spacing:.06em;font-weight:700;}
.btn-sm{min-height:40px;padding:9px 14px;border-radius:11px;font-size:.84rem;}
.addrow{border-radius:14px;min-height:52px;border:1px dashed var(--line2);background:none;
  color:var(--tx2);font-weight:700;letter-spacing:.06em;}

/* ---- 注意書き ---- */
.hint{border-radius:13px;background:var(--surface2);border:0;color:var(--tx2);
  padding:13px 15px;font-size:.85rem;line-height:1.8;letter-spacing:.02em;}
.hint svg{color:var(--tx3);}
.hint b{color:var(--tx);}

/* ---- 数字 ---- */
/* 大きな数字を 200〜300 の細さで置くと、線が消えかけて弱々しく見える。
   日本語フォントの細ウェイトは欧文ほど作り込まれていないので、なおさら痩せる */
.kpi b,.na-big,.res-n b,.wcol .tot,.past-avg b,.ptype .cnt,.kv.na{font-weight:700;letter-spacing:-.02em;}
.na-big{color:var(--tx2);}
/* 4つの数字を1pxの線で四つ切りにすると、罫線ばかりが目に入る。面と余白で分ける */
.kpis{gap:9px;background:none;border-radius:0;overflow:visible;box-shadow:none;}
.kpi{background:var(--surface);padding:16px 15px;border-radius:16px;box-shadow:var(--lift);}
.kpi .kl{font-size:.74rem;letter-spacing:.08em;color:var(--tx2);}
.kpi .kv{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-top:4px;}
.kpi .kv i{font-size:.74rem;margin-left:3px;color:var(--tx2);}
.kpi .kd{font-size:.75rem;margin-top:3px;}
.na-big{font-weight:700;color:var(--tx);}

/* ============================================================
   比較表の軸
   ============================================================ */
/* 長押しで持ち上がった列。どれを動かしているのかが、ひと目で分かるようにする */
/* 運んでいる最中の列。持ち上がっていることが、ひと目で分かるように */
.mx th.ch.drag{background:var(--gold-bg);box-shadow:inset 0 0 0 2px var(--gold);}
.mx th.ch.drag .sname{color:var(--gold);}
.mx th.ch.drag .chmv{background:var(--gold);color:#fff;cursor:grabbing;}
body.mx-drag{cursor:grabbing;user-select:none;-webkit-user-select:none;}
body.mx-drag .mx-wrap{overflow-x:hidden;}
body.mx-drag .mx td,body.mx-drag .mx th{transition:none;}
/* 見出しは、どこを押しても掴める。押して横へ動かせば列がついてくる。
   指を置いた瞬間にOSの文字選択と喧嘩するので、この見出しだけ選べなくする。
   縦の指の動きは表を読むためのものなので、そちらはブラウザに渡す */
.mx th.ch,.mx th.ch .sname{user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:pan-y;cursor:grab;}
.mx th.ch button{cursor:pointer;}
.mx th.ch.drag{cursor:grabbing;}

/* 撮った動画への入口。表の中にも一覧の中にも同じ形で出るので、
   小さくても押せる高さを持たせる */
.vlink{display:inline-flex;align-items:center;gap:5px;margin-top:5px;min-height:30px;
  padding:4px 9px;border:0;border-radius:9px;background:var(--info-bg);color:var(--info);
  font-size:.74rem;font-weight:700;letter-spacing:.02em;text-decoration:none;cursor:pointer;
  max-width:100%;}
.vlink svg{width:13px;height:13px;flex:none;}
.vlink:hover{background:var(--surface3);}
/* 空のときは誘いであって、報せではない。色を持たせない */
.vlink.none{background:none;color:var(--tx3);padding-left:0;text-decoration:underline;
  text-underline-offset:3px;}
.vlink.none:hover{color:var(--accent-d);background:none;}
.vlink-w{margin-top:8px;}
/* 一覧の紙そのものを担当の色に。読まずに、どちらの仕事かが分かる */
.task.w-jp{background:var(--jp-bg);}
.task.w-db{background:var(--db-bg);}
.task.w-jp .tcheck,.task.w-db .tcheck{background:var(--surface);}
.task.w-jp .tchat,.task.w-db .tchat,
.task.w-jp .tedit,.task.w-db .tedit{background:var(--surface);}
/* 期限を過ぎた紙だけ、左端に朱の線を立てる */
.task.is-late{box-shadow:inset 3px 0 0 var(--accent), var(--lift);}
/* 見出しの脇の但し書き。「任意」は見出しと同じ太さで書くと指示に見える */
.frm .jp i{font-style:normal;font-weight:500;color:var(--tx3);font-size:.76rem;}
/* 区分は二段で出すが、見出しはひとつ。段のあいだを詰める */
.frm label>.seg+.seg{margin-top:7px;}
/* つながっているかどうか。いちばん上に、静かに、でも常に出しておく */
.hbtn.fb-on{color:var(--ok);}
.hbtn.fb-err{color:var(--accent-d);background:var(--accent-bg);}
.fbst{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border-radius:var(--r-sm);
  margin-bottom:16px;background:var(--surface2);line-height:1.75;}
.fbst svg{width:19px;height:19px;flex:none;margin-top:2px;}
.fbst b{font-size:var(--fs-sm);font-weight:700;}
.fbst.fb-on{background:var(--ok-bg);}
.fbst.fb-on svg,.fbst.fb-on b{color:var(--ok);}
.fbst.fb-err{background:var(--accent-bg);}
.fbst.fb-err svg,.fbst.fb-err b{color:var(--accent-d);}
/* 状態は二つだけ。未着手は静かに、完了は緑で。
   期限を過ぎたものは、状態ではなく期限の文字の色で気づかせる */
.tgrp-l.st-todo{color:var(--tx2);}
.tgrp-l.st-done{color:var(--ok);}
.st-todo .t-st{color:var(--tx2);}
.st-done .t-st{color:var(--ok);}
.st-done .ttl,.st-done .ttl-b{color:var(--tx2);}
.gap-row .d.st-todo{color:var(--tx2);}
.gap-row .d.st-done{color:var(--ok);}
.task.st-todo{box-shadow:var(--lift);}
.task.is-late .t-sub{color:var(--accent-d);font-weight:700;}
.task.is-late{box-shadow:inset 3px 0 0 var(--accent), var(--lift);}
.dv{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.dv-none{display:inline-flex;align-items:flex-start;gap:6px;font-size:var(--fs-sm);
  line-height:1.7;color:var(--tx2);}
.dv-none svg{width:15px;height:15px;flex:none;margin-top:4px;color:var(--tx3);}
/* 動画の置き場所。住所を落とすか、貼り付けるか、どちらでも同じ結果になる枠 */
.vdrop{display:flex;flex-direction:column;gap:11px;}
.vdrop-z{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
  border:2px dashed var(--line2);border-radius:14px;padding:18px 14px;background:var(--surface2);
  transition:.15s;}
.vdrop-z svg{width:22px;height:22px;color:var(--tx3);}
.vdrop-z b{font-size:var(--fs-sm);font-weight:700;color:var(--tx2);line-height:1.6;}
.vdrop-z i{font-style:normal;font-size:.74rem;font-weight:600;color:var(--tx3);line-height:1.7;}
.vdrop.over .vdrop-z{border-color:var(--accent);background:var(--accent-bg);}
.vdrop.over .vdrop-z svg,.vdrop.over .vdrop-z b{color:var(--accent-d);}
.vdrop-f{display:flex;gap:8px;align-items:center;}
.vdrop-f input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:11px 13px;min-height:46px;background:var(--surface);font-size:var(--fs-sm);
  letter-spacing:.02em;}
.vdrop-f input:focus{outline:none;border-color:var(--accent);}
.vdrop-f .btn{flex:none;}
.vdrop-no{display:flex;align-items:flex-start;gap:6px;font-size:var(--fs-sm);
  line-height:1.7;color:var(--tx2);}
.vdrop-no svg{width:15px;height:15px;flex:none;margin-top:4px;color:var(--tx3);}
/* 入力欄の下に置く、書き方の添え */
.frm .fnote{display:block;margin-top:6px;font-size:.74rem;line-height:1.7;color:var(--tx3);
  letter-spacing:.02em;}
/* 軸を足す入口。表の中に置くと、行の数だけ空のセルが増える */
.mxadds{display:flex;gap:9px;margin-top:12px;}
.mxadd{flex:1 1 0;min-width:0;min-height:50px;border-radius:14px;border:1px dashed var(--line2);
  background:none;color:var(--tx2);font-weight:700;letter-spacing:.03em;font-size:.86rem;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.mxadd svg{width:16px;height:16px;color:var(--tx3);flex:none;}
/* 見出し列が狭すぎて、5文字の名前が3行に折れていた */
.mx th.rh{min-width:76px;}
/* 列を足す口は「シリーズ」の欄に置く。足すものの名前が書いてある場所に、
   足す口があるのがいちばん短い */
.mx th.rh .rh-add{display:flex;align-items:center;justify-content:center;gap:4px;
  width:100%;min-height:38px;margin-top:9px;border-radius:9px;
  border:1px dashed var(--line2);background:var(--surface);color:var(--tx2);
  font-size:.7rem;font-weight:700;letter-spacing:.02em;}
.mx th.rh .rh-add:hover{border-color:var(--accent);color:var(--accent-d);background:var(--accent-bg);}
.mx th.rh .rh-add svg{width:14px;height:14px;}
/* タブ。どれを見ているのかが下線1本では遠目に分からない。面で示す。
   横並びのときは中身が左端に寄っていたので、真ん中へ置く */
.nav button{justify-content:center;}
.nav button[aria-selected="true"]{background:var(--accent-bg);font-weight:700;}
.nav button[aria-selected="true"] svg{color:var(--accent);}
@media(min-width:768px){
  .nav button{justify-content:center;border-radius:11px 11px 0 0;}
}
/* 絞り込みの右に、足す口を置く。下までスクロールしないと足せないのは遠い */
.tbar{display:flex;align-items:center;gap:10px;margin-top:4px;}
.tbar .chips{flex:1;min-width:0;padding-bottom:0;}
.tbar-add{flex:none;white-space:nowrap;}
@media(max-width:519px){
  .tbar{flex-direction:column;align-items:stretch;gap:8px;}
  .tbar-add{width:100%;}
}
/* 撮影手順は畳んでおく。押すと開く */
.cutdet{border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:0 15px;margin-top:16px;}
.cutdet[open]{padding-bottom:15px;}
.cutdet>summary{display:flex;align-items:center;gap:9px;min-height:54px;cursor:pointer;
  list-style:none;font-size:1.02rem;font-weight:700;letter-spacing:.02em;color:var(--tx);}
.cutdet>summary::-webkit-details-marker{display:none;}
.cutdet>summary svg{width:16px;height:16px;color:var(--tx3);}
.cutdet>summary i{font-style:normal;margin-left:auto;font-size:.74rem;font-weight:700;color:var(--tx3);}
.cutdet>summary:hover{color:var(--accent-d);}
/* ボタンの形をしたリンクに下線が入り、押せるものとしての見た目が崩れていた */
a.btn{text-decoration:none;}
.cutdet>.sub{font-size:var(--fs-sm);color:var(--tx2);line-height:1.75;}
/* 撮影素材は並べて見る。1本ずつ縦に積むと、何本あってどれが止まっているのかが掴めない */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(246px,1fr));gap:13px;}
.vg{display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;
  background:var(--surface);border:0;border-radius:18px;padding:17px 17px 15px;
  box-shadow:var(--lift);position:relative;overflow:hidden;transition:.15s;}
.vg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2);}
.vg:hover{transform:translateY(-2px);}
.vg.v-shot::before{background:var(--gold);} .vg.v-review::before{background:var(--info);}
.vg.v-redo::before{background:var(--accent);} .vg.v-ok::before{background:var(--ok);}
.vg.v-posted::before{background:var(--violet);}
.vg-t{font-size:1.02rem;font-weight:700;line-height:1.5;letter-spacing:.02em;}
.vg-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.vg-u{font-size:.71rem;font-weight:700;color:var(--tx3);line-height:1.6;letter-spacing:.02em;}
.vg-u b{color:var(--tx2);font-weight:700;}
.vg .stepbar{margin-top:0;}
.vg-f{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:4px;}
.vg-f .vg-k{margin-left:auto;color:var(--tx3);display:flex;}
.vg-f .vg-k svg{width:16px;height:16px;}
.vg-dot{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;
  font-size:.7rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
/* 動画を見ながら読む。枠が出せないときのために、下に開く口も残す */
.vframe{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;
  overflow:hidden;background:var(--surface3);margin-bottom:9px;}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vfnote{display:flex;align-items:flex-start;gap:6px;font-size:.72rem;line-height:1.7;
  color:var(--tx3);margin-bottom:14px;}
.vfnote svg{width:13px;height:13px;flex:none;margin-top:3px;}
.vtop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
/* 連絡が届いていることは、題名の脇で知らせる。
   カードからふきだしの印を外したので、ここが唯一の入口になる */
.t-un{display:inline-flex;align-items:center;gap:3px;vertical-align:2px;
  margin-left:7px;padding:2px 8px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.02em;}
.t-un svg{width:11px;height:11px;}
/* 一覧のカードの間。詰めると、どこまでが1件なのか目で切れない */
.tlist{gap:12px;}
.tcol{gap:12px;}
/* セルを書くときに、ほかの列を並べて見る。
   横に並べて比べる表なのに、書くときだけ1枚に閉じていた */
.cellwrap{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:760px){ .cellwrap.two{grid-template-columns:1.05fr .95fr;} }
.cellcmp{display:flex;flex-direction:column;gap:11px;min-width:0;}
.cellcmp-i{background:var(--surface2);border-radius:12px;padding:12px 14px;}
.cellcmp-i b{display:block;font-size:.78rem;font-weight:700;color:var(--tx2);
  letter-spacing:.03em;margin-bottom:7px;}
.cellcmp-t{font-size:.78rem;line-height:1.85;white-space:pre-wrap;color:var(--tx);}
.cellcmp-t.none{color:var(--tx3);}
.cellmm{margin-top:18px;}
.cellmm textarea{width:100%;box-sizing:border-box;border:1px solid var(--line2);
  border-radius:var(--r-sm);padding:11px 13px;min-height:96px;background:var(--surface);
  font-size:var(--fs-sm);line-height:1.75;resize:vertical;}
.cellmm textarea:focus{outline:none;border-color:var(--accent);}
/* 表のセルに、メモがあることの印 */
.cell-mm{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:2px 8px;
  border-radius:5px;background:var(--surface3);color:var(--tx2);
  font-size:.68rem;font-weight:700;letter-spacing:.04em;}
.cell-mm svg{width:11px;height:11px;}
/* シートを画面いっぱいに。撮影の指示は行数が多く、
   660pxの枠に収めると、いちばん読みたい下の行がいつも枠の外にある */
.ov.full{padding:0;align-items:stretch;}
.ov.full .sheet{max-width:none;width:100%;height:100%;max-height:100%;
  border-radius:0;border:0;}
.sheet-hd .sheet-x+.sheet-x{margin-left:0;}
/* 投稿の行に置く、動画を落とすところ。行の中なので細くする */
.vdrop.sm{gap:7px;flex-basis:100%;order:8;margin-top:7px;}
.vdrop.sm .vdrop-z{padding:9px 11px;border-radius:10px;border-width:1px;
  flex-direction:row;gap:6px;text-align:left;}
.vdrop.sm .vdrop-z svg{width:14px;height:14px;}
.vdrop.sm .vdrop-z b{font-size:.72rem;}
/* 未着手は二種類が混ざる。くりかえしと、いつまでのもの。
   混ぜて一列に積むと、今日やるものと今週やるものが交互に出てくる */
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start;}
.tcol{min-width:0;display:flex;flex-direction:column;gap:9px;}
.tcol-h{display:flex;align-items:center;gap:6px;padding:0 2px;
  font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--tx2);}
.tcol-h svg{width:14px;height:14px;color:var(--tx3);}
.tcol-h b{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--tx3);}
.tcol .empty{padding:20px 12px;}
@media(max-width:767px){ .tcols{grid-template-columns:1fr;gap:16px;} }
/* カットごとのメモ。撮った側が気づいたことを、その行に残す */
.cut-mm{display:flex;align-items:flex-start;gap:6px;margin-top:7px;padding:7px 9px;
  border-radius:8px;background:var(--surface2);font-size:.72rem;line-height:1.7;color:var(--tx);}
.cut-mm svg{width:13px;height:13px;flex:none;margin-top:3px;color:var(--tx3);}
.cut-mm b{display:block;font-size:.7rem;color:var(--tx2);letter-spacing:.03em;margin-bottom:1px;}
/* 自分で足した行。決まった行と見分けがつくよう、名前の下に直す口を置く */
.mx th.rh-x{position:relative;padding-bottom:36px;}
.mx th.rh-x .rh-e{position:absolute;left:50%;transform:translateX(-50%);bottom:7px;
  width:30px;height:30px;border-radius:9px;
  border:0;background:var(--surface2);color:var(--tx3);display:inline-flex;
  align-items:center;justify-content:center;}
.mx th.rh-x .rh-e svg{width:14px;height:14px;}
.rowmv{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap;}
.rowmv .btn{flex:1 1 140px;}

/* ---- 引き出し ---- */
.sheet{border-radius:26px 26px 0 0;}

/* ---- 狭い画面 ---- */
@media(max-width:400px){
  .card{padding:19px 16px;}
  .task{padding:17px 16px 15px 19px;}
  .task .ttl{font-size:1.1rem;}
  .task .tcheck{min-height:50px;font-size:.9rem;}
  .task .tact .tchat{width:50px;min-height:50px;}
  .brow{padding:13px 12px 13px 19px;min-height:72px;}
  .sec h2,.sec-tight h2{font-size:1.19rem;}
}
</style>
</head>
<body>
<style>
/* ------------------------------------------------------------
   合言葉の覆い
   URLを知っている人のあいだでも、肩越しに開かれるのを1枚はさんで防ぐ。
   これは鍵ではなく、暖簾。ほんとうに見せたくないものは、ここには置かない。
   ------------------------------------------------------------ */
#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:#FAF8F6;}
#gate[hidden]{display:none!important;}
.gate-b{width:100%;max-width:340px;text-align:center;}
.gate-m{width:58px;height:58px;margin:0 auto 20px;border-radius:18px;background:#FFFFFF;
  box-shadow:0 1px 2px rgba(56,51,47,.05),0 16px 30px -24px rgba(56,51,47,.36);
  display:flex;align-items:center;justify-content:center;}
.gate-m svg{width:27px;height:27px;fill:none;stroke:#A05442;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.gate-t{font-size:1.2rem;font-weight:700;letter-spacing:.05em;color:#38332F;line-height:1.5;margin:0 0 7px;}
.gate-s{font-size:.88rem;line-height:1.8;color:#6B645C;letter-spacing:.02em;margin:0 0 22px;}
#gatePin{width:100%;height:60px;border:1px solid #DDD6CE;border-radius:15px;background:#FFFFFF;
  text-align:center;font-size:1.6rem;font-weight:700;letter-spacing:.5em;text-indent:.5em;
  color:#38332F;box-sizing:border-box;}
#gatePin:focus{outline:2px solid #A05442;outline-offset:2px;border-color:#A05442;}
.gate-go{width:100%;height:54px;margin-top:11px;border:0;border-radius:15px;background:#A05442;
  color:#fff;font-size:1rem;font-weight:700;letter-spacing:.08em;cursor:pointer;}
.gate-ng{margin-top:13px;font-size:.86rem;font-weight:700;color:#85402F;min-height:1.4em;}
</style>
<div id="gate">
  <div class="gate-b">
    <div class="gate-m"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10"
      rx="2.2"/><path d="M8 10.5V7.8a4 4 0 018 0v2.7"/></svg></div>
    <p class="gate-t">Dubai Shiogensui 集客管理</p>
    <p class="gate-s">この画面は、この店の人だけのものです。<br>合言葉を入れてください。</p>
    <input id="gatePin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"
      aria-label="合言葉">
    <button class="gate-go" id="gateGo" type="button">開く</button>
    <p class="gate-ng" id="gateNg" role="status"></p>
  </div>
</div>


<header class="hd">
  <div class="hd-in">
    <div class="hd-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5h17c0 5.2-3.8 9-8.5 9s-8.5-3.8-8.5-9Z"/><path d="M8 7.5c0-1.8 1.8-1.8 1.8-3.5M12 7.5c0-1.8 1.8-1.8 1.8-3.5M16 7.5c0-1.8 1.8-1.8 1.8-3.5"/></svg></div>
    <button class="hd-t" id="hdMe" data-act="accounts"><b id="hdShop">Dubai Shiogensui</b><span id="hdWho"></span></button>
    <div class="hd-right">
      <button class="hbtn" id="btnSync"><span id="syncIc"></span><span id="syncTx">同期</span></button>
      <button class="hbtn" id="btnSet" aria-label="設定"><span id="setIc"></span></button>
    </div>
  </div>
</header>

/* ============================================================
   3. 道具
   ============================================================ */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad2(n){ return n<10?'0'+n:''+n; }
function now(){ return Date.now(); }
function tzd(ts,off){ return new Date(ts+off*3600000); }
function ymdTZ(ts,off){ var d=tzd(ts,off); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
function hmTZ(ts,off){ var d=tzd(ts,off); return pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes()); }
function mdTZ(ts,off){ var d=tzd(ts,off); return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }
/* ユーザー指示：日時は必ず「ドバイ／日本」の両方を表示する */
function bothTime(ts){
  return 'ドバイ '+mdTZ(ts,TZ_DUBAI)+' '+hmTZ(ts,TZ_DUBAI)+' ／ 日本 '+mdTZ(ts,TZ_JAPAN)+' '+hmTZ(ts,TZ_JAPAN);
}
function today(){ return ymdTZ(now(),TZ_DUBAI); }
function fromYmd(s){ var a=String(s).split('-'); return new Date(Date.UTC(+a[0],+a[1]-1,+a[2])); }
function ymdOf(d){ return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
function addDays(s,n){ var d=fromYmd(s); d.setUTCDate(d.getUTCDate()+n); return ymdOf(d); }
function dowOf(s){ return fromYmd(s).getUTCDay(); }
function fmtYmd(s){ var d=fromYmd(s); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日('+DOW[d.getUTCDay()]+')'; }
function fmtMd(s){ var d=fromYmd(s); return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }
function weekStart(s){ var d=fromYmd(s); var w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w); return ymdOf(d); }
function diffDays(a,b){ return Math.round((fromYmd(a)-fromYmd(b))/86400000); }
function alive(a){ return (a||[]).filter(function(o){ return !o.del; }); }
function byId(a,id){ for(var i=0;i<(a||[]).length;i++){ if(a[i].id===id) return a[i]; } return null; }
function sum(a){ var t=0; for(var i=0;i<a.length;i++) t+=a[i]; return t; }
function rate(x,y){ return y?Math.round(x/y*100)+'%':'—'; }
function hash(s){ var h=0x811c9dc5; s=String(s);
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; }
  return (h>>>0).toString(16); }

/* 最初に出すのは自分の分だけ。他人のタスクまで並ぶと、1日3分の人は
   自分が何をすればいいのか探すところから始めることになる（上の絞り込みで全件に戻せる） */
var S=null, VIEW='task', PTAB='mx', CAL=null, FILT='todo', CTAB='turn';
/* 「この質問に答える」を押したときだけ入る。送信した答えは質問に紐づく（qa） */
var ANSQ='';

function blank(){
  return { v:2, shop:'Dubai Shiogensui', accounts:[], menus:[], series:[], videos:[], tasks:[],
    posts:[], days:[], msgs:[], me:{id:''}, read:{}, lastShare:0, pendShare:0,
    /* 相手の端末から取り込んだ出来事。この端末だけのもので、相手へは送らない */
    feed:[], feedSeen:0,
    /* 比較表に自分で足した行（縦軸）。決まった5行とは別に持つ */
    rows:[],
    goal:{ bowls:2000, guests:3000, rate:75, rev:0,
      t:'餃子だけで帰るお客様を減らし、【ラーメンの出数】を上げる。',
      s:'この店の強みは、大阪から来た家族が自分たちで作っている本物であること。ドバイに日本食の店は多いが、日本人が厨房に立っている店は多くない。撮る画には、必ずそれが写るようにする。毎日11時半から22時まで開けていることも、投稿で繰り返し伝える。' } };
}
var BROKEN=0;      /* 前回の保存が読めなかった。起動後に知らせて、控えから戻せるようにする */
function load(){
  var raw=null;
  try{ raw=localStorage.getItem(STORE); if(raw) S=JSON.parse(raw); }catch(e){ S=null; }
  if(!S||typeof S!=='object'||!S.v){
    /* 読めなかった中身を消さずに退避する。黙ってデモの内容で上書きすると、
       直せたかもしれない記録がその瞬間に失われる */
    if(raw){ BROKEN=1; try{ localStorage.setItem(STORE+'_broken',raw); }catch(e2){} }
    S=blank(); seed(); sdmark(); save();
  }
  /* 途中で切れた保存や、古い形の控えを取り込んだあとでも起動できるようにする。
     ここが配列でないと、以降のすべての forEach が落ちて画面が真っ白になる */
  ['accounts','menus','series','videos','tasks','posts','days','msgs'].forEach(function(k){
    if(!Array.isArray(S[k])) S[k]=[]; });
  if(!Array.isArray(S.rows)) S.rows=[];
  if(!Array.isArray(S.feed)) S.feed=[];
  if(typeof S.feedSeen!=='number') S.feedSeen=0;
  if(typeof S.read!=='object'||!S.read) S.read={};
  if(typeof S.goal!=='object'||!S.goal) S.goal=blank().goal;
  if(typeof S.shop!=='string'||!S.shop) S.shop=blank().shop;
  if(!S.read) S.read={};
  if(!S.me) S.me={id:''};
  if(!S.goal) S.goal=blank().goal;
  if(!S.pendShare) S.pendShare=0;
  if(!S.gotAt) S.gotAt=0;
  /* 停滞日数の起点。rev は共有コードの取り込みや些末な編集でも動くので使えない */
  S.videos.forEach(function(v){ if(!v.stAt) v.stAt=v.moveAt||v.rev||v.at||now();
    if(!Array.isArray(v.cuts)) v.cuts=[];
    if(!Array.isArray(v.tags)) v.tags=[]; });
  /* 記録の入れ物が欠けていると、完了を押した瞬間に画面が固まる */
  S.tasks.forEach(function(x){
    if(!Array.isArray(x.log)) x.log=[];
    if(!Array.isArray(x.ack)) x.ack=[]; });
  S.series.forEach(function(x){ if(x.ttp===undefined) x.ttp=''; });
  S.posts.forEach(function(x){ if(x.url===undefined) x.url=''; if(x.res===undefined) x.res=''; });
  sample2real();
  reskin();
}
/* 一度でも開いた端末には、前の見本が保存として残る。そのままだと
   新しい版を配っても、画面には古い店名と古い名前が出たままになる。
   見本のまま開いている端末だけを、静かに新しい見本へ寄せる。
   自分たちで人を足した端末・店名を書き換えた端末には触らない */
function sample2real(){
  var old={'a-hana':'a-ai','a-ali':'a-ryuki','a-yuta':'a-ryuki','a-naka':'a-yui'};
  var ac=S.accounts||[];
  if(!ac.length) return;
  for(var i=0;i<ac.length;i++){ if(!old[ac[i].id]) return; }
  var nm={'ハナ':'Ai','アリ':'Ryuki','ユウタ':'Ryuki','中谷':'Yui'};
  function fix(o){ if(!o) return;
    if(o.by&&nm[o.by]) o.by=nm[o.by];
    if(o.bid&&old[o.bid]) o.bid=old[o.bid];
    if(o.name&&nm[o.name]) o.name=nm[o.name]; }
  (S.tasks||[]).forEach(function(x){ (x.log||[]).forEach(fix); (x.ack||[]).forEach(fix); });
  (S.posts||[]).forEach(fix);
  (S.msgs||[]).forEach(fix);
  (S.feed||[]).forEach(fix);
  (S.videos||[]).forEach(function(v){
    (v.tags||[]).forEach(function(x,i){ if(nm[x]) v.tags[i]=nm[x]; });
    if(v.ttl==='店長ハナの一日') v.ttl='店長 Ai の一日'; });
  var n0=now();
  S.accounts=[
    {id:'a-ai',    name:'Ai',    role:'shop', pin:'', color:0, at:n0,   rev:n0},
    {id:'a-ryuki', name:'Ryuki', role:'shop', pin:'', color:1, at:n0+1, rev:n0},
    {id:'a-yui',   name:'Yui',   role:'ops',  pin:'', color:3, at:n0+2, rev:n0}
  ];
  if(S.me&&S.me.id&&old[S.me.id]) S.me.id=old[S.me.id];
  if(S.shop==='JLT ラーメン') S.shop='Dubai Shiogensui';
  save();
}
/* 手元に残すだけ。送らない（受け取った内容を書き戻すときに使う） */
function save0(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }
  catch(e){ alert('保存できませんでした。ブラウザの空き容量を確認してください。'); } }
/* ふだんの保存。手元に残して、そのまま相手にも届ける */
function save(){ save0(); fbSend(); }
/* 自分が触ったら「相手から来たもの」ではなくなる。
   見本の印も外す。外さないと、見本を書き換えたものや、
   見本の日付に入れた当日の記録まで、相手が受け取らない */

function reskin(){
  var P=SHOP_PREV;
  function put(o,k,was,now2){ if(o&&o[k]===was&&was!==now2) o[k]=now2; }
  (S.menus||[]).forEach(function(m,i){
    if(!/^mn-/.test(m.id||'')) return;
    put(m,'name',P.menus[i],SHOP_MENUS[i]);
  });
  SHOP_SERIES.forEach(function(x){
    var s=byId(S.series,x.id), p=P.series[x.id]; if(!s||!p) return;
    put(s,'name',p.name,x.name);
    put(s,'script',p.script,x.script);
    put(s,'purpose',p.purpose,x.purpose);
    put(s,'caution',p.caution,x.caution);
    if(p.ttp!==undefined) put(s,'ttp',p.ttp,x.ttp);
  });
  SHOP_VIDEOS.forEach(function(x){
    var v=byId(S.videos,x.id), p=P.videos[x.id]; if(!v||!p) return;
    if(v.ttl===p.ttl){
      v.ttl=x.ttl;
      /* 題名がそのままなら、その素材は見本のまま。札と添えも合わせる */
      v.tags=x.tags.slice();
      if(x.refNote) v.refNote=x.refNote;
    }
    (x.cuts||[]).forEach(function(c){
      var cur=null;
      (v.cuts||[]).forEach(function(y){ if(y.id===c.id) cur=y; });
      if(!cur) return;
      var pc=p.cuts&&p.cuts[c.id]; if(!pc) return;
      if(pc.d!==undefined) put(cur,'d',pc.d,c.d);
      if(pc.n!==undefined) put(cur,'n',pc.n,c.n||'');
    });
  });
  if(S.goal){ put(S.goal,'t',P.goal.t,SHOP_GOAL.t); put(S.goal,'s',P.goal.s,SHOP_GOAL.s); }
  /* 実績の日ごとの記録に入っている品名も言い換える */
  (S.days||[]).forEach(function(d){
    if(!Array.isArray(d.menus)) return;
    d.menus=d.menus.map(function(n){ return SHOP_MENU_OLD[n]||n; });
  });
  (S.msgs||[]).forEach(function(m){
    if(m.tx==='今週の依頼です。からあげ単品で完結している客が多いため、サイドメニューリールを1本お願いします。必ずラーメンと同一画面に収めてください。')
      m.tx='今週の依頼です。餃子だけで帰られることが多いため、「もう一品」のリールを1本お願いします。必ずラーメンと同一画面に収めてください。';
  });
  (S.posts||[]).forEach(function(p2){
    if(p2.res==='からあげだけの画が続いたせいか、セットだと伝わらなかった。保存が伸びなかった')
      p2.res='餃子だけの画が続いたせいか、セットだと伝わらなかった。保存が伸びなかった';
  });
}

  S.series=SHOP_SERIES.map(function(x){
    return {id:x.id,name:x.name,tag:x.tag,rev:now(),at:now(),
      ttp:x.ttp,script:x.script,purpose:x.purpose,caution:x.caution};
  });

  /* 見本の素材も、タスクと同じ理屈で足した日を戻す。
     at:now() のままだと「今日 追加 ／ 三日前 撮影」という行が並ぶ */
  function vat(d){ var x=now()-3*864e5; return d?Math.min(x, fromYmd(d).getTime()-864e5):x; }
  S.videos=SHOP_VIDEOS.map(function(x){
    return {id:x.id,sid:x.sid,ttl:x.ttl,date:addDays(t,x.dd),tags:x.tags.slice(),
      url:'',ref:x.ref,refNote:x.refNote,st:x.st,stAt:now()-86400000*x.sd,
      rev:now(),at:now(),
      cuts:(x.cuts||[]).map(function(c){ return {id:c.id,t:c.t,d:c.d,n:c.n||''}; })};
  });
  S.videos.forEach(function(v){ v.at=vat(v.date); });

     一覧に「今日 追加 ／ 昨日 まで」という、ありえない行が並ぶ */
  function mk(ttl,cat,who,due,rep,why){
    var at0=now()-3*864e5;
    if(due) at0=Math.min(at0, fromYmd(due).getTime()-864e5);
    return {id:uid('t'),ttl:ttl,cat:cat,who:who,due:due,rep:rep||'none',why:why||'',
      log:[],ack:[],rev:now(),at:at0};
  }
  S.tasks=[

function lcg(seed){ var x=seed>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }

/* ============================================================
   6. 判定
   ============================================================ */
function periodKey(t,ts){
  if(t.rep==='daily')  return ymdTZ(ts,TZ_DUBAI);
  if(t.rep==='weekly') return weekStart(ymdTZ(ts,TZ_DUBAI));
  return 'once';
}
/* log / ack は「状態」ではなく「起きたこと」の列。取り消しも1件の記録として積む。
   配列から消すと、同期の和集合マージが「消した」を表現できず必ず復活する（実測済み）。
   積むだけなら mergeIn / changed / pack / unpack を一切触らずに済む。 */
function undoneSet(arr){
  var m={};
  (arr||[]).forEach(function(x){ if(x.undo&&x.un!==undefined) m[x.un]=1; });
  return m;
}
function doneOf(t){
  var k=periodKey(t,now()), un=undoneSet(t.log), best=null;
  (t.log||[]).forEach(function(x){
    if(x.undo||un[x.at]) return;
    if(periodKey(t,x.at)!==k) return;
    if(!best||x.at>best.at) best=x;
  });
  return best;
}
/* その実施記録に対する承認。for の無い古い記録は同じ期間の承認で代用する（後方互換） */
function ackFor(t,d){
  var un=undoneSet(t.ack), best=null;
  (t.ack||[]).forEach(function(x){
    if(x.undo||un[x.at]) return;
    var tgt = (x['for']!==undefined) ? (x['for']===d.at) : (periodKey(t,x.at)===periodKey(t,d.at));
    if(!tgt) return;
    if(!best||x.at>best.at) best=x;
  });
  return best;
}
function ackOf(t){ var d=doneOf(t); return d?ackFor(t,d):null; }
/* 期間に関係なく、まだ承認されていない実施記録。直近7日分に限る。
   毎日タスクは、現地が夜に実施→日本が翌朝に承認、で必ず期間をまたぐ。
   期間で縛ると構造的に永久に承認できない */
/* 承認できる実施。日数では切らない——1週間コードを取り込まないことは普通に起きるし、
   そのとき画面が「承認待ち」と言い続けるのに押せない、では誰も直せない */
function pendingAcks(t){
  /* 日数では切らない。コードを1週間取り込まないことは普通に起きるし、そのとき
     カードは「承認待ち」と言い続けるのに承認ボタンが押せない、では誰も直せなくなる。
     直近だけを見たい受け渡し盤の側で日数を見る（gapItems） */
  var un=undoneSet(t.log);
  return (t.log||[]).filter(function(x){ return !x.undo&&!un[x.at]&&!ackFor(t,x); })
                    .sort(function(pp,qq){ return qq.at-pp.at; });
}
/* 今の期間より前の、いちばん新しい実施。毎日・毎週で「前にいつ誰がやったか」を残す */
function prevIn(t,arr){
  var k=periodKey(t,now()), un=undoneSet(arr), best=null;
  (arr||[]).forEach(function(x){ if(x.undo||un[x.at]) return;
    if(periodKey(t,x.at)===k) return;
    if(!best||x.at>best.at) best=x; });
  return best;
}
/* これまでの記録（実施・承認）を新しい順に。恒常要件1の「何月何日に」を過去分まで満たす */
/* ボタンに書く言葉。押す前に何が起きるか読めるようにする */
/* 誰が押してもいい。相手の分を代わりに片付けることは、実際に起きる */
function ckLabel(t,mine,d,a){ return d?'完了を取り消す':'完了にする'; }
function histHtml(t){
  var un=undoneSet(t.log), ua=undoneSet(t.ack), ev=[], la={};
  (t.log||[]).forEach(function(x){ if(x.undo||un[x.at]) return; la[x.at]=1; ev.push({at:x.at,k:'完了',by:x.by}); });
  /* 相手の端末の見本に対する承認は、こちらには対応する実施が無い。
     出すと、同じ時刻の同じ人の承認が2件並んで見える */
  var seen={};
  (t.ack||[]).forEach(function(x){ if(x.undo||ua[x.at]) return;
    if(x['for']&&!la[x['for']]) return;
    /* 2台が同じ実施をそれぞれ承認すると、同じ1件に承認が2つ付く。
       記録としては1件にまとめて見せる */
    if(x['for']){ if(seen[x['for']]) return; seen[x['for']]=1; }
    ev.push({at:x.at,k:'確認',by:x.by}); });
  if(!ev.length) return '';
  ev.sort(function(pp,qq){ return qq.at-pp.at; });
  return '<details class="thist"><summary>これまでの記録　'+ev.length+'件</summary>'+
    ev.slice(0,5).map(function(e){
      return '<div class="thist-r"><b>'+e.k+'</b><i>'+esc(e.by)+'</i><span>'+bothTime(e.at)+'</span></div>';
    }).join('')+'</details>';
}
/* 状態は二つだけ。終わったか、まだか。
   期限を過ぎているかどうかは状態ではなく、期限そのものが語ればいい */
function statusOf(t){ return doneOf(t) ? 'done' : 'todo'; }
var STL={ todo:{l:'未着手',p:'p-mute'}, done:{l:'完了済み',p:'p-ok'} };

/* その拠点が抱えているタスク。終わったものは数えない。
   盤の見出しを「日本のタスク」にした以上、数も中身もタスクでなければ話が合わない */
/* 盤に出す名前。「日本チーム」「現地スタッフ」と書くより、
   誰のことかが一目で分かる。二人以上いる役は、先に入れた人の名前で呼ぶ。
   人を入れ替えても、ここを書き換える必要はない */
function roleMembers(r){
  return alive(S.accounts).filter(function(x){ return x.role===r; })
    .sort(function(x,y){ return (x.at||0)-(y.at||0); });
}
function roleName(r){
  var a=roleMembers(r);
  return a.length?a[0].name:ROLE[r].s;
}
function sideRole(side){ return side==='jp'?'ops':'shop'; }
function sideTasks(side){
  var w=(side==='jp'?'ops':'shop'), o={late:0,today:1,wait:2,plan:3,done:4};
  return alive(S.tasks).filter(function(t){
    return t.who===w && statusOf(t)!=='done';
  }).sort(function(a,b){
    var x=o[statusOf(a)], y=o[statusOf(b)];
    if(x!==y) return x-y;
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
}
function gapItems(side){
  var out=[];
  alive(S.tasks).forEach(function(t){
    if(lateOf(t)&&(t.who==='shop'?'db':'jp')===side){
      out.push({k:'tchat',id:t.id,ttl:'期限切れ　'+t.ttl,day:stallOf(t.due),
        at:t.at,due:t.due,rep:t.rep});
    }
  });
  alive(S.videos).forEach(function(v){
    var sd='', lb='', day=stallOf(ymdTZ(vStAt(v),TZ_DUBAI));
    if(v.st==='shot'){       sd='jp'; lb='添削前'; }
    else if(v.st==='review'){ sd='jp'; lb='添削中'; }
    else if(v.st==='redo'){   sd='db'; lb='再撮影'; }
    else if(v.st==='ok'){     sd='db'; lb='投稿待ち'; }
    else if(v.st==='plan'&&v.date){ sd='db'; lb='撮影日超過'; day=stallOf(v.date); }
    else return;
    if(sd!==side) return;
    /* 素材の日付は期限ではなく撮影日。「まで」と書くと別の約束に読める */
    /* 撮ったのにリンクが無いものは、相手を待たせている理由がそれ。
       一覧の時点で名指ししておかないと、二人とも待ち続ける */
    var nolink=(v.st!=='plan'&&!safeUrl(v.url))?'　動画のリンク未記入':'';
    out.push({k:'video',id:v.id,ttl:lb+'　'+v.ttl+nolink,day:day,at:v.at,due:v.date,dl:' 撮影'});
  });
  /* 質問は相手の返事が無いと前へ進まない。当日でも盤に出す（x.q で日数フィルタを抜ける） */
  openQs().forEach(function(m){
    if(((m.role==='shop')?'jp':'db')!==side) return;
    var tg=qTarget(m), cx='';
    if(m.scope==='video'){ var vq=byId(S.videos,m.ref);
      if(vq){ cx=vq.ttl; if(m.cut){ var no=cutNo(vq,m.cut); if(no) cx+='　'+no; } cx+='　'; } }
    out.push({k:tg.k,id:tg.id,q:1,ttl:'質問　'+cx+m.tx,at:m.at,dl:'',
      day:stallOf(ymdTZ(m.at,TZ_DUBAI))});
  });
  /* 質問と承認待ちは、当日でも相手の手を止めているので日数で落とさない */
  return out.filter(function(x){ return x.day>=1||x.q||x.ak; })
            .sort(function(a,b){ return (b.q?1:0)-(a.q?1:0)||b.day-a.day; });
}
/* 定例の消化率。件数の偏りを打ち消す唯一の指標で、日本側の未消化も同じ大きさで出る */
function repRate(role){
  var ts=alive(S.tasks).filter(function(t){ return t.who===role&&(t.rep==='daily'||t.rep==='weekly'); });
  return { d:ts.filter(function(t){ return !!doneOf(t); }).length, n:ts.length };
}
/* 相手が何をしたのか。取り込んだ直後に一度出して終わりにすると、
   別の用事の途中で同期した人が読み落とす。読むまで先頭に残す */
function feedBar(){
  var fn=feedNew();
  if(!fn.length) return '';
  /* 内訳を「2件追加／1件承認／1件進捗／1件修正」と並べると二行に折れるうえ、
     結局どれのことなのか分からない。いちばん新しい1件の題名を出す */
  var w=(fn[0].tx||fn[0].ttl||'')+(fn.length>1?'　ほか'+(fn.length-1)+'件':'');
  /* 誰からの知らせか。両方から来ていることもある */
  var ro={}; fn.forEach(function(f){ if(f.ro) ro[f.ro]=1; });
  var who=Object.keys(ro).map(function(k){ return roleName(k); }).join('・')||'相手';
  return '<button class="fbar" data-act="feed">'+
    '<span class="fbar-i">'+ic('bell')+'</span>'+
    '<span class="fbar-b"><span class="fbar-t">'+esc(who)+'から '+fn.length+'件の更新</span>'+
    '<span class="fbar-s">'+esc(w)+'</span></span>'+
    '<span class="fbar-k">'+ic('arrowR')+'</span></button>';
}
/* 一覧。何が・誰が・いつ、を上から読むだけで分かるようにする */
function sheetFeed(){
  var fn=feedNew(), b='';
  if(!fn.length){
    b='<div class="hint">'+ic('check')+'<span>新しい更新はありません。</span></div>';
  }else{
    b='<div class="fl">';
    fn.forEach(function(f){
      var cl=(f.k==='q'||f.k==='dir'||f.k==='cut')?'ask'
            :(f.k==='ans'||f.k==='ack')?'ack'
            :f.k==='add'?'add':'oth';
      b+='<button class="fl-r fl-'+cl+'" data-act="fgo" data-k="'+esc(f.a)+
        '" data-i="'+esc(f.id)+'" data-sc="'+esc(f.sc||'')+'" data-rf="'+esc(f.rf||'')+'">'+
        '<span class="fl-i">'+ic(feedIcon(f))+'</span>'+
        '<div class="fl-b"><div class="fl-w">'+esc(feedWord(f))+'</div>'+
        '<div class="fl-t">'+esc(f.ttl||'（題名なし）')+
          (f.cut?'<b class="fl-c">'+esc(f.cut)+'</b>':'')+'</div>'+
        /* 言われた中身をここに出す。開かないと分からないのでは、
           時間のない人は結局どれも開かない */
        (f.tx?'<div class="fl-x">'+esc(f.tx)+'</div>':'')+
        '<div class="fl-m">'+esc(f.by?f.by:(f.ro?roleName(f.ro):'相手'))+
          '<span class="tt">'+bothTime(f.ts||f.at)+'</span></div></div>'+
        '<span class="fl-k">'+ic('arrowR')+'</span></button>';
    });
    b+='</div>';
  }
  sheet('相手からの更新',b,
    '<button class="btn btn-main" data-act="feedok">'+ic('check')+'読みました</button>');
}
function gapHtml(){
  var m=today().slice(0,7), g=S.goal;
  var md=S.days.filter(function(x){ return x.d.indexOf(m)===0; });
  var bowls=sum(md.map(function(x){ return x.bowls||0; }));
  var guests=sum(md.map(function(x){ return x.guests||0; }));
  var rt=guests?Math.round(bowls/guests*100):0;

  /* 2列カード（219px）は、先頭2件まで載せるせいで初画面の半分を使っていた。
     件数と「何日止まっているか」だけの1行バーにして、中身はタップ先のシートへ寄せる */
  /* 「日本が返す番」「ドバイが動く番」は、読む人によって意味が入れ替わる。
     自分の番なのか相手を待っているのかが、名前を読んで考えないと分からなかった */
  function col(side){
    var it=gapItems(side);
    /* 質問を先頭に出すよう並べ替えたので、it[0] は最長とは限らない */
    var mx=it.length?Math.max.apply(null,it.map(function(x){ return x.day; })):0;
    var self=(meRole()==='ops')===(side==='jp');
    var ts=sideTasks(side);
    var ttl=roleName(sideRole(side))+'のタスク';
    /* 数えるものを一つに揃える。大きい数と添え字で基準が違うと、
       「2件なのに止まり4件」という、読み解けない札になる */
    var lt=0, td=0;
    ts.forEach(function(t){ if(lateOf(t)) lt++; else if(t.rep!=='none'||(t.due&&diffDays(t.due,today())===0)) td++; });
    return '<div class="brow brow-'+side+(lt?' is-stop':'')+(self?' is-me':'')+'">'+
      '<button class="brow-hit" data-act="gaplist" data-side="'+side+'">'+
      '<span class="brow-t">'+ttl+'</span>'+
      '<span class="brow-n"><b>'+ts.length+'</b><i>件</i></span>'+
      '<span class="brow-s">'+(lt?'期限すぎ '+lt+'件'
        : td?'本日まで '+td+'件'
        : it.length?'止まり '+it.length+'件'+(mx?'　最長 '+mx+'日':'')
        : '急ぎなし')+'</span>'+
      '<span class="brow-k">'+ic('arrowR')+'</span></button>'+
      /* 足す入口を、その拠点の札の中に置く。いままで追加は一覧の下の一か所だけで、
         どちらの担当で足すのかを毎回えらび直していた */
      '<button class="brow-add" data-act="addtask" data-who="'+(side==='jp'?'ops':'shop')+'">'+
        ic('plus')+'追加</button></div>';
  }
  /* 来店数・出数は分析タブへ移した。この画面の主役は数字ではなくやり取りなので、
     上部に残すのは「相手を待たせているか」だけにする */
  var r0=meRole();
  var qn=myQs().length;                                             /* 自分が答える番 */
  var qw=openQs().filter(function(m){ return m.role===r0; }).length; /* 自分が出して返事待ち */
  var vn=alive(S.videos).filter(function(v){ return v.st==='shot'||v.st==='review'; }).length;
  var an=ansAll();                                                  /* 答えが届いた（読むだけ） */
  var wk=weekStart(today());
  /* 口コミ返信と広告はインスタの投稿ではない。ここに混ぜると「週2本」の目安が意味を失う */
  var wp=S.posts.filter(function(x){ return !x.del&&x.d>=wk&&x.d<addDays(wk,7)&&
    (x.ty==='reel'||x.ty==='story'||x.ty==='feed'); }).length;
  /* 共有コードを取り込むまで相手側の数字は必ず古い。この一文が無いと盤の数字が嘘になる */
  /* 送った時刻と取り込んだ時刻の新しいほう。取り込みだけしても「一度も同期していません」が
     残っていると、やることをやった人に嘘を出し続けることになる */
  return '<section class="gap">'+
    '<div class="gap-hd"><h2>'+ic('swap')+
      esc(roleName('ops'))+'と'+esc(roleName('shop'))+'のタスク</h2>'+
      /* 「答える質問」「添削の途中」は盤とまったく同じ1件を数えていたので外した。
         盤に出ない「今週の投稿」だけを、独立タイル（85px）ではなく見出しの右端に置く */
      '<button class="gap-wk'+(wp>=2?' ok':'')+'" data-nav="cal">'+ic('calendar')+
        '今週の投稿 <b>'+wp+'</b> ／ 2</button>'+
      /* 狙いの入口は「今から撮るもの」の脇にしか無かった。
         そこを外したので、ここへ移す */
      '<button class="sec-aim" style="margin-left:0" data-act="goalview">'+ic('target')+
        (+today().slice(5,7))+'月の狙い'+ic('arrowR')+'</button>'+
      '</div>'+
    /* 並びは拠点で固定する。日本が左、ドバイが右。
       読む人によって左右が入れ替わると、二台を並べて話すときに食い違う */
    '<div class="gap-board">'+col('jp')+col('db')+
      (an?'<button class="brow brow-ans" data-nav="chat">'+
        '<span class="brow-t">'+ic('check')+'答えが届いています</span>'+
        '<span class="brow-n"><b>'+an+'</b><i>件</i></span>'+
        '<span class="brow-s">読むだけで終わります</span>'+
        '<span class="brow-k">'+ic('arrowR')+'</span></button>':'')+'</div>'+
    '<p class="gap-clock">'+bothTime(now())+'</p>'+
    /* つながっているかどうかは、画面のいちばん上にいつも出ている。
       盤の下でもう一度言うと、見るところが二つになる */
    '</section>';
}
/* 狙いの全文。現地は読むだけ、日本はここから編集へ進む */

/* 件数ボタンの飛び先。タスクと素材が混ざるので、タスク一覧の絞り込みには飛ばさない */
/* 「いつ足したか・いつまでのものか」を一行に。
   日数だけでは、けさ始まった話なのか、先月から転がっているのかが読めない */
function whenLine(x,stall){
  var a=[];
  if(x.at) a.push(mdTZ(x.at,TZ_DUBAI)+' 追加');
  if(x.rep==='daily') a.push('毎日');
  else if(x.rep==='weekly') a.push('毎週');
  else if(x.due) a.push(fmtMd(x.due)+(x.dl||' まで'));
  /* 何日止まっているか。右端の札を言葉に揃えた分、
     「どれだけ待たせているか」はこちらで言う */
  if(stall) a.push(stall+'日 止まっています');
  return a.length?'<span class="s">'+esc(a.join('　／　'))+'</span>':'';
}
function sheetGap(side){
  var it=gapItems(side), ts=sideTasks(side), b0='';
  var who=sideRole(side), L=roleName(who)+'のタスク';
  /* 同じ役に二人以上いるなら、誰の分がここに入るのかを書いておく。
     「Aiのタスク」とだけ出すと、Ryukiの分が抜けていると読まれる */
  var mem=roleMembers(who);
  if(mem.length>1) b0='<div class="hint" style="margin-bottom:14px">'+ic('info')+
    '<span>'+esc(mem.map(function(x){ return x.name; }).join('・'))+
    'の分が、すべてここに入ります。</span></div>';
  var b=b0+'<button class="addrow" data-act="addtask" data-who="'+who+'">'+
    ic('plus')+esc(L)+'を追加</button>';

  if(it.length){
    b+=sec('Stop','ここで止まっているもの','alert',
      esc(roleName(who))+'が動かすまで進みません。素材の添削もここに出ます。');
    it.forEach(function(x){
      /* 右端の札は、下の一覧と同じ言葉にする。
         同じ画面の同じ位置で数え方が変わると、どちらの読み方なのか毎回考えることになる。
         ここに並ぶものは、まだどれも終わっていない */
      b+='<button class="gap-row" data-act="'+x.k+'" data-id="'+x.id+'">'+
        '<span class="t">'+esc(x.ttl)+whenLine(x,x.day)+'</span>'+
        '<span class="d st-todo">'+esc(STL.todo.l)+'</span>'+
        '<span class="lk">'+ic('arrowR')+'</span></button>';
    });
  }

  b+=sec('Tasks','抱えているタスク','check','押すと、そのタスクのページが開きます。');
  if(!ts.length) b+='<div class="empty">'+ic('check')+'抱えているタスクはありません</div>';
  ts.forEach(function(t){
    var st=statusOf(t);
    b+='<button class="gap-row" data-act="taskpage" data-id="'+t.id+'">'+
      '<span class="t">'+esc(t.ttl)+whenLine(t)+'</span>'+
      '<span class="d st-'+st+'">'+esc(STL[st].l)+'</span>'+
      '<span class="lk">'+ic('arrowR')+'</span></button>';
  });
  sheet(esc(L)+'　'+ts.length+'件',b);
}
/* ============================================================
   撮影の指示は段落ではなく「上から順の行」にする。
   現地は英語圏の交代シフトで、読む時間も日本語の読解力も一定ではない。
   1行＝1カット・秒数つき・やらないことは朱、が最短で伝わる
   ============================================================ */
/* 答えはチャットを流れて消える。カットに紐づいた質問への答えは、そのカットの行にも残す。
   次に撮る人が、やり取りを遡らずに「こう撮る」だけを読めばいいようにするため */
/* 「12,300」「12300人」のように書かれても数字だけ拾う。実績入力と同じ読み方 */
function num(x){ return parseInt(((x||'')+'').replace(/[^0-9]/g,''),10)||0; }
function pinAns(m){
  if(!m||!m.qa) return;
  var q=byId(S.msgs,m.qa);
  if(!q||q.scope!=='video'||!q.cut) return;
  var v=byId(S.videos,q.ref); if(!v) return;
  var c=null; alive(v.cuts).forEach(function(x){ if(x.id===q.cut) c=x; });
  if(!c) return;
  if(!c.add) c.add=[];
  for(var i=0;i<c.add.length;i++){ if(c.add[i].mid===m.id) return; }   /* 二重に足さない */
  c.add.push({mid:m.id,tx:m.tx,by:m.name,at:m.at});
  c.crev=now(); touch(v);
}
/* 同じメニューを扱った過去の投稿。撮る前に「前はどうだったか」を見られるようにする。
   これが無いと、毎回まっさらな状態から撮ることになる */
var PAST_IDS=[];                       /* 直前の pastHtml で出した素材。関連素材から除くため */
function pastHtml(v){
  PAST_IDS=[];
  var tags=v.tags||[]; if(!tags.length) return '';
  var rows=[];
  S.posts.forEach(function(p){
    if(p.del||!p.vid||p.vid===v.id) return;
    var ov=byId(S.videos,p.vid); if(!ov) return;
    var hit=false;
    (ov.tags||[]).forEach(function(t){ if(tags.indexOf(t)>=0) hit=true; });
    if(!hit||(!p.views&&!p.saves&&!p.res)) return;
    rows.push({p:p,v:ov});
  });
  if(!rows.length) return '';
  rows.sort(function(x,y){ return (y.p.views||0)-(x.p.views||0); });
  var vs=rows.filter(function(x){ return x.p.views; });
  var avg=vs.length?Math.round(sum(vs.map(function(x){ return x.p.views; }))/vs.length):0;
  var h=sec('Past','前に出した同じメニュー','chart','');
  h+='<div class="past">';
  /* 1件しかないときの「平均」は、同じ数字を二度書いているだけ */
  if(avg&&vs.length>1) h+='<div class="past-avg"><span>これまでの平均</span><b>'+avg.toLocaleString()+'</b><i>回</i>'+
    '<span class="past-n">'+vs.length+'件</span></div>';
  rows.slice(0,3).forEach(function(x){
    PAST_IDS.push(x.v.id);
    h+='<div class="past-r">'+
      '<span class="past-t">'+esc(x.v.ttl)+'</span>'+
      '<span class="past-m">'+fmtMd(x.p.d)+'　'+PTY[x.p.ty].l+
        (x.p.views?'　再生 <b>'+(+x.p.views).toLocaleString()+'</b>':'')+
        (x.p.saves?'　保存 <b>'+(+x.p.saves).toLocaleString()+'</b>':'')+'</span>'+
      (x.p.res?'<span class="past-s">'+ic('chat')+esc(x.p.res)+'</span>':'')+
      '<span class="past-k">'+
        urlBtn(x.p.url,'投稿を開く','link')+
        '<button class="btn btn-line btn-sm" data-act="video" data-id="'+x.v.id+'">'+
          ic('film')+'この素材を見る</button>'+
      '</span></div>';
  });
  return h+'</div>';
}
function cutsHtml(v){
  /* 墓標（del=1）を数に入れると、盤の「カット2」とシートの「2」が別のカットを指す。
     通し番号は必ず alive() の index+1 で数える */
  var canEd=meRole()==='ops', cs=alive(v.cuts);
  /* 手順は畳んでおく。先に読むのは目的で、手順はいざ撮るときに開く */
  var h='<details class="cutdet"><summary>'+ic('film')+'撮影手順'+
    '<i>'+(cs.length?cs.length+'カット':'まだありません')+'</i></summary>'+
    '<div class="sub" style="margin:0 0 10px">上から順に撮ります。気づいたことは、その行にメモを残せます。</div>';
  if(!cs.length){
    h+='<div class="empty">'+ic('film')+(canEd?'まだ指示がありません。下のボタンで足してください':'まだ指示がありません')+'</div>';
  }else{
    h+='<div class="cuts">';
    cs.forEach(function(c,i){
      var q=cutQ(v.id,c.id), mine=q&&q.role===meRole();
      h+='<div class="cut"><span class="cut-n">'+(i+1)+'</span><div class="cut-b">'+
        (c.t?'<span class="cut-t">'+esc(c.t)+'</span>':'')+
        '<div class="cut-d">'+esc(c.d||'')+'</div>'+
        (c.n?'<div class="cut-ng">'+ic('alert')+'<span>'+esc(c.n)+'</span></div>':'')+

        (c.add||[]).map(function(x){
          return '<div class="cut-ad">'+ic('check')+'<span><b>'+esc(x.by)+'</b>'+esc(x.tx)+'</span></div>'; }).join('')+
        /* そのカットに残したメモ。撮った側が気づいたことが、次に撮る人へそのまま渡る */
        (c.memo?'<div class="cut-mm">'+ic('pencil')+'<span><b>'+esc(c.mby||'')+
          (c.mat?'　'+mdTZ(c.mat,TZ_DUBAI):'')+'</b>'+esc(c.memo)+'</span></div>':'')+
        '<div class="cut-a">'+
          /* 相手からの質問が開いているカットでは、もう一度質問させない。押すべきは「答える」 */
          (q ? (mine
                ? '<span class="qbtn on waiting">'+ic('clock')+'返事を待っています</span>'
                : '<button class="qbtn on" data-act="ansq" data-id="'+q.id+'">'+ic('send')+'この質問に答える</button>')
             : '')+
          '<button class="qbtn" data-act="cutmemo" data-id="'+v.id+'" data-cut="'+esc(c.id)+'">'+
            ic('pencil')+(c.memo?'メモを直す':'メモを書く')+'</button>'+
          (canEd?'<button class="qbtn" data-act="edcut" data-id="'+v.id+'" data-cut="'+esc(c.id)+'">'+
            ic('pencil')+'直す</button>':'')+
        '</div></div></div>';
    });
    h+='</div>';
  }
  h+='<div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">';
  if(canEd) h+='<button class="btn btn-line btn-sm" data-act="edcut" data-id="'+
    v.id+'" data-cut="">'+ic('plus')+'カットを足す</button>';
  if(cs.length) h+='<button class="btn btn-line btn-sm" data-act="print">'+ic('print')+'この指示を印刷</button>';
  return h+'</div></details>';
}

function viewTask(){
  var ts=alive(S.tasks), role=meRole();
  var c={todo:0,done:0};
  ts.forEach(function(t){ c[statusOf(t)]++; });
  /* 「本日の進捗」のリングとタイルは廃止した。3つの数字は直下の絞り込みチップと同じ値で、
     104pxのリングが受け渡し盤と主役を奪い合い、現地の初画面から「今日やること」が落ちる */
  /* 操作者はヘッダーに出したので、ここからは外した（70px） */
  /* 狙いは見出し脇のリンクに畳む。毎日読むものではないのに、
     初画面で98px使って「押せるもの」を画面の外へ押し出していた */
  /* 「今から撮るもの」は外した。同じ素材が企画タブの「撮影素材」に並ぶので、
     同じものを二か所で数えることになっていた */
  var h = feedBar() + gapHtml();

  /* 未読のお知らせ帯は連絡タブのバッジと二重なので外した（60px）。
     見出し「業務タスク」もタブ名と同じなので外した（31px） */
  /* 足す口は絞り込みの右にも置く。下までスクロールしないと足せないのは遠い */
  h+='<div class="tbar"><div class="chips">'+[['todo','未着手',c.todo],['done','完了済み',c.done]].map(function(x){
    return '<button class="chip" data-filt="'+x[0]+'" aria-pressed="'+(FILT===x[0])+'">'+x[1]+'<b>'+x[2]+'</b></button>'; }).join('')+'</div>'+
    '<button class="btn btn-main btn-sm tbar-add" data-act="addtask" data-who="'+(meRole()||'shop')+'">'+
    ic('plus')+'タスクを追加</button></div>';


  var list=ts.filter(function(t){
    var s=statusOf(t);
    if(FILT==='all') return true;
    if(FILT==='todo'||FILT==='done') return s===FILT;
    return s===FILT;
  /* 期限の近いものから。期限の無いものは後ろへ */
  }).sort(function(a,b){
    var x=(a.due||'9999-99-99'), y=(b.due||'9999-99-99');
    if(a.rep!=='none') x='0000';
    if(b.rep!=='none') y='0000';
    return x<y?-1:x>y?1:(a.at||0)-(b.at||0);
  });

  h+='<div class="tlist">';
  if(!list.length) h+='<div class="empty">'+ic('check')+'該当するタスクはありません</div>';
  else if(FILT==='todo'){
    /* まだのものは二種類ある。毎日・毎週くりかえすものと、いつまでのもの。
       混ぜて一列に積むと、今日やるものと今週やるものが交互に出てきて、
       どこから手を付ければよいのかが読み取れない */
    var rep=[], due=[];
    list.forEach(function(x){ (x.rep!=='none'?rep:due).push(x); });
    /* いつまでのものは、期限の近いものから。期限の無いものは後ろへ */
    due.sort(function(a,b){
      var x=(a.due||'9999-99-99'), y=(b.due||'9999-99-99');
      return x<y?-1:x>y?1:(a.at||0)-(b.at||0);
    });
    /* くりかえしは毎日が先。今日じゅうに終わるものから並べる */
    rep.sort(function(a,b){
      var x=(a.rep==='daily'?0:1), y=(b.rep==='daily'?0:1);
      return x-y||(a.at||0)-(b.at||0);
    });
    h+='<div class="tcols">';
    [[rep,'くりかえし','sync','毎日・毎週'],[due,'いつまでのもの','calendar','期限の近い順']].forEach(function(g2){
      h+='<div class="tcol"><div class="tcol-h">'+ic(g2[2])+esc(g2[1])+
        '<i class="mute3" style="font-style:normal;font-weight:600;font-size:.7rem">　'+esc(g2[3])+'</i>'+
        '<b>'+g2[0].length+'</b></div>';
      if(!g2[0].length) h+='<div class="empty">'+ic('check')+'ありません</div>';
      g2[0].forEach(function(x){ h+=taskCard(x); });
      h+='</div>';
    });
    h+='</div>';
  }
  else if(FILT==='done'){
    /* 終わった順に、新しいものから。いつ終わったのかが並びそのものになる */
    list.slice().sort(function(a,b){
      var x=doneOf(a), y=doneOf(b);
      return ((y?y.at:0)-(x?x.at:0))||(b.at||0)-(a.at||0);
    }).forEach(function(x){ h+=taskCard(x); });
  }
  else if(FILT==='all'){
    /* 状態ごとにまとめて、見出しを置く。ただ新しい順に積むだけだと、
       どこまでが今日の話で、どこからが終わった話なのかが読み取れない */
    var g={todo:[],done:[]};
    list.forEach(function(t){ g[statusOf(t)].push(t); });
    ['todo','done'].forEach(function(k){
      if(!g[k].length) return;
      h+='<div class="tgrp"><span class="tgrp-l st-'+k+'">'+esc(STL[k].l)+'</span>'+
        '<span class="tgrp-n">'+g[k].length+'</span></div>';
      g[k].forEach(function(t){ h+=taskCard(t); });
    });
  }
  else list.forEach(function(t){ h+=taskCard(t); });
  /* どちらの分として足すのかを、押す前に見せておく */
  return h+'</div><button class="addrow" data-act="addtask" data-who="'+(meRole()||'shop')+'">'+
    ic('plus')+'タスクを追加</button>';
}
function taskCard(t){
  var st=statusOf(t), d=doneOf(t), a=null, cat=TCAT[t.cat]||null;
  var role=meRole(), mine=t.who===role, can=true;
  /* ピル4個が2段に折り返して55px使い、しかも先に目に入るのが分類ラベルだった。
     状態1個に絞る。区分はタイトル前のアイコン、担当は左の帯色、繰り返しは状態の文言へ吸収 */
  var repL = t.rep==='daily'?'毎日' : t.rep==='weekly'?'毎週' : '';
  /* 上の1行は「誰の・どういう状態か」だけ。札を3つ並べると、
     題名より先に札が目に入り、どれも同じ顔のカードになる。
     担当だけ面で出し、状態と期限は文字の色で差をつける */
  var mtx=[]; if(repL) mtx.push(repL);
  if(t.rep==='none'&&t.due) mtx.push(fmtMd(t.due)+(lateOf(t)?'まで（過ぎています）':'まで'));
  /* 状態は上の絞り込みで選んでいる。どのカードにも同じ言葉を書くと、
     いちばん読みたい「いつまで」と「くりかえし」がその後ろへ押しやられる */
  var meta='<span class="t-who '+(t.who==='shop'?'db':'jp')+'">'+
      esc(roleName(t.who))+'</span>'+
    (mtx.length?'<span class="t-sub">'+esc(mtx.join('・'))+'</span>':'');
  /* 済んだら、誰がいつ押したかを残す。まだなら、いつまでかだけ */
  var flow;
  if(d){
    flow='<span class="dn">'+ic('check')+'完了　'+esc(d.by)+
      '<span class="tt">'+bothTime(d.at)+'</span></span>';
  }else{
    flow='';
    /* 毎日・毎週は期間が変わると今期の記録が空になる。前回を残さないと
       「何月何日にチェックしたか」が画面から消える */
    if(t.rep!=='none'){ var pv=prevIn(t,t.log);
      if(pv) flow+='<span class="pv">'+ic('check')+'前回　'+esc(pv.by)+
        '<span class="tt">'+bothTime(pv.at)+'</span></span>'; }
  }
  var un=unreadOf('task',t.id);
  var lb=ckLabel(t,mine,d,a);
  /* 上から下へ、状態 → やること → なぜ → 経過 → 押すもの、の順に置く。
     題名にページの幅を全部使えるようにしたので、二行に折れることが減った */
  /* 期限を過ぎたものは、状態ではなく期限そのもので気づかせる */
  /* どちらの仕事かは、札の色ではなく紙そのものの色で分かるようにする。
     一覧をざっと見たときに、読まずに分かれてほしい */
  return '<article class="task st-'+st+(lateOf(t)?' is-late':'')+
    ' w-'+(t.who==='shop'?'db':'jp')+'">'+
    '<div class="tmeta">'+meta+'</div>'+
    /* 題名を押せば、そのタスクの1ページが開く。
       カードは一覧の顔、ページが本体 */
    '<h3 class="ttl"><button class="ttl-b" data-act="taskpage" data-id="'+t.id+'">'+
      esc(t.ttl)+(un?' <span class="t-un">'+ic('chat')+un+'</span>':'')+'</button></h3>'+
    /* 「なぜ」は自分の担当分だけ全文で出す。
       相手の担当分まで全部載せると一覧が倍に伸びるし、終わったものは読み返さない。
       相手の意図を知りたいときは、下のふきだしから直接きける */
    (t.why&&st!=='done'&&mine?'<p class="twhy">'+esc(t.why)+'</p>':'')+
    '<div class="tflow">'+flow+'</div>'+histHtml(t)+
    /* 押すものは下にまとめる。いちばん押すボタンに幅を与えて、
       文字を入れておく。丸い印だけでは、押すまで何が起きるか分からない */
    /* 押すものはひとつだけ。連絡と直すはタスクのページに置いてある。
       一覧は読むためのもので、そこに操作を三つ並べると、どれが本命か分からない。
       届いている連絡は題名の脇の数で知らせる */
    '<div class="tact">'+
    '<button class="tcheck '+(a?'ack':d?'on':'')+'" data-act="check" data-id="'+t.id+'"'+(can?'':' disabled')+
      ' aria-label="'+lb+'">'+ic('check')+'<span class="lb">'+lb+'</span></button>'+
    '</div></article>';
}

/* 横軸の並び。配列の順番は同期で保たれないので、番号で持つ */
function seriesOrdered(){
  return alive(S.series).slice().sort(function(a,b){
    var x=(a.ord==null?9990:a.ord), y=(b.ord==null?9990:b.ord);
    return x!==y ? x-y : (a.at||0)-(b.at||0);
  });
}
/* 番号が飛んでいたり重なっていたりしても、必ず 0,1,2… に直してから動かす */
function reord(arr){
  arr.forEach(function(x,i){ if(x.ord!==i){ x.ord=i; touch(x); } });
}
function videosOf(sid){ return alive(S.videos).filter(function(v){ return v.sid===sid; })
  .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); }

/* いま掴んでいる列。掴んでいる間だけ中身が入る */
var MXD=null;
/* 掴んだ列を、指の位置で入れ替える。
   矢印で一つずつ送る形は、押した手応えはあっても、
   どこへ行くのかが指で分からなかった。掴んで運び、離したところに置く */
function mxCols(){
  return [].map.call(document.querySelectorAll('.mx th.ch'),function(el){
    var r=el.getBoundingClientRect();
    return {sid:el.dataset.sid, mid:(r.left+r.right)/2};
  });
}
function mxMark(){
  if(!MXD) return;
  var th=document.querySelector('.mx th.ch[data-sid="'+MXD.sid+'"]');
  if(th) th.classList.add('drag');
}
function mxGrab(sid,x){
  if(MXD) return;
  MXD={sid:sid};
  document.body.classList.add('mx-drag');
  mxMark();
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}
function mxMoveTo(x){
  if(!MXD) return;
  var cols=mxCols(), i=-1;
  cols.forEach(function(c,k){ if(c.sid===MXD.sid) i=k; });
  if(i<0) return;
  /* 隣の列の真ん中を越えたら、その場で入れ替える。
     離すまで待たせると、どこに入るのか分からないまま運ぶことになる */
  var j=i;
  if(i<cols.length-1 && x>cols[i+1].mid) j=i+1;
  else if(i>0 && x<cols[i-1].mid) j=i-1;
  if(j===i) return;
  var sa=seriesOrdered(); reord(sa);
  var o=sa[i].ord; sa[i].ord=sa[j].ord; sa[j].ord=o;
  touch(sa[i]); touch(sa[j]);
  render(); mxMark();
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
}
function mxDrop(){
  if(!MXD) return;
  MXD=null;
  document.body.classList.remove('mx-drag');
  save(); render();
}

    });

  });
  h+='<tr><th class="rh">'+ic('pin')+'タグ</th>';
  ss.forEach(function(s){

  /* 動画フィードバックの行（手書きの表にあった「動画FB」）。

        '　'+mdTZ(x.m.at,TZ_DUBAI)+'</div>'+

        '<button class="btn btn-ghost btn-sm" data-act="video" data-id="'+x.v.id+'" style="margin-top:3px">'+esc(x.v.ttl)+'</button>'+

  /* 参考（お手本）と、うちの場合。真似る対象と自店版を物理的に上下で隣り合わせる。
     今まで ref／refNote は素材シートの中にしか無く、シリーズを横に並べた状態では比べられなかった */
  h+='</tr><tr><th class="rh">'+ic('eye')+'参考／うちの場合</th>';
  ss.forEach(function(s){
    var t='', rf=videosOf(s.id).filter(function(v){ return v.ref||v.refNote; }).slice(0,2);
    if(rf.length){
      rf.forEach(function(v){
        t+='<div class="ttp"><div class="ttp-l">参考</div>'+
          '<div class="ttp-n'+(v.refNote?'':' none')+'">'+esc(v.refNote||'どこを真似るかが未記入')+'</div>'+
          /* 住所なら開くリンク、そうでなければ書かれた文字をそのまま。
             ここだけ黙って捨てていたので、日本側は書いたことに気づけなかった */
          (safeUrl(v.ref)?'<a href="'+esc(safeUrl(v.ref))+'" target="_blank" rel="noopener">'+ic('play')+'見本を開く</a>'
            : (v.ref?'<div class="ttp-memo">'+ic('info')+esc(v.ref)+'</div>':''))+
          '<div class="ttp-n none">'+esc(v.ttl)+'</div></div>';

    t+='<div class="ttp own" data-act="edcell" data-id="'+s.id+'" data-k="ttp">'+

  });
  h+='</tr><tr><th class="rh">'+ic('play')+'素材</th>';
  ss.forEach(function(s){
    var vs=videosOf(s.id), t='<b style="font-size:var(--fs-lg);font-weight:700;color:var(--tx)">'+vs.length+'</b> 本';
    vs.slice(0,3).forEach(function(v){
      t+='<div style="margin-top:7px">'+pill(VST[v.st].p,VST[v.st].l)+

  });
  /* ここから下は、使いながら自分で足した観点。

  rowsOrdered().forEach(function(r){
    h+='</tr><tr><th class="rh rh-x">'+ic('grid')+'<span>'+esc(r.l)+'</span>'+
      (ops?'<button class="rh-e" data-act="edrow" data-id="'+r.id+'" aria-label="この行を直す">'+ic('pencil')+'</button>':'')+'</th>';
    ss.forEach(function(s){
      var xv=(s.ext||{})[r.id]||'';
      var mmx=cellMm(s,'x:'+r.id);
      h+='<td class="ed" data-act="edcell" data-id="'+s.id+'" data-k="x:'+r.id+'"><div class="cell'+(xv?'':' none')+

/* 縦軸の並び。横軸と同じ考え方で番号で持つ */
function rowsOrdered(){

function videoListHtml(){

/* いつ動いた素材なのかは、進捗の印の次に知りたい。
   撮影日（予定の日）と、最後に誰かが触った日時は別物なので、両方出す */
function vUpdAt(v){
  return Math.max(v.rev||0, v.srev||0, v.stAt||0, v.at||0)||0;
}
function videoCard(v){
  var s=byId(S.series,v.sid), st=VST[v.st]||VST.plan, un=unreadOf('video',v.id), bar='';
  for(var i=1;i<=4;i++) bar+='<i class="'+(v.st==='redo'&&i===2?'bad':(st.n>=i?'on':''))+'"></i>';

  return '<button class="vg '+st.cls+'" data-act="video" data-id="'+v.id+'">'+
    '<div class="vg-m">'+pill(st.p,st.l)+pill('p-mute',s?s.name:'未分類')+

    '<div class="vg-t">'+esc(v.ttl)+'</div>'+

      (safeUrl(v.url)
        ? '<span class="vg-k" title="動画の置き場所あり">'+ic('play')+'</span>'
        : (v.st!=='plan'?'<span class="vg-k" style="color:var(--warn)" title="置き場所が未記入">'+ic('link')+'</span>':''))+
