/* ============================================================
   11. 実績カレンダー
   ============================================================ */
/* 日付セルの中に出すラベル。動画に紐づいていればその題名、なければ種別名。
   保険営業ダッシュボードと同じく、時刻は出さない（ユーザー指示） */
function calChip(p){
  var t=PTY[p.ty]||{l:'投稿',c:'#888'}, label=t.l;
  if(p.vid){ var v=byId(S.videos,p.vid); if(v&&v.ttl) label=v.ttl; }
  else if(p.memo) label=p.memo;
  /* 狭い画面では種類名だけを出す。動画タイトルは1文字も読めないうえ、
     「何を」より「いつ何本」が先に要る */
  var nar=window.matchMedia&&window.matchMedia('(max-width:639px)').matches;
  /* 狭い画面では帯だけにするが、塗りは不透明にする。以前は8%の塗りで
     白地とのコントラストが1.06:1しかなく、投稿があったこと自体が見えなかった */
  /* label が種類名そのものだと「リール：リール」になっていた */
  var ttl=esc(label===t.l?t.l:t.l+'：'+label);
  /* このカレンダーは「何を出したか」を見る場所。札はインスタの投稿だけにして、
     広告と口コミ返信は点で添える（記録としては残るが、投稿の本数を数える邪魔をしない） */
  if(p.ty!=='reel'&&p.ty!=='story'&&p.ty!=='feed')
    return '<span class="cal-dot" style="background:'+t.tc+'" title="'+ttl+'"></span>';
  /* 狭い画面は1文字の札。7列×約41pxに「ストーリー」は物理的に入らないが、
     無地の帯だと何を出したのか読み取れない。色＋1文字＋下の凡例で解ける形にする */
  return nar
    ? '<span class="cal-ch nar" style="background:'+t.tc+'" title="'+ttl+'">'+
      esc(t.l.slice(0,1))+'</span>'
    : '<span class="cal-ch" style="color:'+t.tc+';border-color:'+t.c+'80;background:'+t.c+'22" title="'+
      ttl+'">'+esc(label)+'</span>';
}
function viewCal(){
  if(!CAL){ var d=fromYmd(today()); CAL={y:d.getUTCFullYear(),m:d.getUTCMonth()}; }
  var first=new Date(Date.UTC(CAL.y,CAL.m,1)), last=new Date(Date.UTC(CAL.y,CAL.m+1,0));
  var h='<div class="cal-hd"><button class="cal-nav" data-act="calmv" data-d="-1" aria-label="前月">'+ic('arrowL')+'</button>'+
    '<h2>'+CAL.y+'年 '+(CAL.m+1)+'月</h2>'+
    '<button class="cal-nav" data-act="calmv" data-d="1" aria-label="翌月">'+ic('arrowR')+'</button></div>';
  h+='<div class="cal-grid">';
  DOW.forEach(function(d,i){ h+='<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">'+d+'</div>'; });
  for(var p=0;p<first.getUTCDay();p++) h+='<div class="cal-cell pad"></div>';
  for(var day=1;day<=last.getUTCDate();day++){
    var ds=CAL.y+'-'+pad2(CAL.m+1)+'-'+pad2(day), w=new Date(Date.UTC(CAL.y,CAL.m,day)).getUTCDay();
    var ps=S.posts.filter(function(x){ return !x.del&&x.d===ds; }), dy=byId(S.days,'d-'+ds);
    var chs=ps.slice(0,4).map(function(x){ return calChip(x); }).join('');
    if(ps.length>4) chs+='<span class="cal-more">+'+(ps.length-4)+'</span>';
    h+='<button class="cal-cell'+(w===0?' sun':w===6?' sat':'')+(ds===today()?' today':'')+(ds>today()?' future':'')+
      '" data-act="calday" data-d="'+ds+'"><span class="dnum">'+day+'</span><span class="cal-chs">'+chs+'</span>'+
      /* 来客数・出数はここから外した。このカレンダーは「何を出したか」を見る場所で、
         狭い画面では数字と投稿の札が潰し合う。数字は分析タブにある */
      '</button>';
  }
  /* セルに出る1文字を凡例の先頭に同じ色で置く。これが無いと「ス」と「そ」の区別が色頼みになる */
  function lch(k){ var c=PTY[k].c;
    return '<span class="lch" style="color:'+PTY[k].tc+';border-color:'+c+'4d;background:'+c+'14">'+
      '<i class="lch-k" style="background:'+PTY[k].tc+'">'+PTY[k].l.slice(0,1)+'</i>'+PTY[k].l+'</span>'; }
  function lcd(k){ var c=PTY[k].c;
    return '<span class="lch" style="color:'+PTY[k].tc+';border-color:'+c+'4d;background:'+c+'14">'+
      '<i class="lch-d" style="background:'+PTY[k].tc+'"></i>'+PTY[k].l+'</span>'; }
  h+='</div><div class="legend">'+
    '<b class="lg-h">インスタ投稿</b>'+['reel','story','feed'].map(lch).join('')+
    '<b class="lg-h">そのほか</b>'+['ad','review'].map(lcd).join('')+
    /* 来客数・出数はセルから外したので、凡例からも外した */
    '</div>';

  /* 当月集計（9枠）は廃止した。来客・出数・率・フォロワーは分析タブと上部の盤にもあり三重で、
     この画面で本当に要るのは「今週なにを出したか」。セルの中では題名が読めない（1セル約41px） */
  var cw0=weekStart(today());
  var wps=S.posts.filter(function(x){ return !x.del&&x.d>=cw0&&x.d<addDays(cw0,7); })
    .sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:0; });
  /* 上部の「今週の投稿」はインスタの投稿だけを数える。ここは口コミ返信や広告も並ぶので、
     数が合わないように見える。どちらが何を数えているかを画面に書く */
  function isPost(x){ return x.ty==='reel'||x.ty==='story'||x.ty==='feed'; }
  var wIn=wps.filter(isPost).length;
  h+=sec('This week','今週出したもの','calendar',
    'インスタの投稿 '+wIn+'件（目安 週2本）、そのほかの記録 '+(wps.length-wIn)+'件。'+
    '色はカレンダーの帯と同じ。タップするとその日の記録を開きます。');
  h+='<div class="wkp">';
  if(!wps.length) h+='<div class="wkp-e">今週はまだ1件も出ていません</div>';
  /* インスタの投稿を先に、そのほかの記録を後に */
  wps.slice().sort(function(a,b){ return (isPost(b)?1:0)-(isPost(a)?1:0); }).forEach(function(x){
    var t=PTY[x.ty]||{l:'投稿',c:'#888',tc:'#555'}, nm='', mut=false;
    if(x.vid){ var vv=byId(S.videos,x.vid); if(vv&&vv.ttl) nm=vv.ttl; }
    if(!nm&&x.memo) nm=x.memo;
    if(!nm){ nm='素材が未設定'; mut=true; }   /* 何を出したか分からない記録は、そう書く */
    h+='<button class="wkp-r'+(isPost(x)?'':' sub')+'" data-act="calday" data-d="'+x.d+'">'+
      '<span class="wkp-d">'+fmtMd(x.d)+'</span>'+
      '<span class="wkp-c" style="background:'+t.c+'"></span>'+
      '<span class="wkp-t'+(mut?' un':'')+'">'+esc(nm)+'</span>'+
      '<span class="wkp-k">'+(x.url?ic('link'):'')+esc(t.l)+'</span></button>';
  });
  h+='</div>';
  /* FABを廃したので、いちばん使う「本日の記録」はここに置く */
  h+='<button class="addrow" data-act="addtoday">'+ic('plus')+'本日の記録をつける</button>';
  h+='<div class="hint">'+ic('info')+'<span>日付をタップすると当日の投稿と来客数を入力できます。並びはドバイの営業日基準。</span></div>';
  return h;
}

/* ============================================================
   12. 連絡
   ============================================================ */
/* ------------------------------------------------------------
   連絡タブは1本のグループチャットだった。素材ごとの往復が深い階層に埋もれ、
   「自分が答える番のもの」を探すのに画面を3つ跨ぐ必要があった。
   ここを受信箱にして、開いた瞬間に返す先だけが並ぶようにする
   ------------------------------------------------------------ */
/* 連絡タブのバッジ。グループだけ数えていたので、素材の質問が何件残っていても0だった */
function turnCount(){ return inboxRows().filter(function(x){ return x.turn; }).length; }
function inboxRows(){
  var rows=[], role=meRole();
  function add(scope,ref,ttl,icon){
    var ms=msgsOf(scope,ref); if(!ms.length) return;
    var last=ms[ms.length-1];
    var q=ms.filter(function(m){ return m.q&&!ansOf(m.id)&&m.role!==role; }).length;
    var un=unreadOf(scope,ref);
    /* 「開いただけ」で番が移ったことにしない。相手が最後に喋ったなら、
       読んだかどうかに関係なく自分の番。返した時点で初めて外れる */
    /* 「開いただけ」で番が移ったことにはしないが、届いた答えは読めば終わり。
       読んだあとも「返す番」に居座ると、返す先の数がいつまでも減らない */
    var ansOnly=!!last.qa&&un===0;
    rows.push({scope:scope,ref:ref,ttl:ttl,icon:icon,last:last,un:un,q:q,a:ansNew(scope,ref),
      turn:(q>0||(last.role!==role&&!ansOnly)), at:last.at});
  }
  add('g','','みんなへの連絡','chat');
  alive(S.videos).forEach(function(v){ add('video',v.id,v.ttl,'film'); });
  seriesOrdered().forEach(function(x){ add('series',x.id,x.name,'grid'); });
  alive(S.tasks).forEach(function(t){ add('task',t.id,t.ttl,'list'); });
  return rows.sort(function(a,b){ return (b.turn?1:0)-(a.turn?1:0)||b.at-a.at; });
}
function inboxRow(r){
  var act=r.scope==='video'?'video':r.scope==='series'?'series':r.scope==='task'?'tchat':'gchat';
  /* どのカットの話かを行の先頭に出す。定型文は全カット共通なので、
     これが無いと一覧では「どういう意味ですか？」が並ぶだけになる */
  var cn='', cid=r.last.cut||'';
  /* カットが紐づくのは質問のほうだけ。答えは、答えている質問から辿る */
  if(!cid&&r.last.qa){ var q0=byId(S.msgs,r.last.qa); if(q0&&q0.cut) cid=q0.cut; }
  if(r.scope==='video'&&cid){ var vq=byId(S.videos,r.ref);
    if(vq){ var no=cutNo(vq,cid); if(no) cn='<b class="ibx-c">カット'+no+'</b>'; } }
  if(r.last.sec) cn+='<b class="ibx-c">'+esc(r.last.sec)+'</b>';
  var d=stallOf(ymdTZ(r.last.at,TZ_DUBAI));
  return '<button class="ibx-row'+(r.turn?' turn':'')+(r.q?' hasq':'')+'" data-act="'+act+'" data-id="'+esc(r.ref)+'">'+
    '<span class="ibx-i">'+ic(r.icon)+'</span><span class="ibx-b">'+
    '<span class="ibx-t">'+esc(r.ttl)+'</span>'+
    '<span class="ibx-p">'+cn+esc(r.last.name)+'：'+esc(r.last.tx)+'</span>'+
    '<span class="ibx-m">'+
      (r.q?'<span class="pill p-info">'+ic('info')+'質問 '+r.q+'件</span>':'')+
      (r.a?'<span class="pill p-ok">'+ic('check')+'答えが届きました</span>':'')+
      (r.turn&&!r.q&&!r.a?'<span class="pill p-mute">'+ic('send')+'未読</span>':'')+
      /* 片方だけ出すと、日本側は深夜1時に「本日 20:23」と読むことになる */
      '<span class="ibx-d">'+(d?d+'日前':'ドバイ '+hmTZ(r.last.at,TZ_DUBAI)+' ／ 日本 '+
        hmTZ(r.last.at,TZ_JAPAN))+'</span>'+
    '</span></span>'+
    (r.un>0?'<span class="ibx-n">'+(r.un>99?'99':r.un)+'</span>':'')+'</button>';
}
function viewChat(){
  var rows=inboxRows();
  var turn=rows.filter(function(x){ return x.turn; });
  var h=sec('Messages','やり取り','chat','投稿・素材・タスクごとに分かれています。上から順に返せば、返し忘れはありません。');
  h+='<div class="chips">'+[['turn','自分が返す番',turn.length],['all','全部',rows.length]].map(function(x){
    return '<button class="chip" data-ctab="'+x[0]+'" aria-pressed="'+(CTAB===x[0])+'">'+x[1]+'<b>'+x[2]+'</b></button>';
  }).join('')+'</div>';
  var list=CTAB==='turn'?turn:rows;
  if(!list.length) h+='<div class="empty">'+ic('check')+
    (CTAB==='turn'?'返す番のものはありません':'まだやり取りがありません')+'</div>';
  return h+'<div class="ibx">'+list.map(inboxRow).join('')+'</div>';
}
/* 質問がどのカットに付いているかを1行で添える。
   定型文は全カット共通なので、これが無いと「どういう意味ですか？」だけが届く */
function cutRefOf(m){
  if(m.scope!=='video'||!m.cut) return '';
  var v=byId(S.videos,m.ref); if(!v) return '';
  var c=null;
  alive(v.cuts).forEach(function(x){ if(x.id===m.cut) c=x; });
  if(!c) return '';
  return '<div class="q-ref"><b>'+cutNo(v,m.cut)+'</b>'+(c.t?'<i>'+esc(c.t)+'</i>':'')+
    '<span>'+esc(c.d||'')+'</span></div>';
}
/* 入れてもらった文字列をそのままリンクにしない。
   住所として成り立つものだけを返し、それ以外は空を返す（＝ボタンを出さない）。
   「後で送ります」のような覚え書きをリンクにすると、
   日本側は「保存場所は登録済み」と読んでしまい、開いて初めて違うと気づく */
function safeUrl(u){
  u=((u||'')+'').trim();
  if(!u) return '';
  var sc='https://', m=u.match(/^(https?):\/\//i);
  if(m){ sc=m[1].toLowerCase()+'://'; u=u.slice(m[0].length); }
  /* 「javascript:」「data:」などは受け取らない */
  else if(/^[a-z][a-z0-9+.\-]*:/i.test(u)) return '';
  u=u.replace(/^\/+/,'');     /* 「//drive.google.com/…」の頭のスラッシュ */
  if(!u) return '';
  /* 「drive.google.com/…」のように https:// を書き落とすのは日常なので補う。
     ただし点で区切られたASCIIの住所であることは確かめる */
  if(!/^[a-z0-9]([a-z0-9\-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9\-]*[a-z0-9])?)+(:\d+)?([\/?#]|$)/i.test(u)) return '';
  return sc+u;
}
/* 撮った動画そのものへの入口。題名だけでは「どの動画の話か」は分かっても、
   言われた側がその場で見に行けない。置き場所が空なら、そこから貼りに行ける。
   撮る前の企画には出さない（まだ動画が無いのに「未記入」と出ると急かすだけ） */
/* 落とされたものから住所を取り出す。ドライブからの持ち出し方は
   環境によって変わるので、拾える口はぜんぶ見る */
function dropUrl(dt){
  if(!dt) return '';
  var s='';
  try{ s=dt.getData('text/uri-list')||''; }catch(e){}
  if(!s){ try{ s=dt.getData('text/plain')||''; }catch(e){} }
  if(!s){
    var h=''; try{ h=dt.getData('text/html')||''; }catch(e){}
    var m=h.match(/href\s*=\s*["']([^"']+)["']/i); if(m) s=m[1];
  }
  /* uri-list は複数行で来ることがある。先頭の一本だけ使う */
  s=((s||'')+'').split(/[\r\n]+/).filter(function(x){ return x&&x.charAt(0)!=='#'; })[0]||'';
  return s.trim();
}
/* 動画の置き場所。落としても、貼り付けても、同じ結果になるようにしておく */
function vDropHtml(v){

  if(a) h+='<div class="dv">'+urlBtn(v.url,'Googleドライブで開く','play')+'</div>';
  else if(v.url) h+='<div class="urlmemo">'+ic('info')+'<span>'+esc(v.url)+'</span></div>';
  else h+='<div class="vdrop-no">'+ic('info')+'<span>まだ貼られていません。'+
    (v.st==='plan'?'撮影のあとに貼ってください。':'これが無いと日本側は動画を見られません。')+'</span></div>';
  h+='<div class="vdrop-z">'+ic('link')+
    '<b>ここに Google ドライブの動画をドラッグ</b>'+
    '<i>この枠のどこへ落としても受け取ります。下の欄に貼り付けても同じです。</i></div>';
  h+='<div class="vdrop-f"><input type="text" id="vUrl" value="'+esc(v.url||'')+
    '" placeholder="https://drive.google.com/file/d/..." aria-label="動画の住所">'+
    '<button class="btn btn-main btn-sm" data-act="vurl" data-id="'+v.id+'">'+ic('check')+'保存</button></div>';
  return h+'</div>';
}

/* ドライブの住所から、そのまま見られる枠を作る。
   /view は枠の中では開かないので /preview に読み替える */
function driveEmbed(u){
  var a=safeUrl(u); if(!a) return '';
  if(!/(^|\.)drive\.google\.com\//.test(a.replace(/^https?:\/\//,''))) return '';
  var m=a.match(/\/d\/([A-Za-z0-9_-]{10,})/)||a.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  if(!m) return '';
  return '<div class="vframe"><iframe src="https://drive.google.com/file/d/'+esc(m[1])+
    '/preview" allow="autoplay" allowfullscreen loading="lazy" title="撮った動画"></iframe></div>';
}
function vLink(v){
  if(!v) return '';

  if(a) return '<a class="vlink" href="'+esc(a)+'" target="_blank" rel="noopener" '+

}
/* 住所として開けるならボタン、そうでなければ書かれた文字をそのまま見せる。
   黙って捨てると「入れたのに消えた」になり、リンクにすると「場所がある」と誤読される */
function urlBtn(u,lbl,icn,st){
  var a=safeUrl(u); u=((u||'')+'').trim();
  if(a) return '<a class="btn btn-line btn-sm"'+(st?' style="'+st+'"':'')+' href="'+esc(a)+
    '" target="_blank" rel="noopener">'+ic(icn)+esc(lbl)+'</a>';
  if(u) return '<span class="urlmemo">'+ic('info')+'<span>'+esc(u)+'</span></span>';
  return '';
}
/* 必ず esc() したあとの文字列に使う。順番を逆にすると、書き込んだ文字がそのままHTMLになる */
function linkify(h){
  return h.replace(/https?:\/\/[^\s<]+/g, function(u){
    return '<a class="lnk" href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; });
}

/* ============================================================
   13. 分析
   ============================================================ */
function viewData(){
  var w0=weekStart(today()), w1=addDays(w0,-7);
  var dIdx=(fromYmd(today()).getUTCDay()+6)%7;
  function inW(d,s){ return d>=s&&d<addDays(s,7); }
  function inWTD(d,s){ return d>=s&&d<=addDays(s,dIdx); }
  function agg(s,f){
    /* 投稿の数え方は画面で揃える。口コミ返信と広告はインスタの投稿ではないので、
       上の「今週の投稿 n／2」と同じ3種だけを数える */
    var ps=S.posts.filter(function(x){ return !x.del&&f(x.d,s)&&
      (x.ty==='reel'||x.ty==='story'||x.ty==='feed'); });
    var ds=S.days.filter(function(x){ return f(x.d,s); });
    /* n＝その週に来客数を記録した日数。0 の週を「来客0人」と表示すると、
       入力し忘れが「客が来なかった」に化ける */
    return {post:ps.length, n:ds.length, guests:sum(ds.map(function(x){ return x.guests||0; })),
      bowls:sum(ds.map(function(x){ return x.bowls||0; })), foll:sum(ds.map(function(x){ return x.foll||0; }))};
  }
  var a=agg(w0,inWTD), b=agg(w1,inWTD);
  /* rec=false は「記録していない」。数字も増減も出さない */
  function kpi(l,icn,v,pv,u,rec,recPv){
    if(rec===false) return '<div class="kpi"><div class="kl">'+ic(icn)+l+'</div>'+
      '<div class="kv na">—</div><div class="kd fl">記録がありません</div></div>';
    var d=v-pv, cls=d>0?'up':d<0?'dn':'fl';
    return '<div class="kpi"><div class="kl">'+ic(icn)+l+'</div><div class="kv">'+v+'<i>'+(u||'')+'</i></div>'+
      (recPv===false?'<div class="kd fl">先週は記録なし</div>'
        :d===0?'<div class="kd fl">先週と同じ</div>'
        :'<div class="kd '+cls+'">'+(d>0?ic('arrowUp'):ic('arrowDn'))+(d>0?'+':'')+d+'</div>')+'</div>';
  }
  /* ラーメン率＝来客のうち何割がラーメンを頼んだか。
     「サイドだけ注文されて終わる」問題を、そのまま数字にしたもの。
     この画面でいちばん大きく出すべき数字なので、先頭に単独で置く */
  var r0=a.guests?a.bowls/a.guests*100:0, r1=b.guests?b.bowls/b.guests*100:0, rd=r0-r1;
  var tgt=(S.goal&&S.goal.rate)||0;
  var h=sec('Rate','今週、来店100人のうちラーメンを頼むのは','target',
    '残りは、からあげなどサイドだけで帰っているお客様。ここを上げることが今月の狙い。');
  /* 来客をまだ1日も記録していない週に「0人・-75pt」と出すと、
     入力し忘れが「客が来なかった」という嘘の事実になる */
  if(!a.n){
    h+='<div class="card" style="text-align:center;padding:26px 22px">'+
      '<div class="na-big">—</div>'+
      '<div style="font-size:.86rem;font-weight:700;color:var(--tx2);margin-top:8px">今週はまだ記録がありません</div>'+
      '<div style="font-size:.76rem;color:var(--tx3);margin-top:7px;line-height:1.8">'+
        '実績タブの日付から、来客数とラーメンの出数を入れてください。</div>'+
      '<button class="btn btn-line btn-sm" style="margin-top:14px" data-nav="cal">'+ic('calendar')+'実績を入れる</button></div>';
  }else
  h+='<div class="card" style="text-align:center;padding:30px 22px">'+
    '<div style="display:flex;align-items:baseline;justify-content:center;gap:12px">'+
    '<span style="font-size:4.4rem;font-weight:700;letter-spacing:-.05em;line-height:1">'+r0.toFixed(0)+'</span>'+
    '<span style="font-size:1.1rem;font-weight:600;color:var(--tx2)">人</span>'+
    '<span style="font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;color:'+
      (rd>0?'var(--ok)':rd<0?'var(--accent)':'var(--tx3)')+'">'+
      (rd>0?ic('arrowUp'):rd<0?ic('arrowDn'):'')+(rd>0?'+':'')+rd.toFixed(1)+'pt</span></div>'+
    '<div style="height:8px;border-radius:4px;background:#EDE9E2;overflow:hidden;margin:20px auto 0;max-width:460px;position:relative">'+
    '<div style="height:100%;width:'+Math.min(100,r0).toFixed(0)+'%;background:var(--accent);border-radius:4px"></div>'+
    (tgt?'<span style="position:absolute;left:'+Math.min(100,tgt)+'%;top:-4px;bottom:-4px;width:2px;background:var(--tx)"></span>':'')+
    '</div>'+
    (tgt?'<div style="font-size:.78rem;color:var(--tx2);margin-top:9px;font-weight:700">目標 '+tgt+'人　／　残り '+Math.max(0,tgt-Math.round(r0))+'人</div>':'')+
    '</div>';

  h+=sec('Weekly','今週の実績','chart','月曜から'+DOW[fromYmd(today()).getUTCDay()]+'曜まで。増減は先週の同じ曜日までとの比較。');
  h+='<div class="kpis">'+
    kpi('投稿','image',a.post,b.post,'件',true,true)+
    kpi('来客','users',a.guests,b.guests,'人',!!a.n,!!b.n)+
    kpi('ラーメン出数','bowl',a.bowls,b.bowls,'杯',!!a.n,!!b.n)+
    kpi('フォロワー','user',a.foll,b.foll,'人',!!a.n,!!b.n)+'</div>';

  var weeks=[]; for(var i=5;i>=0;i--) weeks.push(addDays(w0,-7*i));
  var maxP=1;
  var data=weeks.map(function(s){
    var by={}; PTY_ORDER.forEach(function(k){ by[k]=0; });
    S.posts.forEach(function(x){ if(!x.del&&inW(x.d,s)) by[x.ty]=(by[x.ty]||0)+1; });
    var tot=sum(PTY_ORDER.map(function(k){ return by[k]; }));
    maxP=Math.max(maxP,tot);
    var dw=S.days.filter(function(x){ return inW(x.d,s); });
    /* gn＝その週に来客を記録した日数。0 の週は数字でなく「—」を出す */
    return {s:s,by:by,tot:tot,gn:dw.length,g:sum(dw.map(function(x){ return x.guests||0; }))};
  });
  h+=sec('Performance','投稿数と来客数の推移','chart');
  h+='<div class="card"><div class="wchart">'+data.map(function(d){
    var cur=d.s===w0;
    var segs=PTY_ORDER.map(function(k){ return d.by[k]?'<span class="wseg" style="height:'+(d.by[k]/maxP*98).toFixed(1)+'px;background:'+PTY[k].c+'"></span>':''; }).join('');
    return '<div class="wcol"><span class="g'+(d.gn?'':' na')+'">'+(d.gn?d.g:'—')+'</span><span class="tot">'+d.tot+'</span>'+
      '<span class="stack" style="height:'+(d.tot/maxP*98).toFixed(1)+'px'+(cur?';opacity:.6':'')+'">'+segs+'</span>'+
      '<span class="lb">'+(cur?'今週':fmtMd(d.s))+'</span></div>'; }).join('')+'</div>';
  h+='<div class="legend">'+PTY_ORDER.map(function(k){
    return '<span><i style="background:'+PTY[k].c+'"></i>'+PTY[k].l+'</span>'; }).join('')+
    '<span style="color:var(--info)">上段の数字＝週の来客数（— は未記録）</span></div></div>';

  var cnt={}; alive(S.menus).forEach(function(m){ cnt[m.name]=0; });
  alive(S.videos).forEach(function(v){ (v.tags||[]).forEach(function(t){ if(cnt[t]!==undefined) cnt[t]++; }); });
  var names=Object.keys(cnt).sort(function(x,y){ return cnt[x]-cnt[y]; });
  var mx=Math.max(1,Math.max.apply(null,names.map(function(n){ return cnt[n]; })));
  h+=sec('Coverage','メニュー別 露出本数','alert','0本のメニューは客が知る手段がない。これが注文されない理由。');
  h+='<div class="card"><div class="rank">'+names.map(function(n){
    var v=cnt[n], z=v===0;
    return '<div class="rank-row"><div class="nm"'+(z?' style="color:var(--accent)"':'')+'>'+esc(n)+'</div>'+
      '<div class="tr"><div class="fl" style="width:'+(z?3:Math.max(8,v/mx*100))+'%;background:'+(z?'var(--accent)':'var(--gold)')+'"></div></div>'+
      '<div class="vl"'+(z?' style="color:var(--accent)"':'')+'>'+v+'</div></div>'; }).join('')+'</div></div>';
  return h;
}

function sheetAccounts(force){
  /* 操作者が1人もいない状態だと、この画面は閉じられない（閉じる先が無い）。
     記録が壊れて全員消えたときに、ここから控えを戻せるようにしておく */
  var noAcc = force&&!alive(S.accounts).length;
  var b='<div class="hint" style="margin-bottom:16px">'+ic('info')+
    '<span>端末を複数人で共有するため、操作者は個別のアカウントで登録します。チェックした記録はそのアカウントの名前で残ります。</span></div>';
  b+='<div class="acc-grid">';
  ['shop','ops'].forEach(function(r){
    var list=alive(S.accounts).filter(function(a){ return a.role===r; });
    if(!list.length) return;
    b+='<div style="grid-column:1/-1;margin-top:6px"><span class="acc-hd">'+esc(roleName(r))+'</span></div>';
    list.forEach(function(a){
      b+='<button class="acc'+(S.me.id===a.id?' on':'')+'" data-act="pick" data-id="'+a.id+'">'+avaOf(a)+
        '<div class="b"><div class="n">'+esc(a.name)+'</div><div class="r">'+esc(roleName(a.role))+'</div></div>'+
        (a.pin?'<span class="lk">'+ic('lock')+'</span>':'')+'</button>';
    });
  });
  b+='<button class="acc add" data-act="accnew" style="grid-column:1/-1">'+ic('plus')+'アカウントを追加</button></div>';
  b+='<div style="margin-top:18px"><button class="btn btn-ghost btn-sm" data-act="accedit">'+ic('pencil')+'アカウントを編集・削除</button></div>';
  if(noAcc) b+='<div class="hint" style="margin-top:14px">'+ic('info')+
    '<span>操作者が1人も登録されていません。以前に書き出した控えがあれば、ここから戻せます。</span></div>'+
    '<div style="margin-top:9px"><button class="btn btn-line btn-sm" data-act="restore">'+ic('up')+
    '控えから戻す</button></div>'+
    '<input type="file" id="fileRestore" accept="application/json,.json" hidden>';
  sheet('操作者の選択',b,'',force);
  if(noAcc) bindRestore();
}

/* --- スレッド --- */
/* toBottom を明示したときだけ最下部へ送る。
   既定で最下部へ飛ばすと、素材を開いた瞬間に見えるのが空のメッセージ欄になり、
   この画面の主役である「こう撮ってほしい」が画面の外（上）へ追い出される */
/* 書きかけの文。画面を作り直すたびに消えていたので、同じ相手あての分は持ち越す */
var CIN={k:'',v:''};
function holdCin(){ var t=$('#cin'); if(t&&CIN.k) CIN.v=t.value; }
/* タスクのメモも同じ。コメントを1件送るたびに画面を作り直すので、
   ここで書き留めておかないと、書きかけのメモが消える */
var TMEMO={k:'',v:''};
function holdTmemo(){ var e=$('#tMemo'); if(e&&TMEMO.k) TMEMO.v=e.value; }
function sheetThread(scope,ref,title,extra,toBottom){
  markRead(scope,ref);
  var ck=tkey(scope,ref);
  holdCin(); holdTmemo();
  if(CIN.k!==ck) CIN={k:ck,v:''};
  if(ANSQ){ var aq0=byId(S.msgs,ANSQ); if(!aq0||aq0.scope!==scope||aq0.ref!==ref) ANSQ=''; }
  sheet(title,(extra||'')+threadHtml(msgsOf(scope,ref))+composerHtml(scope,ref));
  var bd=$('.sheet-bd'); if(bd) bd.scrollTop = toBottom ? bd.scrollHeight : 0;
}
/* 見出しと値を1行。Notionのプロパティと同じで、
   「誰が・いつまでに・どういう区分か」を、読む順に上から並べる */
function propRow(l,v,cls){
  return '<div class="prop"><span class="prop-l">'+esc(l)+'</span>'+
    '<span class="prop-v'+(cls?' '+cls:'')+'">'+v+'</span></div>';
}
/* 1タスク＝1ページ。やること・なぜ・メモ・記録・やり取りを、ひとつづきにする */
function sheetTaskPage(id,toBottom){
  var t=byId(S.tasks,id); if(!t) return;
  var st=statusOf(t), d=doneOf(t), a=null, cat=TCAT[t.cat]||null;
  var role=meRole(), mine=t.who===role, can=true;
  var other=t.who==='shop'?'ops':'shop';
  if(TMEMO.k!==t.id) TMEMO={k:t.id,v:(t.memo||'')};

  var ex='<div class="card" style="margin-bottom:16px">';
  ex+='<div class="props">'+
    propRow('担当','<span class="t-who '+(t.who==='shop'?'db':'jp')+'">'+
      esc(roleName(t.who))+'</span>')+
    propRow('状態','<span class="t-st">'+esc(STL[st].l)+'</span>','st-'+st)+
    propRow('期限', t.rep==='daily'?'毎日' : t.rep==='weekly'?'毎週'
      : (t.due?fmtMd(t.due)+'まで':'決めていない'))+
    propRow('区分', cat?esc(cat.l):'<span class="mute3">なし</span>')+
    '</div></div>';

  /* いちばん押すものを、読んだすぐ下に置く */
  var lb=ckLabel(t,mine,d,a);
  ex+='<div class="tp-act">'+
    '<button class="tp-check '+(a?'ack':d?'on':'')+'" data-act="check" data-id="'+t.id+'"'+
      (can?'':' disabled')+'>'+ic('check')+'<span>'+esc(lb)+'</span></button>'+
    '<button class="btn btn-line" data-act="edtask" data-id="'+t.id+'">'+ic('pencil')+'直す</button></div>';

  if(t.why) ex+=sec('Why','なぜやるのか','target')+
    '<div class="tp-why">'+esc(t.why)+'</div>';

  /* メモ。台本の下書き、買う物、行った店——タスクにぶら下がる細かい話が、
     いままで連絡に流れて埋もれていた。ここに残せば、そのタスクを開けば必ず目に入る */
  ex+=sec('Memo','メモ','pencil')+
    '<div class="tp-memo"><textarea id="tMemo" rows="4" placeholder="例：丼は白の縁あり。スープは寸胴の右。ドライブのフォルダは「9月」の下。">'+
      esc(TMEMO.v)+'</textarea>'+
    '<button class="btn btn-line btn-sm" data-act="savememo" data-id="'+t.id+'">'+
      ic('check')+'メモを保存</button></div>';

  var hh=histHtml(t);
  if(hh) ex+=sec('Log','記録','check')+'<div class="tp-hist">'+hh+'</div>';

  ex+=sec('Talk','このタスクのやり取り','chat','聞きたいことは、ここに書けば相手に届きます。');
  sheetThread('task',t.id,esc(t.ttl),ex,toBottom);
}
function sheetVideo(id,toBottom){
  var v=byId(S.videos,id); if(!v) return;
  var s=byId(S.series,v.sid);
  var ex='<div class="card" style="margin-bottom:16px">';
  ex+='<div class="tmeta">'+pill(VST[v.st].p,VST[v.st].l)+pill('p-mute',s?s.name:'未分類')+
    (v.date?pill('p-mute',fmtMd(v.date),'calendar'):'')+'</div>';
  ex+='<div class="ttl" style="margin-top:8px">'+esc(v.ttl)+'</div>';
  ex+='<div class="tmeta" style="margin-top:9px">'+(v.tags||[]).map(function(t){ return pill('p-gold',t,'pin'); }).join('')+'</div>';
  /* 動画を見ながら、何に気をつけるのかを読む。
     置き場所を開いて別のタブへ行くと、指示はもう画面に無い */
  var fr=driveEmbed(v.url);
  if(fr) ex+='<div style="margin-top:14px">'+fr+
    '<div class="vfnote">'+ic('info')+'<span>ここで再生できないときは、下の「Googleドライブで開く」から。'+
    '共有の設定が「リンクを知っている全員」になっている必要があります。</span></div></div>';
  /* 編集はCanvaでしている。素材からそのまま開けるようにしておく */
  ex+='<div class="vtop">'+
    (safeUrl(v.url)?urlBtn(v.url,'Googleドライブで開く','play'):'')+
    (safeUrl(v.canva)
      ? urlBtn(v.canva,'Canvaで編集する','image')
      : '<a class="btn btn-line btn-sm" href="https://www.canva.com/" target="_blank" rel="noopener">'+
        ic('image')+'Canvaを開く</a>')+
    '<button class="btn btn-line btn-sm" data-act="edvideo" data-id="'+v.id+'">'+ic('pencil')+'この素材を直す</button>'+
    '</div>';
  /* 先に読むのは「何のために撮るのか」。手順はその下で開く */
  if(s) ex+='<div class="sec" style="margin:18px 0 8px"><h2>'+ic('target')+'撮影目的</h2></div>'+
    '<div class="fs-sm mute" style="white-space:pre-wrap">'+esc(s.purpose||'')+'</div>'+
    '<div class="cut-a"><button class="qbtn" data-act="ask" data-scope="video" data-ref="'+v.id+
    '" data-cut="">？　目的が分からない</button></div>';
  ex+=cutsHtml(v);
  ex+=pastHtml(v);
  ex+=sec('Video','撮った動画','folder',
    'Googleドライブで動画を開いて、その住所をここへ落とすか、貼り付けてください。')+vDropHtml(v);
  if(v.ref||v.refNote){
    ex+='<div class="sec" style="margin:18px 0 8px"><h2>'+ic('eye')+'参考素材</h2></div>';
    if(v.ref) ex+=urlBtn(v.ref,'参考を開く','link');
    if(v.refNote) ex+='<div class="fs-sm mute" style="margin-top:8px">'+esc(v.refNote)+'</div>';
  }
  ex+='<div class="sec" style="margin:18px 0 8px"><h2>'+ic('check')+'進捗の更新</h2></div><div class="seg">';
  /* 承認は日本側だけ。現地が自分で承認できると、添削の往復そのものが成立しない */
  VST_ORDER.forEach(function(k){
    /* 承認できるのは日本だけ。ただし「承認済だったものを自分が投稿済にした」ときは、
       新しく承認するのではなく押し間違いを戻すだけなので、現地にも開ける */
    var lock = (k==='ok'&&meRole()!=='ops'&&!(v.st==='posted'&&v.stPrev==='ok'));
    ex+='<button data-act="vst" data-id="'+v.id+'" data-k="'+k+'" aria-pressed="'+(v.st===k)+'"'+
      (lock?' disabled':'')+'>'+VST[k].l+'</button>'; });
  ex+='</div>';
  /* 押せない理由を画面に出す。指で触るだけの道具に、hover で出る説明は無いのと同じ */
  if(meRole()!=='ops') ex+='<div class="fs-xs mute3" style="margin-top:6px">'+
    (v.st==='posted'&&v.stPrev==='ok'
      ? '押し間違えた時は「承認済」に戻せます。'
      : '「承認済」にできるのは日本チームです。')+'</div>';
  /* 撮って添削して終わりにしない。出した投稿と手応えを素材の側から見えるようにする */
  var mine2=S.posts.filter(function(x){ return !x.del&&x.vid===v.id; })
    .sort(function(a,b){ return a.d<b.d?1:-1; });
  ex+=sec('Result','この素材で出した投稿','megaphone',
    mine2.length?'':'まだ結び付いていません。実績タブの日付から「素材を結び付ける」で繋がります。');
  if(!mine2.length) ex+='<div class="wkp-e" style="border-radius:12px">未投稿</div>';
  /* 出した投稿が結び付いているのに進捗が投稿済でないとき、その場で直せるようにする。
     実績の側から勝手に書き換えると、押し間違いを戻せない */
  else if(v.st!=='posted') ex+='<div class="hint">'+ic('info')+
    '<span>出した投稿が結び付いています。進捗はまだ「'+VST[v.st].l+'」です。</span></div>'+
    '<div class="hint-b"><button class="btn btn-line btn-sm" data-act="vst" data-id="'+v.id+'" data-k="posted">'+
    ic('check')+'投稿済にする</button></div>';
  mine2.forEach(function(x){
    var t=PTY[x.ty]||{l:'投稿',c:'#888',tc:'#555'};
    var dy2=byId(S.days,'d-'+x.d);
    ex+='<div class="pres"><div class="pres-h">'+
      '<span class="pres-c" style="background:'+t.c+'"></span>'+
      '<b>'+fmtYmd(x.d)+'</b><span class="pres-k">'+esc(t.l)+'</span></div>'+
      ((x.views||x.saves)
        ? '<div class="res-n">'+
          (x.views?'<b>'+(+x.views).toLocaleString()+'</b><i>再生</i>':'')+
          (x.saves?'<b>'+(+x.saves).toLocaleString()+'</b><i>保存</i>':'')+'</div>'
        : '')+
      (x.res?'<div class="pres-r">'+esc(x.res)+'</div>':'')+
      (dy2?'<div class="pres-n">その日　来客 '+(dy2.guests||0)+'人　ラーメン '+(dy2.bowls||0)+'杯　'+
        '新規フォロワー '+(dy2.foll||0)+'人</div>':'')+
      (x.url?urlBtn(x.url,'インスタで開く','link','margin-top:9px'):
        '<div class="pres-n" style="color:var(--warn)">リンク未登録</div>')+
      /* 数字と手応えを、素材を見ているその場から入れられるようにする。
         実績タブの日付をたどり直させると、結局だれも入れない */
      ' <button class="btn btn-line btn-sm" style="margin-top:9px" data-act="purl" data-id="'+x.id+
        '" data-d="'+x.d+'">'+ic('pencil')+(x.views||x.saves||x.res?'結果を直す':'結果を入れる')+'</button>'+
      '</div>';
  });
  /* 上の「前に出した同じメニュー」に出したものは、ここでは繰り返さない */
  var sim=alive(S.videos).filter(function(o){ return o.id!==v.id&&PAST_IDS.indexOf(o.id)<0&&
    (o.tags||[]).some(function(t){ return (v.tags||[]).indexOf(t)>=0; }); });
  if(sim.length){
    ex+='<div class="sec" style="margin:18px 0 8px"><h2>'+ic('copy')+'関連素材</h2></div>';
    sim.slice(0,6).forEach(function(o){ ex+='<div style="margin-bottom:7px">'+pill(VST[o.st].p,VST[o.st].l)+
      ' <button class="btn btn-ghost btn-sm" data-act="video" data-id="'+o.id+'">'+esc(o.ttl)+'</button></div>'; });
  }
  ex+='</div>'+sec('Feedback','添削・フィードバック','chat');
  sheetThread('video',v.id,esc(v.ttl),ex,toBottom);
}
function sheetSeries(id,toBottom){
  var s=byId(S.series,id); if(!s) return;
  var ex='<div class="card" style="margin-bottom:16px">';
  [['script','台本','film'],['purpose','目的','target'],['caution','注意','alert']].forEach(function(r){
    /* 台本・目的・注意を書き換えられるのは日本側だけ。現地に「編集」を出すと、
       押してから「できません」と言われることになる。代わりに聞く先を出す */
    ex+='<div class="sec" style="margin:14px 0 8px"><h2>'+ic(r[2])+r[1]+
      (meRole()==='ops'
        ? ' <button class="btn btn-ghost btn-sm" data-act="edcell" data-id="'+s.id+'" data-k="'+r[0]+'">'+ic('pencil')+'編集</button>'
        : ' <button class="btn btn-ghost btn-sm" data-act="series" data-id="'+s.id+'" data-b="1">'+ic('chat')+'質問する</button>')+
      '</h2></div>'+
      '<div class="fs-sm mute" style="white-space:pre-wrap">'+(s[r[0]]?esc(s[r[0]]):'<span class="mute3">未記入</span>')+'</div>';
  });
  ex+='<div class="sec" style="margin:18px 0 8px"><h2>'+ic('play')+'この型の素材</h2></div>';
  var vs=videosOf(s.id);
  if(!vs.length) ex+='<div class="fs-sm mute3">未登録</div>';
  vs.forEach(function(v){ ex+='<div style="margin-bottom:7px">'+pill(VST[v.st].p,VST[v.st].l)+
    ' <button class="btn btn-ghost btn-sm" data-act="video" data-id="'+v.id+'">'+esc(v.ttl)+'</button></div>'; });
  ex+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-line btn-sm" data-act="print">'+ic('print')+'台本を印刷</button>'+
    /* 足せるようにした以上、直す口と消す口が無いと、打ち間違えた列が残り続ける */
    (meRole()==='ops'
      ? '<button class="btn btn-line btn-sm" data-act="edseries" data-id="'+s.id+'">'+ic('pencil')+'名前を直す</button>'+
        '<button class="btn btn-ghost btn-sm" data-act="delseries" data-id="'+s.id+'">'+ic('trash')+'この列を削除</button>'
      : '')+'</div></div>';
  ex+='<div class="cut-a" style="margin-top:12px"><button class="qbtn" data-act="ask" data-scope="series" data-ref="'+
    s.id+'" data-cut="">？　この型について聞く</button></div>';
  ex+=sec('Discussion','質問・相談','chat');
  sheetThread('series',s.id,esc(s.name),ex,toBottom);
}
function sheetDay(ds){
  var ps=S.posts.filter(function(x){ return !x.del&&x.d===ds; });
  var dy=byId(S.days,'d-'+ds)||{guests:0,foll:0,menus:[],memo:''};
  var b='<div class="sec" style="margin-top:0"><h2>'+ic('plus')+'投稿記録（タップで1件追加）</h2></div>';
  b+='<div class="ptype-grid">'+PTY_ORDER.map(function(k){
    var n=ps.filter(function(x){ return x.ty===k; }).length;
    return '<button class="ptype" data-act="addpost" data-d="'+ds+'" data-ty="'+k+'" style="border-color:'+PTY[k].c+'55;color:'+PTY[k].tc+'">'+
      ic(PTY[k].i)+'<span>'+PTY[k].l+'</span><span class="cnt">'+n+'</span></button>'; }).join('')+'</div>';
  if(ps.length){
    b+=sec('List','当日の投稿','list','どの撮影素材を出したかを結び付けると、カレンダーに題名が出て、'+
      'その素材のフィードバックまで1タップで戻れます。')+'<div class="plist">'+ps.map(function(p){
      var lv=p.vid?byId(S.videos,p.vid):null;
      return '<div class="pitem"><i style="background:'+PTY[p.ty].c+'"></i>'+esc(PTY[p.ty].l)+
        '<span class="fs-xs mute3" style="margin-left:6px">'+esc(p.by||'')+'</span>'+
        '<button class="rm" data-act="delpost" data-id="'+p.id+'" aria-label="削除">'+ic('trash')+'</button>'+
        '<button class="pvid" data-act="pvid" data-id="'+p.id+'" data-d="'+ds+'">'+ic('play')+

function cellOthers(sid,k,xr){
  var out='';
  seriesOrdered().forEach(function(o){
    if(o.id===sid) return;
    var v=xr?((o.ext||{})[xr.id]||''):(o[k]||'');
    out+='<div class="cellcmp-i"><b>'+esc(o.name)+'</b>'+
      '<div class="cellcmp-t'+(v?'':' none')+'">'+(v?esc(v):'未記入')+'</div></div>';
  });
  return out;
}

  var ops=(meRole()==='ops'), mm=cellMm(s,k), oth=cellOthers(sid,k,xr);

  sheet(esc(s.name)+'／'+L,
    '<div class="cellwrap'+(oth?' two':'')+'"><div>'+main+'</div>'+
    (oth?'<div class="cellcmp"><div class="tcol-h">'+ic('grid')+'ほかの列（読むだけ）</div>'+oth+'</div>':'')+

   15. 同期
   ============================================================ */
function fnv(s){ var h=0x811c9dc5; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return h>>>0; }
function ks(len,seed){ var o=new Uint8Array(len), x=seed>>>0||1;
  for(var i=0;i<len;i++){ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; o[i]=x&255; } return o; }
function b64e(b){ var s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(t){ var s=t.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  var bin=atob(s), o=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) o[i]=bin.charCodeAt(i); return o; }
function pack(o){
  var json=JSON.stringify(o), body=new TextEncoder().encode(json), s=fnv(json+SECRET);
  var buf=new Uint8Array(body.length+4);
  buf[0]=(s>>>24)&255; buf[1]=(s>>>16)&255; buf[2]=(s>>>8)&255; buf[3]=s&255; buf.set(body,4);
  var k=ks(buf.length,fnv(SECRET));
  for(var i=0;i<buf.length;i++) buf[i]^=k[i];
  return b64e(buf);
}
function unpack(t){
  try{
    var buf=b64d(String(t).replace(/\s+/g,'')), k=ks(buf.length,fnv(SECRET));
    for(var i=0;i<buf.length;i++) buf[i]^=k[i];
    var s=((buf[0]<<24)>>>0)+(buf[1]<<16)+(buf[2]<<8)+buf[3];
    var json=new TextDecoder().decode(buf.subarray(4));
    if(fnv(json+SECRET)!==(s>>>0)) return null;
    return JSON.parse(json);
  }catch(e){ return null; }
}
function changed(since){
  /* inb＝相手から取り込んだもの。送り返すと毎往復で差分が膨らみ、
     「未送信102件」という嘘の緊急表示が出続ける */
  function f(a){ return (a||[]).filter(function(o){ return !o.inb&&((o.rev||o.at||0)>since||(o.srev||0)>since||
    (o.log||[]).some(function(x){ return x.at>since; })||(o.ack||[]).some(function(x){ return x.at>since; })); }); }
  return { v:2, at:now(), shop:S.shop, G:(S.goal&&(S.goal.rev||0)>since)?S.goal:null,
    A:f(S.accounts), T:f(S.tasks), V:f(S.videos), R:f(S.series),
    P:f(S.posts), D:f(S.days), U:f(S.menus), X:f(S.rows),
    M:(S.msgs||[]).filter(function(m){ return !m.inb&&m.at>since; }) };
}
function countOf(o){ return o.A.length+o.T.length+o.V.length+o.R.length+o.P.length+o.D.length+o.U.length+
  ((o.X&&o.X.length)||0)+o.M.length; }
/* 誰の側の人か。名前だけでは、日本から来た知らせなのか現地からなのか読めない */
function accRole(nm){

/* 出来事を1件書き留める。同じものを二度書かないよう、内容から鍵を作る */
function feedAdd(arr,x,k,e){
  if(arr!=='tasks'&&arr!=='videos'&&arr!=='posts') return;
  /* 初回の同期では見本がまるごと流れてくる。それを「追加されました」と並べても仕方がない。
     一方、見本のタスクを相手が実施した・直したのは、まぎれもない出来事なので知らせる */
  if(k==='add'&&x.sd) return;
  var ttl=x.ttl||x.name||x.t||'';
  var by=e?(e.by||''):(x.by||'');
  var ts=e?(e.at||0):(x.rev||x.at||0);
  var key=arr+'|'+x.id+'|'+k+'|'+ts;
  if(S.feed.some(function(f){ return f.key===key; })) return;
  S.feed.push({key:key,at:now(),ts:ts,k:k,a:arr,id:x.id,ttl:ttl,by:by,
    ro:accRole(by)||(e?'':(x.bro||''))});
  /* 際限なく伸ばさない。古いものから落とす */
  if(S.feed.length>240) S.feed=S.feed.slice(-240);

/* やり取りを書き留める。どの素材の・どのカットの・何を言われたのかまで残さないと、
   「連絡が1件あります」だけでは、開いて読むまで何のことか分からない */
/* カット単位の直し。素材のどのカットが変わったのかまで出す */
function feedCut(v,c){
  var key='cut|'+c.id+'|'+(c.crev||0);
  if(S.feed.some(function(f){ return f.key===key; })) return;
  var no=cutNo(v,c.id);
  S.feed.push({key:key,at:now(),ts:c.crev||now(),k:'cut',a:'videos',id:v.id,
    ttl:v.ttl||'素材',cut:no?'カット'+no:'',tx:(c.t||'').slice(0,90),by:'',ro:''});
  if(S.feed.length>240) S.feed=S.feed.slice(-240);
}
function feedMsg(m){
  if(!m||m.sd) return;
  var k=m.q?'q':(m.qa?'ans':((m.sec||m.cut)?'dir':'msg'));
  var ttl='', cut='';
  if(m.scope==='video'){
    var v=byId(S.videos,m.ref); ttl=v?v.ttl:'素材';
    if(m.cut&&v){ var no=cutNo(v,m.cut); if(no) cut='カット'+no; }
  }else if(m.scope==='task'){ var t=byId(S.tasks,m.ref); ttl=t?t.ttl:'タスク'; }
  else if(m.scope==='post'){ ttl='出した投稿'; }
  else ttl='みんなへの連絡';
  if(m.sec) cut=(cut?cut+'・':'')+m.sec;
  var key='msg|'+m.id;
  if(S.feed.some(function(f){ return f.key===key; })) return;
  S.feed.push({key:key,at:now(),ts:m.at||now(),k:k,a:'msgs',id:m.id,ttl:ttl,cut:cut,
    sc:m.scope||'g', rf:m.ref||'',
    tx:(m.tx||'').slice(0,90),by:m.name||'',ro:m.role||''});
  if(S.feed.length>240) S.feed=S.feed.slice(-240);
}
function mergeIn(o){
  var n={A:0,T:0,V:0,R:0,P:0,D:0,U:0,M:0};
  function up(key,arr,inc){
    (inc||[]).forEach(function(x){
      /* 見本を消した端末に、相手の見本を書き戻さない。
         押した本人には、消したはずのものが翌日戻ってくるように見える。
         相手が見本に手を入れたものは印が外れているので、そちらは届く */
      if(S.nos&&x.sd) return;
      var ex=byId(S[arr],x.id);
      if(!ex){
        /* 相手の見本の実施・承認は持ち込まない。こちらでは日付が違い、
           同じ1件が2つに増えたうえ、取り消しも噛み合わなくなる */
        ['log','ack'].forEach(function(k){
          if(Array.isArray(x[k])) x[k]=x[k].filter(function(e){ return !e.sd; }); });
        x.inb=1; S[arr].push(x); n[key]++;
        feedAdd(arr,x,'add'); return;
      }
      var ch=false;
      /* 丸ごと上書きから外すもの：
         st/stAt は現地が押す進捗、cuts は日本が書く指示。
         日本が夜にカット割りを書き、現地が朝に進捗を動かす——という普通の1日で、
         rev の新しい側が相手の作業を無警告で消していた */
      if((x.rev||0)>(ex.rev||0)){
        /* 題名・担当・期限が書き換わったことは、上書きする前でないと分からない */
        if(arr==='tasks'&&(x.ttl!==ex.ttl||x.due!==ex.due||x.who!==ex.who||x.why!==ex.why))
          feedAdd(arr,x,'edit');
        Object.keys(x).forEach(function(k){
          /* stPrev は「自分が押し間違えたときに戻すための印」。相手に渡すと、
             触っていない人の画面に「押し間違えた時は戻せます」が出る */
          if(k!=='log'&&k!=='ack'&&k!=='cuts'&&k!=='st'&&k!=='stAt'&&k!=='srev'&&k!=='stPrev') ex[k]=x[k]; });
        ch=true;
      }
      /* 進捗は別リビジョン。現地が押すのは st/stAt だけなので指示と衝突しない */
      /* stPrev（直前の状態）は運ばない。自分が押し間違えたときに戻すための印なので、
         相手の端末に渡すと「押し間違えた時は戻せます」が、触っていない人に出る */
      if((x.srev||0)>(ex.srev||0)){
        if(arr==='videos'&&x.st!==ex.st) feedAdd(arr,ex,'st:'+x.st);
        ex.st=x.st; ex.stAt=x.stAt; delete ex.stPrev; ex.srev=x.srev; ch=true; }
      /* カットは id 単位。両方にあれば crev の新しい側、片方にしか無い id は残す */
      if(x.cuts){
        if(!ex.cuts) ex.cuts=[];
        x.cuts.forEach(function(c){
          var e0=null; ex.cuts.forEach(function(y){ if(y.id===c.id) e0=y; });
          if(!e0){ ex.cuts.push(c); ch=true; return; }
          if((c.crev||0)>(e0.crev||0)){
            /* 撮り方の直しは、この道具でいちばん伝わってほしいもの。
               黙って上書きすると、現地は古い指示のまま撮りに行く */
            if(arr==='videos'&&(c.t!==e0.t||c.ng!==e0.ng||c.ad!==e0.ad)) feedCut(ex,c);
            Object.keys(c).forEach(function(k){ e0[k]=c[k]; }); ch=true; }
        });
      }
      ['log','ack'].forEach(function(k){
        if(!x[k]) return; if(!ex[k]) ex[k]=[];
        x[k].forEach(function(e){
          /* sd が付いているのは見本だけ。両方の端末が最初から同じ見本を持っていて、
             日付は「初めて開いた日」で決まる。受け取ると同じ1件が2つに増えたうえ、
             時刻が食い違うので取り消しも相手に届かなくなる。見本は受け取らない */
          if(e.sd) return;
          if(!ex[k].some(function(y){ return y.at===e.at&&y.by===e.by; })){
            ex[k].push(e); ch=true; feedAdd(arr,ex,k==='ack'?'ack':'done',e); } });
        ex[k].sort(function(p,q){ return p.at-q.at; });
      });
      if(ch){ ex.inb=1; n[key]++; }
    });
  }
  up('A','accounts',o.A); up('T','tasks',o.T); up('V','videos',o.V); up('R','series',o.R);
  up('P','posts',o.P); up('D','days',o.D); up('U','menus',o.U);
  /* 古い画面から来たコードには X が無い。up は空として扱うので、そのまま通る */
  up('R','rows',o.X);
  if(o.G&&(o.G.rev||0)>((S.goal&&S.goal.rev)||0)) S.goal=o.G;
  (o.M||[]).forEach(function(m){
    /* 連絡もここで見本を弾く。弾かないと、消したはずの見本のやり取りだけが戻る */
    if(S.nos&&m.sd) return;
    if(!byId(S.msgs,m.id)){ m.inb=1; S.msgs.push(m); n.M++; feedMsg(m); } });
  /* 受け取った中に前の見本が混じっていることがある。
     相手の端末が、まだ言い換える前の控えを置き場所に残しているため */
  reskin();
  save();
  return n;
}

/* 控えの読み込み。シートを開くたびに張り直す（シートの中身は毎回作り直されるため） */
function bindRestore(){
  var fi=$('#fileRestore'); if(!fi) return;
  fi.addEventListener('change',function(){
    var f=fi.files&&fi.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var o=null;
      try{ o=JSON.parse(rd.result); }catch(e){ o=null; }
      if(!o||typeof o!=='object'||!o.v){ alert('この書類は控えとして読めませんでした。書き出したJSONを選んでください。'); fi.value=''; return; }
      var cnt=(o.tasks||[]).length+(o.videos||[]).length+(o.msgs||[]).length;
      if(!confirm('控えの内容（タスク・素材・やり取り 合わせて'+cnt+'件）で、この端末の記録を入れ替えます。よろしいですか。')){ fi.value=''; return; }
      /* 先に書いてから読み直す。順番が逆だと、load() が localStorage の
         古い内容で S を上書きしてしまい、控えが1件も入らないまま成功と表示される */
      S=o; save(); load(); save();
      BROKEN=0; closeSheet(); render();
      alert('控えから戻しました。');
      /* 控えに操作者が入っていないことがある。誰でもない状態だと、
         押しても何も起きないボタンだけが並ぶ画面になる */
      if(!me()) sheetAccounts(true);
    };
    rd.readAsText(f);
  });
}

/* ============================================================
   17. 描画
   ============================================================ */
/* 選んでいる絞り込みが画面の外にあると、何で絞っているのか分からない。
   描き直すたびに、選んでいるものを見える位置へ寄せる */
/* 画面の幅で札の形が変わる。回したときに描き直さないと、
   狭い形のまま広い画面に残る */
var RSZ=0, RSZW=0;
window.addEventListener('resize',function(){
  if(window.innerWidth===RSZW) return;
  RSZW=window.innerWidth;
  clearTimeout(RSZ); RSZ=setTimeout(function(){ if(me()) render(); },200);
});
function keepChip(){
  var ch=$('.chips'); if(!ch) return;
  var on=ch.querySelector('.chip[aria-pressed="true"]'); if(!on) return;
  ch.scrollLeft=Math.max(0, on.offsetLeft-(ch.clientWidth-on.offsetWidth)/2);
}
function render(){
  $('#navIn').innerHTML=navHtml();
  $('#hdShop').textContent=S.shop;
  /* 交代で同じ端末を使うので、いま誰として押しているかを常に出す。
     ここに出すことで、一覧の先頭を70px占めていた操作者カードを丸ごと外せる */
  var ac0=me();
  /* 名前と所属を包んで、足りないときはそこだけ縮める。包まないと、
     いちばん右の⇄（押すと操作者を変えられる印）が画面の外へ押し出される */
  $('#hdWho').innerHTML = ac0
    ? '<i class="ava c'+(ac0.color||0)+'">'+esc(ac0.name.slice(0,1))+'</i>'+
      /* 長いほうは375pxで切れる。タスクのピルと同じ短い呼び名を使う */
      '<span class="hd-nm">'+esc(ac0.name)+'</span>'+ic('swap')
    : '<span class="hd-nm">操作者を選ぶ</span>'+ic('swap');
  $('#setIc').innerHTML=ic('gear');
  paintSync();

  var m=$('#main');
  m.innerHTML = VIEW==='task'?viewTask() : VIEW==='plan'?viewPlan() : VIEW==='cal'?viewCal() :
                VIEW==='chat'?viewChat() : viewData();
  keepChip();
  /* 連絡タブは受信箱になったので、開いただけで既読にしない（中を開いたときに markRead される） */
}

document.addEventListener('click',function(e){
  var nav=e.target.closest('[data-nav]');
  /* タスクに戻ってきたときは、また自分の分から見せる */
  /* 持ち上げた列を抱えたまま他のタブへ行くと、戻ったとき詳細が開けないままになる */
  if(nav){ VIEW=nav.dataset.nav; FILT=(VIEW==='task'?'todo':'all'); mxDrop();
    closeSheet(); render(); window.scrollTo(0,0); return; }
  var pt=e.target.closest('[data-ptab]'); if(pt){ PTAB=pt.dataset.ptab; FILT='all'; mxDrop(); render(); return; }
  var fl=e.target.closest('[data-filt]'); if(fl){ FILT=fl.dataset.filt; render(); return; }
  var ct=e.target.closest('[data-ctab]'); if(ct){ CTAB=ct.dataset.ctab; render(); return; }
  var vf=e.target.closest('[data-vfilt]'); if(vf){ FILT=vf.dataset.vfilt; render(); return; }

  var seg=e.target.closest('#acRole button,#acColor button,#tWho button,#tCat button,#tCat2 button,#tRep button,#vSid button,#sTag button');
  if(seg){
    var on=(seg.getAttribute('aria-pressed')==='true');
    Array.prototype.forEach.call(seg.parentNode.children,function(x){ x.setAttribute('aria-pressed','false'); });
    var pid=seg.parentNode.id;
    if(pid==='tCat'||pid==='tCat2'){
      /* 区分は二段で見せているが、中身はひとつ。片方を押したら、もう片方は外す。
         押し直せば「区分なし」に戻せる——当てはまらない仕事のほうが多い */
      var other=$('#'+(pid==='tCat'?'tCat2':'tCat'));
      if(other) Array.prototype.forEach.call(other.children,function(x){ x.setAttribute('aria-pressed','false'); });
      if(on) return;
    }
    seg.setAttribute('aria-pressed','true'); return;
  }
  var mc=e.target.closest('#dMenus button,#vTags button');
  if(mc){ mc.setAttribute('aria-pressed', mc.getAttribute('aria-pressed')==='true'?'false':'true'); return; }

  /* 日付の欄。押された時点で暦に変え、そのまま開く。
     何も選ばずに離れたら、また言葉の欄に戻す（yyyy/mm/dd を残さない） */
  var dfl=e.target.closest('input[data-date]');
  if(dfl){
    if(dfl.type!=='date'){ dfl.removeAttribute('readonly'); dfl.type='date'; }
    try{ if(dfl.showPicker) dfl.showPicker(); }catch(e9){}
    return;
  }
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, id=b.dataset.id;
  if(a==='vurl'){
    var vu=byId(S.videos,id), iu=$('#vUrl');
    if(vu&&iu) vSetUrl(vu,iu.value);
    return;
  }
  if(a==='shfull'){
    SHFULL=SHFULL?0:1;
    try{ localStorage.setItem(STORE+'_full',SHFULL?'1':'0'); }catch(e){}
    var ov2=$('.ov'); if(ov2){ if(SHFULL) ov2.classList.add('full'); else ov2.classList.remove('full'); }
    var fb=$('[data-act="shfull"]');
    if(fb){ fb.innerHTML=ic(SHFULL?'shrink':'expand');
      fb.setAttribute('aria-label',SHFULL?'元の大きさに戻す':'画面いっぱいに広げる');
      fb.setAttribute('title',SHFULL?'元の大きさに戻す':'画面いっぱいに広げる'); }
    return;
  }
  if(a==='goalview'){ sheetGoalView(); return; }

  if(a==='ovclose'){ if(e.target.classList.contains('ov')&&me()){ closeSheet(); render(); } return; }
  /* 開いた時点で既読になっている。閉じたあとに描き直さないと、
     読んだのに「返す番」も連絡バッジも減らないままになる */
  if(a==='close'){ closeSheet(); render(); return; }

  /* アカウント */
  if(a==='accounts'){ sheetAccounts(!me()); return; }
  if(a==='accnew'){ sheetAccNew(id||''); return; }
  if(a==='accedit'){ sheetAccEdit(); return; }
  if(a==='pick'){
    var acc=byId(S.accounts,id); if(!acc) return;
    if(acc.pin){ sheetPin(id); return; }
    S.me.id=id; save(); closeSheet(); render(); return;
  }
  if(a==='pinok'){
    var ac=byId(S.accounts,id), v=($('#pinIn').value||'').trim();
    if(hash(v)!==ac.pin){ $('#pinRes').innerHTML='<div class="res ng">暗証番号が違います。</div>'; return; }
    S.me.id=id; save(); closeSheet(); render(); return;
  }
  if(a==='accsave'){
    var nm=$('#acName').value.trim(); if(!nm){ alert('名前を入力してください'); return; }
    var o=id?byId(S.accounts,id):{id:uid('a'),at:now(),pin:''};
    o.name=nm;
    o.role=$('#acRole [aria-pressed="true"]').dataset.v;
    o.color=parseInt($('#acColor [aria-pressed="true"]').dataset.v,10)||0;
    var pin=($('#acPin').value||'').trim();
    if(pin){ if(!/^\d{4}$/.test(pin)){ alert('暗証番号は4桁の数字で入力してください'); return; } o.pin=hash(pin); }
    touch(o); if(!id) S.accounts.push(o);
    save(); sheetAccounts(!me()); return;
  }
  if(a==='accdel'){
    var ad=byId(S.accounts,id);
    if(ad&&confirm('このアカウントを削除しますか？　これまでの記録の名前は残ります。')){
      ad.del=1; touch(ad); if(S.me.id===id) S.me.id='';
      save(); sheetAccounts(!me()); render();
    }
    return;
  }

  /* タスク */
  if(a==='check'){
    var t=byId(S.tasks,id), acc2=me(); if(!t||!acc2) return;
    if(!Array.isArray(t.log)) t.log=[];
    if(!Array.isArray(t.ack)) t.ack=[];
    var d=doneOf(t);
    if(d){
      if(!confirm('完了を取り消しますか？　これまでの記録には残ります。')) return;
      /* 記録は消さずに「取り消した」を積む。配列から消すと、同期の和集合マージが
         「消した」を表現できず、相手の端末から必ず復活する */
      t.log.push({at:now(),by:acc2.name,bid:acc2.id,undo:1,un:d.at});
    }else{
      t.log.push({at:now(),by:acc2.name,bid:acc2.id});
    }
    moved(t); save(); render(); return;
  }
  /* ふきだしはやり取りの位置まで送るだけ。開くのは同じ1ページ */
  if(a==='tchat'){ sheetTaskPage(id,true); return; }
  if(a==='taskpage'){ sheetTaskPage(id,false); return; }
  if(a==='savememo'){
    var tm=byId(S.tasks,id), el=$('#tMemo'); if(!tm||!el) return;
    tm.memo=el.value; touch(tm); TMEMO={k:tm.id,v:tm.memo}; save();
    var b2=$('[data-act="savememo"]');
    if(b2){ b2.innerHTML=ic('check')+'保存しました'; b2.disabled=true; }
    return;
  }
  if(a==='tack'){ closeSheet(); sheetAck(id); return; }
  if(a==='ackone'){
    var ta=byId(S.tasks,id), ac3=me(); if(!ta||!ac3) return;
    if(ta.who===ac3.role){ alert('承認は'+roleName(ta.who==='shop'?'ops':'shop')+'が行います。'); return; }
    ta.ack.push({at:now(),by:ac3.name,bid:ac3.id,'for':parseInt(b.dataset.at,10)});
    moved(ta); save(); closeSheet(); sheetAck(id); render(); return;
  }
  if(a==='addtask'){ sheetTaskEdit('',b.dataset.who||''); return; }
  if(a==='edtask'){ sheetTaskEdit(id); return; }
  if(a==='savetask'){
    var ttl=$('#tTtl').value.trim(); if(!ttl){ alert('タスク名を入力してください'); return; }
    var me0=me();
    var o2=id?byId(S.tasks,id):{id:uid('t'),log:[],ack:[],at:now(),
      by:me0?me0.name:'', bid:me0?me0.id:'', bro:me0?me0.role:''};
    o2.ttl=ttl;
    o2.memo=($('#tMemoF')?$('#tMemoF').value:'').trim();
    if(TMEMO.k===o2.id) TMEMO.v=o2.memo;
    /* 担当は画面で選ぶ。足した場所で決め打ちにすると、
       間違えたときに作り直すしかなくなる */
    var wsel=$('#tWho [aria-pressed="true"]');
    o2.who = wsel ? wsel.dataset.v : (o2.who||b.dataset.who||meRole()||'shop');
    /* 区分は二段に分かれて出しているが、選ぶのは一つ */
    var c1=$('#tCat [aria-pressed="true"]'), c2=$('#tCat2 [aria-pressed="true"]');
    o2.cat=c1?c1.dataset.v:(c2?c2.dataset.v:'');
    if(!o2.rep) o2.rep='none';
    o2.due=$('#tDue').value||'';
    touch(o2); if(!id) S.tasks.push(o2);
    save(); closeSheet(); render(); return;
  }
  if(a==='deltask'){ var td=byId(S.tasks,id); if(td&&confirm('このタスクを削除しますか？')){ td.del=1; touch(td); save(); closeSheet(); render(); } return; }

  /* 企画・素材 */
  /* 「質問する」から来たときは、書く場所まで送る。同じ画面が開き直るだけだと、
     押した人には何も起きていないように見える */
  if(a==='series'){ var toB=b.dataset.b==='1'; closeSheet(); sheetSeries(id,toB); return; }
  if(a==='edcell'){ closeSheet(); sheetCell(id,b.dataset.k); return; }
  if(a==='savecellmm'){
    var sm=byId(S.series,id), km=b.dataset.k, im=$('#cellMm');
    if(!sm||!im) return;
    var tm=im.value.trim(), am=me();
    if(!sm.mm) sm.mm={};
    if(tm) sm.mm[km]={tx:tm,by:(am||{}).name||'',at:now()};
    else delete sm.mm[km];
    touch(sm); save(); closeSheet(); render(); return;
  }
  if(a==='savecell'){
    var s2=byId(S.series,id), kk=b.dataset.k;
    if(s2){
      if(kk.indexOf('x:')===0){ if(!s2.ext) s2.ext={}; s2.ext[kk.slice(2)]=$('#cellTx').value; }
      else s2[kk]=$('#cellTx').value;
      /* メモも同じ画面にある。別のボタンにすると、書いたのに残らない */
      var im2=$('#cellMm');
      if(im2){
        var tm2=im2.value.trim(), am2=me();
        if(!s2.mm) s2.mm={};
        if(tm2) s2.mm[kk]={tx:tm2,by:(am2||{}).name||'',at:now()};
        else delete s2.mm[kk];
      }
      touch(s2); save();
    }
    closeSheet(); render(); return; }
  /* ---- 比較表の軸 ---- */
  if(a==='mxaddcol'){ sheetSeriesNew(); return; }
  if(a==='saveseries'){
    var snm=$('#sNm').value.trim(); if(!snm){ alert('シリーズ名を入力してください'); return; }
    var sar=seriesOrdered(); reord(sar);
    S.series.push({id:uid('s'),name:snm,tag:$('#sTag [aria-pressed="true"]').dataset.v,
      script:'',purpose:'',caution:'',ttp:'',ext:{},ord:sar.length,rev:now(),at:now()});
    save(); closeSheet(); render(); return;
  }
  if(a==='edseries'){ closeSheet(); sheetSeriesEdit(id); return; }
  if(a==='saveseries2'){
    var se=byId(S.series,id); if(!se) return;
    var nm2=$('#sNm2').value.trim(); if(!nm2){ alert('シリーズ名を入力してください'); return; }
    se.name=nm2; se.tag=$('#sTag2 [aria-pressed="true"]').dataset.v;
    touch(se); save(); closeSheet(); render(); return;
  }
  if(a==='delseries'){
    var sd2=byId(S.series,id); if(!sd2) return;
    var vn=videosOf(id).length;
    /* 素材がぶら下がったまま列を消すと、その素材はどこにも出なくなる */
    if(vn){ alert('この列には素材が'+vn+'本ぶら下がっています。\n先に素材の型を移すか、素材を削除してください。'); return; }
    if(!confirm('「'+sd2.name+'」の列を削除しますか？\n書いてある台本・目的・注意も消えます。')) return;
    /* 配列から消すと、相手の端末では「こちらに無い列」として戻ってくる。
       墓標を残して、消したこと自体を相手へ渡す */
    sd2.del=1; touch(sd2); save(); closeSheet(); render(); return;

  if(a==='mxaddrow'){ sheetRowEdit(''); return; }
  if(a==='edrow'){ sheetRowEdit(id); return; }
  if(a==='saverow'){
    var rl=$('#rNm').value.trim(); if(!rl){ alert('観点の名前を入力してください'); return; }
    if(id){ var r0=byId(S.rows,id); if(r0){ r0.l=rl; touch(r0); } }

      S.rows.push({id:uid('rw'),l:rl,ord:rar.length,rev:now(),at:now()}); }

  if(a==='delrow'){
    var rd=byId(S.rows,id); if(!rd) return;

    var rt=ra[ri].ord; ra[ri].ord=ra[rj].ord; ra[rj].ord=rt;
    touch(ra[ri]); touch(ra[rj]); save(); render(); sheetRowEdit(id); return;

  if(a==='video'){ closeSheet(); sheetVideo(id); return; }
  if(a==='addvideo'){ sheetVideoEdit(''); return; }
  if(a==='edvideo'){ closeSheet(); sheetVideoEdit(id); return; }

    var vt=$('#vTtl').value.trim(); if(!vt){ alert('タイトルを入力してください'); return; }

    v2.ttl=vt;
    var sb=$('#vSid [aria-pressed="true"]'); v2.sid=sb?sb.dataset.v:'';

    /* 書いてもらった文字はそのまま残す。リンクにするかどうかは出すときに決める
       （ここで捨てると「入れたのに消えた」になる） */
    v2.url=$('#vUrl').value.trim(); v2.canva=$('#vCanva').value.trim();
    v2.ref=$('#vRef').value.trim(); v2.refNote=$('#vRefNote').value.trim();
    touch(v2); if(!id) S.videos.push(v2);
    save(); closeSheet(); render(); return;

  if(a==='delvideo'){ var vd=byId(S.videos,id); if(vd&&confirm('この素材を削除しますか？')){ vd.del=1; touch(vd); save(); closeSheet(); render(); } return; }
  if(a==='vst'){ holdCin(); var vv=byId(S.videos,id); if(vv){

    save(); closeSheet(); sheetVideo(id); } return; }
  if(a==='gaplist'){ sheetGap(b.dataset.side); return; }
  if(a==='edcut'){ closeSheet(); sheetCut(id,b.dataset.cut||''); return; }
  if(a==='savecut'){

    ob.t=$('#cuT').value.trim(); ob.d=dd; ob.n=$('#cuN').value.trim();

  }
  if(a==='cutmemo'){ closeSheet(); sheetCutMemo(id,b.dataset.cut||''); return; }
  if(a==='savecutmemo'){
    var vm=byId(S.videos,id); if(!vm) return;
    var cm=alive(vm.cuts).filter(function(x){ return x.id===b.dataset.cut; })[0]; if(!cm) return;
    var cmi=$('#cmIn'), ctx=cmi?cmi.value.trim():'', cac=me();

    (vd2.cuts||[]).forEach(function(x){ if(x.id===b.dataset.cut){ x.del=1; x.crev=now(); } });

/* 列の名前を長押しすると、その列を動かせるようにする。
   この表は横に流して読むものなので、指が少しでも動いたら「スクロールのつもり」とみなしてやめる。
   ボタンの上から始まった長押しは拾わない（詳細を開くつもりの指を奪ってしまう） */
/* つまみは触れた瞬間から掴む。列の名前は長押しで掴む。
   どちらも、そのまま横へ動かせば列がついてくる */
var LPT=null;
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.chmv');
  if(g&&g.dataset.sid){ e.preventDefault(); mxGrab(g.dataset.sid,e.clientX); return; }
  if(e.target.closest('button,a,input,textarea')) return;
  var th=e.target.closest('.mx th.ch'); if(!th||!th.dataset.sid) return;
  var sid=th.dataset.sid;
  /* 押したまま待っても掴めるし、押してすぐ横へ動かしても掴める。
     待たせる作りだと、動かし始めた指が取り消し扱いになって、
     「長押ししても動かない」という手応えだけが残る */
  LPT={x:e.clientX,y:e.clientY,sid:sid,t:setTimeout(function(){
    if(LPT){ LPT=null; mxGrab(sid,e.clientX); }
  },320)};
},{passive:false});
document.addEventListener('focusout',function(e){
  var d=e.target;
  if(d&&d.tagName==='INPUT'&&d.dataset&&d.dataset.date&&d.type==='date'&&!d.value){
    d.type='text'; d.readOnly=true;
  }
},true);
document.addEventListener('pointermove',function(e){
  if(MXD){ e.preventDefault(); mxMoveTo(e.clientX); return; }
  if(!LPT) return;
  var dx=e.clientX-LPT.x, dy=e.clientY-LPT.y;
  /* 横へ動いたら、それは列を運ぼうとしている手。その場で掴む */
  if(Math.abs(dx)>6&&Math.abs(dx)>=Math.abs(dy)){
    clearTimeout(LPT.t);
    var sid=LPT.sid; LPT=null;
    e.preventDefault(); mxGrab(sid,e.clientX); mxMoveTo(e.clientX); return;
  }
  /* 縦へ動いたのは、表を上下に読んでいるだけ */
  if(Math.abs(dy)>10){ clearTimeout(LPT.t); LPT=null; }
},{passive:false});
['pointerup','pointercancel'].forEach(function(k){
  document.addEventListener(k,function(){
    if(LPT){ clearTimeout(LPT.t); LPT=null; }
    mxDrop();
  },{passive:true,capture:true});
});

function vdZone(e){
  var t=e.target, c=(t&&t.closest)?t:null;
  var z=c?c.closest('.vdrop'):null;
  if(z) return z;
  var s=c?c.closest('.sheet'):null;
  return s?s.querySelector('.vdrop'):null;
}
var VDZ=null;
function vdOff(){ if(VDZ){ VDZ.classList.remove('over'); VDZ=null; } }
document.addEventListener('dragover',function(e){
  e.preventDefault();
  var z=vdZone(e);
  if(!z){ vdOff(); return; }
  try{ e.dataTransfer.dropEffect='copy'; }catch(er){}
  if(VDZ!==z){ vdOff(); VDZ=z; z.classList.add('over'); }
});
document.addEventListener('dragleave',function(e){
  if(VDZ&&!VDZ.contains(e.relatedTarget)) vdOff();
});
document.addEventListener('drop',function(e){

  var z=vdZone(e); vdOff();
  if(!z) return;
  var u=dropUrl(e.dataTransfer);
  /* 落とし先は素材の画面と、日付ごとの投稿の行の二つ */
  var pd=z.dataset.pd?byId(S.posts,z.dataset.pd):null;
  var v=z.dataset.vd?byId(S.videos,z.dataset.vd):null;
  if(!v&&!pd) return;
  if(safeUrl(u)){
    if(pd){ pd.dv=((u||'')+'').trim(); touch(pd); save(); render(); sheetDay(pd.d); }
    else vSetUrl(v,u);
    return;
  }
  var f=e.dataTransfer&&e.dataTransfer.files;
  if(f&&f.length){
    /* 動画そのものは預かれない。預かっても相手の端末には届かないので、
       「貼ったのに見えない」が起きる。置き場所はドライブのまま */
    alert('動画そのものは、この画面には置けません。\n\n'+f[0].name+
      '\n\nGoogleドライブに上げてから、その動画の住所をこの枠へ落としてください。');
    return;
  }
  alert('リンクを読み取れませんでした。\nGoogleドライブで動画を開いて、上の住所をそのまま貼り付けてください。');
});

  var b=document.querySelector('[data-act="vurl"]'); if(!b) return;
  e.preventDefault();
  var v=byId(S.videos,b.dataset.id); if(v) vSetUrl(v,i.value);
});
$('#btnSet').addEventListener('click',function(){ sheetSet(); });
/* 携帯は、画面を伏せているあいだに接続を切る。戻ってきたらつなぎ直す */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&FB_URL){
    if(!FBES||FBST==='err'){ if(FBES){ try{ FBES.close(); }catch(e){} FBES=null; } FBER=0; fbStart(); }
    else fbSend();
  }
});
window.addEventListener('online',function(){
  if(FBES){ try{ FBES.close(); }catch(e){} FBES=null; }
  FBER=0; fbStart();
});


/* ============================================================
   18.5 つながり（お互いの入力がそのまま届く）
   ============================================================ */
/* 置き場所。部屋の名前が住所そのものなので、これを知らない人は中を見られない。
   ルールで「ルートは読めない・部屋の名前を知っていれば読み書きできる」としてある */
var FB_URL='https://dubai-shiogensui-default-rtdb.asia-southeast1.firebasedatabase.app';
var FB_ROOM='3e9c4d003efb814ae613b490378e56fa';
var FBDEV='', FBES=null, FBQ=null, FBIN=false, FBST='off', FBAT=0, FBER=0;
/* 端末の名札。同じ人が二台で開くこともあるので、人ではなく端末で分ける */
function fbDev(){
  if(FBDEV) return FBDEV;
  try{ FBDEV=localStorage.getItem(STORE+'_dev')||''; }catch(e){}
  if(!FBDEV){
    FBDEV='d'+Math.random().toString(36).slice(2,10)+(''+now()).slice(-5);
    try{ localStorage.setItem(STORE+'_dev',FBDEV); }catch(e){}
  }
  return FBDEV;
}
function fbSet(s){ if(FBST===s) return; FBST=s; paintSync(); }
/* 自分の持っているものを丸ごと置く。差分だけを積むと、相手がいつ読むか分からない以上、
   どこまで届いたかを両側で数える羽目になる。丸ごと置けば、最後に置いたものが正しい */
function fbSend(){
  if(!FB_URL||FBIN||!S) return;
  clearTimeout(FBQ);
  FBQ=setTimeout(function(){
    var body;
    /* 中身は文字のまま渡す。置き場所は空の配列を保存しないので、
       そのまま渡すと log や ack のキーごと消え、相手の端末では
       記録の入れ物が無いタスクになる */
    try{ body=JSON.stringify({at:now(),by:(me()||{}).name||'',j:JSON.stringify(changed(0))}); }
    catch(e){ return; }
    fetch(FB_URL+'/'+FB_ROOM+'/d/'+fbDev()+'.json',{method:'PUT',body:body})
      .then(function(r){
        if(r.ok){ FBER=0; S.lastShare=now(); FBAT=now(); save0(); fbSet('on'); }
        else fbSet('err');
      })
      .catch(function(){ fbSet('err'); });
  },1800);
}
/* 受け取り。相手が置いた瞬間に流れてくる */
function fbStart(){
  if(!FB_URL||FBES) return;
  try{ FBES=new EventSource(FB_URL+'/'+FB_ROOM+'/d.json'); }
  catch(e){ fbSet('err'); return; }
  FBES.addEventListener('open',function(){ FBER=0; fbSet('on'); fbSend(); });
  FBES.addEventListener('error',function(){
    fbSet('err');
    /* 回線が切れることはある。つなぎ直しは自分でやる。
       ただし間隔は広げていく。切れたままの相手を叩き続けても何も起きない */
    if(FBES){ try{ FBES.close(); }catch(e){} FBES=null; }
    FBER++;
    setTimeout(fbStart, Math.min(60000, 3000*FBER));
  });
  ['put','patch'].forEach(function(k){
    FBES.addEventListener(k,function(ev){
      var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      fbTake(m.path,m.data);
    });
  });
}
/* 古い形で置かれたものを受けるときの手当て。
   空の配列が消えているので、入れ物を作り直してから渡す */
function fbFix(d){
  if(!d) return d;
  ['A','T','V','R','P','D','U','X','M'].forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  (d.T||[]).forEach(function(x){
    if(!Array.isArray(x.log)) x.log=[];
    if(!Array.isArray(x.ack)) x.ack=[]; });
  (d.V||[]).forEach(function(x){
    if(!Array.isArray(x.cuts)) x.cuts=[];
    if(!Array.isArray(x.tags)) x.tags=[]; });
  return d;
}
function fbTake(path,data){
  if(data==null||!S) return;
  var got=[];
  if(path==='/'){
    /* つないだ直後は全員分がまとめて来る */
    Object.keys(data).forEach(function(k){ if(k!==fbDev()&&data[k]) got.push(data[k]); });
  }else{
    var k=(path||'').replace(/^\//,'').split('/')[0];
    if(!k||k===fbDev()) return;
    got.push(data);
  }
  var hit=false;
  FBIN=true;
  try{
    got.forEach(function(x){
      if(!x) return;
      var d=null;
      if(typeof x.j==='string'){ try{ d=JSON.parse(x.j); }catch(e2){ d=null; } }
      else if(x.d) d=fbFix(x.d);   /* 古い形。念のため受けられるようにしておく */
      if(d){ mergeIn(d); hit=true; }
    });
  }catch(e){}
  FBIN=false;
  fbSet('on'); FBAT=now();
  if(hit){ S.gotAt=now(); save0(); render(); }
}

/* ============================================================
   19. 起動
   ============================================================ */
/* ここで落ちると、画面には何も出ないまま終わる。
   保存が壊れていても、初期化して開ける状態までは必ず持っていく */
try{
  load(); render();
  /* つながるのは、画面が出てから。つなぎに手間取っても、
     画面が出ないという事態にはしない */
  setTimeout(fbStart,300);
  if(BROKEN) sheetBroken();
  else if(!me()) sheetAccounts(true);
}catch(e){
  try{ localStorage.removeItem(STORE); }catch(e2){}
  try{ S=null; load(); render(); if(!me()) sheetAccounts(true);
    alert('保存されていた記録を読めなかったため、初期状態で開きました。');
  }catch(e3){
    document.body.innerHTML='<div style="padding:28px;font-family:system-ui;line-height:1.9">'+
      '<b>画面を開けませんでした。</b><br>お手数ですが、この画面をいったん閉じて開き直してください。</div>';
  }
}
})();
</script>

<script>
(function(){
  /* 合言葉は形を変えて持つ。読めば分かるところに、そのまま書かない */
  function fnv(t){ var h=0x811c9dc5;
    for(var i=0;i<t.length;i++){ h^=t.charCodeAt(i);
      h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; }
    return h>>>0; }
  var KEY='jltGateOK', H=4274414375;
  var g=document.getElementById('gate'), inp=document.getElementById('gatePin'),
      go=document.getElementById('gateGo'), ng=document.getElementById('gateNg');
  function open_(){
    g.hidden=true;
    document.documentElement.style.overflow='';
    try{ localStorage.setItem(KEY,'1'); }catch(e){}
  }
  var ok=false; try{ ok=localStorage.getItem(KEY)==='1'; }catch(e){}
  if(ok){ open_(); return; }
  /* 覆っている間は、後ろが動かないようにする */
  document.documentElement.style.overflow='hidden';
  function tryIt(){
    var v=(inp.value||'').trim();
    if(!v){ inp.focus(); return; }
    if(fnv(v)===H){ open_(); return; }
    ng.textContent='合言葉が違います。日本チームに確認してください。';
    inp.value=''; inp.focus();
  }
  go.addEventListener('click',tryIt);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') tryIt(); });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },120);
})();
</script>
