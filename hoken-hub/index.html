<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>保険ツール管理センター｜株式会社Office-M</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b3f5e'/%3E%3Cpath d='M32 13.5 17 19.2v10.3c0 9.3 6.4 17.1 15 20 8.6-2.9 15-10.7 15-20V19.2Z' fill='%23f0846a'/%3E%3Cpath d='m25 32 5 5 10-10' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   保険ツール管理センター
   ・管理画面（社内用）と、共有ゲート（お客様用 #s=... ）の2モードを1ファイルに収めている
   ・配色は各保険チェックツールと共通（ネイビー＋クリーム＋コーラル）
   ============================================================ */
:root{
  --navy:#1b3f5e; --navy-2:#27587f; --navy-soft:#eaf1f7;
  --bg:#fff8f2; --white:#fff; --text:#33404d; --muted:#5c6874; --line:#efe2d8;
  --shadow:0 6px 20px rgba(130,100,80,.09); --shadow-sm:0 3px 10px rgba(130,100,80,.07);
  --coral:#f0846a;            /* 装飾専用（帯・アイコン地）。文字は載せない */
  --coral-btn:#bf4123; --coral-btn-h:#aa391f;  /* 白文字を載せるボタン地色 */
  --coral-text:#bd4523; --coral-bg:#fdeee9; --coral-border:#f4d0c6;
  --green:#2c7a4b; --green-bg:#e8f6ef; --green-border:#c3e5d3;
  --amber:#966417; --amber-bg:#fdf3e2; --amber-border:#f2dcae;
  --sky:#24729f; --sky-bg:#e8f4fb; --sky-border:#c6e2f2;
  --berry:#8f4574; --berry-bg:#fbeef6; --berry-border:#eed2e2;
  --red:#c2453f; --red-bg:#fdeee9;

  /* 文字サイズ：7段階に統一（最小13px。従来は10.9〜24pxが18種類に散っていた） */
  --fs-xs:.8125rem; --fs-sm:.9rem; --fs-base:1rem; --fs-md:1.125rem;
  --fs-lg:1.35rem; --fs-xl:1.6rem; --fs-2xl:1.9rem;
  /* 行間：日本語は欧文より広めに取る。密度の要る管理UIは base、読ませる文章は prose */
  --lh-tight:1.5; --lh-base:1.75; --lh-prose:1.95;
  /* 余白：4pxグリッド */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"游明朝体","MS PMincho",serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
/* 左右の余白が広い画面ほど文字を大きくして見やすさに還元する（各保険ツール本体と同じ扱い） */
html{-webkit-text-size-adjust:100%;font-size:16px;}
@media(min-width:640px){ html{font-size:16.5px;} }
@media(min-width:1100px){ html{font-size:17px;} }
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",sans-serif;
  color:var(--text); background:var(--bg);
  font-size:var(--fs-base); line-height:var(--lh-base);
  overflow-wrap:break-word; padding-bottom:60px;
}
/* インラインSVGアイコンの既定サイズ。個別指定（.btn svg など）が優先される */
svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--navy-2);}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px;}
.hide{display:none !important;}

/* ---------- ヘッダー（各保険ツールと同じ、やわらかいグラデーション） ---------- */
.topbar{background:linear-gradient(168deg,#fbe6e6 0%,#fdf1ea 46%,#ddf0fb 100%);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.topbar .wrap{display:flex;align-items:center;gap:var(--sp-4);min-height:74px;flex-wrap:wrap;padding:var(--sp-3) 16px;}
.tb-brand{display:flex;align-items:center;gap:var(--sp-3);color:var(--navy);}
.tb-brand .tb-art{width:46px;height:46px;flex:none;}
.tb-brand .tb-art svg{width:46px;height:46px;}
.tb-brand b{display:block;font-family:var(--mincho);font-size:var(--fs-lg);letter-spacing:.06em;font-weight:600;line-height:1.35;}
.tb-brand small{display:block;font-size:var(--fs-xs);color:var(--muted);letter-spacing:.02em;line-height:1.5;}
.tb-actions{margin-left:auto;display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);border:1px solid #e3d3c6;
  color:var(--navy);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:var(--fs-sm);font-weight:700;transition:.15s;}
.tb-btn:hover{background:#fff;border-color:#cfe0ec;}
.tb-btn svg{width:16px;height:16px;}

/* ---------- セクション見出し ---------- */
.sec{margin-top:var(--sp-8);scroll-margin-top:90px;}
.sec-head{margin-bottom:var(--sp-4);}
.sec-head h2{font-family:var(--mincho);font-size:var(--fs-xl);color:var(--navy);letter-spacing:.06em;font-weight:600;
  display:inline-block;padding-bottom:5px;border-bottom:4px solid var(--coral);border-radius:2px;}
.sec-head p{font-size:var(--fs-sm);color:var(--muted);max-width:40em;margin-top:var(--sp-2);}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;
  padding:13px 24px;cursor:pointer;font-size:var(--fs-base);font-weight:700;letter-spacing:.03em;transition:.15s;text-decoration:none;}
.btn svg{width:17px;height:17px;}
.btn-primary{background:var(--coral-btn);color:#fff;box-shadow:0 4px 12px rgba(176,60,26,.26);}
.btn-primary:hover{background:var(--coral-btn-h);transform:translateY(-1px);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:#16344e;}
.btn-ghost{background:var(--white);color:var(--navy);border:1px solid #cfe0ec;}
.btn-ghost:hover{background:var(--navy-soft);}
.btn-sm{padding:8px 16px;font-size:var(--fs-sm);}
.btn-sm svg{width:14px;height:14px;}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none;}

/* ---------- 分野の選択（1段目） ---------- */
.cat-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:var(--sp-4);}
.cat-card{border-radius:24px;padding:var(--sp-8) var(--sp-5);text-align:center;cursor:pointer;
  border:2px solid transparent;transition:.16s;display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.cat-life{background:linear-gradient(160deg,#fdeee9 0%,#fff8f2 75%);border-color:#f4d0c6;}
.cat-sonpo{background:linear-gradient(160deg,#e8f4fb 0%,#fff8f2 75%);border-color:#c6e2f2;}
.cat-plan{background:linear-gradient(160deg,#e8f6ef 0%,#fff8f2 75%);border-color:#c3e5d3;}
.cat-card .c-art{width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;flex:none;}
.cat-card .c-art svg{width:70px;height:70px;}
.cat-card h3{font-family:var(--mincho);font-size:var(--fs-xl);color:var(--navy);letter-spacing:.05em;font-weight:600;}
.cat-card .c-n{font-size:var(--fs-sm);color:var(--muted);}
.cat-all{text-align:center;margin-top:var(--sp-5);}
.cat-all button{background:none;border:none;cursor:pointer;color:var(--navy-2);font-size:var(--fs-sm);
  text-decoration:underline;padding:11px 16px;min-height:44px;}

/* ---------- 選んだ分野の見出し（2段目） ---------- */
.back-bar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);}
.back-btn{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);
  border-radius:999px;padding:11px 18px;font-size:var(--fs-sm);font-weight:700;color:var(--navy);cursor:pointer;transition:.15s;}
.back-btn:hover{border-color:#cfe0ec;background:var(--navy-soft);}
.back-btn svg{width:15px;height:15px;}
.now-cat{display:inline-flex;align-items:center;gap:9px;font-family:var(--mincho);font-size:var(--fs-lg);
  color:var(--navy);letter-spacing:.06em;}
.now-cat .n-art{width:38px;height:38px;} .now-cat .n-art svg{width:38px;height:38px;}

/* ---------- ツール一覧 ---------- */
.filters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4);}
.filter{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:9px 18px;
  font-size:var(--fs-sm);cursor:pointer;color:var(--muted);font-weight:700;transition:.15s;}
.filter:hover{border-color:#cfe0ec;}
.filter.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-4);}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:var(--sp-5);
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;text-align:center;
  cursor:pointer;transition:.16s;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:5px;}
.c-life.card::after{background:var(--coral);}
.c-sonpo.card::after{background:#6bb3d9;}
.c-plan.card::after{background:var(--mint);}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#e3d3c6;}
.card-art{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:var(--sp-2) 0 var(--sp-3);flex:none;}
.card-art svg{width:58px;height:58px;}
.c-life .card-art{background:var(--coral-bg);}
.c-sonpo .card-art{background:var(--sky-bg);}
.c-plan .card-art{background:var(--green-bg);}
.card h3{font-family:var(--mincho);font-size:var(--fs-md);color:var(--navy);line-height:1.55;letter-spacing:.03em;font-weight:600;}
.card .owner{font-size:var(--fs-xs);color:var(--muted);margin-top:4px;}
.card .desc{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-base);flex:1;margin:var(--sp-3) 0;text-align:left;}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);width:100%;
  padding-top:var(--sp-3);border-top:1px dashed var(--line);}
.card-open{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:700;color:var(--coral-text);}
.c-sonpo .card-open{color:var(--sky);} .c-plan .card-open{color:var(--green);}
.card-open svg{width:15px;height:15px;}
.card.pending .card-art{opacity:.45;}
.card.pending h3{color:var(--muted);}
.card-pending{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:700;color:var(--amber);}
.card-pending svg{width:15px;height:15px;}
.badge{display:inline-block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;border-radius:999px;padding:4px 11px;}
.b-life{background:var(--coral-bg);color:var(--coral-text);}
.b-sonpo{background:var(--sky-bg);color:var(--sky);}
.b-plan{background:var(--green-bg);color:var(--green);}
.b-ok{background:var(--green-bg);color:var(--green);} .b-ng{background:var(--amber-bg);color:var(--amber);}

/* ---------- 発行した共有リンク（表ではなくカードの並びにする） ---------- */
.link-list{display:flex;flex-direction:column;gap:var(--sp-3);}
.link-row{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:var(--sp-4);
  display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.link-row .l-art{width:48px;height:48px;flex:none;}
.link-row .l-art svg{width:48px;height:48px;}
.link-row .l-main{flex:1 1 240px;min-width:0;}
.link-row .l-nm{font-family:var(--mincho);font-weight:600;color:var(--navy);font-size:var(--fs-base);letter-spacing:.03em;}
.link-row .l-meta{font-size:var(--fs-xs);color:var(--muted);margin-top:3px;}
.link-row .acts{display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.remain{display:inline-block;font-weight:700;font-size:var(--fs-sm);border-radius:999px;padding:5px 14px;white-space:nowrap;}
.remain.ok{background:var(--green-bg);color:var(--green);}
.remain.warn{background:var(--amber-bg);color:var(--amber);}
.remain.dead{background:var(--red-bg);color:var(--red);}
.empty{background:var(--white);border:2px dashed var(--line);border-radius:20px;padding:var(--sp-8);
  text-align:center;color:var(--muted);font-size:var(--fs-base);}
.empty .e-art{width:64px;height:64px;margin:0 auto var(--sp-3);opacity:.75;}
.empty .e-art svg{width:64px;height:64px;}

/* ---------- 設定のURL一覧 ---------- */
.url-list{display:flex;flex-direction:column;gap:var(--sp-3);}
.url-item{display:flex;align-items:center;gap:var(--sp-3);}
.url-item .u-art{width:36px;height:36px;flex:none;}
.url-item .u-art svg{width:36px;height:36px;}
.url-item .u-body{flex:1;min-width:0;}
.url-item .u-nm{font-size:var(--fs-xs);color:var(--navy);font-weight:700;margin-bottom:3px;}
.url-item input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:var(--fs-sm);background:#fdfaf6;}
.url-item input:focus{outline:2px solid var(--navy-2);outline-offset:-1px;background:#fff;}
.url-item .saved{font-size:var(--fs-xs);color:var(--green);opacity:0;transition:opacity .2s;white-space:nowrap;}
.url-item .saved.on{opacity:1;}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;background:rgba(27,63,94,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto;}
.modal-box{background:var(--white);border-radius:16px;max-width:620px;width:100%;box-shadow:0 18px 50px rgba(27,63,94,.3);margin:auto;}
.modal-box.wide{max-width:780px;}
.modal-head{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--mincho);font-size:var(--fs-lg);color:var(--navy);letter-spacing:.04em;flex:1;}
.modal-body{padding:19px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;}
.x-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;line-height:0;}
.x-btn:hover{background:var(--navy-soft);}
.x-btn svg{width:19px;height:19px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--navy);margin-bottom:5px;letter-spacing:.03em;}
.field .hint{font-size:var(--fs-xs);color:var(--muted);margin-top:4px;line-height:var(--lh-base);max-width:40em;}
.field input[type=text],.field input[type=email],.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:var(--fs-base);background:#fdfaf6;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-2);outline-offset:-1px;background:#fff;}
.field textarea{min-height:120px;line-height:var(--lh-base);resize:vertical;font-size:var(--fs-sm);}
.radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-row label{display:inline-flex;align-items:center;gap:6px;background:#fdfaf6;border:1px solid var(--line);
  border-radius:9px;padding:8px 14px;cursor:pointer;font-size:var(--fs-sm);font-weight:400;color:var(--text);margin:0;}
.radio-row label.on{background:var(--navy-soft);border-color:#9cc2dc;font-weight:700;color:var(--navy);}
.radio-row input{accent-color:var(--navy);}
.note{border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);line-height:var(--lh-prose);max-width:40em;}
.note-amber{background:var(--amber-bg);border:1px solid var(--amber-border);color:#7d5413;}
.note-sky{background:var(--sky-bg);border:1px solid var(--sky-border);color:#1c5b7f;}
.note-green{background:var(--green-bg);border:1px solid var(--green-border);color:#215c39;}
.share-url{display:flex;gap:8px;align-items:stretch;}
.share-url input{flex:1;font-size:var(--fs-sm);font-family:ui-monospace,Menlo,Consolas,monospace;}
.qr-box{text-align:center;padding:14px;background:#fdfaf6;border:1px solid var(--line);border-radius:12px;}
.qr-box svg{width:190px;height:190px;background:#fff;border-radius:8px;}
.qr-box p{font-size:var(--fs-xs);color:var(--muted);margin-top:7px;}
.help h4{font-family:var(--mincho);color:var(--navy);font-size:var(--fs-md);margin:18px 0 6px;letter-spacing:.04em;}
.help h4:first-child{margin-top:0;}
.help p,.help li{font-size:var(--fs-sm);line-height:var(--lh-prose);color:var(--text);max-width:40em;}
.help ul,.help ol{padding-left:1.35em;margin:5px 0;}
.help code{background:var(--navy-soft);padding:1px 6px;border-radius:5px;font-size:var(--fs-sm);font-family:ui-monospace,Menlo,Consolas,monospace;}

/* ---------- パスワード画面（社内用） ---------- */
#lock{min-height:100vh;background:linear-gradient(168deg,#fbe6e6 0%,#fdf1ea 46%,#ddf0fb 100%);
  display:flex;align-items:center;justify-content:center;padding:24px 14px;}
.lock-card{background:var(--white);border-radius:20px;box-shadow:0 12px 40px rgba(130,100,80,.16);
  padding:34px 30px;max-width:400px;width:100%;text-align:center;}
.lock-card .l-ico{width:60px;height:60px;border-radius:50%;background:var(--navy-soft);color:var(--navy);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.lock-card .l-ico svg{width:29px;height:29px;}
.lock-card h1{font-family:var(--mincho);font-size:var(--fs-xl);color:var(--navy);letter-spacing:.05em;line-height:var(--lh-tight);}
.lock-card .l-lead{font-size:var(--fs-sm);color:var(--muted);margin:6px 0 20px;}
.lock-card input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-size:var(--fs-md);background:#fdfaf6;text-align:center;letter-spacing:.14em;}
.lock-card input[type=password]:focus{outline:3px solid var(--navy-2);outline-offset:-1px;background:#fff;}
.lock-card .l-err{min-height:22px;font-size:var(--fs-sm);color:var(--red);margin-top:7px;}
.lock-card .l-remember{display:flex;align-items:center;justify-content:center;gap:7px;font-size:var(--fs-sm);
  color:var(--muted);margin-bottom:16px;cursor:pointer;}
.lock-card .l-remember input{accent-color:var(--navy);width:24px;height:24px;}  /* SC 2.5.8：チェックボックス自体も24px確保する */
.lock-card button{width:100%;padding:12px;font-size:var(--fs-base);}
.lock-card .l-note{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-prose);margin-top:18px;padding-top:15px;border-top:1px solid var(--line);}

/* ---------- 共有ゲート（お客様側） ---------- */
#gate{min-height:100vh;background:linear-gradient(168deg,#fbe6e6 0%,#fdf1ea 46%,#ddf0fb 100%);padding:0 0 40px;}
#gate.framed{background:var(--bg);padding:0;display:flex;flex-direction:column;height:100vh;}
.gate-bar{background:var(--navy);color:#fff;padding:10px 0;}
.gate-bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gate-bar .g-brand{display:flex;align-items:center;gap:8px;font-size:var(--fs-base);font-weight:700;letter-spacing:.04em;}
.gate-bar .g-brand svg{width:20px;height:20px;}
.gate-bar .g-exp{margin-left:auto;font-size:var(--fs-sm);background:rgba(255,255,255,.14);border-radius:999px;padding:4px 13px;}
.gate-card{max-width:640px;margin:38px auto;background:var(--white);border-radius:20px;box-shadow:0 12px 40px rgba(130,100,80,.16);
  padding:34px 30px;text-align:center;}
.gate-card .g-ico{width:66px;height:66px;border-radius:50%;background:var(--coral-bg);color:var(--coral-text);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.gate-card .g-ico svg{width:33px;height:33px;}
.gate-card.expired .g-ico{background:var(--amber-bg);color:var(--amber);}
.gate-card.error .g-ico{background:var(--red-bg);color:var(--red);}
.gate-card .g-to{font-size:var(--fs-base);color:var(--muted);letter-spacing:.06em;}

var SECRET = 'officem-hoken-hub-2026';

function fnv1a(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h >>> 0;
}
function keyStream(len, seed) {
  var out = new Uint8Array(len), x = seed >>> 0 || 1;
  for (var i = 0; i < len; i++) {
    x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0;
    out[i] = x & 0xff;
  }
  return out;

function b64urlEnc(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);

function b64urlDec(str) {
  var s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

  var json = JSON.stringify(obj);
  var body = new TextEncoder().encode(json);
  var sum = fnv1a(json + SECRET);

  buf[0] = (sum >>> 24) & 0xff; buf[1] = (sum >>> 16) & 0xff; buf[2] = (sum >>> 8) & 0xff; buf[3] = sum & 0xff;
  buf.set(body, 4);
  var ks = keyStream(buf.length, fnv1a(SECRET));
  for (var i = 0; i < buf.length; i++) buf[i] ^= ks[i];
  return b64urlEnc(buf);
}
function unpack(str) {
  try {
    var buf = b64urlDec(str);
    var ks = keyStream(buf.length, fnv1a(SECRET));
    for (var i = 0; i < buf.length; i++) buf[i] ^= ks[i];

    if (fnv1a(json + SECRET) !== (sum >>> 0)) return null;
    return JSON.parse(json);
  } catch (e) { return null; }

/* ============================================================
   6. モーダル
   ============================================================ */
function modal(title, bodyHtml, footHtml, wide) {
  var root = document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal" id="mOverlay"><div class="modal-box' + (wide ? ' wide' : '') + '">' +
      '<div class="modal-head"><h3>' + title + '</h3><button class="x-btn" id="mClose" aria-label="閉じる">' + ICO.close + '</button></div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '') +
    '</div></div>';
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mOverlay').onclick = function (e) { if (e.target.id === 'mOverlay') closeModal(); };
  [].forEach.call(root.querySelectorAll('[data-mclose]'), function (b) { b.onclick = closeModal; });
  document.addEventListener('keydown', escClose);
  return root;
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

/* ---------- 共有リンクの作成 ---------- */
function openShare(toolId) {
  var t = tool(toolId);
  if (!toolUrl(t)) {
    modal('公開URLが未登録です',
      '<div class="note note-amber">' + ICO.warn + ' <b>「' + esc(t.name) + '」の公開URLがまだ登録されていません。</b><br>' +
      '共有リンクは「インターネット上に公開されたツールのURL」を包んで作るしくみのため、先に公開URLの登録が必要です。' +
      'ツール一覧のカードにあるURL欄に貼り付けて保存してください（例: <code>https://○○○.github.io/△△△/</code>）。</div>',
      '<button class="btn btn-ghost" data-mclose>閉じる</button>');
    return;
  }
  if (!shareBase()) {
    modal('先に「共有ページのURL」を設定してください',
      '<div class="note note-amber">' + ICO.warn + ' <b>この管理画面自体の公開URLが未設定です。</b><br>' +
      '共有リンクはこの管理画面（＝閲覧期限を判定するページ）を経由します。設定画面で、この管理画面を公開した先のURLを登録してください。<br>' +
      'まだどこにも公開していない場合は、このHTMLを <code>index.html</code> という名前で GitHub Pages や Netlify にアップロードしてから、そのURLを登録してください。</div>',
      '<button class="btn btn-navy" id="toSettings">設定を開く</button>');
    document.getElementById('toSettings').onclick = function () { closeModal(); openSettings(); };
    return;
  }
  modal('共有リンクを作る',
    '<div class="note note-sky" style="margin-bottom:16px;">' + ICO.clock + ' 共有先：<b>' + esc(t.name) + '</b><br>' +
      'お渡ししたリンクは<b>発行から最大1週間</b>で開けなくなります。</div>' +
    '<div class="field"><label>お客様のお名前（任意）</label>' +
      '<input type="text" id="shName" placeholder="例：山田" autocomplete="off">' +
      '<div class="hint">共有ページに「山田 様へ」と表示されます。空欄でもかまいません。</div></div>' +
    '<div class="field"><label>閲覧できる期間</label><div class="radio-row" id="shDays">' +
      '<label><input type="radio" name="d" value="1">1日</label>' +
      '<label><input type="radio" name="d" value="3">3日</label>' +
      '<label class="on"><input type="radio" name="d" value="7" checked>7日（既定）</label>' +
    '</div><div class="hint">1週間を超える期間は設定できません。</div></div>',
    '<button class="btn btn-ghost" id="shCancel">やめる</button><button class="btn btn-primary" id="shGo">' + ICO.link + 'リンクを作成</button>');

  var box = document.getElementById('shDays');
  box.onclick = function (e) {
    var lb = e.target.closest('label'); if (!lb) return;
    [].forEach.call(box.querySelectorAll('label'), function (l) { l.classList.remove('on'); });
    lb.classList.add('on'); lb.querySelector('input').checked = true;
  };
  document.getElementById('shCancel').onclick = closeModal;
  document.getElementById('shGo').onclick = function () {
    var days = box.querySelector('input:checked').value;
    var rec = makeShare(toolId, days, document.getElementById('shName').value.trim());
    showShareResult(rec);
    renderLinks();
  };
}

function shareMessage(rec) {
  var t = tool(rec.t), s = state.settings;
  return (rec.n ? rec.n + ' 様\n\n' : '') +
    'お世話になっております。' + s.office + 'です。\n' +
    '先日お話ししました「' + t.name + '」のページをお送りします。\n\n' +
    rec.url + '\n\n' +
    '※ こちらのリンクは ' + fmtDateTime(rec.exp) + ' まで有効です。\n' +
    '　 期限を過ぎた場合や、うまく開けない場合は、お手数ですがご連絡ください。\n\n' +
    s.office + '\n' + s.contact;
}

function showShareResult(rec) {
  var t = tool(rec.t);
  var qr = QRGen.create(rec.url, 'M');
  modal('共有リンクができました',
    '<div class="note note-green" style="margin-bottom:16px;">' + ICO.shield + ' <b>' + esc(t.name) + '</b><br>' +
      (rec.n ? esc(rec.n) + ' 様へ／' : '') + '有効期限：<b>' + fmtDateTime(rec.exp) + '</b>まで（あと' + daysLeft(rec.exp) + '日）</div>' +
    '<div class="field"><label>共有リンク</label><div class="share-url">' +
      '<input type="text" id="shUrl" readonly value="' + esc(rec.url) + '">' +
      '<button class="btn btn-navy btn-sm" id="shCopy">' + ICO.copy + 'コピー</button></div></div>' +
    '<div class="field"><label>そのまま送れる文面</label>' +
      '<textarea id="shMsg" readonly>' + esc(shareMessage(rec)) + '</textarea>' +
      '<div class="hint">メール・LINE・SMSにそのまま貼り付けてお使いいただけます。</div></div>' +
    (qr ? '<div class="qr-box">' + QRGen.toSvg(qr) + '<p>その場でお客様のスマートフォンから読み取っていただけます</p></div>'
        : '<div class="note note-amber">リンクが長すぎるためQRコードは作成できませんでした。</div>'),
    '<button class="btn btn-ghost btn-sm" id="shCopyMsg">' + ICO.copy + '文面をコピー</button>' +
    '<button class="btn btn-ghost btn-sm" id="shMail">' + ICO.mail + 'メールで送る</button>' +
    '<button class="btn btn-ghost btn-sm" id="shLine">LINEで送る</button>' +
    '<button class="btn btn-navy btn-sm" id="shPreview">' + ICO.open + '開いて確認</button>', true);

  document.getElementById('shCopy').onclick = function () { copyText(rec.url); };
  document.getElementById('shCopyMsg').onclick = function () { copyText(shareMessage(rec)); };
  document.getElementById('shMail').onclick = function () {
    var subj = '【' + state.settings.office + '】' + tool(rec.t).name;
    location.href = 'mailto:?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(shareMessage(rec));
  };
  document.getElementById('shLine').onclick = function () {
    window.open('https://line.me/R/msg/text/?' + encodeURIComponent(shareMessage(rec)), '_blank', 'noopener');
  };
  document.getElementById('shPreview').onclick = function () { window.open(rec.url, '_blank', 'noopener'); };
  document.getElementById('shUrl').onclick = function () { this.select(); };
}

/* ---------- 設定 ---------- */
function openSettingsFor(t) { openSettings(); }
function openSettings() {
  var s = state.settings;
  var guess = (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin + location.pathname : '';
  modal('設定',
    '<div class="field"><label>この管理画面を公開したURL（共有リンクの土台）</label>' +
      '<input type="text" id="stBase" placeholder="https://○○○.github.io/hoken-hub/" value="' + esc(s.base) + '">' +
      '<div class="hint">共有リンクは「このURL＋#s=…」の形で発行されます。' +
      (guess ? '空欄のままなら、いま開いているURL（<code>' + esc(guess) + '</code>）を使います。' : 'いまは手元のファイルとして開いているため、公開URLの登録が必要です。') +
      '</div></div>' +
    '<div class="field"><label>差出人の名前（共有ページに表示されます）</label>' +
      '<input type="text" id="stOffice" value="' + esc(s.office) + '"></div>' +
    '<div class="field"><label>連絡先（期限切れのときの再発行のご案内に使います）</label>' +
      '<input type="text" id="stContact" value="' + esc(s.contact) + '"></div>' +
    '<div class="field"><label>各ツールの公開URL</label>' +
      '<div class="url-list">' +
      TOOLS.map(function (t) {
        var u = toolUrl(t);
        return '<div class="url-item">' +
          '<span class="u-art">' + (TOOL_ART[t.id] || '') + '</span>' +
          '<span class="u-body"><span class="u-nm">' + esc(t.short) +
            ' <span class="badge ' + (u ? 'b-ok">登録済み' : 'b-ng">未登録') + '</span></span>' +
            '<input type="text" data-url="' + t.id + '" value="' + esc(u) + '" ' +
            'placeholder="https://…（公開したらここに貼り付け）" spellcheck="false"></span>' +
          '<span class="saved" data-saved="' + t.id + '">保存</span>' +
        '</div>';
      }).join('') +
      '</div><div class="hint">入力するとその場で保存されます。ここに入れたURLが、共有リンクの中身になります。</div></div>' +
    '<div class="note note-sky">' + ICO.warn + ' 登録したURLや発行済みリンクは<b>この端末のブラウザだけ</b>に保存されます。別のパソコンでも同じ設定を使いたいときは、下の「設定を書き出す」で保存したファイルを、その端末で読み込んでください。</div>',
    '<button class="btn btn-ghost btn-sm" id="stExport">設定を書き出す</button>' +
    '<button class="btn btn-ghost btn-sm" id="stImport">設定を読み込む</button>' +
    '<button class="btn btn-primary" id="stSave">保存する</button>', true);

  document.getElementById('stSave').onclick = function () {
    var b = document.getElementById('stBase').value.trim();
    if (b && !/^https?:\/\//.test(b)) { toast('URLは https:// から始めてください'); return; }
    if (b && b.indexOf('#') >= 0) b = b.split('#')[0];
    s.base = b;
    s.office = document.getElementById('stOffice').value.trim() || '株式会社Office-M';
    s.contact = document.getElementById('stContact').value.trim();
    save(); closeModal(); renderAll(); toast('保存しました');
  };
  document.getElementById('stExport').onclick = function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '保険ツール管理画面_設定.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  };
  document.getElementById('stImport').onclick = function () {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          if (o.urls) state.urls = o.urls;
          if (o.links) state.links = o.links;
          if (o.settings) for (var k in o.settings) state.settings[k] = o.settings[k];
          save(); closeModal(); renderAll(); toast('設定を読み込みました');
        } catch (e) { toast('読み込めませんでした'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };
}

    '<div class="help">' +
    '<h4>0. パスワードについて</h4>' +
    '<p>この管理画面を開くときにパスワードを入力します。「この端末では30日間、次回から省略する」にチェックを入れておけば、次からはそのまま開きます。' +
    '共有のパソコンで使ったときや、他の方に画面を見られたくないときは、右上の<b>「ロックする」</b>で記憶を消せます。' +
    '<b>お客様にお渡しした共有リンクにはパスワードはかかりません</b>（お客様には期限つきの閲覧ページだけが表示されます）。</p>' +
    '<div class="note note-amber">' + ICO.warn + ' パスワードの確認もブラウザの中で行っています。' +
    'HTMLの中にパスワードそのものは書いていませんが、<b>技術に詳しい方であれば回避できる程度のもの</b>とお考えください。' +
    'お客様情報など、外に出て困る内容はこの画面に入力しないでください。</div>' +
    '<h4>1. まずやること：公開URLの登録</h4>' +
    '<p>各ツールを GitHub Pages や tiiny.site などに公開したら、そのURLを「ツール一覧」のカードにあるURL欄に貼り付けてください。入力するとその場で保存されます。<b>公開URLを登録したツールだけ、共有リンクを発行できます。</b></p>' +
    '<h4>2. 提案のとき</h4>' +
    '<p>ツール一覧の<b>カードをクリック</b>すると、そのツールが開きます。手元のパソコンでこのファイルを直接開いている場合は同じフォルダにあるHTMLを、インターネット上で開いている場合は登録した公開URLを開きます。</p>' +
    '<h4>3. お客様への共有（1週間で見られなくなります）</h4>' +
    '<ol>' +
      '<li>「共有リンクを作る」を押し、お名前と期間（最長7日）を選びます</li>' +
      '<li>できたリンクを、コピー・メール・LINE・QRコードのいずれかでお渡しします</li>' +
      '<li>期限を過ぎると、リンクを開いても「有効期限が切れました」という案内だけが表示されます</li>' +
    '</ol>' +
    '<h4>4. この管理画面自体も公開が必要です</h4>' +
    '<p>共有リンクは <code>https://…/#s=…</code> の形で、<b>この管理画面のURL</b>を土台にします。' +
    'このHTMLを <code>index.html</code> という名前でGitHub PagesやNetlifyにアップロードし、そのURLを「設定」に登録してください。' +
    'お客様がリンクを開くと管理画面ではなく、期限を確認する共有ページだけが表示されます。</p>' +
    '<h4>5. 閲覧期限について（正直なところ）</h4>' +
    '<div class="note note-amber">' + ICO.warn + ' このしくみは<b>サーバーを持たない（費用ゼロの）構成</b>のため、期限の判定はお客様のブラウザの中で行っています。' +
    'リンクの中身は書き換え検知が付いているので、期限だけを後ろにずらすことはできません。ただし、' +
    '<b>お客様がツールのページを直接ブックマークした場合や、パソコンの日付を変更した場合には、期限後もご覧になれてしまいます。</b>' +
    '「そっと見られなくする」ための機能であり、機密情報の保護には使えません。厳密な期限管理が必要な場合はご相談ください。</div>' +
    '<h4>6. 発行したリンクを期限前に止めたいとき</h4>' +
    '<p>公開先のフォルダ（この管理画面と同じ場所）に <code>hoken-share-revoked.json</code> というファイルを置き、止めたいリンクのIDを次のように書いてアップロードすると、そのリンクは開けなくなります。IDは「発行した共有リンク」の一覧に表示されています。</p>' +
    '<p><code>["abc123xy", "def456zw"]</code></p>' +
    '<h4>7. 設定の保管</h4>' +
    '<p>登録したURLと発行履歴は、いまお使いの端末のブラウザに保存されます。パソコンを変えるときや、念のためのバックアップには「設定 → 設定を書き出す」をお使いください。</p>' +
    '</div>',
    '<button class="btn btn-navy" data-mclose>閉じる</button>', true);
}

/* ============================================================
   7. 管理画面の描画
   ============================================================ */
/* 分野を選んでから、その中のツールを選ぶ。null のあいだは分野の選択画面 */
var curCat = null;
var CAT_ART = { life: 'seimei', sonpo: 'jidousha', plan: 'lifeplan' };
var CAT_NOTE = {
  life: '医療・死亡・介護・相続・法人',
  sonpo: '自動車・火災',
  plan: '住宅・教育・老後の見える化'
};

function catCount(id) { return TOOLS.filter(function (t) { return t.cat === id; }).length; }

function renderCats() {
  var head = document.getElementById('toolHead');
  var pick = document.getElementById('catPick');
  var back = document.getElementById('backBar');
  if (curCat) {
    var c = CATS.filter(function (x) { return x.id === curCat; })[0];
    head.innerHTML = '';
    pick.innerHTML = '';
    back.innerHTML = '<div class="back-bar">' +
      '<button class="back-btn" id="btnBackCat">' + ICO.back + '分野を選び直す</button>' +
      '<span class="now-cat"><span class="n-art">' + (TOOL_ART[CAT_ART[curCat]] || '') + '</span>' +
      (c ? esc(c.label) : '') + '（' + (curCat === 'all' ? TOOLS.length : catCount(curCat)) + '件）</span>' +
      '</div>';
    var bb = document.getElementById('btnBackCat');
    if (bb) bb.onclick = function () { curCat = null; renderCats(); renderTools(); };
    return;
  }
  head.innerHTML = '<h2>どの分野をお使いですか</h2>' +
    '<p>分野を選ぶと、その中のツールが並びます。カードをクリックすればそのまま開きます。</p>';
  back.innerHTML = '<div class="cat-all"><button data-cat="all">分野を分けずに全' + TOOLS.length + '件を見る</button></div>';
  pick.innerHTML = CATS.filter(function (c) { return c.id !== 'all'; }).map(function (c) {
    return '<div class="cat-card cat-' + c.id + '" data-cat="' + c.id + '" tabindex="0" role="button" aria-label="' + esc(c.label) + ' を選ぶ">' +
      '<span class="c-art">' + (TOOL_ART[CAT_ART[c.id]] || '') + '</span>' +
      '<h3>' + esc(c.label) + '</h3>' +
      '<span class="c-n">' + esc(CAT_NOTE[c.id] || '') + '　' + catCount(c.id) + '件</span>' +
    '</div>';
  }).join('');
}

function renderTools() {
  var host = document.getElementById('toolGrid');
  if (!curCat) { host.innerHTML = ''; return; }
  var list = TOOLS.filter(function (t) { return curCat === 'all' || t.cat === curCat; });
  host.innerHTML = list.map(function (t) {
    var ready = !!toolUrl(t) || (location.protocol === 'file:' && t.local);
    return '<div class="card c-' + t.cat + (ready ? '' : ' pending') + '" data-card="' + t.id + '" tabindex="0" role="button" ' +
      'aria-label="' + esc(t.name) + (ready ? ' を開く' : '（準備中）') + '">' +
      '<div class="card-art">' + (TOOL_ART[t.id] || '') + '</div>' +
      '<h3 title="' + esc(t.name) + '">' + esc(t.short) + '</h3>' +
      (t.owner ? '<div class="owner">' + esc(t.owner) + '</div>' : '') +
      '<p class="desc">' + esc(t.desc) + '</p>' +
      '<div class="card-foot">' +
        (ready ? '<span class="card-open">' + ICO.open + '開く</span>'
               : '<span class="card-pending">' + ICO.clock + '準備中</span>') +
        '<button class="btn btn-ghost btn-sm" data-share="' + t.id + '">' + ICO.share + '共有リンク</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderLinks() {
  var host = document.getElementById('linkList');
  if (!state.links.length) {
    host.innerHTML = '<div class="empty"><div class="e-art">' + (TOOL_ART.shibou || '') + '</div>' +
      'まだ共有リンクはありません。<br>ツールのカードにある「共有リンク」からお作りいただけます。</div>';
    return;
  }
  var rows = state.links.map(function (r) {
    var t = tool(r.t), left = daysLeft(r.exp), dead = left <= 0;
    var cls = dead ? 'dead' : (left <= 2 ? 'warn' : 'ok');
    return '<div class="link-row">' +
      '<span class="l-art">' + (TOOL_ART[r.t] || '') + '</span>' +
      '<div class="l-main">' +
        '<div class="l-nm">' + esc(t ? t.short : r.t) + '</div>' +
        '<div class="l-meta">' + (r.n ? esc(r.n) + ' 様へ／' : '') +
          fmtDate(r.iat) + ' 発行　' + fmtDate(r.exp) + ' まで　ID ' + esc(r.k) + '</div>' +
      '</div>' +
      '<span class="remain ' + cls + '">' + (dead ? '期限切れ' : 'あと' + left + '日') + '</span>' +
      '<div class="acts">' +
        '<button class="btn btn-ghost btn-sm" data-lcopy="' + r.k + '">' + ICO.copy + 'コピー</button>' +
        '<button class="btn btn-ghost btn-sm" data-lmsg="' + r.k + '">' + ICO.qr + '文面とQR</button>' +
        '<button class="btn btn-ghost btn-sm" data-ldel="' + r.k + '" aria-label="履歴から削除">' + ICO.trash + '</button>' +
      '</div>' +
    '</div>';
  }).join('');
  var expired = state.links.filter(function (r) { return daysLeft(r.exp) <= 0; }).length;
  host.innerHTML = '<div class="link-list">' + rows + '</div>' +
    (expired ? '<div style="margin-top:14px;text-align:right;"><button class="btn btn-ghost btn-sm" id="clearExpired">' + ICO.trash + '期限切れ' + expired + '件を履歴から消す</button></div>' : '');
  if (expired) document.getElementById('clearExpired').onclick = function () {
    state.links = state.links.filter(function (r) { return daysLeft(r.exp) > 0; });
    save(); renderLinks(); toast('期限切れの履歴を消しました');
  };
}

function renderWarn() {
  var host = document.getElementById('setupWarn');
  var noUrl = TOOLS.filter(function (t) { return !toolUrl(t); }).length;
  var msgs = [];
  if (!shareBase()) msgs.push('この管理画面の公開URLが未設定です。共有リンクを発行するには「設定」で登録してください。');
  if (noUrl) msgs.push('公開URLが未登録のツールが ' + noUrl + ' 件あります。右上の「設定」から登録すると、共有リンクを作れるようになります。');
  host.innerHTML = msgs.length
    ? '<div class="note note-amber" style="margin-top:18px;">' + ICO.warn + ' ' + msgs.map(esc).join('<br>' + ICO.warn + ' ') + '</div>'
    : '';
}

function renderAll() { renderWarn(); renderCats(); renderTools(); renderLinks(); }

/* ---------- 管理画面のイベント ---------- */
function bindAdmin() {
  document.getElementById('btnHelp').onclick = openHelp;
  document.getElementById('btnSettings').onclick = openSettings;
  document.getElementById('btnLock').onclick = function () { forgetAuth(); location.reload(); };

  /* カード全体を押すとツールが開く（中の共有リンクボタンが押されたときは開かない） */
  document.getElementById('admin').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest && e.target.closest('[data-card]');
    if (c && e.target === c) { e.preventDefault(); openTool(c.dataset.card); return; }
    var k = e.target.closest && e.target.closest('[data-cat]');
    if (k && e.target === k) { e.preventDefault(); curCat = k.dataset.cat; renderCats(); renderTools(); }
  });

  document.getElementById('admin').addEventListener('click', function (e) {
    var b = e.target.closest('[data-open],[data-share],[data-cat],[data-lcopy],[data-lmsg],[data-ldel]');
    if (!b) {
      var c = e.target.closest('[data-card]');
      if (c) openTool(c.dataset.card);
      return;
    }
    if (b.dataset.open) openTool(b.dataset.open);
    else if (b.dataset.share) openShare(b.dataset.share);
    else if (b.dataset.cat) { curCat = b.dataset.cat; renderCats(); renderTools(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (b.dataset.lcopy) {
      var r1 = findLink(b.dataset.lcopy);
      if (r1) { if (daysLeft(r1.exp) <= 0) toast('このリンクは期限切れです'); copyText(r1.url); }
    } else if (b.dataset.lmsg) {
      var r2 = findLink(b.dataset.lmsg); if (r2) showShareResult(r2);
    } else if (b.dataset.ldel) {
      state.links = state.links.filter(function (r) { return r.k !== b.dataset.ldel; });
      save(); renderLinks(); toast('履歴から削除しました');
    }
  });

  /* 設定モーダルのURL欄は、入力したその場で保存する */
  document.getElementById('modalRoot').addEventListener('input', function (e) {
    var inp = e.target.closest('[data-url]'); if (!inp) return;
    var id = inp.dataset.url, v = inp.value.trim();
    if (v) state.urls[id] = v; else delete state.urls[id];
    save();
    var flag = document.querySelector('[data-saved="' + id + '"]');
    if (flag) {
      flag.classList.add('on'); clearTimeout(flag._t);
      flag._t = setTimeout(function () { flag.classList.remove('on'); }, 1400);
    }
    clearTimeout(renderAll._t);
    renderAll._t = setTimeout(renderWarn, 600);
  });
}
function findLink(k) { for (var i = 0; i < state.links.length; i++) if (state.links[i].k === k) return state.links[i]; return null; }

/* ============================================================
   8. 共有ゲート（お客様が共有リンクを開いたとき）
   ============================================================ */
function gateShell(inner) { return '<div class="gate-card ' + inner.cls + '">' + inner.html + '</div>'; }

function renderGate(token) {
  var host = document.getElementById('gate');
  host.classList.remove('hide');
  document.getElementById('admin').classList.add('hide');

  var p = unpack(token);
  var office = (p && p.o) || state.settings.office;
  var bar = '<div class="gate-bar"><div class="wrap">' +
    '<span class="g-brand">' + ICO.shield + esc(office) + '</span>' +
    (p && p.e ? '<span class="g-exp">' + ICO.clock + ' ' + fmtDateTime(p.e * 1000) + ' まで閲覧できます</span>' : '') +
    '</div></div>';

  function show(cls, iconHtml, html) {
    host.innerHTML = bar + '<div class="wrap">' + gateShell({ cls: cls, html: '<div class="g-ico">' + iconHtml + '</div>' + html }) + '</div>';
  }
  function foot() {
    var c = (p && p.c) || state.settings.contact;
    return '<div class="g-foot">お心当たりのない場合や、うまく開けない場合は、お手数ですが下記までご連絡ください。<br>' +
      esc(office) + (c ? '　<a href="mailto:' + esc(c) + '">' + esc(c) + '</a>' : '') + '</div>';
  }

  if (!p || !p.u || !p.e) {
    show('error', ICO.warn,
      '<h1>リンクを読み取れませんでした</h1>' +
      '<p class="g-desc">お送りしたリンクが途中で切れている可能性があります。メールやメッセージ内のURLを、最後（末尾の記号まで）すべてコピーしてお試しください。<br>それでも開けない場合は、お手数ですが再発行をご依頼ください。</p>' + foot());
    return;
  }

  var expMs = p.e * 1000;
  if (Date.now() > expMs) {
    show('expired', ICO.clock,
      '<div class="g-to">' + (p.n ? esc(p.n) + ' 様' : '') + '</div>' +
      '<h1>閲覧期限が過ぎました</h1>' +
      '<p class="g-desc">こちらのページは <b>' + fmtDateTime(expMs) + '</b> までの公開でした。<br>' +
      'もう一度ご覧になりたい場合は、お手数ですが下記までご連絡ください。あらためてリンクをお送りします。</p>' + foot());
    return;
  }

  /* 期限前に止めたいリンクがあれば、公開先の hoken-share-revoked.json に ID を追加する運用 */
  var t = tool(p.t), left = Math.max(1, Math.ceil((expMs - Date.now()) / 86400000));
  show('', ICO.shield,
    '<div class="g-to">' + (p.n ? esc(p.n) + ' 様へ' : '') + '</div>' +
    '<h1>' + esc(t ? t.name : 'ご案内資料') + '</h1>' +
    (t ? '<p class="g-desc">' + esc(t.desc) + (t.owner ? '<br><span style="font-size:var(--fs-sm);">作成：' + esc(t.owner) + '</span>' : '') + '</p>' : '') +
    '<div class="gate-meta"><span>' + ICO.clock + ' ' + fmtDateTime(expMs) + ' まで</span><span' + (left <= 2 ? ' class="warn"' : '') + '>あと' + left + '日</span></div>' +
    '<button class="btn btn-primary" id="gOpen" style="font-size:var(--fs-md);padding:16px 34px;">' + ICO.open + 'ページを開く</button>' +
    '<div style="margin-top:14px;font-size:var(--fs-sm);"><a href="#" id="gNew">新しいタブで開く</a></div>' +
    foot());

  var url = p.u;
  document.getElementById('gOpen').onclick = function () { showFrame(url, expMs, office); };
  document.getElementById('gNew').onclick = function (e) { e.preventDefault(); window.open(url, '_blank', 'noopener'); };

  /* 失効リストの確認（ファイルが無ければ何もしない） */
  try {
    fetch('hoken-share-revoked.json', { cache: 'no-store' }).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (list) {
      if (list && list.indexOf && list.indexOf(p.k) >= 0) {
        show('expired', ICO.clock,
          '<h1>このリンクは停止されています</h1>' +
          '<p class="g-desc">恐れ入りますが、こちらのリンクは公開を終了しました。あらためてご覧になりたい場合はご連絡ください。</p>' + foot());
      }
    }).catch(function () {});
  } catch (e) {}
}

function showFrame(url, expMs, office) {
  var host = document.getElementById('gate');
  host.classList.add('framed');
  document.body.style.padding = '0';
  host.innerHTML =
    '<div class="gate-bar"><div class="wrap">' +
      '<span class="g-brand">' + ICO.shield + esc(office) + '</span>' +
      '<span class="g-exp">' + ICO.clock + ' ' + fmtDateTime(expMs) + ' まで</span>' +
    '</div></div>' +
    '<iframe id="gateFrame" src="' + esc(url) + '" title="共有ページ"></iframe>' +
    '<div class="frame-help">うまく表示されない場合は <a href="' + esc(url) + '" target="_blank" rel="noopener">こちらから新しいタブで開いてください</a></div>';
}

/* ============================================================
   9. 起動
   ============================================================ */
function startAdmin() {
  document.getElementById('lock').classList.add('hide');
  document.getElementById('admin').classList.remove('hide');
  if (location.protocol === 'file:') {
    document.getElementById('tbSub').textContent = '手元のフォルダから開いています（ツールは同じフォルダのHTMLを開きます）';
  }
  renderAll();
  bindAdmin();
}

function showLock() {
  var host = document.getElementById('lock');
  host.classList.remove('hide');
  var pass = document.getElementById('lockPass'), err = document.getElementById('lockErr');
  document.getElementById('lockForm').onsubmit = function (e) {
    e.preventDefault();
    var hash = sha256(PASS_SALT + pass.value);
    if (PASS_HASHES.indexOf(hash) >= 0) {
      if (document.getElementById('lockKeep').checked) rememberAuth(hash);
      startAdmin();
    } else {
      err.textContent = 'パスワードが違います。';
      pass.select();
    }
  };
  pass.oninput = function () { err.textContent = ''; };
  pass.focus();
}

load();
var hash = location.hash || '';
if (hash.indexOf('#s=') === 0) {
  renderGate(hash.slice(3));          /* 共有リンクはパスワード不要 */
} else if (isAuthed()) {
  startAdmin();
} else {
  showLock();
}
window.addEventListener('hashchange', function () { location.reload(); });

})();
</script>
