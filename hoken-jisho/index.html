<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#fdf1ea">
<title>お金の言葉の辞書｜保険ツール</title>
<!--
  お金の言葉の辞書（社内ツール・2026-10-29）。
  ★正本は smile24-demo の hoken-newtools-src/kanren/jisho-page.html と build_jisho_page.py。
    この HTML（保険お金の言葉の辞書.html・office-m/hoken-jisho/index.html）を手で直さない。
  - 言葉のデータはライフプランのものを読む（/lifeplan/vendor/lpjisho-data.js。同じ場所 office-m-nakatani.github.io）。二重に持たない
  - 言葉ごとの AI師匠の問いは hoken-newtools-src/kanren/kanren.json の words から（この HTML に焼いてある）
  - 公開先は office-m/hoken-jisho/。扉は apply_gate.py が入れる。会社フォルダは make_agency.py が写す（管理画面への行き先の行を ../ に）
  - 学習ツールは公開の office-m/<id>/ にある。会社フォルダの中から開くときは ../../<id>/（管理画面への行き先の行が ../ のとき）
-->
<style>
:root{
  --navy:#1b3f5e; --navy-2:#27587f; --navy-soft:#eaf1f7;
  --bg:#fff8f2; --white:#fff; --text:#33404d; --muted:#5c6874; --line:#efe2d8; --line-2:#e6d6c9;
  --shadow:0 6px 20px rgba(130,100,80,.09);
  --coral:#f0846a; --coral-text:#bd4523; --coral-bg:#fdeee9; --coral-border:#f4d0c6;
  --green:#2c7a4b; --green-bg:#e8f6ef; --green-border:#c3e5d3;
  --sky:#24729f; --sky-text:#1d5679; --sky-bg:#e8f4fb; --sky-border:#c6e2f2;
  --berry:#8f4574; --berry-bg:#fbeef6; --berry-border:#eed2e2;
  --violet:#3f2a7a; --violet-bg:#f5f1fc; --violet-border:#ddd0f2;
  --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"游明朝体","游明朝","MS PMincho",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;font-size:16px;}
@media(min-width:640px){ html{font-size:16.5px;} }
@media(min-width:1100px){ html{font-size:17px;} }
body{margin:0;font-family:var(--gothic);color:var(--text);background:var(--bg);font-size:1rem;line-height:1.75;overflow-wrap:break-word;}
h1,h2,h3,p,ol,ul{margin:0;}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--navy-2);}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;border-radius:6px;}
svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;}
.vh{position:absolute !important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- 上の帯（ほかの社内ツールと同じ顔） ---------- */
.topbar{flex:none;background:linear-gradient(168deg,#fbe6e6 0%,#fdf1ea 46%,#ddf0fb 100%);border-bottom:1px solid var(--line);}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:74px;padding:10px 22px;}
.tb-brand{display:flex;align-items:center;gap:12px;color:var(--navy);min-width:0;}
.tb-art{width:46px;height:46px;flex:none;}
.tb-art svg{width:46px;height:46px;}
.tb-brand h1{font-family:var(--mincho);font-size:1.35rem;letter-spacing:.06em;font-weight:600;line-height:1.35;color:var(--navy);}
.tb-brand small{display:block;font-size:.8125rem;color:var(--muted);letter-spacing:.02em;line-height:1.5;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--navy-2);
  background:var(--white);color:var(--navy);font-weight:700;font-size:.9rem;text-decoration:none;white-space:nowrap;}
.tb-home:hover{background:var(--navy-soft);}
.tb-home svg{width:18px;height:18px;}
@media(max-width:600px){
  .topbar .wrap{min-height:0;padding:8px 12px;gap:10px;}
  .tb-art,.tb-art svg{width:38px;height:38px;}
  .tb-brand h1{font-size:1.12rem;white-space:nowrap;letter-spacing:.04em;}
  .tb-brand small{display:none;}
  .tb-home{padding:8px 14px;}
}
@media(max-width:379px){ .tb-home .th-l{display:none;} }

/* ---------- 画面の組み（PC＝左に一覧・右に中身／携帯＝縦） ---------- */
.jp-app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
.jp{flex:1;display:block;}
.jp-side{background:#fffdfb;}
.jp-find{padding:14px 16px 12px;background:#fffdfb;border-bottom:1px solid var(--line);}
.jp-qw{position:relative;}
.jp-qw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none;}
.jp-find input{width:100%;min-height:50px;padding:10px 14px 10px 44px;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;font-size:1.02rem;color:var(--text);}
.jp-find input::placeholder{color:#7a838c;}
.jp-find input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(240,132,106,.22);}
.jp-list{padding:6px 12px 28px;}
.jp-main{background:var(--bg);}
.jp-det{max-width:900px;margin:0 auto;padding:24px 34px 48px;}
@media(min-width:900px){
  .jp-app{height:100vh;height:100dvh;}
  .jp{min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);}
  .jp-side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);}
  .jp-list{flex:1;min-height:0;overflow-y:auto;}
  .jp-main{min-height:0;overflow-y:auto;}
}
@media(min-width:1400px){ .jp{grid-template-columns:420px minmax(0,1fr);} }
@media(max-width:899px){
  .jp-find{position:sticky;top:0;z-index:5;padding:10px 12px;}
  .jp.det .jp-list{display:none;}
  .jp:not(.det) .jp-main{display:none;}
  .jp-list{padding:4px 10px 32px;}
  .jp-det{padding:12px 12px 40px;}
}

/* ---------- 一覧 ---------- */
.jp-sh{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:700;color:var(--muted);margin:18px 6px 8px;letter-spacing:.04em;}
.jp-sh svg{width:17px;height:17px;}
.jp-gh{position:sticky;top:0;z-index:1;margin:0 -12px;padding:10px 18px 6px;font-family:var(--mincho);font-size:.98rem;font-weight:700;color:var(--navy);
  background:#fffdfb;border-bottom:1px solid #f3e7dd;letter-spacing:.04em;line-height:1.5;}
h3.jp-gh{font-size:.92rem;color:var(--navy-2);}
@media(max-width:899px){ .jp-gh{position:static;margin:0 -10px;padding:12px 16px 6px;} }
.jp-ul{list-style:none;margin:0;padding:4px 0 8px;}
.jp-ul > li{content-visibility:auto;contain-intrinsic-size:auto 66px;}
.jp-it{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:9px 10px 9px 12px;border-radius:10px;
  cursor:pointer;min-height:44px;color:var(--text);text-decoration:none;line-height:1.5;}
.jp-it:hover{background:var(--coral-bg);}
.jp-it.on{background:var(--navy-soft);border-left-color:var(--navy-2);}
.jp-it:focus-visible{outline-offset:-3px;}
.jp-iw{display:block;font-weight:700;font-size:1rem;color:var(--navy);}
.jp-is{display:block;font-size:.86rem;color:var(--muted);line-height:1.55;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.jp-tag{display:inline-block;font-size:.8125rem;font-weight:700;line-height:1.45;border-radius:999px;padding:1px 9px;margin-right:7px;vertical-align:1px;}
.jp-tag-f{color:var(--violet);background:#efe9fa;}
.jp-tag-g{color:var(--green);background:var(--green-bg);}
.jp-count{font-size:.86rem;color:var(--muted);margin:12px 6px 4px;line-height:1.6;}
.jp-none,.jp-wait{margin:16px 8px;font-size:.95rem;line-height:1.8;color:var(--muted);}
.jp-none b{color:var(--text);}
.jp-chips{display:flex;flex-wrap:wrap;gap:8px;}
.jp-list .jp-chips{margin:0 4px;}
.jp-chip{display:inline-flex;align-items:center;min-height:44px;padding:6px 15px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;color:var(--navy);
  font-size:.92rem;font-weight:700;cursor:pointer;max-width:100%;text-align:left;line-height:1.4;}
.jp-chip:hover{border-color:var(--coral-border);background:var(--coral-bg);}
.jp-kana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 4px;}
.jp-kana button{min-height:52px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-family:var(--mincho);font-size:1.18rem;font-weight:700;color:var(--navy);cursor:pointer;}
.jp-kana button:hover{border-color:var(--coral-border);background:var(--coral-bg);}
.jp-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 4px;}
.jp-cats button{display:flex;align-items:center;min-height:48px;padding:7px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;color:var(--navy);
  font-size:.9rem;font-weight:700;line-height:1.4;text-align:left;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere;}
.jp-cats button:hover{border-color:var(--coral-border);background:var(--coral-bg);}
.jp-rowtop{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:6px 0 2px;}
.jp-rowtop h2{font-family:var(--mincho);font-size:1.2rem;color:var(--navy);font-weight:700;letter-spacing:.06em;}
.jp-how{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px 14px;margin:12px 4px 4px;}
.jp-how .jp-steps{font-size:.92rem;line-height:1.8;margin-top:4px;}

/* ---------- 中身 ---------- */
.jp-bar{display:flex;flex-wrap:wrap;gap:4px 10px;margin:0 0 8px -6px;min-height:0;}
.jp-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px 6px 8px;border:0;background:transparent;color:var(--navy-2);
  font-size:.92rem;font-weight:700;cursor:pointer;border-radius:10px;max-width:100%;}
.jp-back:hover{background:var(--navy-soft);}
.jp-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jp-back svg{width:18px;height:18px;}
@media(min-width:900px){ .jp-back.sp{display:none;} }
.jp-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 30px 28px;box-shadow:var(--shadow);}
@media(max-width:899px){ .jp-card{padding:18px 16px 22px;border-radius:16px;} }
.jp-dcat{display:inline-block;font-size:.8125rem;font-weight:700;color:var(--navy-2);background:var(--navy-soft);border-radius:999px;padding:3px 12px;line-height:1.5;}
.jp-dw{font-family:var(--mincho);font-size:1.85rem;font-weight:700;line-height:1.4;color:var(--navy);margin:10px 0 2px;letter-spacing:.03em;}
.jp-start .jp-dw{margin-top:0;font-size:1.5rem;}
@media(max-width:899px){ .jp-dw{font-size:1.5rem;} }
.jp-dw:focus{outline:none;}
.jp-dal{font-size:.88rem;color:var(--muted);margin:4px 0 0;line-height:1.6;}
.jp-dal-w{display:inline-block;max-width:100%;}   /* 呼び名ごとに折らない（携帯で「ニ／ーサ」と語の途中で折れた。2026-10-31）。行より長い呼び名だけ中で折れる */
.jp-imi{font-size:1.06rem;line-height:1.95;margin:16px 0 0;max-width:40em;}
.jp-lk{display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:var(--navy-2);text-decoration:underline;text-decoration-style:dotted;
  text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer;border-radius:3px;}
.jp-lk:hover{text-decoration-style:solid;background:var(--navy-soft);}
.jp-steps{margin:14px 0 0;padding-left:1.4em;line-height:1.9;font-size:1rem;max-width:40em;}
.jp-sec{margin:26px 0 0;}
.jp-sec-h{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-family:var(--mincho);font-size:1.08rem;font-weight:700;color:var(--navy);line-height:1.5;letter-spacing:.03em;}
.jp-sec-h .ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--sb,#eef1f4);color:var(--sc,#4a5560);flex:none;}
.jp-sec-h .ic svg{width:18px;height:18px;}
.jp-sec.c-rel{--sb:var(--sky-bg);--sc:var(--sky);}
.jp-sec.c-gk{--sb:var(--green-bg);--sc:var(--green);}
.jp-sec.c-ask{--sb:var(--berry-bg);--sc:var(--berry);}
.jp-sec.c-fx{--sb:#efe9fa;--sc:var(--violet);}
.jp-sec.c-pop{--sb:var(--coral-bg);--sc:var(--coral-text);}
.jp-sec.c-rel .jp-chip{border-color:var(--sky-border);background:#f7fbfe;color:var(--sky-text);}
.jp-sec.c-rel .jp-chip:hover{border-color:var(--sky);background:var(--sky-bg);}
.jp-fx{background:var(--violet-bg);border:1px solid var(--violet-border);border-radius:12px;padding:12px 14px;max-width:44em;}
.jp-fx-b + .jp-fx-b{margin-top:14px;padding-top:12px;border-top:1px dashed #cdbfe9;}
.jp-fx-t{font-size:.88rem;font-weight:700;color:var(--violet);margin:0 0 5px;line-height:1.5;}
.jp-fx-f{font-size:1.04rem;font-weight:700;color:#2b1d57;line-height:1.9;padding:9px 13px;background:#fff;border:1px solid #e3d9f5;border-radius:8px;overflow-wrap:anywhere;}
.jp-fx-n{font-size:.88rem;color:#4a4560;line-height:1.7;margin:6px 0 0;}
.jp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.jp-card2{display:flex;align-items:flex-start;gap:10px;min-height:56px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);text-decoration:none;line-height:1.55;}
.jp-card2 b{display:block;font-size:.98rem;font-weight:700;color:var(--navy);}
.jp-card2 small{display:block;font-size:.84rem;color:var(--muted);margin-top:2px;}
.jp-card2 .t{min-width:0;display:block;}
.jp-card2 .t b{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.jp-card2 > svg{width:20px;height:20px;margin-top:2px;}
.c-gk .jp-card2{border-color:var(--green-border);background:#fbfefc;}
.c-gk .jp-card2:hover{border-color:var(--green);background:#f1faf4;}
.c-gk .jp-card2 > svg{color:var(--green);}
.c-ask .jp-card2{border-color:var(--berry-border);background:#fffbfd;}
.c-ask .jp-card2:hover{border-color:var(--berry);background:#fdf3f8;}
.c-ask .jp-card2 > svg{color:var(--berry);}
.jp-snote{font-size:.84rem;color:var(--muted);line-height:1.7;margin:8px 0 0;}
.jp-note{font-size:.84rem;color:var(--muted);line-height:1.75;margin:26px 0 0;padding-top:14px;border-top:1px dashed var(--line-2);max-width:44em;}
@media print{
  .jp-side,.tb-right,.jp-bar{display:none !important;}
  .jp-app{height:auto !important;display:block;}
  .jp{display:block !important;}
  .jp-main{display:block !important;overflow:visible !important;}
  .jp-card{box-shadow:none;}
  body{background:#fff;}
}
</style>
</head>
<body>
<!-- OMGATE-BEGIN ★IDとパスワードの扉。正本は hoken-gate-src/gate.html。ページ側を直接編集しないこと（apply_gate.py で入れ直すと消える） -->
<style>
/* ★中身は「開いていない限り隠す」＝ fail-closed。JavaScript が切られていても
   中身は出ない（class を足して隠す形にすると、JS 無しで素通りしてしまう） */
html:not(.omgate-open) body > *:not(#omgate){display:none !important}
html:not(.omgate-open),html:not(.omgate-open) body{overflow:hidden !important}
#omgate{position:fixed; inset:0; z-index:2147483000; display:grid; place-items:center; padding:22px;
  background:linear-gradient(168deg,#f2f7fd 0%,#fdfbf7 54%,#f1f6fc 100%);
  font-family:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  color:#2b3646; line-height:1.95; letter-spacing:.015em; -webkit-font-smoothing:antialiased}
/* ★display を書くので [hidden] とセットで書く（この案件で4回目の詳細度事故） */
#omgate[hidden]{display:none !important}
#omgate .og-card{width:min(100%,432px); background:#fff; border:1px solid #e7edf5; border-radius:20px;
  padding:34px 30px 28px; text-align:center; box-shadow:0 14px 44px rgba(43,54,70,.10)}
#omgate .og-ico{width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:#eef4ff;
  display:grid; place-items:center; color:#2f63c8}
#omgate .og-ico svg{width:26px; height:26px}
#omgate h1{margin:0; font-size:18px; font-weight:800; letter-spacing:.04em; line-height:1.6}
#omgate .og-lead{margin:8px 0 20px; font-size:13px; color:#5d6b7c; line-height:1.9}
#omgate .og-lab{display:block; text-align:left; font-size:13px; font-weight:700; color:#33465c; margin:0 0 4px}
#omgate input#omgate-i,#omgate input[type=password]{width:100%; font-family:inherit; font-size:17px; font-weight:500; letter-spacing:.06em;
  color:#2b3646; background:#fbfdff; border:1px solid #dae3ee; border-radius:13px; padding:14px 16px; outline:none;
  text-align:center; transition:border-color .18s, box-shadow .18s; min-height:50px; box-sizing:border-box}
#omgate input#omgate-i{margin-bottom:12px; font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
#omgate input#omgate-i:focus,#omgate input[type=password]:focus{border-color:#bed3f7; background:#fff; box-shadow:0 0 0 4px #eef4ff}
#omgate .og-err{min-height:24px; font-size:13px; color:#b9645a; margin-top:8px}
#omgate .og-keep{display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px;
  color:#5d6b7c; margin:2px 0 16px; cursor:pointer}
#omgate .og-keep input{width:18px; height:18px; accent-color:#0b5cff; cursor:pointer}
#omgate button{width:100%; font-family:inherit; font-weight:700; font-size:16px; letter-spacing:.08em;
  padding:15px; border:0; border-radius:14px; color:#fff; cursor:pointer;
  background:linear-gradient(135deg,#2f74ff 0%,#0b5cff 58%,#0847c9 100%);
  box-shadow:0 8px 22px rgba(11,92,255,.20); transition:transform .18s, box-shadow .18s, filter .18s}
#omgate button:hover{filter:brightness(1.04); transform:translateY(-1px)}
#omgate .og-note{margin:20px 0 0; padding-top:16px; border-top:1px solid #eef1f6;
  font-size:12px; color:#7d8b9b; line-height:1.9; text-align:left}
#omgate .og-note a{color:#2f63c8; font-weight:700}
#omgate .og-note b{color:#5d6b7c}
@media(max-width:420px){ #omgate .og-card{padding:28px 20px 24px} }
@media(prefers-reduced-motion:reduce){ #omgate *{transition:none !important} }
/* お客様が共有リンクで開いたとき（② の鍵で開いたとき）は、営業向けの部分を隠す（2026-10-04）。
   面談の最初のひと言・ページ内の目次・30秒の核心・現場あるある・逆転劇場・明日の3つの問い。
   解説の部分（もとの知識の節）とまとめだけが残る */
html.omgate-cust .tot-first,html.omgate-cust .tot-nav,html.omgate-cust #tot-core,html.omgate-cust .tot-core,
html.omgate-cust .tot-sec,html.omgate-cust #toi,html.omgate-cust .tot-toi,html.omgate-cust .tot-modal{display:none !important}
html.omgate-cust .tot-pair{grid-template-columns:minmax(0,1fr) !important}
</style>
<div id="omgate" role="dialog" aria-modal="true" aria-labelledby="omgate-h">
  <div class="og-card">
    <div class="og-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.6"/><path d="M8 10.5V7.4a4 4 0 0 1 8 0v3.1"/><circle cx="12" cy="15.7" r="1.15"/>
      </svg>
    </div>

<script>
/* ============================================================
   IDとパスワードの扉（2026-09-11 ユーザー指示。2026-10-26 から合言葉1つではなくIDとパスワードの2つ）
   「URLをコピーして送付されたら情報が外に出てしまう。お客様専用の
     パスワードを入力してこのページに行った人でないと見れないように」

   ★これはブラウザの中だけで確かめるしくみで、堅牢な認証ではない。
     URLを受け取っただけの人をそっと止めるための扉（利用規約 第6条5項に
     明記してあるとおり）。この扉を「暗号化」「本当のロック」と説明しないこと。

   開いてよいのは次の3つ。どれも同じオリジン（office-m-nakatani.github.io）
   の中だけで完結する。
     ① 管理画面（hoken-hub）でログインした端末
        localStorage 'officem.hokenHub.auth'
        ★ハッシュの中身は照合しない。代理店ごとの専用管理画面
          （make_agency.py が作る）はIDとパスワードが違うので、
          「どこかの管理画面が通した」ことだけを見る
        ★この扉で「次回から省略」を外して入った担当者は sessionStorage 'officem.hokenGate.staff'
          （タブを閉じると消える）。2026-10-29 まではお客様の共有リンクと同じ鍵を書いていたので、
          そのタブで次のページを開くとお客様向けの形になっていた。鍵を分けた
     ② 共有リンクの枠の中（管理画面が iframe で開いたとき）
        sessionStorage 'officem.hokenGate.share'
        ★sessionStorage はタブ単位。枠の中のURLをコピーして
          別の人に送っても、その人のタブには無いので開かない
     ③ 体験版（3日間）が配った鍵。ページを名指しで許す
        localStorage 'officem.hokenGate.taiken' = {e:期限, ids:[…]}
   ============================================================ */
(function () {
  var R = document.documentElement;
  var AUTH = 'officem.hokenHub.auth';
  var SHARE = 'officem.hokenGate.share';
  var STAFF = 'officem.hokenGate.staff';
  var TRIAL = 'officem.hokenGate.taiken';
  var SALT = 'officem-hoken-hub-2026|';
  /* 受け付ける印＝sha256(SALT + 'id:' + ID + '|pw:' + パスワード)（平文はどのファイルにも書かない）。
     ★管理画面の PASS_HASHES と同じもの */
  var OKH = ['edca5a0720eb230f3f1d4d319dd86c9dc79bdc9aea9f681c5557a4eedebd388b'];
  var DAYS = 30;

  function read(store, k) { try { return JSON.parse(store.getItem(k) || 'null'); } catch (e) { return null; } }
  function live(o) { return !!(o && typeof o.e === 'number' && o.e > Date.now()); }
  function pageId() {
    var p = String(location.pathname).replace(/\/+$/, '');
    return p.slice(p.lastIndexOf('/') + 1).replace(/\.html$/i, '');
  }
  /* どの鍵で開いたかを返す（'auth'＝管理画面・'staff'＝この扉で入った担当者（次回から省略なし）・'share'＝共有リンク・'trial'＝体験版・''＝開けない） */
  function allowed() {
    try {
      var a = read(localStorage, AUTH);
      if (live(a) && /^[0-9a-f]{64}$/.test(String(a.h || ''))) return 'auth';
    } catch (e) {}
    try { if (live(read(sessionStorage, STAFF))) return 'staff'; } catch (e) {}
    try { if (live(read(sessionStorage, SHARE))) return 'share'; } catch (e) {}
    try {
      var t = read(localStorage, TRIAL);
      if (live(t) && t.ids && t.ids.join && t.ids.indexOf(pageId()) >= 0) return 'trial';
    } catch (e) {}
    return '';
  }
  function open_() {
    R.className += ' omgate-open';
    var g = document.getElementById('omgate');
    if (g) g.hidden = true;
  }

  var how = allowed();
  if (how) {
    /* 共有リンク（お客様）で開いたときは、営業向けの部分を隠す印を付ける */
    if (how === 'share') R.className += ' omgate-cust';
    open_(); return;
  }

  var f = document.getElementById('omgate-f');
  var inp = document.getElementById('omgate-p');
  var idIn = document.getElementById('omgate-i');
  var err = document.getElementById('omgate-e');
  var keep = document.getElementById('omgate-k');

  /* crypto.subtle は https と localhost でしか使えない。無い環境では
     IDとパスワードを確かめられないので、入力欄を出さずに管理画面へ案内する */
  var canHash = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
  if (!canHash) {
    if (f) f.innerHTML = '<div class="og-err">この画面ではIDとパスワードを確認できません。'
      + 'お手数ですが、管理画面から開いてください。</div>';
    return;
  }

  function sha256(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
      var b = new Uint8Array(buf), out = '', i;
      for (i = 0; i < b.length; i++) out += ('0' + b[i].toString(16)).slice(-2);
      return out;
    });
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = String(idIn.value || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[\s\u3000]/g, '');
    var pw = inp.value || '';
    if (!id) { err.textContent = 'IDを入れてください。'; idIn.focus(); return; }
    if (!pw) { err.textContent = 'パスワードを入れてください。'; inp.focus(); return; }
    err.textContent = '';
    sha256(SALT + 'id:' + id + '|pw:' + pw).then(function (h) {
      if (OKH.indexOf(h) < 0) {
        err.textContent = 'IDかパスワードが違います。';
        inp.value = ''; inp.focus();
        return;
      }
      try {
        if (keep && keep.checked) {
          localStorage.setItem(AUTH, JSON.stringify({ h: h, e: Date.now() + DAYS * 86400000, i: id }));
        } else {
          sessionStorage.setItem(STAFF, JSON.stringify({ e: Date.now() + 12 * 3600000 }));
        }
      } catch (e2) { /* 保存できなくても、その場では開く */ }
      open_();
    })['catch'](function () { err.textContent = 'この画面ではIDとパスワードを確認できませんでした。'; });
  });

  setTimeout(function () { try { idIn.focus(); } catch (e) {} }, 60);
})();
</script>

<!-- OMLOG-BEGIN ★学習の記録（量だけ）。正本は hoken-gate-src/katalog.html。ページ側を直接編集しないこと（apply_gate.py で入れ直すと消える） -->
<script>
/* ============================================================
   学習の記録（2026-09-29 ユーザー指示）
   「教育の記録を1枚の紙に」「使われているかが社長に見える」
   「社長には内容が見えないようにだけして従業員のプライベートを守ってください」

   ★記録するのは「量」だけ。中身は記録しない（記録していないものは、誰にも見せようがない）
     残すもの   ＝ その日に1分以上ひらいた学習資料・社内ツールの id と題名／
                  教材の問題を最後まで解いた id／資格の問題に答えた数／
                  AI師匠への仕事の相談の回数（AI師匠の側が omLog('m') を呼ぶ）
     残さないもの＝ 相談の文・返事・正解か不正解か・点数・時刻・どこを読んだか
   ★置き場所はこの端末の localStorage 'officem.kataLog.v1' だけ。外へ送らない。
     社長に届くのは、本人が管理画面で中身を見てから書き出して渡したときだけ
   ★記録するのは「管理画面の合言葉を通した端末」（社員の端末）だけ。
     お客様や共有リンクで開いた人の端末には何も残さない
   ★日付は「日」まで。時刻は持たない。社長に渡るのは月ごとの合計（管理画面が作る）
   ============================================================ */
(function () {
  if (window.omLog) return;                       /* 1ページに2回入っても1回だけ動く */
  var KEY = 'officem.kataLog.v1';
  var AUTH = 'officem.hokenHub.auth';
  var KEEP_DAYS = 430;                            /* 13か月と少し。古い日は消す */
  var OPEN_MS = 60000;                            /* 1分以上ひらいたら「ひらいた」と数える */
  var TOOLS = /^hoken-(training|shiharai|kirikaeshi|compliance|shikaku|sales|gyakusan|calendar|mentor|jisho)$/;   /* 2026-10-29 にお金の言葉の辞書（hoken-jisho）を足した */

  function read(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function staff() {
    var a = read(AUTH);
    return !!(a && typeof a.e === 'number' && a.e > Date.now() && /^[0-9a-f]{64}$/.test(String(a.h || '')));
  }
  function z(n) { return (n < 10 ? '0' : '') + n; }
  function day(t) { var d = t ? new Date(t) : new Date(); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function load() {
    var o = read(KEY);
    if (!o || typeof o !== 'object' || o.v !== 1 || !o.d || typeof o.d !== 'object') o = { v: 1, d: {}, t: {} };
    if (!o.t || typeof o.t !== 'object') o.t = {};
    return o;
  }
  function save(o) {
    var cut = day(Date.now() - KEEP_DAYS * 86400000);
    Object.keys(o.d).forEach(function (k) { if (k < cut) delete o.d[k]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* 残せなくても画面は止めない */ }
  }
  function pageId() {
    var p = String(location.pathname).replace(/\/+$/, '');
    return p.slice(p.lastIndexOf('/') + 1).replace(/\.html$/i, '');
  }
  function cleanTitle(s) {
    s = String(s || '').replace(/\s+/g, ' ').replace(/[｜|].*$/, '').trim();
    return s.slice(0, 60);
  }

  /* 記録の入口。kind：'p'＝ひらいた／'q'＝教材の問題を解き終えた（id）／'s'＝資格の問題（数）／'m'＝AI師匠への仕事の相談（数） */
  function omLog(kind, id, n) {
    if (!staff()) return;
    if (!/^[pqsm]$/.test(kind)) return;
    var o = load(), d = day(), r = o.d[d] || (o.d[d] = {});
    if (kind === 'p' || kind === 'q') {
      id = String(id || '').replace(/[^a-z0-9-]/g, '').slice(0, 64);
      if (!id) return;
      r[kind] = r[kind] || {};
      r[kind][id] = 1;
      if (kind === 'p' && document.title) o.t[id] = cleanTitle(document.title);
    } else {
      n = Math.max(1, Math.min(500, Math.round(+n || 1)));
      r[kind] = (r[kind] || 0) + n;
    }
    save(o);
  }
  window.omLog = omLog;

  var id = pageId();
  var mine = /-check$/.test(id) || TOOLS.test(id);
  if (!mine) return;

  /* 1分以上ひらいたら「ひらいた」。画面が裏に回っている時間は数えない */
  var seen = 0, done = false, tick = 5000;
  var iv = setInterval(function () {
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    seen += tick;
    if (!done && seen >= OPEN_MS) { done = true; omLog('p', id); clearInterval(iv); }
  }, tick);

  /* 教材：問題を最後まで解くと #quizDone に .show が付く（kyozai-template.html）。
     ★正解の数は見ない。「最後まで解いた」だけ */
  function watchQuiz() {
    var q = document.getElementById('quizDone');
    if (!q || !window.MutationObserver) return;
    var hit = false;
    var mo = new MutationObserver(function () {
      if (!hit && q.classList.contains('show')) { hit = true; omLog('q', id); mo.disconnect(); }
    });
    mo.observe(q, { attributes: true, attributeFilter: ['class'] });
  }

  /* 資格試験対策ツール：通算の問題数（officem.shikaku.v1 の total）の増えた分だけ数える。
     ★どの問題を解いたか・正解したかは見ない */
  function shikakuTotal() { var s = read('officem.shikaku.v1'); return s && +s.total >= 0 ? +s.total : 0; }
  if (id === 'hoken-shikaku') {
    var base = shikakuTotal();
    var flush = function () {
      var cur = shikakuTotal();
      if (cur > base) omLog('s', null, cur - base);
      base = cur;
    };
    setInterval(flush, 15000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', flush);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watchQuiz);
  else watchQuiz();
})();
</script>

    terms.forEach(function(n, j){
      if(!n || n.length < 2) return;
      var s = 0;
      if(x.s === n) s = 90; else if(x.t.indexOf(n) >= 0 || x.s.indexOf(n) >= 0) s = 70; else if(x.k.indexOf(n) >= 0) s = 45;
      sc = Math.max(sc, j === 0 ? s : s * 0.8);
    });
    if(sc) out.push([sc, i]);
  });
  out.sort(function(a, b){ return b[0] - a[0] || a[1] - b[1]; });
  return out;
}
function gOfWord(i, max){
  var it = W[i], out = (it.gk || []).filter(function(j){ return !!GK[j]; }).slice(0, max);
  if(out.length < max){
    var terms = [it.w].concat(it.al || []).map(nz).filter(function(z){ return z.length >= 3; });
    gFind(terms).forEach(function(a){ if(a[0] >= 70 && out.length < max && out.indexOf(a[1]) < 0) out.push(a[1]); });
  }
  return out;
}
function asksOf(i){
  var it = W[i], out = [it.w + 'とは？'];
  (KQ[it.w] || []).forEach(function(n){ var q = KQT[n]; if(q && out.indexOf(q) < 0) out.push(q); });
  return out.slice(0, 3);
}
/* 五十音の行（データは読みの順に並んでいる） */
function kanaBase(c){ c = SMALL[c] || c; try{ c = c.normalize('NFD').charAt(0); }catch(e){} return c; }
function rowsOf(){
  if(ROWL) return ROWL;
  ROWL = ROWS.map(function(){ return []; });
  W.forEach(function(it, i){
    var c = kanaBase(String(it.y || '').charAt(0)), r = ROWS.length - 1;
    for(var k = 0; k < ROWS.length; k++){ if(ROWS[k][1].indexOf(c) >= 0){ r = k; break; } }
    ROWL[r].push(i);
  });
  return ROWL;
}
/* 分野ごとの言葉（データの読みの順のまま） */
function catsOf(){
  if(CATL) return CATL;
  CATL = {};
  W.forEach(function(it, i){ (CATL[it.cat] = CATL[it.cat] || []).push(i); });
  return CATL;
}
function popular(){ return ((D && D.pop) || []).map(function(w){ return BYW[w]; }).filter(function(x){ return x >= 0; }); }
function recent(){
  try{ var a = JSON.parse(localStorage.getItem(RKEY) || '[]'); if(!Array.isArray(a)) return []; return a.map(function(w){ return BYW[w]; }).filter(function(x){ return x >= 0; }).slice(0, 8); }catch(e){ return []; }
}
function addRecent(w){
  try{ var a = JSON.parse(localStorage.getItem(RKEY) || '[]'); if(!Array.isArray(a)) a = []; a = [w].concat(a.filter(function(x){ return x !== w; })).slice(0, 8); localStorage.setItem(RKEY, JSON.stringify(a)); }catch(e){}
}

/* ---------- 部品 ---------- */
function wItem(i, sub){
  var it = W[i];
  return '<li><button type="button" class="jp-it" data-jp-i="' + i + '"><span class="jp-iw">' + (it.fx ? '<span class="jp-tag jp-tag-f">計算式</span>' : '') + esc(it.w)
    + '</span><span class="jp-is">' + esc(sub || first(it.imi)) + '</span></button></li>';
}
function gItem(j){
  var p = GK[j];
  return '<li><a class="jp-it jp-gk" href="' + esc(learnHref(p.i)) + '"><span class="jp-iw"><span class="jp-tag jp-tag-g">学習</span>' + esc(p.t) + '</span><span class="jp-is">' + esc(p.c) + 'の学習ツール</span></a></li>';
}
function chip(i){ return '<button type="button" class="jp-chip" data-jp-i="' + i + '">' + esc(W[i].w) + '</button>'; }
function sec(c, ic, t, body){ return '<div class="jp-sec c-' + c + '"><h3 class="jp-sec-h"><span class="ic">' + ic + '</span>' + esc(t) + '</h3>' + body + '</div>'; }
function gCard(j){ var p = GK[j]; return '<a class="jp-card2" href="' + esc(learnHref(p.i)) + '">' + IC.cap + '<span class="t"><b>' + esc(p.t) + '</b><small>' + esc(p.c) + 'の学習ツール</small></span></a>'; }
function askCard(q){ return '<a class="jp-card2" href="' + esc(mentorHref(q)) + '">' + IC.chat + '<span class="t"><b>' + esc(q) + '</b><small>AI師匠に聞く</small></span></a>'; }
function fxHTML(it){
  if(!it.fx || !it.fx.length) return '';
  return sec('fx', IC.calc, '計算のしかた（一般的な式）', '<div class="jp-fx">' + it.fx.map(function(b){
    return '<div class="jp-fx-b">' + (b.t ? '<p class="jp-fx-t">' + esc(b.t) + '</p>' : '') + '<p class="jp-fx-f">' + esc(b.f) + '</p>' + (b.n ? '<p class="jp-fx-n">' + esc(b.n) + '</p>' : '') + '</div>';
  }).join('') + '</div>');
}
function stepsHTML(){
  return '<ol class="jp-steps"><li>「言葉を入れて引く」の欄に言葉を入れます。ひらがな・カタカナ・英字・別の呼び名でも引けます。</li>'
    + '<li>説明の中で下線の付いた言葉を押すと、その言葉へ移ります。</li>'
    + '<li>言葉ごとに「学習ツールで詳しく」と「AI師匠に聞く」から、続きへ進めます。</li></ol>';
}
function noteHTML(){
  return '<p class="jp-note">意味は一般的な説明で、制度は改正で変わることがあります。お客様に説明するときは、所属保険会社の資料と最新の制度で確かめてください。病気や治療は医師・薬剤師に、税は税理士に、法律上の判断は弁護士にご確認ください。</p>';
}
function failHTML(){
  return '<div class="jp-none"><b>辞書を読み込めませんでした。</b><br>通信の具合を確かめて、もう一度お試しください。<br><button type="button" class="jp-chip" data-jp-retry style="margin-top:10px">もう一度読み込む</button></div>';
}

/* ---------- 一覧 ---------- */
function startListHTML(){
  var h = '';
  if(!wide()) h += '<div class="jp-how"><p class="jp-sh" style="margin:0">' + IC.book + '辞書の引き方</p>' + stepsHTML() + '</div>';
  var rc = recent();
  if(rc.length) h += '<p class="jp-sh">' + IC.clock + '最近引いた言葉</p><div class="jp-chips">' + rc.map(chip).join('') + '</div>';
  if(!wide()){ var pop = popular(); if(pop.length) h += '<p class="jp-sh">' + IC.star + 'よく使う言葉</p><div class="jp-chips">' + pop.map(chip).join('') + '</div>'; }
  h += '<p class="jp-sh">' + IC.kana + '五十音で探す</p><div class="jp-kana">' + ROWS.map(function(r, k){
    return '<button type="button" data-jp-row="' + k + '" aria-label="' + r[0] + '行の言葉を見る">' + r[0] + '</button>';
  }).join('') + '</div>';
  var cl = catsOf();
  h += '<p class="jp-sh">' + IC.grid + '分野で探す</p><div class="jp-cats">' + (D.cats || []).filter(function(c){ return cl[c[0]]; }).map(function(c){
    /* 折り返すのは「・」の後ろと「の言葉」の前だけ（語の途中で折らない） */
    return '<button type="button" data-jp-cat="' + esc(c[0]) + '">' + esc(CATN[c[0]]).replace(/・/g, '・<wbr>').replace(/の言葉$/, '<wbr>の言葉') + '</button>';
  }).join('') + '</div>';
  return h;
}
/* 言葉の並びを、読みの頭の字ごとに区切って出す（五十音の行・分野の一覧） */
function groupedHTML(L){
  var cur = '', h = '';
  L.forEach(function(i){
    var c = kanaBase(String(W[i].y || '').charAt(0));
    if(c !== cur){ if(cur) h += '</ul>'; cur = c; h += '<h3 class="jp-gh">' + esc(c) + '</h3><ul class="jp-ul">'; }
    h += wItem(i);
  });
  return cur ? h + '</ul>' : h;
}
function topHTML(t){ return '<div class="jp-rowtop"><button type="button" class="jp-back" data-jp-rows>' + IC.left + '<span>最初の画面へ戻る</span></button><h2>' + esc(t) + '</h2></div>'; }
function rowHTML(r){ return topHTML(ROWS[r][0] + '行') + groupedHTML(rowsOf()[r]); }
function catHTML(k){ return topHTML(CATN[k] || '') + groupedHTML(catsOf()[k] || []); }
function searchHTML(){
  var raw = st.q, n = nz(raw), parts = [], h = '';
  var hit = find(n), skip = {};
  hit.forEach(function(a){ skip[a[1]] = 1; });
  var terms = [n];
  if(hit.length && hit[0][0] >= 60){ var t = W[hit[0][1]]; [t.w].concat(t.al || []).forEach(function(a){ var z = nz(a); if(z && terms.indexOf(z) < 0) terms.push(z); }); }
  var multi = raw.split(/[\s　]+/).map(nz).filter(Boolean);
  var body = findBody(multi.length > 1 ? multi : [n], skip);
  var LIM = 80, LIMB = 30;
  var gs = [], gd = gFind(terms);
  /* 題や名前がそのまま当たるものを先に、次に当たった言葉に結びつけたもの、最後に検索の語で当たったもの */
  gd.forEach(function(a){ if(a[0] >= 70 && gs.indexOf(a[1]) < 0) gs.push(a[1]); });
  hit.slice(0, 3).forEach(function(a){ gOfWord(a[1], 3).forEach(function(j){ if(gs.indexOf(j) < 0) gs.push(j); }); });
  gd.forEach(function(a){ if(gs.indexOf(a[1]) < 0) gs.push(a[1]); });
  if(gs.length){
    gs = gs.slice(0, 3);
    parts.push('学習ツール ' + gs.length + '件');
    h += '<h2 class="jp-gh">学習ツール（' + gs.length + '）</h2><ul class="jp-ul">' + gs.map(gItem).join('') + '</ul>';
  }
  if(hit.length){
    parts.push('言葉 ' + hit.length + '件');
    h += '<h2 class="jp-gh">言葉（' + hit.length + '）</h2><ul class="jp-ul">' + hit.slice(0, LIM).map(function(a){ return wItem(a[1]); }).join('') + '</ul>'
      + (hit.length > LIM ? '<p class="jp-count">ほか ' + (hit.length - LIM) + '件。言葉を長くすると絞れます。</p>' : '');
  }
  if(body.length){
    parts.push('説明の中 ' + body.length + '件');
    h += '<h2 class="jp-gh">説明に出てくる言葉（' + body.length + '）</h2><ul class="jp-ul">' + body.slice(0, LIMB).map(function(i){ return wItem(i, snip(i, multi[0] || n)); }).join('') + '</ul>'
      + (body.length > LIMB ? '<p class="jp-count">ほか ' + (body.length - LIMB) + '件。</p>' : '');
  }
  if(!h){
    var nr = near(n);
    return '<div class="jp-none"><b>「' + esc(raw) + '」は、この辞書にまだ入っていません。</b><br>言葉を短くするか、別の呼び名で引いてください。</div>'
      + (nr.length ? '<h2 class="jp-gh">近い言葉</h2><ul class="jp-ul">' + nr.map(function(a){ return wItem(a[1]); }).join('') + '</ul>' : '');
  }
  return '<p class="jp-count">「' + esc(raw) + '」で ' + parts.join('・') + '</p>' + h;
}
function listHTML(){
  if(st.failed) return failHTML();
  if(!D) return '<p class="jp-wait">辞書を読み込んでいます…</p>';
  if(st.q) return searchHTML();
  if(st.row >= 0) return rowHTML(st.row);
  if(st.cat && catsOf()[st.cat]) return catHTML(st.cat);
  return startListHTML();
}
function markOn(scroll){
  var bs = E('jpList').querySelectorAll('.jp-it[data-jp-i]'), hit = null;
  for(var k = 0; k < bs.length; k++){
    var b = bs[k], on = +b.getAttribute('data-jp-i') === st.cur;
    b.classList.toggle('on', on);
    if(on){ b.setAttribute('aria-current', 'true'); if(!hit) hit = b; } else b.removeAttribute('aria-current');
  }
  if(scroll && hit && wide()) try{ hit.scrollIntoView({ block:'nearest' }); }catch(e){}
}
function renderList(){ E('jpList').innerHTML = listHTML(); markOn(false); }

/* ---------- 中身 ---------- */
function barHTML(){
  var back = st.q ? '検索結果へ戻る' : st.row >= 0 ? ROWS[st.row][0] + '行の一覧へ戻る' : st.cat && CATN[st.cat] ? CATN[st.cat] + 'の一覧へ戻る' : '一覧へ戻る';
  var h = '<div class="jp-bar"><button type="button" class="jp-back sp" data-jp-back>' + IC.list + '<span>' + back + '</span></button>';
  if(st.hist.length) h += '<button type="button" class="jp-back" data-jp-hb>' + IC.left + '<span>「' + esc(W[st.hist[st.hist.length - 1]].w) + '」へ戻る</span></button>';
  return h + '</div>';
}
function detHTML(i){
  var it = W[i];
  /* 別の呼び名のうち、ひらがなだけのもの（読み）は引くためのもの。画面には出さない */
  var als = (it.al || []).filter(function(a){ return !/^[ぁ-ゟー・\s]+$/.test(a); });
  var h = barHTML() + '<article class="jp-card" aria-labelledby="jpDw">'
    + (CATN[it.cat] ? '<span class="jp-dcat">' + esc(CATN[it.cat]) + '</span>' : '')
    + '<h2 class="jp-dw" id="jpDw" tabindex="-1">' + esc(it.w) + '</h2>'
    + (als.length ? '<p class="jp-dal">別の呼び名：' + als.map(function(a, k){ return '<span class="jp-dal-w">' + esc(a) + (k < als.length - 1 ? '・' : '') + '</span>'; }).join('') + '</p>' : '')
    + '<p class="jp-imi">' + linkify(it.imi, i, 6) + '</p>' + fxHTML(it);
  var rel = (it.rel || []).map(function(w){ return BYW[w]; }).filter(function(x){ return x >= 0; });
  if(rel.length) h += sec('rel', IC.link, '関係する言葉', '<div class="jp-chips">' + rel.map(chip).join('') + '</div>');
  var gl = gOfWord(i, 3);
  if(gl.length) h += sec('gk', IC.cap, '学習ツールで詳しく', '<div class="jp-cards">' + gl.map(gCard).join('') + '</div>');
  h += sec('ask', IC.chat, 'AI師匠に聞く', '<div class="jp-cards">' + asksOf(i).map(askCard).join('') + '</div><p class="jp-snote">AI師匠の画面が開き、この問いをそのまま送ります。</p>');
  return h + noteHTML() + '</article>';
}
function startDetHTML(){
  var pop = popular();
  return '<article class="jp-card jp-start" aria-labelledby="jpDw"><h2 class="jp-dw" id="jpDw" tabindex="-1">辞書の引き方</h2>' + stepsHTML()
    + (pop.length ? sec('pop', IC.star, 'よく使う言葉', '<div class="jp-chips">' + pop.map(chip).join('') + '</div>') : '')
    + noteHTML() + '</article>';
}
function renderDet(){ E('jpDet').innerHTML = st.cur >= 0 && D ? detHTML(st.cur) : startDetHTML(); }

/* ---------- 開く・戻る（アドレスの #w=<言葉> とそろえる） ---------- */
function setHash(w, push){
  var url = location.pathname + location.search + (w ? '#w=' + encodeURIComponent(w) : '');
  try{ if(push) history.pushState({ jw:w || '' }, '', url); else history.replaceState({ jw:w || '' }, '', url); }catch(e){}
}
function show(i, how){
  if(!W[i]) return;
  if(how === 'push' && st.cur >= 0 && st.cur !== i){ st.hist.push(st.cur); if(st.hist.length > 30) st.hist.shift(); }
  if(how === 'fresh' || how === 'pop' || how === 'init') st.hist = [];
  if(!wide() && st.cur < 0) st.listTop = window.pageYOffset || 0;
  st.cur = i;
  addRecent(W[i].w);
  E('jp').classList.add('det');
  E('jpDet').innerHTML = detHTML(i);
  markOn(true);
  document.title = W[i].w + '｜お金の言葉の辞書';
  if(how === 'fresh' || how === 'push' || how === 'hb') setHash(W[i].w, true);
  if(wide()) E('jpMain').scrollTop = 0; else window.scrollTo(0, 0);
  var hd = E('jpDw'); if(hd) try{ hd.focus({ preventScroll:true }); }catch(e){}
}
function goBack(){ var c = st.hist.pop(); if(c >= 0) show(c, 'hb'); }
function clearDet(push){
  st.cur = -1; st.hist = [];
  E('jp').classList.remove('det');
  renderDet(); markOn(false);
  document.title = BASE_TITLE;
  if(push !== null) setHash('', push);
}
function toList(){
  clearDet(true);
  window.scrollTo(0, st.listTop || 0);
  var on = E('jpList').querySelector('.jp-it[data-jp-i="' + st.last + '"]');
  try{ (on || E('jpQ')).focus({ preventScroll:true }); }catch(e){}
}
function hashWord(){
  var m = /(?:^#|[#&])w=([^&]*)/.exec(location.hash || '');
  if(!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
}
function resolve(w){
  if(BYW[w] >= 0) return BYW[w];
  var n = nz(w); if(!n) return -1;
  var h = find(n);
  return h.length && h[0][0] === 100 ? h[0][1] : -1;
}
function route(how){
  if(!D) return;
  var w = hashWord();
  if(w === null || w === ''){ if(st.cur >= 0) clearDet(null); return; }
  var i = resolve(w);
  if(i >= 0){ if(i !== st.cur) show(i, how); return; }
  /* 見出しに無い言葉は、引いた形で一覧に出す */
  E('jpQ').value = w; st.q = w.trim(); st.row = -1; st.cat = '';
  clearDet(null); renderList();
}

/* ---------- 操作 ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-jp-i],[data-jp-row],[data-jp-cat],[data-jp-rows],[data-jp-back],[data-jp-hb],[data-jp-retry]') : null;
  if(!t) return;
  if(t.hasAttribute('data-jp-retry')){ st.failed = false; renderList(); load(function(){ renderList(); renderDet(); route('init'); }); return; }
  if(t.hasAttribute('data-jp-back')){ st.last = st.cur; toList(); return; }
  if(t.hasAttribute('data-jp-hb')){ goBack(); return; }
  if(t.hasAttribute('data-jp-row') || t.hasAttribute('data-jp-cat')){
    st.row = t.hasAttribute('data-jp-row') ? +t.getAttribute('data-jp-row') : -1;
    st.cat = t.getAttribute('data-jp-cat') || '';
    renderList(); E('jpList').scrollTop = 0; if(!wide()) window.scrollTo(0, 0);
    var b = E('jpList').querySelector('[data-jp-rows]'); if(b) try{ b.focus({ preventScroll:true }); }catch(e2){}
    return;
  }
  if(t.hasAttribute('data-jp-rows')){ st.row = -1; st.cat = ''; renderList(); E('jpList').scrollTop = 0; if(!wide()) window.scrollTo(0, 0); return; }
  var i = +t.getAttribute('data-jp-i');
  show(i, E('jpList').contains(t) ? 'fresh' : 'push');
});
E('jpQ').addEventListener('input', function(){
  st.q = this.value.trim(); st.row = -1; st.cat = '';
  if(!wide() && st.cur >= 0) clearDet(false);
  load(function(){ renderList(); E('jpList').scrollTop = 0; });
});
document.addEventListener('keydown', function(e){
  var tg = e.target;
  if(tg && tg.id === 'jpQ'){
    if(e.key === 'Enter'){ var f = E('jpList').querySelector('.jp-it[data-jp-i]'); if(f){ e.preventDefault(); f.click(); } return; }
    if(e.key === 'ArrowDown'){ var f2 = E('jpList').querySelector('.jp-it, .jp-chip, .jp-kana button'); if(f2){ e.preventDefault(); try{ f2.focus(); }catch(e2){} } return; }
    if(e.key === 'Escape' && tg.value){ e.preventDefault(); tg.value = ''; st.q = ''; renderList(); return; }
  }
  if(tg && tg.classList && tg.classList.contains('jp-it') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    var its = Array.prototype.slice.call(E('jpList').querySelectorAll('.jp-it'));
    var p = its.indexOf(tg), nx = e.key === 'ArrowDown' ? p + 1 : p - 1;
    e.preventDefault();
    if(nx < 0){ try{ E('jpQ').focus(); }catch(e3){} return; }
    if(its[nx]) try{ its[nx].focus(); }catch(e4){}
  }
});
window.addEventListener('popstate', function(){ route('pop'); });
window.addEventListener('hashchange', function(){ route('pop'); });
try{
  window.matchMedia('(min-width:900px)').addEventListener('change', function(){ if(D){ renderList(); if(st.cur < 0) renderDet(); } });
}catch(e){}

function boot(){
  E('tbHome').href = hubHref();
  renderDet();
  load(function(){
    renderList();
    if(D){ renderDet(); route('init'); }
  });
}
/* 扉（apply_gate.py が入れる）と会社フォルダの鍵（make_agency.py が入れる）が開くまで、辞書のデータを読まない */
function gateOpen(){
  var c = document.documentElement.className;
  if(/(^|\s)omauth-lock(\s|$)/.test(c)) return false;
  return !E('omgate') || /(^|\s)omgate-open(\s|$)/.test(c);
}
if(gateOpen()) boot();
else {
  try{
    var mo = new MutationObserver(function(){ if(gateOpen()){ mo.disconnect(); boot(); } });
    mo.observe(document.documentElement, { attributes:true, attributeFilter:['class'] });
  }catch(e){ boot(); }
}
})();
</script>
