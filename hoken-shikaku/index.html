方法の組合せとして、誤っているものはどれか。","t":"mc","c":["退職所得 ― 総合課税","利子所得（預貯金） ― 源泉分離課税","土地建物の譲渡所得 ― 申告分離課税","給与所得 ― 総合課税"],"a":0,"exp":"退職所得は分離課税（退職所得控除＋1/2課税）。分離のグループ（退職・山林・土地建物株式の譲渡・利子）を覚えれば消去できる。","topic":"タックス","diff":"重要"},{"q":"不動産所得の損失のうち、土地を取得するための借入金の利子に相当する部分は、他の所得と損益通算できない。","t":"ox","a":true,"exp":"不動産投資の節税トークで必ず出る制限。建物取得分の利子は通算できる。別荘など生活に必要でない資産の損失も通算不可。","topic":"タックス","diff":"重要"},{"q":"1998年4月1日以後に取得した建物の減価償却方法は、定額法に限られる。","t":"ox","a":true,"exp":"建物は定額法のみ（2016年4月以後は附属設備・構築物も）。器具備品などは定率法も選択できる。","topic":"タックス","diff":"応用"},{"q":"総所得金額の計算：事業所得400万円、給与所得100万円、一時所得80万円（特別控除後）の場合、総所得金額はいくらか。","t":"mc","c":["540万円","580万円","500万円","620万円"],"a":0,"exp":"一時所得は2分の1を算入：400＋100＋80×1/2＝540万円。「特別控除後の一時所得をさらに半分にする」手順を体で覚える。","topic":"タックス","diff":"重要"},{"q":"扶養控除のうち、19歳以上23歳未満の特定扶養親族に係る控除額は63万円である。","t":"ox","a":true,"exp":"一般扶養38万円・特定63万円・老人48万円（同居老親等58万円）。大学生年代の子がいる世帯の税負担に直結する数字。","topic":"タックス","diff":"応用"},{"q":"セルフメディケーション税制は、対象医薬品の購入費が年間1万2千円を超えた部分（上限8万8千円）を控除でき、通常の医療費控除と併用できる。","t":"ox","a":false,"exp":"金額は正しいが、通常の医療費控除とは選択適用で併用不可。健康診断の受診など「一定の取組」も要件。","topic":"タックス","diff":"応用"},{"q":"資本金1億円以下の中小法人には、所得800万円以下の部分に軽減税率15%が適用される。","t":"ox","a":true,"exp":"800万円超の部分は23.2%。交際費の800万円定額控除限度など、中小法人の特例数字とセットで覚える。","topic":"タックス","diff":"応用"},{"q":"消費税について、正しい記述はどれか。","t":"mc","c":["基準期間の課税売上高が1,000万円以下の事業者は原則として免税事業者となる","免税事業者は適格請求書（インボイス）を交付できる","簡易課税制度は課税売上高5億円以下まで選択できる","消費税の確定申告期限は法人税と常に同じである"],"a":0,"exp":"免税判定は基準期間（前々年・前々事業年度）1,000万円以下。インボイスを交付できるのは登録した課税事業者のみ、簡易課税は5,000万円以下。","topic":"タックス","diff":"応用"},{"q":"青色申告の承認を受けようとする場合、原則としてその年の3月15日まで（1月16日以後開業なら開業から2ヶ月以内）に申請書を提出する。","t":"ox","a":true,"exp":"期限を過ぎるとその年は白色のまま。青色の特典（65万円控除・純損失の繰越3年・青色事業専従者給与）とセットで出題される。","topic":"タックス","diff":"応用"},{"q":"借地借家法における普通借地権の当初の存続期間は、契約で定めがない場合何年か。","t":"mc","c":["30年","20年","50年","10年"],"a":0,"exp":"普通借地権は30年以上（定めがなければ30年）。更新後は1回目20年・2回目以降10年。一般定期借地権は50年以上・書面（電磁的記録可）で更新なし。","topic":"不動産","diff":"重要"},{"q":"定期建物賃貸借（定期借家）契約は、公正証書等の書面（電磁的記録を含む）で契約し、更新がない旨をあらかじめ説明しなければならない。","t":"ox","a":true,"exp":"書面契約＋事前の書面説明が要件。期間満了で確定的に終了する（再契約は可能）。普通借家との対比で頻出。","topic":"不動産","diff":"応用"},{"q":"区分所有法において、建物の建替え決議に必要な区分所有者および議決権の割合はどれか。","t":"mc","c":["5分の4以上","4分の3以上","3分の2以上","過半数"],"a":0,"exp":"建替えは5分の4以上、規約の設定・変更や共用部分の重大変更は4分の3以上、普通決議は過半数。数字の階段で覚える。","topic":"不動産","diff":"重要"},{"q":"市街化区域内で1,000㎡以上の開発行為を行う場合、原則として都道府県知事等の開発許可が必要である。","t":"ox","a":true,"exp":"市街化区域は1,000㎡以上（三大都市圏の一部は500㎡以上）。市街化調整区域は規模にかかわらず許可が必要。","topic":"不動産","diff":"応用"},{"q":"前面道路の幅員が12m未満の場合の容積率は、指定容積率と「前面道路幅員×法定乗数」のどちらを適用するか。","t":"mc","c":["いずれか小さいほう","いずれか大きいほう","常に指定容積率","常に幅員×乗数"],"a":0,"exp":"住居系は幅員×4/10、その他は×6/10と指定容積率の小さいほう。幅員6m・住居系なら240%が上限になる、という計算問題で出る。","topic":"不動産","diff":"重要"},{"q":"防火地域内に耐火建築物等を建てる場合、建ぺい率が10%緩和される（指定建ぺい率80%の地域では制限なしになる）。","t":"ox","a":true,"exp":"耐火建築物等＋防火地域（準防火地域＋準耐火以上も対象）で＋10%、特定行政庁指定の角地も＋10%。80%地域＋防火＋耐火で100%（制限なし）。","topic":"不動産","diff":"応用"},{"q":"不動産取得税について、誤っている記述はどれか。","t":"mc","c":["相続により取得した場合も課税される","一定の新築住宅は課税標準から1,200万円を控除できる","宅地の課税標準は価格の2分の1とする特例がある","税率は住宅・土地について3%の特例がある"],"a":0,"exp":"相続による取得は非課税（贈与は課税）。新築住宅1,200万円控除・宅地1/2特例・住宅と土地3%はいずれも現行の特例。","topic":"不動産","diff":"応用"},{"q":"譲渡所得の計算で取得費が不明な場合、譲渡収入金額の5%を概算取得費とすることができる。","t":"ox","a":true,"exp":"先祖伝来の土地などで使う概算取得費。実際の取得費が5%を下回る場合も5%を使える。","topic":"不動産","diff":"重要"},{"q":"相続した被相続人の居住用家屋（空き家）を譲渡した場合の3,000万円特別控除は、1981年5月31日以前に建築された家屋であることが要件のひとつである。","t":"ox","a":true,"exp":"旧耐震の空き家が対象で、耐震改修または取壊しが必要（2024年からは譲渡後翌年2月15日までの買主による工事でも可）。相続日から3年後の年末までの譲渡が対象。","topic":"不動産","diff":"応用"},{"q":"土地の有効活用で、土地所有者が土地を出資し、デベロッパーが建設資金を負担して、完成建物を出資割合に応じて取得する方式はどれか。","t":"mc","c":["等価交換方式","事業受託方式","定期借地権方式","建設協力金方式"],"a":0,"exp":"等価交換は土地の一部を手放す代わりに建物を取得し、借入なしで活用できる。各方式の「資金負担が誰か・土地の権利がどうなるか」で整理する。","topic":"不動産","diff":"応用"},{"q":"相続人が配偶者と被相続人の兄1人の場合、配偶者の法定相続分はどれか。","t":"mc","c":["4分の3","3分の2","2分の1","全部"],"a":0,"exp":"配偶者と兄弟姉妹の組合せは3/4・1/4。子がなく親も他界しているケースで、保険や遺言の必要性が高い典型パターン。","topic":"相続・事業承継","diff":"重要"},{"q":"代襲相続について、被相続人の兄弟姉妹の子（甥・姪）の代襲は一代限りである。","t":"ox","a":true,"exp":"子の系統は孫・ひ孫と再代襲するが、兄弟姉妹の系統は甥姪まで。相続放棄した者の子は代襲しない点もあわせて頻出。","topic":"相続・事業承継","diff":"応用"},{"q":"自筆証書遺言について、正しい記述はどれか。","t":"mc","c":["財産目録はパソコンで作成したものでもよい","全文をパソコンで作成できる","法務局保管制度を利用しても家庭裁判所の検認が必要","証人2人以上の立会いが必要"],"a":0,"exp":"本文は自書が必要だが財産目録はパソコン・通帳コピー可（各頁に署名押印）。法務局保管なら検認不要。証人2人が要るのは公正証書遺言。","topic":"相続・事業承継","diff":"重要"},{"q":"相続税額の2割加算の対象となる人はどれか。","t":"mc","c":["被相続人の兄弟姉妹","被相続人の配偶者","代襲相続人である孫","被相続人の子"],"a":0,"exp":"配偶者・一親等の血族（子・父母）と代襲相続人の孫以外は2割加算。孫を養子にした場合は加算対象になる点がひっかけ。","topic":"相続・事業承継","diff":"重要"},{"q":"相続税の課税価格の計算で、葬式費用は債務控除できるが、香典返しの費用は控除できない。","t":"ox","a":true,"exp":"通夜・葬儀費用は控除可、香典返し・法要（初七日等）・墓地購入の未払金は控除不可。細かい線引きが2級らしい出題ポイント。","topic":"相続・事業承継","diff":"応用"},{"q":"相続時精算課税制度について、正しい記述はどれか。","t":"mc","c":["特別控除2,500万円とは別に年110万円の基礎控除がある","一度選択しても暦年課税に戻れる","贈与者は60歳以上の父母・祖父母に限られ、受贈者の年齢要件はない","特別控除を超える部分には一律10%の贈与税が課される"],"a":0,"exp":"2024年から年110万円の基礎控除が新設（この分は相続時の加算対象外・申告不要）。選択後は撤回不可、受贈者は18歳以上の子・孫、超過分は一律20%。","topic":"相続・事業承継","diff":"重要"},{"q":"教育資金の一括贈与の非課税制度の非課税限度額は、受贈者1人につき1,500万円（うち学校等以外への支払いは500万円まで）である。","t":"ox","a":true,"exp":"金融機関との契約で管理し、30歳到達時の残額は原則贈与税の対象。使い切れる金額設計かの検討が実務では重要。","topic":"相続・事業承継","diff":"応用"},{"q":"取引相場のない株式（非上場株式）の相続税評価で、同族株主以外の少数株主が取得した場合に適用される評価方式はどれか。","t":"mc","c":["配当還元方式","類似業種比準方式","純資産価額方式","収益還元方式"],"a":0,"exp":"支配権のない少数株主は配当還元方式（低い評価になりやすい）。同族株主は会社規模に応じ類似業種比準・純資産価額（併用）で評価する。","topic":"相続・事業承継","diff":"応用"},{"q":"小規模宅地等の特例で、貸付事業用宅地等は200㎡まで50%の減額である。","t":"ox","a":true,"exp":"居住用330㎡80%・特定事業用400㎡80%・貸付用200㎡50%。併用時の面積調整計算は実技でも出る。","topic":"相続・事業承継","diff":"重要"},{"q":"相続により不動産を取得した相続人は、相続の開始および所有権の取得を知った日から3年以内に相続登記を申請しなければならない。","t":"ox","a":true,"exp":"2024年4月から相続登記が義務化（正当な理由のない放置は過料の対象）。過去の相続分も対象になる。時事的な頻出改正。","topic":"相続・事業承継","diff":"重要"}]},{"id":"fp1","label":"FP1級","full":"1級FP技能検定（学科）","step":"STEP 3","format":"学科は基礎編（四肢択一50問）＋応用編（記述式）・200点満点","pass":"120点以上（6割）で合格","note":"2級の知識を「例外・特例・計算の細部」まで掘る試験。基礎編は難問対応より、2級レベルの取りこぼしゼロを先に固めるのが定石。ここでは基礎編レベルの想定問題を扱う。","next":"学科合格後は実技（面接または筆記）へ。1級FP＝お金の相談の最高峰資格。","questions":[{"q":"2026年4月以降、65歳以上の在職老齢年金の支給停止調整額は62万円に引き上げられた。","t":"ox","a":true,"exp":"2025年成立の年金改正により50万円→62万円へ。総報酬月額相当額＋基本月額が62万円を超えると超過分の1/2が支給停止。働くシニアの提案に直結する改正。","topic":"ライフ・年金","diff":"応用"},{"q":"老齢厚生年金の繰下げ待機期間中は、加給年金も増額の対象になる。","t":"ox","a":false,"exp":"加給年金と振替加算は繰下げによる増額の対象外で、待機中は支給もされない。加給年金が大きい人は厚生年金を繰り下げない選択も検討に値する。","topic":"ライフ・年金","diff":"重要"},{"q":"中高齢寡婦加算は、夫の死亡時に40歳以上65歳未満で子のない妻などに支給される、遺族厚生年金への加算である。","t":"ox","a":true,"exp":"遺族基礎年金を受けられない妻の穴を埋める加算。65歳以降は自身の老齢基礎年金が始まるため打ち切られ、経過的寡婦加算に切り替わる場合がある。","topic":"ライフ・年金","diff":"応用"},{"q":"健康保険の任意継続被保険者の標準報酬月額は、退職時の標準報酬月額と全被保険者の平均標準報酬月額のいずれか低いほうが上限となる。","t":"ox","a":true,"exp":"高報酬だった人ほど任意継続の保険料に上限メリットが出る。国保（前年所得ベース）・家族の扶養との3択比較が実務の定番。","topic":"ライフ・年金","diff":"応用"},{"q":"国民年金保険料の免除を受けた期間の保険料は、何年前まで遡って追納できるか。","t":"mc","c":["10年","2年","5年","3年"],"a":0,"exp":"追納は10年以内（通常の納付時効は2年）。3年度目以降の追納には加算額が付く。免除期間は追納しないと年金額が減る。","topic":"ライフ・年金","diff":"応用"},{"q":"小規模企業共済の掛金は月額1,000円〜7万円で、全額が小規模企業共済等掛金控除の対象になる。","t":"ox","a":true,"exp":"個人事業主・小規模法人役員の退職金制度。年84万円まで全額所得控除、受取時は退職所得または公的年金等控除。iDeCoと併用できる。","topic":"ライフ・年金","diff":"重要"},{"q":"2019年7月8日以後契約で最高解約返戻率85%超の法人向け定期保険は、当初10年間、支払保険料に最高解約返戻率の90%を乗じた額を資産計上する。","t":"ox","a":true,"exp":"85%超区分の取扱い。11年目以降はピーク年度まで70%を乗じた額。返戻率が高い商品ほど損金性がほぼなくなる構造を正確に。","topic":"リスク管理","diff":"応用"},{"q":"役員退職金のうち功績倍率法等に照らして不相当に高額な部分は、法人の損金に算入されない。","t":"ox","a":true,"exp":"功績倍率法（最終報酬月額×在任年数×功績倍率）が実務・裁判例の代表的な目安。過大退職金の否認は法人保険の出口設計で必ず押さえる。","topic":"リスク管理","diff":"重要"},{"q":"養老保険のハーフタックスプラン（福利厚生プラン）の要件・経理処理として正しいものはどれか。","t":"mc","c":["死亡保険金受取人＝従業員の遺族、満期保険金受取人＝法人とし、保険料の2分の1を損金算入","死亡・満期とも受取人を法人とし、全額損金算入","死亡・満期とも受取人を遺族とし、全額資産計上","役員のみを被保険者として2分の1損金算入"],"a":0,"exp":"遺族／法人の受取人設定で1/2損金（1/2資産計上）。全従業員の普遍的加入が前提で、特定の役員・従業員のみだと給与課税の問題が生じる。","topic":"リスク管理","diff":"重要"},{"q":"相続税における生命保険契約に関する権利（契約者＝被相続人以外、保険料負担者＝被相続人）の評価額は、原則として相続開始時の解約返戻金相当額である。","t":"ox","a":true,"exp":"低解約返戻金型保険の評価を利用した行き過ぎた節税は否認リスクがある点も含め、1級では評価の根拠まで問われる。","topic":"リスク管理","diff":"応用"},{"q":"保険期間中に受け取った個人年金の年金受給権（相続等で取得）の相続税評価は、解約返戻金額・一時金額・予定利率による複利年金現価のうち最も多い金額による。","t":"ox","a":true,"exp":"定期金に関する権利の評価（相続税法24条）。3つの候補の「いずれか多い金額」という判定方法が問われる。","topic":"リスク管理","diff":"応用"},{"q":"金融サービス提供法において、重要事項の説明義務違反や断定的判断の提供により顧客に損害が生じた場合、金融商品販売業者等は損害賠償責任を負う。","t":"ox","a":true,"exp":"元本欠損額が損害額と推定される点が消費者保護の柱。保険販売にも適用される。消費者契約法（取消し）との使い分けも整理する。","topic":"リスク管理","diff":"応用"},{"q":"債券のデュレーションについて、他の条件が同じなら、表面利率が低いほどデュレーションは長くなる。","t":"ox","a":true,"exp":"デュレーションは資金回収の平均期間＝金利感応度。クーポンが低い（またはゼロ）ほど、残存期間が長いほど金利変動の影響を強く受ける。","topic":"金融資産運用","diff":"重要"},{"q":"利回り曲線（イールドカーブ）について、正しい記述はどれか。","t":"mc","c":["景気後退の予兆として長短金利が逆転する逆イールドが注目される","順イールドとは短期金利が長期金利より高い状態をいう","イールドカーブのスティープ化とは曲線が平坦になることをいう","イールドカーブは株式の配当利回りを期間別に並べたものである"],"a":0,"exp":"通常は右上がり（順イールド）。長短逆転（逆イールド）は景気後退のシグナルとされる。スティープ化＝傾き拡大、フラット化＝平坦化。","topic":"金融資産運用","diff":"応用"},{"q":"保有株式の値下がりに備えるオプション戦略として、最も基本的なものはどれか。","t":"mc","c":["プット・オプションの買い","プット・オプションの売り","コール・オプションの買い","コール・オプションの売り"],"a":0,"exp":"プットの買い＝売る権利の取得で下落をヘッジ（プロテクティブ・プット）。オプションの買い手の損失はプレミアムに限定される。","topic":"金融資産運用","diff":"応用"},{"q":"ポートフォリオの収益率6%・標準偏差5%・無リスク金利1%のときのシャープレシオと、収益率9%・標準偏差10%のポートフォリオとの比較として正しいものはどれか。","t":"mc","c":["前者1.0＞後者0.8で、前者のほうが効率的","後者のほうがリターンが高いので常に優れる","両者は同じ効率である","シャープレシオでは比較できない"],"a":0,"exp":"（6−1）/5＝1.0、（9−1）/10＝0.8。リスク調整後では前者が優位。「リターンの高さ」と「効率」を分けて評価するのが試験の狙い。","topic":"金融資産運用","diff":"重要"},{"q":"行動ファイナンスのプロスペクト理論によれば、投資家は同額の利益から得る満足より損失から受ける苦痛を大きく感じる傾向がある。","t":"ox","a":true,"exp":"損失回避性。塩漬け・利小損大の行動を説明する理論として1級で出題される。顧客の意思決定の癖を理解する道具にもなる。","topic":"金融資産運用","diff":"応用"},{"q":"外貨建てMMFの譲渡益（為替差益を含む）は、申告分離課税20.315%の対象である。","t":"ox","a":true,"exp":"外貨預金の為替差益（雑所得・総合）との違いが頻出。外貨建てMMFは上場株式等と同じ扱いで、損益通算・繰越控除も使える。","topic":"金融資産運用","diff":"応用"},{"q":"新NISA口座内で生じた譲渡損失は、特定口座の譲渡益や配当と損益通算できる。","t":"ox","a":false,"exp":"NISA内の損失は税務上ないものとされ、通算も繰越もできない。非課税の代償としてのデメリットで、1級では必ず問われる。","topic":"金融資産運用","diff":"重要"},{"q":"上場株式の配当所得について、2024年度分以降は所得税と住民税で異なる課税方式を選択することができない。","t":"ox","a":true,"exp":"2022年度改正で課税方式が統一（2024年度住民税から適用）。総合課税（配当控除）か申告分離（損益通算）か申告不要かは所税・住民税一体で選ぶ。","topic":"タックス","diff":"応用"},{"q":"役員としての勤続年数が5年以下の者が受ける退職金（特定役員退職手当等）については、退職所得の計算上2分の1課税が適用されない。","t":"ox","a":true,"exp":"特定役員は1/2なし。従業員でも勤続5年以下の短期退職手当等は、控除後300万円超の部分に1/2が適用されない。出口設計の重要な制約。","topic":"タックス","diff":"重要"},{"q":"中小法人の交際費課税について、正しい記述はどれか。","t":"mc","c":["年800万円までの定額控除と、接待飲食費の50%損金算入の有利なほうを選択できる","交際費は全額損金算入できる","1人あたり1万円以下の飲食費も交際費に含めなければならない","定額控除限度額は年400万円である"],"a":0,"exp":"中小法人は800万円定額控除と飲食費50%の選択制。1人1万円以下（2024年4月から5,000円→1万円）の一定の飲食費はそもそも交際費から除外できる。","topic":"タックス","diff":"応用"},{"q":"中古資産を取得した場合の耐用年数（簡便法）は、法定耐用年数の全部を経過した資産では「法定耐用年数×20%」で計算する。","t":"ox","a":true,"exp":"一部経過なら（法定−経過年数）＋経過年数×20%。中古建物投資の減価償却シミュレーションの基礎で、計算問題として出る。","topic":"タックス","diff":"応用"},{"q":"法人が役員に支給する給与のうち、損金算入が認められる代表的なものは、定期同額給与・事前確定届出給与・業績連動給与である。","t":"ox","a":true,"exp":"期中の増額や届出のない賞与は損金不算入になる。役員報酬の設計（保険料の原資づくりを含む）で必須の枠組み。","topic":"タックス","diff":"重要"},{"q":"適格請求書発行事業者となった免税事業者に対する「2割特例」は、売上に係る消費税額の2割を納付税額とできる経過措置である。","t":"ox","a":true,"exp":"インボイス登録を機に課税事業者となった小規模事業者向けの経過措置（適用期限あり）。簡易課税との有利判定まで問われる。","topic":"タックス","diff":"応用"},{"q":"貸家建付地の相続税評価額の計算式はどれか。","t":"mc","c":["自用地評価額×（1−借地権割合×借家権割合×賃貸割合）","自用地評価額×（1−借地権割合）","自用地評価額×借地権割合","自用地評価額×（1−借家権割合）"],"a":0,"exp":"アパート敷地（貸家建付地）の評価減の式。借地権割合60%・借家権割合30%・満室なら18%減。賃貸による評価減は相続対策の基本計算。","topic":"不動産","diff":"重要"},{"q":"都市計画税は、原則として市街化区域内の土地・建物の所有者に課され、税率の上限（制限税率）は0.3%である。","t":"ox","a":true,"exp":"固定資産税（標準税率1.4%）とセットで課税。住宅用地の課税標準特例は都計税では200㎡以下1/3（固定資産税は1/6）と異なる。","topic":"不動産","diff":"応用"},{"q":"個人が法人に対して土地を時価の2分の1未満で譲渡した場合、時価で譲渡したものとみなして譲渡所得が課税される。","t":"ox","a":true,"exp":"法人への低額譲渡はみなし譲渡課税。個人間の低額譲渡では譲受人側に贈与税（時価との差額）が課される。相手が法人か個人かで課税が変わる。","topic":"不動産","diff":"応用"},{"q":"特定事業用資産の買換え特例（事業用資産の買換え）を適用した場合、譲渡益の原則何%相当について課税を繰り延べられるか。","t":"mc","c":["80%","100%","50%","60%"],"a":0,"exp":"原則80%繰延べ（一部の組合せは70%等）。繰延べであって免除ではないため、買換資産の取得価額が圧縮され将来の税負担に影響する。","topic":"不動産","diff":"応用"},{"q":"投資用不動産のNOI利回り（純利回り）は、年間賃料収入から運営費用を差し引いた純収益を投資額で割って求める。","t":"ox","a":true,"exp":"表面利回り（グロス）との差を生むのは空室損・管理費・固定資産税等の運営費用。収益物件の提案書は必ずNOIベースで検証する。","topic":"不動産","diff":"重要"},{"q":"市街化区域内の農地を宅地に転用する場合、農地法上必要な手続きはどれか。","t":"mc","c":["農業委員会への届出","都道府県知事等の許可","農林水産大臣の許可","手続き不要"],"a":0,"exp":"市街化区域内の転用（4条・5条）は許可不要で農業委員会への届出でよい。市街化区域外は知事等の許可が必要。権利移動のみ（3条）は常に許可。","topic":"不動産","diff":"応用"},{"q":"所有権移転の仮登記には、本登記の順位を保全する効力がある。","t":"ox","a":true,"exp":"仮登記のままでは対抗力はないが、本登記をすれば順位は仮登記の時点に遡る。農地の売買予約などで実務に登場する。","topic":"不動産","diff":"応用"},{"q":"遺留分侵害額請求権は、遺留分権利者が相続の開始および侵害する贈与・遺贈を知った時から1年間行使しないと時効消滅する。","t":"ox","a":true,"exp":"2019年改正で金銭債権化（現物返還から金銭請求へ）。相続開始から10年の除斥期間もある。生命保険金は原則遺留分の算定基礎に入らない点が対策の根拠。","topic":"相続・事業承継","diff":"重要"},{"q":"配偶者居住権は、被相続人所有の建物に相続開始時に居住していた配偶者が、原則終身、無償でその建物に住み続けられる権利である。","t":"ox","a":true,"exp":"2020年4月新設。所有権を子、居住権を配偶者に分けることで、配偶者の住まいと生活資金を両立させる遺産分割ができる。評価方法まで1級では問われる。","topic":"相続・事業承継","diff":"応用"},{"q":"非上場株式等についての相続税・贈与税の納税猶予（法人版事業承継税制・特例措置）では、対象株式の全部について納税額の100%が猶予される。","t":"ox","a":true,"exp":"一般措置（2/3・80%）に対し特例措置は全株・100%。適用には特例承継計画の提出と都道府県知事の認定が必要で、雇用要件は弾力化されている。「猶予であって免除ではない」点も必須。","topic":"相続・事業承継","diff":"応用"},{"q":"類似業種比準方式による非上場株式の評価で、比準要素となる3つはどれか。","t":"mc","c":["配当・利益・純資産","売上・利益・従業員数","配当・売上・総資産","利益・純資産・負債"],"a":0,"exp":"1株当たりの配当金額・利益金額・純資産価額（帳簿価額）の3要素を上場類似業種と比較する。利益の比重を下げる自社株対策はこの構造の応用。","topic":"相続・事業承継","diff":"重要"},{"q":"相続財産を譲渡した場合の取得費加算の特例は、相続税の申告期限の翌日以後何年以内の譲渡が対象か。","t":"mc","c":["3年","1年","5年","10年"],"a":0,"exp":"申告期限の翌日から3年以内（＝相続開始から3年10ヶ月以内）の譲渡なら、支払った相続税の一部を取得費に加算できる。納税資金のための売却プランで必ず検討する。","topic":"相続・事業承継","diff":"応用"},{"q":"被相続人が配偶者名義・子名義で積み立てていた預金でも、実質的な資金の出どころ・管理状況から被相続人の財産と認められるもの（名義預金）は相続税の課税対象になる。","t":"ox","a":true,"exp":"税務調査で最も否認が多い論点のひとつ。贈与の実体（契約・通帳管理・受贈者の認識）を整えることが生前対策の基本。","topic":"相続・事業承継","diff":"重要"},{"q":"代償分割において、代償金の支払能力を確保する手段として、生命保険（受取人＝後継相続人）の活用が有効とされる理由として最も適切なものはどれか。","t":"mc","c":["死亡保険金は受取人固有の財産として遺産分割の対象外で、すぐに現金化できるから","死亡保険金は常に相続税が非課税だから","保険金で払う代償金には贈与税がかからなくなるから","保険に入ると遺留分の規定が適用されなくなるから"],"a":0,"exp":"固有財産性と即時の現金化が本質。非課税は500万円×法定相続人の枠まで、代償金の課税関係や遺留分の規定自体は保険でなくならない。","topic":"相続・事業承継","diff":"重要"},{"q":"純資産価額方式による評価では、評価差額（含み益）に対する法人税額等相当額として37%を控除できる。","t":"ox","a":true,"exp":"含み益の37%控除は純資産価額方式の重要な調整。会社規模区分（大・中・小）と評価方式の組合せ（併用割合）もあわせて整理しておく。","topic":"相続・事業承継","diff":"応用"}]}]}]};

/* ============================================================
   2. 保存データ（この端末のみ・外部送信なし）

var STORE_KEY = 'officem.shikaku.v1';
var PASS_RATE = 0.7;            /* どの試験も合格ラインは7割で統一されている */
var MOCK_N = 20;                /* 模擬テストの出題数 */

var state = load();
function load() {
  var d = { days: {}, total: 0, exams: {} };
  try {
    var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && typeof s === 'object') { d.days = s.days || {}; d.total = s.total || 0; d.exams = s.exams || {}; }
  } catch (e) {}
  return d;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function exRec(key) {
  if (!state.exams[key]) state.exams[key] = { attempts: 0, best: null, last: null, wrong: {}, topics: {} };
  return state.exams[key];
}
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
/* 連続学習日数（今日または昨日から途切れず遡れる日数） */
function streakDays() {
  var n = 0, d = new Date();
  var k = todayKey();
  if (!state.days[k]) d.setDate(d.getDate() - 1);   /* 今日まだやっていなければ昨日から数える */
  for (;;) {
    k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    if (!state.days[k]) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ============================================================
   3. アイコン（インラインSVGのみ・絵文字不使用）
   ============================================================ */
var I = {
  o: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4.4 0 7-2.8 7-6.5 0-3-1.7-5-3.2-6.8C14.4 7 13 5.4 13 3c-3 1.5-4.2 4-4.1 6.2-1-.6-1.7-1.4-2.2-2.5C5.3 8.5 5 10.4 5 12c0 5.5 2.6 10 7 10z"/></svg>',
  medal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14.5 7 22l5-3 5 3-1.5-7.5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ============================================================
   4. ホーム（ロードマップ）
   ============================================================ */
function examKey(tr, ex) { return tr.id + '-' + ex.id; }
function findExam(key) {
  for (var i = 0; i < BANK.tracks.length; i++) {
    var tr = BANK.tracks[i];
    for (var j = 0; j < tr.exams.length; j++) {
      if (examKey(tr, tr.exams[j]) === key) return { tr: tr, ex: tr.exams[j] };
    }
  }
  return null;
}
function weakCount(key) {
  var w = exRec(key).wrong, n = 0, k;
  for (k in w) if (w[k] > 0) n++;
  return n;
}

function renderHome() {
  /* 学習状況 */
  var sd = streakDays();
  var doneToday = !!state.days[todayKey()];
  document.getElementById('streakBox').innerHTML =
    '<div class="s-item"><div class="s-num">' + sd + '<small>日</small></div><div class="s-label">' + I.flame + ' 連続学習日数' + (doneToday ? '（今日も学習ずみ）' : '（今日はまだ）') + '</div></div>' +
    '<div class="s-item"><div class="s-num">' + state.total + '<small>問</small></div><div class="s-label">' + I.book + ' これまでに解いた問題</div></div>' +
    '<div class="s-item"><div class="s-num">' + passCount() + '<small>試験</small></div><div class="s-label">' + I.medal + ' 模試で合格ライン到達</div></div>';

  /* 次の目標：ロードマップ順で、模試の最高点がまだ合格ラインに届いていない最初の試験 */
  var goal = null;
  BANK.tracks.forEach(function (tr) {
    tr.exams.forEach(function (ex) {
      if (goal) return;
      var r = state.exams[examKey(tr, ex)];
      if (!r || r.best === null || r.best < 70) goal = { tr: tr, ex: ex, r: r };
    });
  });
  var ng = document.getElementById('nextGoal');
  if (goal) {
    ng.classList.remove('hide');
    ng.innerHTML = I.target + '<span>次の目標：<b>' + esc(goal.tr.label.split('（')[0]) + '／' + esc(goal.ex.label) + '</b>' +
      (goal.r && goal.r.best !== null ? '　模試の最高 ' + goal.r.best + '点 → 合格ラインまであと' + Math.max(0, 70 - goal.r.best) + '点' : '　まずは分野別ドリルから') + '</span>';
  } else {
    ng.classList.remove('hide');
    ng.innerHTML = I.medal + '<span><b>収録している全試験で模試の合格ラインに到達しています。</b>弱点復習で仕上げをどうぞ。</span>';
  }

  /* トラック */
  var html = '';
  BANK.tracks.forEach(function (tr) {
    html += '<h2 class="sec">' + esc(tr.label) + '</h2>' +
      '<p class="sec-sub">' + esc(tr.sub) + '</p>' +
      '<p class="roadline"><b>資格の道順：</b>' + esc(tr.roadmap) + '</p>' +
      '<div class="egrid">' +
      tr.exams.map(function (ex) {
        var key = examKey(tr, ex);
        var r = state.exams[key];
        var wk = weakCount(key);
        var prog;
        if (r && r.best !== null) {
          prog = '<span class="p-best">' + I.medal + ' 模試最高 ' + r.best + '点</span>';
        } else if (r && r.attempts === 0 && r.topics && hasTopics(r)) {
          prog = '<span class="p-none">ドリル学習中</span>';
        } else {
          prog = '<span class="p-none">未挑戦</span>';
        }
        if (wk) prog += '<span class="p-weak">弱点' + wk + '問</span>';
        return '<button type="button" class="ecard t-' + tr.id + '" data-exam="' + key + '">' +
          '<span class="e-step">' + esc(ex.step) + '</span>' +
          '<h3>' + esc(ex.label) + '</h3>' +
          (ex.cert ? '<span class="e-cert">' + esc(ex.cert) + '</span>' : '') +
          '<span class="e-meta">' + esc(ex.format) + '／' + esc(ex.pass) + '</span>' +
          '<span class="e-prog">' + prog + '</span>' +
        '</button>';
      }).join('') + '</div>';
  });
  document.getElementById('trackList').innerHTML = html;
}
function hasTopics(r) { var k; for (k in r.topics) return true; return false; }
function passCount() {
  var n = 0, k;
  for (k in state.exams) if (state.exams[k].best !== null && state.exams[k].best >= 70) n++;
  return n;
}

/* ============================================================
   5. 試験詳細
   ============================================================ */
var curKey = null;

function renderExam(key) {
  curKey = key;
  var f = findExam(key);
  if (!f) return;
  var ex = f.ex, tr = f.tr;
  var r = exRec(key);
  var wk = weakCount(key);

  /* 分野の一覧と正答率 */
  var topics = [], seen = {};
  ex.questions.forEach(function (q) { if (!seen[q.topic]) { seen[q.topic] = true; topics.push(q.topic); } });
  var chips = topics.map(function (tp) {
    var t = r.topics[tp];
    var acc = t && t.t ? Math.round(t.c / t.t * 100) + '%' : '—';
    return '<button type="button" class="tchip" data-topic="' + esc(tp) + '">' + esc(tp) +
      '<span class="tc-acc">正答 ' + acc + '</span></button>';
  }).join('');

  document.getElementById('examBody').innerHTML =
    '<div class="exam-head"><h2>' + esc(ex.full) + '</h2>' +
    (ex.cert ? '<p class="x-cert">' + esc(ex.cert) + '</p>' : '') + '</div>' +
    '<div class="guide">' +
      '<div class="g-row"><span class="g-k">形式</span><span>' + esc(ex.format) + '</span></div>' +
      '<div class="g-row"><span class="g-k">合格</span><span>' + esc(ex.pass) + '</span></div>' +
      '<div class="g-row"><span class="g-k">次へ</span><span>' + esc(ex.next) + '</span></div>' +
      '<p class="g-note">' + esc(ex.note) + '</p>' +
    '</div>' +
    '<p class="stat-line">この試験の記録：模試 <b>' + r.attempts + '回</b>' +
      (r.best !== null ? '　最高 <b>' + r.best + '点</b>　直近 <b>' + r.last + '点</b>' : '') +
      (wk ? '　弱点 <b>' + wk + '問</b>' : '') + '（収録 ' + ex.questions.length + '問）</p>' +
    '<div class="modes">' +
      '<button type="button" class="mode-btn m-drill" id="mDrill"><h4>' + I.book + '分野別ドリル</h4><p>1問ごとにすぐ解説。下の分野を選ぶとその分野だけ集中練習できます。</p></button>' +
      '<button type="button" class="mode-btn m-mock" id="mMock"><h4>' + I.timer + '模擬テスト ' + Math.min(MOCK_N, ex.questions.length) + '問</h4><p>本番と同じく解説は最後まで見ずに連続解答。7割で合格判定します。</p></button>' +
      '<button type="button" class="mode-btn m-weak" id="mWeak"' + (wk ? '' : ' disabled') + '><h4>' + I.redo + '弱点復習' + (wk ? '（' + wk + '問）' : '') + '</h4><p>これまでに間違えた問題だけをもう一度。正解すると弱点から消えます。</p></button>' +
    '</div>' +
    '<div class="topic-chips"><span class="tlead">分野をしぼってドリル：</span>' + chips + '</div>';

  document.getElementById('mDrill').onclick = function () { startQuiz('drill', null); };
  document.getElementById('mMock').onclick = function () { startQuiz('mock', null); };
  if (wk) document.getElementById('mWeak').onclick = function () { startQuiz('weak', null); };
  var tc = document.querySelectorAll('#examBody .tchip');
  for (var i = 0; i < tc.length; i++) {
    tc[i].onclick = function () { startQuiz('drill', this.getAttribute('data-topic')); };
  }
  show('scrExam');
}

/* ============================================================
   6. クイズの進行
   ============================================================ */
var quiz = null;   /* { mode, keys(問題index配列), pos, correct, wrongIdx[], answers[] } */

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz(mode, topic) {
  var f = findExam(curKey);
  if (!f) return;
  var qs = f.ex.questions;
  var idx = [];
  if (mode === 'weak') {
    var w = exRec(curKey).wrong, k;
    for (k in w) if (w[k] > 0 && qs[k]) idx.push(Number(k));
    if (!idx.length) return;
    shuffle(idx);
  } else if (mode === 'mock') {
    for (var i = 0; i < qs.length; i++) idx.push(i);
    shuffle(idx);
    idx = idx.slice(0, Math.min(MOCK_N, idx.length));
  } else {
    for (var j = 0; j < qs.length; j++) if (!topic || qs[j].topic === topic) idx.push(j);
    shuffle(idx);
  }
  quiz = { mode: mode, topic: topic || null, keys: idx, pos: 0, correct: 0, wrongIdx: [], answers: [] };
  show('scrQuiz');
  renderQuestion();
}

function modeLabel() {
  return quiz.mode === 'mock' ? '模擬テスト' : quiz.mode === 'weak' ? '弱点復習' : (quiz.topic ? '分野別ドリル：' + quiz.topic : '分野別ドリル');
}

function renderQuestion() {
  var f = findExam(curKey);
  var q = f.ex.questions[quiz.keys[quiz.pos]];
  document.getElementById('qWhere').innerHTML = esc(f.ex.label) + '　' + esc(modeLabel()) + '　<b>' + (quiz.pos + 1) + '</b> / ' + quiz.keys.length + '問';
  document.getElementById('qBarFill').style.width = Math.round(quiz.pos / quiz.keys.length * 100) + '%';

  var tags = '<div class="q-tags"><span class="q-tag">' + esc(q.topic) + '</span>' +
    (q.diff ? '<span class="q-tag d-' + esc(q.diff) + '">' + esc(q.diff) + '</span>' : '') + '</div>';
  var body;
  if (q.t === 'mc') {
    body = '<div class="ans-mc">' + q.c.map(function (c, i) {
      return '<button type="button" data-a="' + i + '"><span class="mc-n">' + (i + 1) + '</span><span>' + esc(c) + '</span></button>';
    }).join('') + '</div>';
  } else {
    body = '<div class="ans-ox">' +
      '<button type="button" class="a-o" data-a="1">' + I.o + '正しい</button>' +
      '<button type="button" class="a-x" data-a="0">' + I.x + '誤り</button></div>';
  }
  var card = document.getElementById('qCard');
  card.innerHTML = tags + '<p class="q-text">' + esc(q.q) + '</p>' + body;
  var btns = card.querySelectorAll('[data-a]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () { answer(q, this.getAttribute('data-a')); };
  }
}

function answer(q, aStr) {
  var qi = quiz.keys[quiz.pos];
  var ok;
  var picked;
  if (q.t === 'mc') { picked = Number(aStr); ok = picked === q.a; }
  else { picked = aStr === '1'; ok = picked === q.a; }

  /* 記録（総数・日付・分野別・弱点） */
  state.total++;
  state.days[todayKey()] = true;
  var r = exRec(curKey);
  if (!r.topics[q.topic]) r.topics[q.topic] = { c: 0, t: 0 };
  r.topics[q.topic].t++;
  if (ok) {
    r.topics[q.topic].c++;
    delete r.wrong[qi];              /* どのモードでも、正解できたら弱点から外す */
  } else {
    r.wrong[qi] = (r.wrong[qi] || 0) + 1;
  }
  save();

  if (ok) quiz.correct++; else quiz.wrongIdx.push(qi);
  quiz.answers.push({ qi: qi, picked: picked, ok: ok });

  if (quiz.mode === 'mock') { next(); return; }

  /* ドリル・弱点復習：その場で解説 */
  var card = document.getElementById('qCard');
  var btns = card.querySelectorAll('[data-a]');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  var ansText = q.t === 'mc' ? '正解：' + (q.a + 1) + '．' + q.c[q.a] : '正解：' + (q.a ? '正しい（○）' : '誤り（×）');
  card.insertAdjacentHTML('beforeend',
    '<div class="fb ' + (ok ? 'ok' : 'ng') + '">' +
      '<div class="fb-head">' + (ok ? I.o + '正解' : I.x + '不正解') + '</div>' +
      '<div class="fb-ans">' + esc(ansText) + '</div>' +
      '<p class="fb-exp">' + esc(q.exp) + '</p>' +
    '</div>' +
    '<button type="button" class="q-next" id="btnNext">' + (quiz.pos + 1 >= quiz.keys.length ? '結果を見る' : '次の問題へ') + '</button>');
  document.getElementById('btnNext').onclick = next;
  document.getElementById('btnNext').focus();
}

function next() {
  quiz.pos++;
  if (quiz.pos >= quiz.keys.length) { finish(); return; }
  renderQuestion();
}

/* ============================================================
   7. 結果
   ============================================================ */
function finish() {
  var f = findExam(curKey);
  var ex = f.ex;
  var n = quiz.keys.length;
  var score = Math.round(quiz.correct / n * 100);
  var isMock = quiz.mode === 'mock';

  if (isMock) {
    var r = exRec(curKey);
    r.attempts++;
    r.last = score;
    if (r.best === null || score > r.best) r.best = score;
    save();
  }

  /* 分野別の内訳（今回の出題分） */
  var tt = {}, order = [];
  quiz.answers.forEach(function (a) {
    var q = ex.questions[a.qi];
    if (!tt[q.topic]) { tt[q.topic] = { c: 0, t: 0 }; order.push(q.topic); }
    tt[q.topic].t++;
    if (a.ok) tt[q.topic].c++;
  });
  var rows = order.map(function (tp) {
    var p = Math.round(tt[tp].c / tt[tp].t * 100);
    return '<div class="rt-row"><span class="rt-name">' + esc(tp) + '</span>' +
      '<span class="rt-bar"><i class="' + (p < 70 ? 'low' : '') + '" style="width:' + p + '%"></i></span>' +
      '<span class="rt-pct">' + tt[tp].c + '/' + tt[tp].t + '</span></div>';
  }).join('');

  var judge = '';
  if (isMock) {
    judge = score >= 70
      ? '<span class="res-judge pass">' + I.medal + '合格ライン（7割）クリア</span>'
      : '<span class="res-judge fail">' + I.target + 'あと' + (Math.ceil(n * PASS_RATE) - quiz.correct) + '問で合格ライン</span>';
  }
  var note = isMock
    ? '本番の「' + esc(ex.pass) + '」に合わせ、7割を合格ラインとして判定しています。'
    : '「' + esc(modeLabel()) + '」の結果です。間違えた問題は弱点復習に登録されました。';

  var wrongs = quiz.wrongIdx.map(function (qi) {
    var q = ex.questions[qi];
    var ansText = q.t === 'mc' ? (q.a + 1) + '．' + q.c[q.a] : (q.a ? '正しい（○）' : '誤り（×）');
    return '<div class="w-item"><p class="w-q">' + esc(q.q) + '</p>' +
      '<p class="w-a">正解：' + esc(ansText) + '</p>' +
      '<p class="w-exp">' + esc(q.exp) + '</p></div>';
  }).join('');

  document.getElementById('resBody').innerHTML =
    '<div class="res-card">' +
      '<div class="res-score">' + score + '<small>点</small></div>' +
      '<p style="font-size:var(--fs-sm);color:var(--muted);">' + esc(ex.label) + '・' + esc(modeLabel()) + '　' + quiz.correct + '/' + n + '問正解</p>' +
      judge +
      '<p class="res-note">' + note + '</p>' +
      (rows ? '<div class="res-topics"><h4>分野別の正答</h4>' + rows + '</div>' : '') +
      '<div class="res-acts">' +
        '<button type="button" class="btn primary" id="btnRetry">' + I.redo + 'もう一度</button>' +
        '<button type="button" class="btn ghost" id="btnToExam">この試験のメニューへ</button>' +
        '<button type="button" class="btn ghost" id="btnToHome">資格の一覧へ</button>' +
      '</div>' +
    '</div>' +
    (wrongs ? '<div class="wrong-list"><h3>間違えた問題の解説</h3>' + wrongs + '</div>' : '');

  var mode = quiz.mode, topic = quiz.topic;
  document.getElementById('btnRetry').onclick = function () { renderExam(curKey); startQuiz(mode === 'weak' && !weakCount(curKey) ? 'drill' : mode, topic); };
  document.getElementById('btnToExam').onclick = function () { renderExam(curKey); };
  document.getElementById('btnToHome').onclick = goHome;
  show('scrResult');
  window.scrollTo({ top: 0 });
}

/* ============================================================
   8. 画面の切り替え
   ============================================================ */
function show(id) {
  ['scrHome', 'scrExam', 'scrQuiz', 'scrResult'].forEach(function (s) {
    document.getElementById(s).classList.toggle('hide', s !== id);
  });
  window.scrollTo({ top: 0 });
}
function goHome() { renderHome(); show('scrHome'); }

document.getElementById('btnBackHome').onclick = goHome;
document.getElementById('btnQuit').onclick = function () {
  /* 途中でやめても、解いた分の記録は残っている */
  renderExam(curKey);
};
document.getElementById('trackList').addEventListener('click', function (e) {
  var b = e.target.closest('[data-exam]');
  if (b) renderExam(b.getAttribute('data-exam'));
});

goHome();
})();
</script>
</body>
