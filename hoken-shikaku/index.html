<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>保険資格試験トレーニング｜社内用</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b3f5e'/%3E%3Ccircle cx='32' cy='26' r='12' fill='none' stroke='%23f7c34e' stroke-width='5'/%3E%3Cpath d='M24 36 20 54l12-7 12 7-4-18' fill='%23f7c34e'/%3E%3C/svg%3E">
<style>
/* ============================================================
   保険資格試験トレーニング（社内用）
   保険ツール管理センター・社員教育ツールと同じデザイントークン。
   実際の過去問の転載はせず、出題範囲にもとづく想定問題を収録。
   ============================================================ */
:root{
  --navy:#1b3f5e; --navy-2:#27587f; --navy-soft:#eaf1f7;
  --bg:#fff8f2; --white:#fff; --text:#33404d; --muted:#5c6874; --line:#efe2d8;
  --shadow:0 6px 20px rgba(130,100,80,.09); --shadow-sm:0 3px 10px rgba(130,100,80,.07);
  --coral:#f0846a; --coral-btn:#bf4123; --coral-btn-h:#aa391f;
  --coral-text:#bd4523; --coral-bg:#fdeee9; --coral-border:#f4d0c6;
  --green:#2c7a4b; --green-bg:#e8f6ef; --green-border:#c3e5d3;
  --amber:#966417; --amber-bg:#fdf3e2; --amber-border:#f2dcae;
  --sky:#24729f; --sky-bg:#e8f4fb; --sky-border:#c6e2f2;
  --berry:#8f4574; --berry-bg:#fbeef6;
  --red:#c2453f; --red-bg:#fdeee9;
  --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"游明朝体","MS PMincho",serif;
  --fs-xs:.8125rem; --fs-sm:.9rem; --fs-base:1rem; --fs-md:1.125rem;
  --fs-lg:1.35rem; --fs-xl:1.6rem; --fs-2xl:1.9rem;
  --lh-tight:1.5; --lh-base:1.75; --lh-prose:1.95;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;font-size:16px;}
@media(min-width:640px){ html{font-size:16.5px;} }
@media(min-width:1100px){ html{font-size:17px;} }
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",sans-serif;
  color:var(--text);background:var(--bg);font-size:var(--fs-base);line-height:var(--lh-base);
  overflow-wrap:break-word;padding-bottom:60px;}
svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;}
button{font-family:inherit;font-size:inherit;color:inherit;}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px;}
.hide{display:none !important;}

/* ---------- ヘッダー ---------- */
header{background:linear-gradient(135deg,#f7ede3 0%,#fdf6ee 55%,#eef4f8 100%);
  border-bottom:1px solid var(--line);padding:var(--sp-6) 0 var(--sp-5);}
header .h-in{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;}
header .h-art{width:56px;height:56px;flex:none;background:rgba(255,255,255,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
header .h-art svg{width:38px;height:38px;}
header h1{font-family:var(--mincho);font-size:var(--fs-xl);color:var(--navy);letter-spacing:.06em;font-weight:600;line-height:var(--lh-tight);}
header .h-sub{font-size:var(--fs-sm);color:var(--muted);margin-top:3px;}
.badge-int{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:#fff;border-radius:999px;
  padding:4px 13px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;}

/* ---------- 学習状況ストリップ ---------- */
.streak{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin:var(--sp-5) 0;}
.streak .s-item{flex:1 1 150px;background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:var(--sp-3) var(--sp-4);box-shadow:var(--shadow-sm);}
.streak .s-num{font-size:var(--fs-xl);font-weight:700;color:var(--navy);line-height:1.2;}
.streak .s-num small{font-size:var(--fs-sm);font-weight:700;margin-left:2px;}
.streak .s-label{font-size:var(--fs-xs);color:var(--muted);}
.next-goal{background:var(--amber-bg);border:1.5px solid var(--amber-border);border-radius:14px;
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-5);font-size:var(--fs-sm);color:var(--amber);display:flex;align-items:center;gap:var(--sp-2);}
.next-goal b{color:var(--navy);}

/* ---------- トラックとカード ---------- */
h2.sec{font-family:var(--mincho);font-size:var(--fs-lg);color:var(--navy);letter-spacing:.05em;font-weight:600;
  margin:var(--sp-8) 0 var(--sp-2);}
.sec-sub{font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-2);max-width:46em;}
.roadline{font-size:var(--fs-xs);color:var(--muted);background:var(--white);border:1px dashed var(--line);
  border-radius:10px;padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-4);line-height:var(--lh-base);}
.roadline b{color:var(--navy-2);}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--sp-3);}
.ecard{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:var(--sp-4);
  cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:.15s;display:flex;flex-direction:column;gap:6px;}
.ecard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#e3d3c6;}
.ecard .e-step{align-self:flex-start;font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:2px 10px;}
.t-seiho .e-step{background:var(--coral-bg);color:var(--coral-text);}
.t-sonpo .e-step{background:var(--sky-bg);color:var(--sky);}
.t-fp .e-step{background:var(--green-bg);color:var(--green);}
.ecard h3{font-size:var(--fs-md);color:var(--navy);font-weight:700;line-height:var(--lh-tight);}
.ecard .e-cert{font-size:var(--fs-xs);color:var(--berry);font-weight:700;}
.ecard .e-meta{font-size:var(--fs-xs);color:var(--muted);}
.ecard .e-prog{margin-top:auto;display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);font-weight:700;}
.ecard .e-prog .p-best{color:var(--green);}
.ecard .e-prog .p-none{color:var(--muted);font-weight:400;}
.ecard .e-prog .p-weak{color:var(--coral-text);}

/* ---------- 試験画面 ---------- */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);
  color:var(--navy);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:var(--fs-sm);font-weight:700;margin:var(--sp-5) 0;}
.back-btn:hover{background:var(--navy-soft);}
.exam-head h2{font-family:var(--mincho);font-size:var(--fs-xl);color:var(--navy);font-weight:600;letter-spacing:.04em;line-height:var(--lh-tight);}
.exam-head .x-cert{font-size:var(--fs-sm);color:var(--berry);font-weight:700;margin-top:4px;}
.guide{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:var(--sp-4) var(--sp-5);
  margin:var(--sp-4) 0;box-shadow:var(--shadow-sm);}
.guide .g-row{display:flex;gap:var(--sp-2);font-size:var(--fs-sm);margin:3px 0;align-items:baseline;}
.guide .g-k{flex:none;font-weight:700;color:var(--navy-2);font-size:var(--fs-xs);background:var(--navy-soft);
  border-radius:6px;padding:1px 8px;}
.guide .g-note{font-size:var(--fs-sm);color:var(--muted);border-top:1px dashed var(--line);margin-top:var(--sp-2);padding-top:var(--sp-2);line-height:var(--lh-base);}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:var(--sp-3);margin:var(--sp-4) 0;}
.mode-btn{border:1.5px solid var(--line);border-radius:16px;background:var(--white);padding:var(--sp-4);
  cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:.15s;}
.mode-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.mode-btn h4{font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;gap:7px;}
.mode-btn p{font-size:var(--fs-xs);color:var(--muted);margin-top:4px;line-height:var(--lh-base);}
.mode-btn.m-drill h4{color:var(--sky);} .mode-btn.m-drill{border-color:var(--sky-border);}
.mode-btn.m-mock h4{color:var(--coral-text);} .mode-btn.m-mock{border-color:var(--coral-border);}
.mode-btn.m-weak h4{color:var(--amber);} .mode-btn.m-weak{border-color:var(--amber-border);}
.mode-btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}
.topic-chips{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-2) 0 var(--sp-4);}
.topic-chips .tlead{font-size:var(--fs-xs);color:var(--muted);align-self:center;}
.tchip{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font-size:var(--fs-xs);font-weight:700;color:var(--navy-2);cursor:pointer;}
.tchip:hover{background:var(--navy-soft);}
.tchip .tc-acc{font-weight:400;color:var(--muted);margin-left:4px;}
.stat-line{font-size:var(--fs-sm);color:var(--muted);margin:var(--sp-2) 0;}
.stat-line b{color:var(--navy);}

/* ---------- クイズ画面 ---------- */
.q-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin:var(--sp-5) 0 var(--sp-3);flex-wrap:wrap;}
.q-where{font-size:var(--fs-sm);color:var(--muted);font-weight:700;}
.q-where b{color:var(--navy);}
.q-quit{background:none;border:none;color:var(--muted);font-size:var(--fs-xs);cursor:pointer;text-decoration:underline;}
.q-bar{height:8px;background:#f0e6db;border-radius:999px;overflow:hidden;margin-bottom:var(--sp-4);}
.q-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#f7c34e);border-radius:999px;transition:width .25s;}
.q-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:var(--sp-5) var(--sp-6);box-shadow:var(--shadow);}
.q-tags{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3);}
.q-tag{font-size:var(--fs-xs);font-weight:700;border-radius:999px;padding:2px 10px;background:var(--navy-soft);color:var(--navy-2);}
.q-tag.d-重要{background:var(--coral-bg);color:var(--coral-text);}
.q-tag.d-応用{background:var(--amber-bg);color:var(--amber);}
.q-text{font-size:var(--fs-md);line-height:var(--lh-prose);color:var(--text);}
.ans-ox{display:flex;gap:var(--sp-3);margin-top:var(--sp-5);}
.ans-ox button{flex:1;border-radius:16px;border:2px solid;background:var(--white);padding:var(--sp-4);
  font-size:var(--fs-lg);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.12s;}
.ans-ox .a-o{border-color:var(--green-border);color:var(--green);}
.ans-ox .a-o:hover{background:var(--green-bg);}
.ans-ox .a-x{border-color:var(--coral-border);color:var(--coral-text);}
.ans-ox .a-x:hover{background:var(--coral-bg);}
.ans-ox svg{width:1.3em;height:1.3em;}
.ans-mc{display:grid;gap:var(--sp-2);margin-top:var(--sp-5);}
.ans-mc button{text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--white);
  padding:var(--sp-3) var(--sp-4);font-size:var(--fs-base);cursor:pointer;line-height:var(--lh-base);display:flex;gap:10px;transition:.12s;}
.ans-mc button:hover{border-color:var(--navy-2);background:var(--navy-soft);}
.ans-mc .mc-n{flex:none;font-weight:700;color:var(--navy-2);}
.fb{margin-top:var(--sp-4);border-radius:16px;padding:var(--sp-4) var(--sp-5);}
.fb.ok{background:var(--green-bg);border:1.5px solid var(--green-border);}
.fb.ng{background:var(--red-bg);border:1.5px solid var(--coral-border);}
.fb .fb-head{font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;gap:8px;}
.fb.ok .fb-head{color:var(--green);} .fb.ng .fb-head{color:var(--red);}
.fb .fb-ans{font-size:var(--fs-sm);font-weight:700;color:var(--navy);margin-top:4px;}
.fb .fb-exp{font-size:var(--fs-sm);color:var(--text);line-height:var(--lh-prose);margin-top:var(--sp-2);}
.q-next{display:block;width:100%;margin-top:var(--sp-4);background:var(--coral-btn);color:#fff;border:none;
  border-radius:999px;padding:14px;font-size:var(--fs-base);font-weight:700;cursor:pointer;letter-spacing:.04em;}
.q-next:hover{background:var(--coral-btn-h);}

/* ---------- 結果画面 ---------- */
.res-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:var(--sp-6);
  box-shadow:var(--shadow);text-align:center;margin-top:var(--sp-5);}
.res-score{font-family:var(--mincho);font-size:2.6rem;color:var(--navy);font-weight:600;line-height:1.2;}
.res-score small{font-size:var(--fs-md);}
.res-judge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 20px;font-weight:700;margin-top:var(--sp-3);font-size:var(--fs-md);}
.res-judge.pass{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border);}
.res-judge.fail{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border);}
.res-note{font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-3);}
.res-topics{margin-top:var(--sp-5);text-align:left;}
.res-topics h4{font-size:var(--fs-sm);color:var(--navy);margin-bottom:var(--sp-2);}
.rt-row{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-xs);margin:5px 0;}
.rt-name{flex:0 0 11em;color:var(--muted);}
.rt-bar{flex:1;height:9px;background:#f0e6db;border-radius:999px;overflow:hidden;}
.rt-bar i{display:block;height:100%;background:var(--green);border-radius:999px;}
.rt-bar i.low{background:var(--coral);}
.rt-pct{flex:none;width:4.5em;text-align:right;font-weight:700;color:var(--navy);}
.res-acts{display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap;margin-top:var(--sp-5);}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:12px 24px;cursor:pointer;
  font-size:var(--fs-base);font-weight:700;letter-spacing:.03em;border:none;}
.btn.primary{background:var(--coral-btn);color:#fff;} .btn.primary:hover{background:var(--coral-btn-h);}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--navy);}
.btn.ghost:hover{background:var(--navy-soft);}
.wrong-list{margin-top:var(--sp-6);}
.wrong-list h3{font-family:var(--mincho);font-size:var(--fs-lg);color:var(--navy);font-weight:600;margin-bottom:var(--sp-3);}
.w-item{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:12px;
  padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-3);}
.w-q{font-size:var(--fs-sm);font-weight:700;color:var(--text);line-height:var(--lh-base);}
.w-a{font-size:var(--fs-xs);color:var(--coral-text);font-weight:700;margin-top:4px;}
.w-exp{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh-prose);margin-top:var(--sp-2);}

/* ---------- 免責 ---------- */
.notice{margin:var(--sp-8) 0 0;background:var(--white);border:1px dashed var(--line);border-radius:14px;
  padding:var(--sp-4) var(--sp-5);font-size:var(--fs-xs);color:var(--muted);line-height:var(--lh-base);}
.notice b{color:var(--navy-2);}

:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;border-radius:6px;}
@media(max-width:480px){
  .q-card{padding:var(--sp-4);}
  .ans-ox button{font-size:var(--fs-md);padding:var(--sp-3);}
  .rt-name{flex-basis:8em;}
}
</style>
</head>
<body>

<header>
  <div class="wrap h-in">
    <span class="h-art"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="14" fill="none" stroke="#1b3f5e" stroke-width="4.5"/><circle cx="32" cy="24" r="7" fill="#f7c34e"/><path d="M23 34 18 56l14-8 14 8-5-22" fill="#f0846a"/></svg></span>
    <div style="flex:1;min-width:220px;">
      <h1>保険資格試験トレーニング</h1>
      <p class="h-sub">生保協会・損保一般・FP技能検定の想定問題で、自分のペースで力試し。記録はこの端末にだけ残ります。</p>
    </div>
    <span class="badge-int"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>社内用</span>
  </div>
</header>

<main class="wrap">
  <!-- ホーム -->
  <section id="scrHome">
    <div class="streak" id="streakBox"></div>
    <div class="next-goal hide" id="nextGoal"></div>
    <div id="trackList"></div>
    <div class="notice">
      <b>この問題集について：</b>実際の試験問題（過去問）の転載ではなく、各試験の公表されている出題範囲・制度にもとづいて作成した想定問題です。
      制度改正で数字が変わることがあります。受験の際は必ず所属会社配布の最新テキスト・各実施団体（生命保険協会・損害保険協会・きんざい／日本FP協会）の公式情報で確認してください。
      学習記録はこの端末のブラウザにのみ保存され、外部には送信されません。
    </div>
  </section>

  <!-- 試験詳細 -->
  <section id="scrExam" class="hide">
    <button class="back-btn" id="btnBackHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>資格の一覧に戻る</button>
    <div id="examBody"></div>
  </section>

  <!-- クイズ -->
  <section id="scrQuiz" class="hide">
    <div class="q-top">
      <span class="q-where" id="qWhere"></span>
      <button class="q-quit" id="btnQuit">中断して戻る</button>
    </div>
    <div class="q-bar"><i id="qBarFill" style="width:0%"></i></div>
    <div class="q-card" id="qCard"></div>
  </section>

  <!-- 結果 -->
  <section id="scrResult" class="hide">
    <div id="resBody"></div>
  </section>
</main>

<script>
(function () {
'use strict';

/* ============================================================
   1. 問題バンク（build.py が注入する）
   ============================================================ */
var BANK = {"tracks":[{"id":"seiho","label":"生命保険（生保協会の試験）","sub":"一般 → 専門 → 変額 → 応用 の順に受けるのが標準ルート。専門と応用に合格すると称号（LC／SLC）がつく。","roadmap":"一般課程（募集人登録に必須）→ 専門課程（合格でLC＝ライフ・コンサルタント）→ 変額保険販売資格（変額を売るなら必須）→ 応用課程（合格でSLC）→ 大学課程6科目（合格でTLC）","exams":[{"id":"ippan","label":"一般課程","full":"生命保険 一般課程試験","step":"STEP 1","format":"○×式・語群選択式など（100点満点）","pass":"70点以上で合格","note":"生命保険募集人として登録するために必ず合格が必要な最初の試験。テキストの太字・数字（8日・90%・500万円など）を確実に覚えれば届く。","next":"合格・登録したら、次は専門課程へ。","questions":[{"q":"生命保険は、大数の法則と収支相等の原則にもとづいて保険料が計算されている。","t":"ox","a":true,"exp":"多数の被保険者を集めることで死亡率などが安定し（大数の法則）、契約者全体が払う保険料等と会社が支払う保険金等が等しくなるよう（収支相等の原則）保険料が決められる。","topic":"生命保険のしくみ","diff":"基礎"},{"q":"生命保険は貯蓄と同じく、積み立てた分だけが戻ってくる「三角形」のしくみである。","t":"ox","a":false,"exp":"貯蓄が積み立てた分だけ増えていく「三角」なのに対し、保険は契約直後から約束した保障額が確保される「四角」。この違いこそ相互扶助のしくみの核心。","topic":"生命保険のしくみ","diff":"基礎"},{"q":"保険料のうち、将来の保険金支払いの財源になる部分を純保険料、会社運営の経費にあてる部分を付加保険料という。","t":"ox","a":true,"exp":"純保険料は予定死亡率と予定利率をもとに、付加保険料は予定事業費率をもとに計算される。","topic":"保険料と配当","diff":"基礎"},{"q":"保険料の計算に使う予定基礎率は、予定死亡率・予定利率・予定事業費率の3つである。","t":"ox","a":true,"exp":"3つの予定基礎率で保険料が決まる。実際との差から生じる剰余が死差益・利差益・費差益（3利源）で、配当の原資になる。","topic":"保険料と配当","diff":"基礎"},{"q":"予定利率が高く設定されるほど、保険料は高くなる。","t":"ox","a":false,"exp":"予定利率は運用で見込む収益をあらかじめ割り引く率。高いほど割引きが大きくなるので保険料は安くなる。","topic":"保険料と配当","diff":"応用"},{"q":"配当金の原資となる剰余金は、どの3つの差益から生じるか。","t":"mc","c":["死差益・利差益・費差益","売買益・評価益・為替益","予定利率・標準利率・公定歩合"],"a":0,"exp":"予定死亡率・予定利率・予定事業費率と実際との差から生じる死差益・利差益・費差益が3利源。ここから契約者配当が分配される。","topic":"保険料と配当","diff":"基礎"},{"q":"保険会社の責任開始は、申込み・告知（診査）・第1回保険料の払込みの3つがすべて完了したとき（会社が承諾した場合）である。","t":"ox","a":true,"exp":"3つが揃った時点にさかのぼって保障が始まる。順番は前後してもよいが、3つ揃わないうちは保障が始まらないことを顧客に必ず伝える。","topic":"契約の手続き","diff":"基礎"},{"q":"告知は、保険会社が質問した事項に答える「質問応答義務」であり、聞かれていないことまで自発的に申し出る義務はない。","t":"ox","a":true,"exp":"保険法により告知義務は質問応答義務とされている。ただし質問された事項に事実と違う回答をすれば告知義務違反となり、契約解除の対象になりうる。","topic":"契約の手続き","diff":"応用"},{"q":"生命保険募集人には告知受領権があるため、営業職員に口頭で健康状態を伝えれば告知したことになる。","t":"ox","a":false,"exp":"告知受領権があるのは保険会社と会社が指定した診査医。募集人に話しただけでは告知にならない。この誤解はトラブルの定番なので募集時に必ず説明する。","topic":"契約の手続き","diff":"重要"},{"q":"クーリング・オフは、申込日またはクーリング・オフに関する書面の受領日のいずれか遅い日を含めて何日以内に行う必要があるか。","t":"mc","c":["8日以内","14日以内","30日以内"],"a":0,"exp":"いずれか遅い日から8日以内に書面または電磁的記録で申込みの撤回ができる。医師の診査を受けた後などは対象外になる。","topic":"契約の手続き","diff":"重要"},{"q":"契約者は、保険期間の途中で死亡保険金受取人を変更することができる。","t":"ox","a":true,"exp":"契約者は被保険者の同意を得たうえで、保険会社への通知により受取人を変更できる。遺言による変更も可能。","topic":"契約の手続き","diff":"基礎"},{"q":"月払契約の保険料払込猶予期間は、払込期月の翌月初日から翌月末日までである。","t":"ox","a":true,"exp":"月払は翌月末まで。半年払・年払は翌月初日から翌々月の契約応当日（月単位）まで。猶予期間を過ぎて自動振替貸付もできないと契約は失効する。","topic":"約款のきまり","diff":"重要"},{"q":"失効した契約は、いかなる場合でも二度と元に戻すことができない。","t":"ox","a":false,"exp":"所定の期間内なら復活を申し込める。ただし改めて告知（診査）が必要で、延滞保険料の払込みも必要。健康状態によっては復活できないことがある。","topic":"約款のきまり","diff":"基礎"},{"q":"解約返戻金の範囲内で保険会社から貸付を受けられる制度を何というか。","t":"mc","c":["契約者貸付","自動振替貸付","リビング・ニーズ"],"a":0,"exp":"契約者貸付は解約返戻金の一定範囲内で資金を借りられる制度。自動振替貸付は保険料の立替え。混同しやすいので区別して覚える。","topic":"約款のきまり","diff":"基礎"},{"q":"保険料の払込みが困難になったとき、保障額を下げて保険料を安くする方法として「減額」がある。","t":"ox","a":true,"exp":"減額のほか、払済保険（以後の払込みをやめ保険金額を下げて同種の保険を続ける）、延長保険（定期保険に変える）という継続の工夫がある。安易な解約より先に案内する。","topic":"約款のきまり","diff":"重要"},{"q":"被保険者が契約から一定期間（多くは3年）内に自殺した場合、死亡保険金は支払われない。","t":"ox","a":true,"exp":"約款の免責事由。ほかに契約者・受取人の故意など。免責期間経過後の扱いなど詳細は約款で確認する。","topic":"約款のきまり","diff":"基礎"},{"q":"告知義務違反による解除は、会社が解除の原因を知ってから1ヶ月、または契約締結から一定期間（多くは2年）を経過すると行えなくなる。","t":"ox","a":true,"exp":"解除権には期間の制限がある。ただし詐欺による取消しには期間制限の適用がないなど、悪質な場合は別扱い。","topic":"約款のきまり","diff":"応用"},{"q":"定期保険は、保険期間内に死亡したときに死亡保険金が支払われ、満期保険金はない。","t":"ox","a":true,"exp":"いわゆる掛捨て型で、同じ保障額なら保険料が最も安い。満期保険金がないことは必ず説明する。","topic":"商品知識","diff":"基礎"},{"q":"養老保険は、死亡保険金と満期保険金が同額の保険である。","t":"ox","a":true,"exp":"保険期間内の死亡なら死亡保険金、満期まで生存なら同額の満期保険金。保障と貯蓄を兼ねるぶん保険料は高い。","topic":"商品知識","diff":"基礎"},{"q":"終身保険の保障は一生涯続くが、保険料の払込みも必ず一生涯続けなければならない。","t":"ox","a":false,"exp":"払込みは有期払（60歳までなど）と終身払から選べる。保障が一生涯であることと払込期間は別。","topic":"商品知識","diff":"基礎"},{"q":"収入保障保険は、死亡時から満期まで年金形式で保険金が支払われ、受取総額は死亡時期が遅いほど少なくなる。","t":"ox","a":true,"exp":"残り期間分だけ年金が出るしくみなので、経過とともに受取総額は減っていく。そのぶん保険料が割安で、遺族の生活費に合わせやすい。","topic":"商品知識","diff":"応用"},{"q":"医療保険の入院給付金は、被保険者本人が受け取った場合、所得税の課税対象になる。","t":"ox","a":false,"exp":"身体の傷害に基因して支払われる入院給付金・手術給付金などは非課税。配偶者や生計を一にする親族が受け取った場合も非課税。","topic":"税金","diff":"重要"},{"q":"がん保険には、一般に契約から90日程度の待ち期間（免責期間）があり、その間にがんと診断されても給付金は支払われない。","t":"ox","a":true,"exp":"待ち期間中の診断は契約無効となる商品が多い。乗換えの際に空白が生じないよう特に注意が必要。","topic":"商品知識","diff":"重要"},{"q":"災害割増特約や傷害特約は、不慮の事故などによる死亡・障害に対して主契約に上乗せで支払う特約である。","t":"ox","a":true,"exp":"特約はあくまで主契約に付加するもので、主契約が消滅（解約・払済など）すると特約も消滅するのが原則。","topic":"商品知識","diff":"基礎"},{"q":"学資保険（こども保険）の多くは、契約者である親が死亡すると、以後の保険料払込みが免除されたうえで祝金・満期金は予定どおり受け取れる。","t":"ox","a":true,"exp":"保険料払込免除が学資保険の核となる保障機能。貯蓄との一番の違いとして説明できるようにする。","topic":"商品知識","diff":"基礎"},{"q":"個人年金保険で、年金受取開始前に被保険者が死亡した場合は、一般に既払込保険料相当額の死亡給付金が支払われる。","t":"ox","a":true,"exp":"受取開始前の死亡保障は既払込保険料相当が中心で、大きな死亡保障はない。死亡保障目的の保険ではないことを理解して販売する。","topic":"商品知識","diff":"応用"},{"q":"2012年以後の契約（新制度）における生命保険料控除は、一般・介護医療・個人年金の3区分で、所得税ではそれぞれ最高いくら控除できるか。","t":"mc","c":["各4万円（合計最高12万円）","各5万円（合計最高15万円）","各2万8千円（合計最高8万4千円）"],"a":0,"exp":"新制度は所得税で各枠最高4万円・合計12万円、住民税で各枠最高2万8千円・合計7万円。旧制度（一般・個人年金の2区分、各5万円）との違いも問われやすい。","topic":"税金","diff":"重要"},{"q":"契約者＝被保険者（夫）、受取人＝相続人（妻）の死亡保険金は相続税の課税対象となり、「500万円×法定相続人の数」の非課税枠がある。","t":"ox","a":true,"exp":"非課税枠は受取人が相続人である場合に使える。相続放棄した人が受け取った分には適用されない。","topic":"税金","diff":"重要"},{"q":"契約者と死亡保険金受取人が同じ人（例：契約者＝夫、被保険者＝妻、受取人＝夫）の場合、受け取った保険金は贈与税の対象になる。","t":"ox","a":false,"exp":"契約者（保険料負担者）＝受取人なら一時所得として所得税・住民税の対象。契約者・被保険者・受取人がすべて別人のときに贈与税になる。3パターンの整理は頻出。","topic":"税金","diff":"重要"},{"q":"契約者＝受取人が受け取る満期保険金は一時所得となり、特別控除50万円を引いた残りの2分の1が他の所得と合算して課税される。","t":"ox","a":true,"exp":"一時所得＝（受取金−払込保険料−50万円）×1/2。満期金・解約返戻金・契約者＝受取人の死亡保険金に共通する計算。","topic":"税金","diff":"応用"},{"q":"保険業法300条では、保険募集にあたって虚偽のことを告げることや、重要な事項を告げないことが禁止されている。","t":"ox","a":true,"exp":"300条の禁止行為の代表。ほかに告知妨害・不告知の教唆、不利益事実を告げない乗換募集、特別利益の提供、誤解を招く比較表示などがある。","topic":"コンプライアンス","diff":"重要"},{"q":"契約者に保険料の一部を立て替えてあげる「サービス」は、成約のためであれば認められる。","t":"ox","a":false,"exp":"保険料の立替え・肩代わり、金品の供与や割引の約束は保険業法300条が禁止する特別利益の提供にあたる。少額でも不可。","topic":"コンプライアンス","diff":"重要"},{"q":"既契約を解約させて新契約を勧める場合、予定利率や告知など契約者に不利益となりうる事実を説明しなければならない。","t":"ox","a":true,"exp":"不利益事実を告げない乗換募集は300条違反。予定利率の変化、告知義務が再度発生すること、免責期間が振り出しに戻ることなどを必ず説明する。","topic":"コンプライアンス","diff":"重要"},{"q":"保険募集では、顧客の意向を把握し、それに沿った商品を提案し、契約前に意向と合っているか確認すること（意向把握義務）が法律で求められている。","t":"ox","a":true,"exp":"改正保険業法（2016年施行）で意向把握義務・情報提供義務が導入された。「契約概要」「注意喚起情報」の交付・説明とセットで覚える。","topic":"コンプライアンス","diff":"重要"},{"q":"生命保険契約者保護機構は、保険会社が破綻した場合、原則として責任準備金等の何%まで補償するか。","t":"mc","c":["90%","100%","80%"],"a":0,"exp":"高予定利率契約を除き責任準備金等の90%まで補償。銀行の預金保険（元本1,000万円）との違いを問う形でよく出る。","topic":"生命保険のしくみ","diff":"重要"},{"q":"少額短期保険業者が扱う保険は、保険金額が少額・保険期間が短期のもので、生命保険契約者保護機構の補償対象外である。","t":"ox","a":true,"exp":"少額短期保険は保護機構の対象外。生命保険料控除の対象にもならない。","topic":"生命保険のしくみ","diff":"応用"},{"q":"個人情報である契約内容や健康状態は、家族から問い合わせがあれば本人の同意なく答えてよい。","t":"ox","a":false,"exp":"契約内容・告知内容は機微性の高い個人情報。たとえ家族でも本人の同意なく開示してはならない（指定代理請求など約款上の制度による場合を除く）。","topic":"コンプライアンス","diff":"基礎"},{"q":"公的年金や公的医療保険などの社会保障制度を理解しておくことは、私的保険である生命保険の提案に役立つ。","t":"ox","a":true,"exp":"生命保険は社会保障の不足を補う私的保障。遺族年金や高額療養費を踏まえて必要保障額を考えるのが正しい募集活動の出発点。","topic":"生命保険のしくみ","diff":"基礎"},{"q":"第1回保険料充当金を受け取ったのに会社に送金せず流用することは、犯罪となりうる重大な違反である。","t":"ox","a":true,"exp":"保険料の流用・費消は業務上横領にあたりうる最も重大な違反行為のひとつ。金銭の取扱いルールは厳格に守る。","topic":"コンプライアンス","diff":"基礎"},{"q":"契約転換制度を利用すると、元の契約の責任準備金等を新契約の一部にあてられるが、転換後の保険料は転換時の年齢・保険料率で計算される。","t":"ox","a":true,"exp":"転換は「下取り」。告知も新たに必要で、旧契約の高い予定利率は引き継がれない。この2点を告げない転換募集は不利益事実の不説明になる。","topic":"契約の手続き","diff":"応用"}]},{"id":"senmon","label":"専門課程","full":"生命保険 専門課程試験","step":"STEP 2","cert":"合格するとLC（ライフ・コンサルタント）","format":"○×式・選択式（100点満点）","pass":"70点以上で合格","note":"一般課程より一歩深く、税務・制度・商品のしくみが問われる。ここを固めるとお客様への説明が一気に上手くなる。","next":"合格したら、変額保険販売資格と応用課程へ。","questions":[{"q":"営業保険料は純保険料と付加保険料で構成され、純保険料はさらに死亡保険料と生存保険料に分けられる。","t":"ox","a":true,"exp":"死亡保障の財源が死亡保険料、満期金・年金など生存給付の財源が生存保険料。商品による保険料の違いを構成から説明できるとよい。","topic":"保険料のしくみ","diff":"基礎"},{"q":"ソルベンシー・マージン比率は保険会社の健全性を示す指標で、200%を下回ると金融庁による早期是正措置の対象となる。","t":"ox","a":true,"exp":"通常の予測を超えるリスクへの支払余力を示す。200%はあくまで行政措置の基準であり、高ければ高いほど余力があることを意味する。","topic":"会社の健全性","diff":"重要"},{"q":"生命保険会社が破綻した場合、生命保険契約者保護機構により保険金額の90%が必ず補償される。","t":"ox","a":false,"exp":"補償されるのは「保険金額」ではなく「責任準備金等」の90%（高予定利率契約を除く）。破綻後は予定利率引下げ等により保険金額自体が減ることがある。","topic":"会社の健全性","diff":"応用"},{"q":"契約転換をする場合、被保険者は改めて告知または診査を受ける必要がある。","t":"ox","a":true,"exp":"転換は新契約の締結。告知義務・免責期間とも振り出しに戻る。健康状態によっては転換できないこともあわせて説明する。","topic":"契約の見直し","diff":"重要"},{"q":"払済保険に変更すると、以後の保険料払込みは不要になるが、原則として特約は消滅する。","t":"ox","a":true,"exp":"払済・延長保険への変更で入院特約などは消滅する。保障の見直し提案では「何が残り、何が消えるか」を必ず確認する。","topic":"契約の見直し","diff":"重要"},{"q":"個人年金保険料税制適格特約を付けるには、年金受取人が契約者またはその配偶者で、かつ被保険者と同一であることが必要である。","t":"ox","a":true,"exp":"ほかに保険料払込期間10年以上、確定・有期年金の場合は年金開始60歳以降かつ受取期間10年以上という要件がある。要件を満たすと個人年金保険料控除の枠が使える。","topic":"個人年金と税","diff":"重要"},{"q":"個人年金保険料税制適格特約の要件を満たさない個人年金保険の保険料は、生命保険料控除の対象にまったくならない。","t":"ox","a":false,"exp":"適格特約がない場合は「一般」の生命保険料控除の対象になる。個人年金枠か一般枠かの違いであり、控除自体が受けられないわけではない。","topic":"個人年金と税","diff":"応用"},{"q":"確定年金は、被保険者の生死にかかわらず契約時に定めた期間の年金が支払われる。","t":"mc","c":["正しい","被保険者が生存している間だけ支払われる","被保険者が死亡すると打ち切られる"],"a":0,"exp":"確定年金は生死に関係なく所定期間支払われ、受取開始後に死亡した場合は残存期間分が遺族に支払われる。生存中のみ支払われるのは終身年金・有期年金。","topic":"個人年金と税","diff":"基礎"},{"q":"終身年金は同条件の確定年金に比べて、被保険者が長生きするほど受取総額が多くなるが、早く死亡すると少なくなる。","t":"ox","a":true,"exp":"終身年金は長生きリスクへの備え。早期死亡時の目減りを補うのが保証期間付終身年金で、保証期間中は生死にかかわらず支払われる。","topic":"個人年金と税","diff":"基礎"},{"q":"リビング・ニーズ特約は、余命6ヶ月以内と判断されたとき、死亡保険金の全部または一部（通例3,000万円限度）を生前に受け取れる特約である。","t":"ox","a":true,"exp":"特約保険料は不要。被保険者本人が受け取る生前給付金は非課税。ただし受け取って使い切らずに死亡した残額は相続財産として相続税の対象になる。","topic":"生前給付と特約","diff":"重要"},{"q":"指定代理請求特約により、被保険者本人が請求できない特別な事情があるとき、あらかじめ指定した代理人が給付金等を請求できる。","t":"ox","a":true,"exp":"がんの告知を受けていない場合や意識不明の場合などに備える特約。代理請求人の範囲や指定の変更方法まで確認しておく。","topic":"生前給付と特約","diff":"基礎"},{"q":"特定（三大）疾病保障保険は、特定疾病保険金を受け取ると契約が消滅し、その後死亡しても死亡保険金は支払われない。","t":"ox","a":true,"exp":"特定疾病保険金の支払いで契約は終了する。特定疾病に該当せず死亡した場合は同額の死亡保険金が出る。生前受取分は非課税。","topic":"生前給付と特約","diff":"応用"},{"q":"被保険者本人が受け取った入院給付金・手術給付金・通院給付金は非課税だが、配偶者が受け取った場合は課税される。","t":"ox","a":false,"exp":"身体の傷害に基因して支払われる給付金は、本人のほか配偶者・直系血族・生計を一にする親族が受け取っても非課税。","topic":"給付金と税","diff":"重要"},{"q":"一時払養老保険を契約から5年以内に解約した場合の差益は、金融類似商品として20.315%の源泉分離課税となる。","t":"ox","a":true,"exp":"保険期間5年以下または5年以内の解約で一定要件に該当すると金融類似商品扱い。5年超なら一時所得。銀行窓販でよく問われる論点。","topic":"給付金と税","diff":"応用"},{"q":"契約者が受け取る配当金は、その年の雑所得として毎年課税される。","t":"ox","a":false,"exp":"契約者配当は支払保険料の戻りとみなされ、受取時には課税されない。満期時等に生命保険料控除や一時所得の計算で払込保険料から差し引いて精算される。","topic":"給付金と税","diff":"応用"},{"q":"解約返戻金は、契約者が受け取ると一時所得として課税対象になる（払込保険料と特別控除を差し引いた残額の2分の1）。","t":"ox","a":true,"exp":"満期保険金と同じ扱い。払込保険料総額を下回る解約返戻金なら課税は生じない。","topic":"給付金と税","diff":"基礎"},{"q":"遺族基礎年金を受け取れるのは、死亡した人に生計を維持されていた「子のある配偶者」または「子」である。","t":"ox","a":true,"exp":"子のない配偶者には遺族基礎年金は出ない。ここが民間の死亡保障で補うべき典型的な穴として提案の起点になる。","topic":"社会保障の知識","diff":"重要"},{"q":"遺族厚生年金の額は、原則として死亡した人の老齢厚生年金（報酬比例部分）の4分の3である。","t":"ox","a":true,"exp":"必要保障額の計算に不可欠な数字。子のない40歳以上の妻には中高齢寡婦加算が上乗せされる場合がある。","topic":"社会保障の知識","diff":"重要"},{"q":"健康保険の傷病手当金は、連続3日の待期のあと、休業4日目から通算1年6ヶ月、標準報酬日額の約3分の2が支給される。","t":"ox","a":true,"exp":"働けないときの公的保障の柱。国民健康保険にはこの制度がないため、自営業者には就業不能への民間の備えがより重要になる。","topic":"社会保障の知識","diff":"重要"},{"q":"総合福祉団体定期保険は、企業が保険料を負担して従業員等を一括して被保険者とする1年更新の定期保険で、保険料は原則損金算入できる。","t":"ox","a":true,"exp":"従業員の遺族保障（弔慰金・死亡退職金）の財源準備が目的。加入には従業員（被保険者）の同意が必要。","topic":"法人・団体の保険","diff":"応用"},{"q":"団体信用生命保険は、住宅ローンの返済中に債務者が死亡した場合、保険金でローン残高が弁済されるしくみである。","t":"ox","a":true,"exp":"受取人は金融機関（債権者）。加入していれば遺族に住宅ローンは残らないため、必要保障額の計算では住居費の見方が大きく変わる。","topic":"法人・団体の保険","diff":"基礎"},{"q":"こども（学資）保険は、被保険者である子どもが死亡した場合でも、満期まで契約が続き満期保険金が支払われる。","t":"ox","a":false,"exp":"被保険者（子）が死亡すると契約は消滅し、死亡給付金（多くは既払込保険料相当）が支払われる。契約者（親）死亡の場合の払込免除と混同しない。","topic":"商品知識の深掘り","diff":"応用"},{"q":"低解約返戻金型終身保険は、保険料払込期間中の解約返戻金を低く抑える代わりに保険料を割安にした終身保険である。","t":"ox","a":true,"exp":"払込満了後は通常水準に戻る。払込期間中に解約すると大きく元本割れすることを必ず説明する。","topic":"商品知識の深掘り","diff":"基礎"},{"q":"無選択型・引受基準緩和型の保険は、告知項目が少ない（または不要な）代わりに、保険料は通常の商品より割高である。","t":"ox","a":true,"exp":"健康に不安がある人向けの商品。割高な保険料や当初の削減期間など、通常商品との違いを丁寧に説明したうえで、まず通常商品の引受可否を検討するのが原則。","topic":"商品知識の深掘り","diff":"重要"},{"q":"外貨建て保険は、為替レートの変動により、円換算の受取額が払込保険料を下回るおそれがある。","t":"ox","a":true,"exp":"為替リスクは契約者が負う。市場価格調整（MVA）や解約控除がある商品も多く、金融サービス提供法・適合性の原則を踏まえた丁寧な説明が必要。","topic":"商品知識の深掘り","diff":"重要"},{"q":"契約者（保険料負担者）が夫、年金受取人が妻の個人年金保険で年金受取が始まった場合、年金開始時に贈与税の課税関係が生じる。","t":"ox","a":true,"exp":"年金開始時に年金受給権が夫から妻へ贈与されたものとして課税される。契約形態による課税の違いは個人年金でも頻出。","topic":"個人年金と税","diff":"応用"},{"q":"生命保険募集人が顧客の告知書に「持病は書かないほうが通りやすい」と助言することは、告知妨害・不告知の教唆として禁止されている。","t":"ox","a":true,"exp":"保険業法300条の禁止行為。発覚すれば契約解除で顧客に保険金が支払われない事態を招き、募集人・会社とも重い処分を受ける。","topic":"コンプライアンス","diff":"重要"},{"q":"保険金の支払事由が発生したことを知ったとき、募集人は顧客に請求手続きを案内する義務的な役割を担う。","t":"ox","a":true,"exp":"請求案内はアフターフォローの中核。請求もれ防止（入院給付金・手術給付金・通院など複数の支払事由の確認）まで行うのがプロの仕事。","topic":"コンプライアンス","diff":"基礎"},{"q":"既払込保険料より受け取った解約返戻金が少ない場合でも、他の一時所得と損益通算して差引きできる。","t":"ox","a":false,"exp":"生命保険の解約差損はなかったものとされ、他の所得との損益通算はできない。同一年の他の一時所得の内部でのみ通算される。","topic":"給付金と税","diff":"応用"},{"q":"銀行窓口で保険を販売する場合も、販売するのはあくまで保険であり、預金とは異なり預金保険の対象外であることを説明しなければならない。","t":"ox","a":true,"exp":"銀行窓販では「預金ではないこと」「元本保証がない場合があること」「保護機構の補償内容」の説明が必須。誤認防止措置が法令で求められている。","topic":"コンプライアンス","diff":"重要"}]},{"id":"hengaku","label":"変額保険販売資格","full":"変額保険販売資格試験","step":"STEP 3","cert":"変額保険・変額個人年金を売るための必須資格","format":"○×式・選択式（100点満点）","pass":"70点以上で合格","note":"専門課程合格が受験の前提。「最低保証があるのは死亡保険金だけ」「リスクは契約者が負う」という2本柱から枝を広げると覚えやすい。","next":"合格すると変額商品の募集ができる。次は応用課程でSLCへ。","questions":[{"q":"変額保険の保険料は、定額保険の資産とは分離された特別勘定で運用される。","t":"ox","a":true,"exp":"特別勘定は主に株式・債券等で運用され、実績がそのまま保険金額や解約返戻金に反映される。定額保険の一般勘定との分離が変額の大前提。","topic":"しくみの基本","diff":"基礎"},{"q":"変額保険の運用がうまくいかなかった場合、その損失は保険会社が負担する。","t":"ox","a":false,"exp":"特別勘定の運用リスク（投資リスク）は契約者が負う。ここが定額保険との最大の違いであり、募集時に最も丁寧に説明すべき点。","topic":"しくみの基本","diff":"重要"},{"q":"変額保険の死亡保険金には基本保険金額という最低保証があり、運用実績が悪くても基本保険金額を下回らない。","t":"ox","a":true,"exp":"死亡保険金＝基本保険金額＋変動保険金。変動保険金がマイナスでも死亡保険金は基本保険金額が保証される。","topic":"しくみの基本","diff":"重要"},{"q":"変額保険の解約返戻金にも、死亡保険金と同じように最低保証がある。","t":"ox","a":false,"exp":"解約返戻金と（有期型の）満期保険金に最低保証はなく、運用実績によっては払込保険料を大きく下回る。最低保証の有無の整理が試験でも実務でも最重要。","topic":"しくみの基本","diff":"重要"},{"q":"変額保険（有期型）の満期保険金は、運用実績によっては基本保険金額を下回ることがある。","t":"ox","a":true,"exp":"満期保険金は満期時の特別勘定の実績で決まり、最低保証はない。死亡保険金だけが基本保険金額を保証される。","topic":"しくみの基本","diff":"応用"},{"q":"変額保険を募集・販売するには、一般課程・専門課程に合格したうえで、変額保険販売資格試験に合格し登録を受ける必要がある。","t":"ox","a":true,"exp":"変額商品は資格がなければ販売できない。無資格募集は重大なコンプライアンス違反となる。","topic":"販売のルール","diff":"基礎"},{"q":"変額保険・変額個人年金は「特定保険契約」として、金融商品取引法の販売・勧誘ルール（適合性の原則など）が準用される。","t":"ox","a":true,"exp":"市場リスクを顧客が負う保険は特定保険契約。適合性の原則・断定的判断の提供の禁止・契約締結前交付書面など、投資商品と同等のルールが適用される。","topic":"販売のルール","diff":"重要"},{"q":"「過去の運用実績から見て、将来も年5%程度で増えることは確実です」という説明は、実績の紹介なので問題ない。","t":"ox","a":false,"exp":"断定的判断の提供にあたり禁止。過去の実績は将来を保証しない旨をあわせて説明し、複数の利回り前提のシミュレーションで示すのが正しい。","topic":"販売のルール","diff":"重要"},{"q":"適合性の原則とは、顧客の知識・経験・財産の状況・契約目的に照らして不適当な勧誘をしてはならないという原則である。","t":"ox","a":true,"exp":"投資経験のない高齢者に退職金の大半で変額商品を勧めるような募集が典型的な問題例。意向把握とあわせて記録を残すことが重要。","topic":"販売のルール","diff":"重要"},{"q":"特別勘定は複数の運用タイプ（株式型・債券型・バランス型など）から選択でき、契約後に繰入比率の変更や積立金の移転（スイッチング）ができる商品が多い。","t":"ox","a":true,"exp":"スイッチングの回数制限や手数料は商品ごとに異なる。契約後のメンテナンスまで案内できるようにしておく。","topic":"特別勘定と運用","diff":"基礎"},{"q":"特別勘定の積立金の評価額（ユニットプライス）は、月に1回だけ算出される。","t":"ox","a":false,"exp":"ユニットプライスは原則として日々算出・公表される。積立金額はこれに応じて毎日変動する。","topic":"特別勘定と運用","diff":"応用"},{"q":"変額保険は、運用実績が物価上昇に連動しうるという意味で、定額保険よりインフレに対応しやすい面がある。","t":"ox","a":true,"exp":"定額保険は金額が固定のためインフレで実質価値が目減りする。変額はインフレ対応が期待できる半面、下振れリスクも負う。両面をセットで説明する。","topic":"しくみの基本","diff":"応用"},{"q":"変額個人年金保険では、年金原資や年金額は運用実績によって変動する。","t":"ox","a":true,"exp":"年金原資・死亡給付金の最低保証の有無や水準は商品によって異なる。保証の内容（ある・ない・何%か）を商品ごとに必ず確認する。","topic":"変額個人年金","diff":"基礎"},{"q":"変額個人年金保険の死亡給付金には、払込保険料相当額を最低保証するものがある。","t":"ox","a":true,"exp":"運用期間中の死亡給付金は既払込保険料相当を最低保証する商品が多い。ただし保証のない商品もあるため約款・パンフレットで確認する。","topic":"変額個人年金","diff":"応用"},{"q":"変額個人年金保険の保険料は、個人年金保険料控除の対象になる。","t":"ox","a":false,"exp":"変額個人年金は税制適格特約を付けられず、個人年金枠ではなく「一般」の生命保険料控除の対象。試験でも実務でも間違えやすい重要ポイント。","topic":"税金","diff":"重要"},{"q":"変額保険の死亡保険金の課税関係は、定額保険と同様に契約形態（契約者・被保険者・受取人の関係）で決まる。","t":"ox","a":true,"exp":"変額でも課税ルールは同じ。契約者＝被保険者なら相続税（非課税枠あり）、契約者＝受取人なら一時所得、三者別人なら贈与税。","topic":"税金","diff":"基礎"},{"q":"変額保険の解約時に、経過年数によっては解約控除が差し引かれることがある。","t":"ox","a":true,"exp":"早期解約では解約控除により受取額がさらに減る。運用リスクとあわせて「短期での解約に向かない商品」であることを説明する。","topic":"しくみの基本","diff":"応用"},{"q":"契約締結前交付書面や「特別勘定のしおり」等を用いて、リスク・費用を契約前に説明することが求められる。","t":"ox","a":true,"exp":"特定保険契約では契約締結前の書面交付・説明が義務。費用（保険関係費・運用関係費・解約控除）とリスクの説明が中心になる。","topic":"販売のルール","diff":"重要"},{"q":"顧客が被った運用の損失を募集人が事後に補てんすることは、顧客保護のためであれば認められる。","t":"ox","a":false,"exp":"損失補てん・利益保証の約束はいずれも禁止。特別利益の提供にもあたる重大な違反行為。","topic":"販売のルール","diff":"重要"},{"q":"変額保険の運用対象に株式が含まれる場合、株価の下落だけでなく、金利や為替の変動も積立金額に影響しうる。","t":"ox","a":true,"exp":"特別勘定の運用対象に応じて価格変動・金利・為替・信用などのリスクを負う。選択した特別勘定ごとのリスク特性を説明する。","topic":"特別勘定と運用","diff":"基礎"},{"q":"変額保険では、契約者が特別勘定の個別の株式銘柄を直接指定して売買を指示できる。","t":"ox","a":false,"exp":"契約者が選べるのは特別勘定（運用タイプ）まで。個別銘柄の運用は保険会社（委託した運用会社）が行う。投資信託の仕組みに近い。","topic":"特別勘定と運用","diff":"応用"},{"q":"変額保険と有価証券（投資信託）の違いとして、変額保険には死亡保障がある点が挙げられる。","t":"ox","a":true,"exp":"変額保険＝投資機能＋保障機能。「投資信託に保障がついたもの」と分解して比較説明すると顧客に伝わりやすい。ただし費用構造の違いも必ず示す。","topic":"しくみの基本","diff":"基礎"},{"q":"変額保険の基本保険金額を減額した場合、減額部分に応じて死亡保障の最低保証も小さくなる。","t":"ox","a":true,"exp":"減額は部分解約と同じ扱いで、解約控除が引かれることもある。保障の最低保証水準が変わることを説明する。","topic":"しくみの基本","diff":"応用"},{"q":"変額個人年金の据置（運用）期間中に解約した場合の解約返戻金には、最低保証がないのが一般的である。","t":"ox","a":true,"exp":"死亡給付金に最低保証があっても、解約返戻金は運用実績次第で元本割れする。「死亡時」と「解約時」の保証の違いを混同させない説明が必要。","topic":"変額個人年金","diff":"重要"},{"q":"変額保険の販売時には、複数の運用利回り前提（例：−1%・0%・3%など）による受取額の試算を示すことが望ましい。","t":"ox","a":true,"exp":"良い場合だけでなく悪い場合の数字も見せるのが適正募集。都合のよいシナリオだけの提示は誤解を招く表示になりうる。","topic":"販売のルール","diff":"基礎"},{"q":"変額保険の保険関係費用・運用関係費用は契約者が負担するが、その内容は契約前に開示されている。","t":"ox","a":true,"exp":"保険関係費（保障・契約維持）と運用関係費（信託報酬等）が積立金から控除される。費用が実績を押し下げる要因になることまで説明する。","topic":"特別勘定と運用","diff":"応用"},{"q":"市場リスクの説明を省略して「銀行預金より有利です」とだけ伝えて変額個人年金を販売することは、不適正募集にあたる。","t":"ox","a":true,"exp":"預金との誤認を招く比較・リスク不説明は典型的な不適正募集。特に銀行窓販では預金でないことの明示が必須。","topic":"販売のルール","diff":"重要"},{"q":"変額保険の積立金額が増えている場合、その増加分を毎年受け取って生活費にあてる引出し機能が必ず付いている。","t":"ox","a":false,"exp":"引出しや定期受取の可否・条件は商品による。「必ず」ではない。機能の有無は商品ごとにパンフレット・約款で確認する。","topic":"変額個人年金","diff":"応用"},{"q":"高齢の顧客に変額商品を販売する場合、家族の同席や複数回の面談など、社内ルールに沿った慎重な手続きが求められる。","t":"ox","a":true,"exp":"高齢者募集ルールは適合性の原則の具体化。理解度の確認・親族同席・翌日以降の再確認など、会社の定める手続きを省略しない。","topic":"販売のルール","diff":"重要"},{"q":"変額保険の「変動保険金」は、いったんプラスになれば以後マイナスになることはない。","t":"ox","a":false,"exp":"変動保険金は毎日の運用実績で増減し、プラスからマイナスに転じることもある。確定するのは支払事由発生時。","topic":"しくみの基本","diff":"応用"}]},{"id":"oyo","label":"応用課程","full":"生命保険 応用課程試験","step":"STEP 4","cert":"合格するとSLC（シニア・ライフ・コンサルタント）","format":"○×式・選択式・計算問題（100点満点）","pass":"70点以上で合格","note":"税務・社会保障・相続をつかってお客様の設計図を描く力が問われる。計算問題（必要保障額・退職所得など）は手を動かして慣れるのが近道。","next":"合格したらSLC。さらに上の大学課程（6科目・TLC）が最終ゴール。","questions":[{"q":"必要保障額は「遺族の支出見込額から、遺族年金・配偶者の収入・貯蓄などの収入見込額を差し引いた不足分」として計算する。","t":"ox","a":true,"exp":"必要保障額＝遺族の支出−遺族の収入。末子の成長とともに減っていくのが通常で、収入保障保険や逓減定期が形として合いやすい。","topic":"必要保障額の設計","diff":"重要"},{"q":"住宅ローン返済中の人が団体信用生命保険に加入している場合、必要保障額の計算では以後の住居費としてローン返済額を見込む必要はない。","t":"ox","a":true,"exp":"団信でローンは完済されるため遺族の支出から除ける。ただし固定資産税・管理費・修繕費は残ることに注意。","topic":"必要保障額の設計","diff":"応用"},{"q":"子どもが独立した後は、一般に死亡保障の必要額は子育て期より小さくなり、医療・介護・老後資金の準備の優先度が上がる。","t":"ox","a":true,"exp":"ライフステージで必要保障は変わる。定期的な見直し（減額・払済の活用を含む）を提案するのがコンサルティング営業の基本。","topic":"必要保障額の設計","diff":"基礎"},{"q":"遺族基礎年金は、子のない30歳の配偶者にも支給される。","t":"ox","a":false,"exp":"遺族基礎年金は「子のある配偶者」または「子」だけ。子のない配偶者には出ない（厚生年金加入者の死亡なら遺族厚生年金の可能性はある）。","topic":"社会保障と年金","diff":"重要"},{"q":"老齢年金の繰下げ受給は1ヶ月あたり0.7%増額され、75歳まで繰り下げると最大84%の増額になる。","t":"ox","a":true,"exp":"繰上げは1ヶ月あたり0.4%減額（最大24%減）。損益分岐の説明は老後設計の定番トーク。","topic":"社会保障と年金","diff":"重要"},{"q":"公的介護保険の第2号被保険者（40〜64歳）は、原因を問わず要介護認定を受ければサービスを利用できる。","t":"ox","a":false,"exp":"第2号は末期がん・若年性認知症など16の特定疾病が原因の場合に限られる。原因を問わないのは65歳以上の第1号被保険者。","topic":"社会保障と年金","diff":"重要"},{"q":"障害基礎年金の1級の年金額は、2級の1.25倍である。","t":"ox","a":true,"exp":"障害年金は就業不能保障設計の土台。1級＝2級×1.25、子の加算があること、初診日要件・保険料納付要件もあわせて押さえる。","topic":"社会保障と年金","diff":"応用"},{"q":"退職所得は「（収入金額−退職所得控除額）×2分の1」で計算され、他の所得と分離して課税される。","t":"ox","a":true,"exp":"退職所得控除は勤続20年まで年40万円、20年超の部分は年70万円（最低80万円）。長期勤続ほど税負担が軽いしくみ。","topic":"退職金と税","diff":"重要"},{"q":"勤続30年で退職した場合の退職所得控除額はいくらか。","t":"mc","c":["1,500万円","1,200万円","800万円"],"a":0,"exp":"40万円×20年＋70万円×10年＝800万＋700万＝1,500万円。この範囲内の退職金なら税金はかからない。計算問題の定番。","topic":"退職金と税","diff":"重要"},{"q":"役員退職金の適正額の目安として使われる功績倍率法は「最終報酬月額×役員在任年数×功績倍率」で計算する。","t":"ox","a":true,"exp":"過大な部分は法人の損金と認められないおそれがある。法人保険の出口（解約返戻金と退職金の相殺）設計の基礎知識。","topic":"退職金と税","diff":"応用"},{"q":"2019年7月以降の契約に係る法人契約の定期保険は、最高解約返戻率が50%以下であれば保険料の全額を損金算入できる。","t":"ox","a":true,"exp":"最高解約返戻率で区分：50%以下は全額損金、50%超70%以下は当初4割資産計上、70%超85%以下は6割資産計上、85%超はさらに厳しい取扱い。","topic":"法人保険の税務","diff":"重要"},{"q":"最高解約返戻率が70%超85%以下の法人契約定期保険は、当初の所定期間、支払保険料の6割を資産計上する。","t":"ox","a":true,"exp":"損金にできるのは4割。「返戻率が高いほど損金は小さい」という原則で覚えると整理しやすい。","topic":"法人保険の税務","diff":"応用"},{"q":"法人が受け取った死亡保険金は、資産計上額との差額が益金となり、法人税の課税対象になる。","t":"ox","a":true,"exp":"法人受取の保険金は益金。死亡退職金・弔慰金の支払いを損金として組み合わせることで課税を調整するのが実務の基本形。","topic":"法人保険の税務","diff":"応用"},{"q":"被相続人の死亡により遺族が受け取る弔慰金は、業務上の死亡なら普通給与の3年分、業務外なら6ヶ月分まで相続税がかからない。","t":"ox","a":true,"exp":"非課税限度を超える部分は死亡退職金として扱われ、退職手当金等の非課税枠（500万円×法定相続人）の対象になる。","topic":"相続と贈与","diff":"応用"},{"q":"相続税の基礎控除額は「3,000万円＋600万円×法定相続人の数」である。","t":"ox","a":true,"exp":"妻と子2人なら3,000万＋600万×3＝4,800万円。課税価格がこの範囲内なら相続税はかからない。すべての相続対策トークの出発点。","topic":"相続と贈与","diff":"重要"},{"q":"配偶者の税額軽減により、配偶者が取得した財産は1億6,000万円または法定相続分のいずれか多い金額まで相続税がかからない。","t":"ox","a":true,"exp":"ただし配偶者に寄せすぎると二次相続で子の負担が重くなる。一次・二次をセットで考えるのが応用課程レベルの提案。","topic":"相続と贈与","diff":"重要"},{"q":"被相続人の兄弟姉妹が相続人となる場合、その兄弟姉妹の相続税額は2割加算される。","t":"ox","a":true,"exp":"配偶者・一親等の血族（子・父母）以外は2割加算。孫養子も加算対象だが、代襲相続人となった孫は加算されない。","topic":"相続と贈与","diff":"応用"},{"q":"遺留分は、兄弟姉妹を含むすべての法定相続人に認められている。","t":"ox","a":false,"exp":"兄弟姉妹に遺留分はない。遺留分は原則2分の1（直系尊属のみが相続人の場合は3分の1）。遺言＋生命保険で遺留分対策を設計する場面で必須の知識。","topic":"相続と贈与","diff":"重要"},{"q":"死亡保険金は受取人固有の財産であり、原則として遺産分割協議の対象にならず、受取人が単独で請求できる。","t":"ox","a":true,"exp":"分割協議を待たず現金化できるため、納税資金・代償分割の資金・遺留分対策として生命保険が使われる根拠になっている。","topic":"相続と贈与","diff":"重要"},{"q":"暦年贈与の基礎控除は年110万円だが、相続開始前の一定期間（2024年以降順次7年まで延長）内の贈与は相続財産に加算される。","t":"ox","a":true,"exp":"2024年改正で加算期間が3年から7年に段階的に延長。延長された4年分は総額100万円まで加算されない。生前贈与プランの前提が変わった重要改正。","topic":"相続と贈与","diff":"応用"},{"q":"相続時精算課税制度を選択すると、特別控除2,500万円とは別に、2024年以降は年110万円の基礎控除が使える。","t":"ox","a":true,"exp":"2024年改正で年110万円の基礎控除が新設され、この範囲内の贈与は申告不要・相続時の加算もなし。選択後は暦年課税に戻れない点は変わらない。","topic":"相続と贈与","diff":"応用"},{"q":"生命保険料の負担者と被保険者が同じで、受取人が相続人である死亡保険金の非課税限度額は「500万円×法定相続人の数」である。","t":"ox","a":true,"exp":"現金で残すより保険金で残すほうが非課税枠のぶん有利になる。相続対策としての生命保険の第一の機能。","topic":"相続と贈与","diff":"重要"},{"q":"小規模宅地等の特例では、被相続人の自宅の土地について、要件を満たせば330㎡まで評価額を80%減額できる。","t":"ox","a":true,"exp":"特定居住用330㎡80%減、特定事業用400㎡80%減、貸付用200㎡50%減。適用には申告が必要。","topic":"相続と贈与","diff":"応用"},{"q":"iDeCo（個人型確定拠出年金）の掛金は小規模企業共済等掛金控除として全額所得控除の対象になる。","t":"ox","a":true,"exp":"拠出時は全額所得控除、運用中は非課税、受取時は退職所得控除または公的年金等控除。「入口・道中・出口」の3段階で優遇を整理する。","topic":"老後資金の設計","diff":"重要"},{"q":"iDeCoの老齢給付金を一時金で受け取る場合は退職所得、年金で受け取る場合は雑所得（公的年金等控除の対象）となる。","t":"ox","a":true,"exp":"会社の退職金と同時期に一時金で受け取ると退職所得控除の重複調整がかかる。受取時期の設計が手取りを左右する。","topic":"老後資金の設計","diff":"応用"},{"q":"高額療養費制度があるため、医療費の自己負担には月ごとの上限があるが、差額ベッド代や先進医療の技術料は対象外である。","t":"ox","a":true,"exp":"対象外の費用（差額ベッド・食事・先進医療の技術料）こそ民間医療保険で備える領域。公的保障の説明とセットで提案する。","topic":"社会保障と年金","diff":"重要"},{"q":"6つの係数のうち、目標額を貯めるために毎年いくら積み立てればよいかを求めるときに使うのは減債基金係数である。","t":"ox","a":true,"exp":"目標額×減債基金係数＝毎年の積立額。逆に毎年の積立額から将来額を求めるのは年金終価係数。ライフプラン計算の道具として使い分ける。","topic":"老後資金の設計","diff":"応用"},{"q":"事業保障資金の目安は、短期債務の返済額と当面の運転資金（固定費の数ヶ月〜1年分）を合計して見積もる。","t":"ox","a":true,"exp":"社長にもしものとき会社を守る資金＝借入返済＋運転資金＋（役員退職金・弔慰金）。法人向け死亡保障の必要額算定の基本式。","topic":"法人保険の税務","diff":"応用"},{"q":"長期平準定期保険は保険期間が長期にわたる定期保険で、解約返戻金のピークを役員退職の時期に合わせる出口設計が行われる。","t":"ox","a":true,"exp":"ピーク時に解約して返戻金を退職金の財源にあて、益金と損金を相殺するのが典型。ピークを過ぎると返戻率は下がっていくため出口の時期管理が命。","topic":"法人保険の税務","diff":"応用"},{"q":"個人年金保険の年金受取開始後に受け取る毎年の年金は、雑所得として課税される。","t":"ox","a":true,"exp":"年金額から対応する払込保険料を差し引いた部分が雑所得。相続等で取得した年金受給権には二重課税調整のしくみがある。","topic":"老後資金の設計","diff":"応用"}]}]},{"id":"sonpo","label":"損害保険（損保一般試験）","sub":"基礎単位が必須。売る商品に応じて自動車・火災・傷害疾病の商品単位を追加で取る。資格は5年ごとの更新制。","roadmap":"基礎単位（必須）→ 商品単位（自動車保険・火災保険・傷害疾病保険。扱う商品の単位に合格）→ 5年ごとに更新試験。さらに上を目指すなら損保大学課程（専門コース・コンサルティングコース）","exams":[{"id":"kiso","label":"基礎単位","full":"損害保険募集人一般試験 基礎単位","step":"STEP 1","format":"CBT方式・40分","pass":"満点の70%以上で合格","note":"募集のルール（保険業法・保険法）と損害保険のしくみが中心。「してはいけない募集行為」と「告知・通知」まわりを固めれば合格が見える。","next":"合格したら、扱う商品の単位（自動車・火災・傷害疾病）へ。","questions":[{"q":"損害保険を募集するには、損害保険募集人として登録を受け、一般試験（基礎単位）に合格している必要がある。","t":"ox","a":true,"exp":"登録と試験合格が募集の前提。商品単位は扱う商品に応じて取得する。資格は5年ごとの更新制であることも覚えておく。","topic":"募集のルール","diff":"基礎"},{"q":"保険募集にあたっては、自分が保険会社の代理人として契約締結権を持つ（代理）のか、勧誘のみを行う（媒介）のかを顧客に明示しなければならない。","t":"ox","a":true,"exp":"権限明示義務。代理店は代理（締結権あり）が基本、保険仲立人や生保募集は媒介。立場によって契約成立のタイミングが変わる。","topic":"募集のルール","diff":"重要"},{"q":"保険業法300条では、重要事項の不説明・虚偽の説明・告知妨害・特別利益の提供などが禁止行為とされている。","t":"ox","a":true,"exp":"禁止行為の柱。保険料の立替えや物品の供与も特別利益の提供にあたる。違反は登録取消や業務停止につながる。","topic":"募集のルール","diff":"重要"},{"q":"顧客から「他社と比較したい」と言われた場合、自社に有利な項目だけを抜き出した比較表を使ってよい。","t":"ox","a":false,"exp":"誤解させるおそれのある比較表示は禁止。比較説明は保険期間・保険金額・補償範囲など前提を揃え、根拠を示して行う。","topic":"募集のルール","diff":"重要"},{"q":"保険募集では、顧客の意向を把握し、意向に沿った商品を提案し、契約前に最終的な意向と合致しているか確認する義務がある。","t":"ox","a":true,"exp":"意向把握義務。情報提供義務（契約概要・注意喚起情報の交付）とセットで、改正保険業法により導入された募集の基本ルール。","topic":"募集のルール","diff":"重要"},{"q":"保険法における告知義務は、保険会社が告知を求めた事項に答える質問応答義務である。","t":"ox","a":true,"exp":"自発的申告義務ではなく質問応答義務。故意・重過失による不告知や虚偽告知は、危険増加に関する所定の要件のもとで契約解除の原因になる。","topic":"保険法の知識","diff":"重要"},{"q":"契約締結後に建物の用途を住宅から店舗に変更するなど危険が高くなった場合、契約者は保険会社に通知する義務がある。","t":"ox","a":true,"exp":"通知義務。告知義務が「契約時」なのに対し、通知義務は「契約後」の危険の増加に関するもの。怠ると保険金が支払われないことがある。","topic":"保険法の知識","diff":"重要"},{"q":"保険価額とは、保険の対象の評価額（被りうる損害の最高見積額）のことをいう。","t":"ox","a":true,"exp":"保険価額＝対象の評価額、保険金額＝契約で定めた支払いの限度額。この2つの関係で全部保険・一部保険・超過保険が決まる。","topic":"損保のしくみ","diff":"基礎"},{"q":"保険金額が保険価額より小さい一部保険では、損害額の全額が常に支払われる。","t":"ox","a":false,"exp":"一部保険では保険金額と保険価額の割合に応じて保険金が削減される（比例てん補）。実損払いにするには適正な保険金額の設定が必要。","topic":"損保のしくみ","diff":"重要"},{"q":"保険金額が保険価額を超える超過保険でも、支払われる保険金は実際の損害額が限度である。","t":"ox","a":true,"exp":"損害保険は利得禁止（実損てん補）が原則。保険を掛けすぎても損害額以上は受け取れないため、保険料の無駄になる。","topic":"損保のしくみ","diff":"重要"},{"q":"同じ対象に複数の保険契約がある重複保険の場合、それぞれの契約から損害額を超えて二重に保険金を受け取れる。","t":"ox","a":false,"exp":"重複保険でも受け取れるのは損害額まで。契約時に他の保険契約の有無を確認・告知するのはこのため。","topic":"損保のしくみ","diff":"応用"},{"q":"損害保険契約が有効に成立するには、被保険者が保険の対象について経済的な利益（被保険利益）を持っていることが必要である。","t":"ox","a":true,"exp":"被保険利益のない契約は無効。他人の家に勝手に火災保険を掛けられないのはこの原則による。","topic":"損保のしくみ","diff":"応用"},{"q":"損害保険の保険料も、大数の法則と収支相等の原則にもとづいて算出される。","t":"ox","a":true,"exp":"さらに保険料と事故率が見合う公平の原則（給付・反対給付均等の原則）も働く。構造は生保と共通。","topic":"損保のしくみ","diff":"基礎"},{"q":"保険期間が1年を超える保険契約には、原則としてクーリング・オフ制度の適用がある。","t":"ox","a":true,"exp":"損保のクーリング・オフは保険期間1年超の契約が対象（法人契約や自賠責など対象外あり）。書面等の受領日と申込日のいずれか遅い日から8日以内。","topic":"募集のルール","diff":"応用"},{"q":"自賠責保険は、自動車を運行するすべての人に加入が義務づけられた強制保険である。","t":"ox","a":true,"exp":"未加入運行は法律違反（罰則あり）。対人賠償に限られ、対物や自分のケガは対象外。任意保険で上乗せする構造を説明できるように。","topic":"商品の基礎知識","diff":"基礎"},{"q":"自賠責保険の支払限度額は、被害者1名あたり死亡3,000万円、傷害120万円である。","t":"ox","a":true,"exp":"後遺障害は等級に応じ最高4,000万円。この限度を超える賠償は任意の対人賠償保険でカバーする。数字は頻出。","topic":"商品の基礎知識","diff":"重要"},{"q":"火災保険では、地震・噴火・津波による損害も当然に補償される。","t":"ox","a":false,"exp":"地震・噴火・津波による損害（これらによる火災を含む）は火災保険では免責。備えるには地震保険の付帯が必要。募集時の最重要説明事項のひとつ。","topic":"商品の基礎知識","diff":"重要"},{"q":"地震保険は単独では契約できず、火災保険に付帯して契約する。","t":"ox","a":true,"exp":"保険金額は主契約の30〜50%の範囲で、建物5,000万円・家財1,000万円が上限。国と保険会社が共同で運営する制度であることも特徴。","topic":"商品の基礎知識","diff":"重要"},{"q":"傷害保険が対象とするケガは「急激・偶然・外来」の3要件を満たす事故によるものである。","t":"ox","a":true,"exp":"3要件は傷害疾病分野の土台。靴ずれや病気による転倒など、要件を欠くものは対象外になる。","topic":"商品の基礎知識","diff":"重要"},{"q":"損害保険契約者保護機構により、自賠責保険と地震保険は保険会社が破綻しても保険金が100%補償される。","t":"ox","a":true,"exp":"自賠責・地震保険は100%。その他の契約は破綻後3ヶ月内の事故は保険金100%、それ以外は80%が原則。生保の保護機構との違いを整理する。","topic":"保険法の知識","diff":"応用"},{"q":"保険料は保険会社が引受けの対価として受け取るお金であり、募集人が受け取った保険料を私的に流用することは重大な犯罪となりうる。","t":"ox","a":true,"exp":"保険料の分別管理・速やかな精算は代理店業務の基本。流用は業務上横領にあたりうる。","topic":"募集のルール","diff":"基礎"},{"q":"個人情報保護法上、契約者の同意なく取得目的の範囲を超えて個人データを第三者に提供してはならない。","t":"ox","a":true,"exp":"健康状態や事故歴などの情報はとくに慎重に扱う。目的外利用・無断提供は法令違反になる。","topic":"募集のルール","diff":"基礎"},{"q":"保険金請求の相談を受けた募集人は、事故の状況をよく確認し、契約者に不利にならないよう速やかに保険会社への事故報告を案内すべきである。","t":"ox","a":true,"exp":"事故時の対応こそ代理店の存在価値。通知の遅れは保険金支払いに影響することがあるため、初動の案内が重要。","topic":"募集のルール","diff":"基礎"},{"q":"共同保険とは、1つの保険契約を複数の保険会社が割合を定めて共同で引き受けるしくみである。","t":"ox","a":true,"exp":"大口物件などで使われる。再保険（引き受けたリスクを保険会社間で分散する）としくみを区別して覚える。","topic":"損保のしくみ","diff":"応用"},{"q":"保険代理店が顧客に保険料の割引・割戻しを独自に約束することは、サービスの一環として認められる。","t":"ox","a":false,"exp":"保険料の割引・割戻しの約束は特別利益の提供として禁止。保険料は認可・届出された料率にもとづくもので、代理店が勝手に変えられない。","topic":"募集のルール","diff":"重要"},{"q":"「注意喚起情報」には、告知義務・クーリング・オフ・免責事由など、顧客にとって不利益になりうる事項が記載されている。","t":"ox","a":true,"exp":"契約概要（商品のあらまし）と注意喚起情報（不利益事項）はセットで交付・説明する。どちらに何が書いてあるかも問われる。","topic":"募集のルール","diff":"応用"},{"q":"保険の対象である建物を売却した場合でも、火災保険の契約は自動的に買主に引き継がれる。","t":"ox","a":false,"exp":"保険の対象の譲渡には保険会社の承認等の手続きが必要で、自動的には移らない。住所変更・増改築なども含め契約後の変更手続きの案内は代理店の重要業務。","topic":"保険法の知識","diff":"応用"},{"q":"損害保険の保険金は、被保険者に生じた実際の損害を埋めるもので、利得を与えるものではない。","t":"ox","a":true,"exp":"実損てん補（利得禁止の原則）。定額給付の生命保険・傷害保険の死亡保険金等との根本的な違いとして頻出。","topic":"損保のしくみ","diff":"基礎"},{"q":"保険会社が保険金を支払ったとき、被保険者が第三者に対して持つ損害賠償請求権は、支払った保険金の範囲で保険会社に移る。","t":"ox","a":true,"exp":"保険代位（請求権代位）。もらい事故で車両保険を使うと、保険会社が相手方へ求償するのはこのしくみによる。","topic":"保険法の知識","diff":"応用"},{"q":"告知義務違反があっても、保険会社がその事実を知ってから1ヶ月間解除権を行使しない場合や、契約から5年を経過した場合には解除できなくなる。","t":"ox","a":true,"exp":"保険法上の解除権の消滅。約款ではより短い期間（責任開始から2年など）を定めるのが一般的。","topic":"保険法の知識","diff":"応用"},{"q":"火災保険や傷害保険の保険料は、地震保険料控除の対象になる。","t":"ox","a":false,"exp":"地震保険料控除の対象は地震保険の保険料（所得税最高5万円・住民税最高2万5千円）。火災保険料自体は控除対象外。","topic":"商品の基礎知識","diff":"重要"},{"q":"反社会的勢力との保険契約は、約款の暴力団排除条項により解除の対象となる。","t":"ox","a":true,"exp":"契約者・被保険者等が反社会的勢力と判明した場合は契約解除。募集段階での確認も求められる。","topic":"募集のルール","diff":"基礎"},{"q":"保険仲立人（ブローカー）は特定の保険会社に所属せず、顧客のために誠実に保険契約の媒介を行う。","t":"ox","a":true,"exp":"代理店（保険会社から委託）との立場の違いを問う問題が出る。仲立人は顧客サイドに立つ媒介者で、誠実義務を負う。","topic":"募集のルール","diff":"応用"},{"q":"見積書や提案書などの募集文書は、保険会社の審査（承認）を受けたものを使わなければならない。","t":"ox","a":true,"exp":"未審査の手作り資料での募集は不適正募集の典型。表示内容に誤りや誇大な表現があれば景品表示法等にも抵触しうる。","topic":"募集のルール","diff":"基礎"},{"q":"損害保険では、故意による事故はもちろん、契約者・被保険者の重大な過失による損害も免責となる場合がある。","t":"ox","a":true,"exp":"故意・重過失は代表的な免責事由。ほかに戦争・地震等の巨大リスク免責がある（商品により地震保険等でカバー）。","topic":"保険法の知識","diff":"基礎"},{"q":"1つの事故で複数の補償（例：車両保険と人身傷害）から保険金が支払われることはない。","t":"ox","a":false,"exp":"補償項目ごとに支払事由を満たせばそれぞれ支払われる。事故受付時にどの補償が使えるかを漏れなく確認するのが実務の基本。","topic":"商品の基礎知識","diff":"応用"},{"q":"保険募集人が顧客の告知書・申込書を代筆することは、顧客の依頼があれば認められる。","t":"ox","a":false,"exp":"告知書等の代筆・代印は禁止。告知内容の正確性が損なわれ、告知義務違反トラブルの温床になる。必ず顧客本人に記入してもらう。","topic":"募集のルール","diff":"重要"},{"q":"損害保険料率算出機構が算出する参考純率は、会員会社が保険料率を定める際の基礎として使われている。","t":"ox","a":true,"exp":"自動車・火災・傷害などの参考純率と、自賠責・地震の基準料率を算出する。料率の公正性を支えるしくみとして基礎単位で問われる。","topic":"損保のしくみ","diff":"応用"},{"q":"保険期間中に保険料の支払いを怠った場合、保険会社は所定の手続きのうえで契約を解除でき、未払期間中の事故には保険金が支払われないことがある。","t":"ox","a":true,"exp":"分割払の払込猶予や解除の取扱いは約款で定められている。口座変更・残高不足時の案内も代理店の重要なフォロー業務。","topic":"保険法の知識","diff":"基礎"},{"q":"営業成績のための架空契約や名義借りによる契約は、後で解約すれば問題にならない。","t":"ox","a":false,"exp":"架空契約・名義借りは重大な不正行為で、登録取消・懲戒の対象。後で解約しても不正は消えない。発見したら速やかに報告する義務がある。","topic":"募集のルール","diff":"基礎"}]},{"id":"car","label":"自動車保険単位","full":"損保一般試験 商品単位（自動車保険）","step":"商品単位","format":"CBT方式・40分","pass":"満点の70%以上で合格","note":"「誰の・何に・どの補償が出るか」を4つの箱（相手のヒト・相手のモノ・自分のヒト・自分のクルマ）で整理すると全体が見える。","next":"扱う商品に応じて火災・傷害疾病の単位も取得する。","questions":[{"q":"対人賠償保険は、自賠責保険の支払額を超える部分について保険金を支払う。","t":"ox","a":true,"exp":"対人賠償は自賠責の上乗せ。死亡事故の賠償は億単位になりうるため、保険金額は無制限で設定するのが一般的。","topic":"賠償の補償","diff":"基礎"},{"q":"対人賠償保険では、記名被保険者の配偶者や同居の親族にケガをさせた場合も保険金が支払われる。","t":"ox","a":false,"exp":"記名被保険者・運転者の配偶者、父母、子などへの賠償は対象外。家族間事故は人身傷害や搭乗者傷害でカバーを検討する。","topic":"賠償の補償","diff":"重要"},{"q":"対物賠償保険は、他人の車や塀・店舗などの財物に与えた損害の賠償をカバーする。","t":"ox","a":true,"exp":"営業中の店舗に突っ込んだ場合の休業損害（間接損害）まで賠償の対象になりうるため、対物も無制限設定が主流。","topic":"賠償の補償","diff":"基礎"},{"q":"人身傷害保険は、自分の過失分を含めた実際の損害額が、示談の成立を待たずに支払われる。","t":"ox","a":true,"exp":"過失割合に関係なく実損（治療費・休業損害・逸失利益等）を先に受け取れるのが最大の特徴。搭乗者傷害（定額払い）との違いは頻出。","topic":"自分と同乗者の補償","diff":"重要"},{"q":"搭乗者傷害保険は、実際にかかった治療費の金額を実費精算で支払う保険である。","t":"ox","a":false,"exp":"搭乗者傷害は入院・通院日数や部位・症状に応じた定額払い。実損払いの人身傷害とセットで出題される定番の対比。","topic":"自分と同乗者の補償","diff":"重要"},{"q":"一般条件の車両保険では、単独事故（電柱への衝突など）や当て逃げによる損害も補償される。","t":"ox","a":true,"exp":"エコノミー型（車対車＋A）では単独事故・当て逃げが対象外になる。補償範囲と保険料の違いを説明して選んでもらう。","topic":"車両保険","diff":"重要"},{"q":"車両保険では、地震・噴火・津波による車の損害も通常の契約だけで補償される。","t":"ox","a":false,"exp":"地震・噴火・津波は車両保険でも免責。備えるには地震等による車両全損時一時金特約などの付帯が必要。","topic":"車両保険","diff":"重要"},{"q":"台風による洪水で車が水没した損害は、一般に車両保険の補償対象になる。","t":"ox","a":true,"exp":"台風・洪水・高潮などの水災は車両保険の対象（地震由来の津波は対象外）。大雨災害の相談で最初に確認するポイント。","topic":"車両保険","diff":"重要"},{"q":"車両保険に免責金額を設定すると、保険料は安くなる。","t":"ox","a":true,"exp":"免責金額（自己負担額）を大きくするほど保険料は下がる。1回目と2回目以降で免責額を変える設定もある。","topic":"車両保険","diff":"基礎"},{"q":"ノンフリート等級は1〜20等級まであり、事故で保険を使うと原則3等級下がる。","t":"ox","a":true,"exp":"無事故なら毎年1等級上がる。3等級ダウン事故のほか、飛び石など1等級ダウン事故、等級に影響しないノーカウント事故がある。","topic":"等級と保険料","diff":"重要"},{"q":"事故で等級が下がった場合、同じ等級の無事故の人と比べて保険料の割引率が低い「事故有係数」が一定期間適用される。","t":"ox","a":true,"exp":"事故有係数適用期間は3等級ダウン事故で3年加算（上限6年）。「等級が同じでも保険料が違う」しくみとして説明が必要。","topic":"等級と保険料","diff":"応用"},{"q":"小さな損害で車両保険を使うと、等級ダウンによる以後の保険料増加が受取保険金を上回ることがある。","t":"ox","a":true,"exp":"保険を使うかどうかは3年間の保険料増加額と修理費を比べて判断する。この試算を示せるのが良い代理店。","topic":"等級と保険料","diff":"応用"},{"q":"自動車保険の保険料は、車の型式ごとの事故実績にもとづく型式別料率クラスによっても変わる。","t":"ox","a":true,"exp":"自家用普通・小型乗用車は17クラスに区分され、事故実績に応じて毎年見直される。同じ補償・同じ等級でも車種によって保険料が違う理由になる。","topic":"等級と保険料","diff":"応用"},{"q":"運転者を本人・配偶者に限定したり、年齢条件を設定したりすると保険料は安くなるが、範囲外の人の運転中の事故は補償されない。","t":"ox","a":true,"exp":"限定条件と補償範囲はトレードオフ。子どもが免許を取った・別居したなどライフイベント時の条件見直し案内が重要。","topic":"等級と保険料","diff":"基礎"},{"q":"別居の未婚の子が親の車を借りて運転中に起こした事故は、運転者を本人・配偶者限定にしていても補償される。","t":"ox","a":false,"exp":"運転者限定の範囲外の運転は補償されない。臨時に貸すなら1日単位の保険や限定解除の検討を案内する。","topic":"等級と保険料","diff":"応用"},{"q":"他車運転特約により、記名被保険者等が臨時に借りた他人の車を運転中の事故は、借りた人の契約から優先して保険金が支払われる。","t":"ox","a":true,"exp":"友人の車を借りて事故を起こしても、友人の等級に影響させず自分の契約で対応できる。対象となる運転者・車の範囲は約款で確認。","topic":"特約の知識","diff":"応用"},{"q":"弁護士費用特約は、もらい事故（自分に過失がない事故）で相手に損害賠償請求する際の弁護士費用等を補償する。","t":"ox","a":true,"exp":"過失ゼロの事故では保険会社は示談交渉を代行できない（弁護士法）ため、この特約の価値が大きい。日常事故型もある。","topic":"特約の知識","diff":"重要"},{"q":"ファミリーバイク特約は、原動機付自転車の運転中の事故を補償する特約で、本人だけでなく家族も対象になる。","t":"ox","a":true,"exp":"対象は総排気量125cc以下等の原付。自損型と人身型があり、等級制度はなく保険を使っても本体の等級に影響しない。","topic":"特約の知識","diff":"応用"},{"q":"個人賠償責任特約は、自転車事故や買い物中の物損など日常生活の賠償事故を補償し、自動車保険に付帯できる。","t":"ox","a":true,"exp":"自転車事故の高額賠償判決を背景に自治体の加入義務化も広がる。示談交渉サービス付きが主流。重複加入になっていないかの確認も大事。","topic":"特約の知識","diff":"基礎"},{"q":"無保険車傷害保険は、賠償資力が十分でない無保険の車との事故で死亡・後遺障害を被った場合に不足分を補う。","t":"ox","a":true,"exp":"対人無制限が普及したとはいえ無保険車は存在する。人身傷害とあわせて「相手に頼れない事故」への備えとなる。","topic":"自分と同乗者の補償","diff":"応用"},{"q":"政府の保障事業は、ひき逃げや無保険車による事故の被害者を、自賠責保険と同水準で救済する制度である。","t":"ox","a":true,"exp":"加害者不明・無保険でも被害者は政府保障事業に請求できる。てん補額は自賠責と同基準で、健康保険等の給付分は差し引かれる。","topic":"賠償の補償","diff":"応用"},{"q":"自賠責保険の保険金は、被害者側から保険会社へ直接請求することはできない。","t":"ox","a":false,"exp":"被害者請求（16条請求）が認められており、当面の治療費に充てる仮渡金の制度もある。被害者救済が自賠責の目的。","topic":"賠償の補償","diff":"応用"},{"q":"ドライブレコーダーの映像は、事故の過失割合の認定資料として役立つことがある。","t":"ox","a":true,"exp":"客観的資料は示談を早める。特約でレコーダーを貸与し事故時に自動通報するサービスを提供する会社もある。","topic":"特約の知識","diff":"基礎"},{"q":"ロードアシスタンス（レッカー・応急対応）のサービスを使っただけでは、ノンフリート等級は下がらない。","t":"ox","a":true,"exp":"多くの会社でロードサービスの利用はノーカウント。「使うと等級が下がるのでは」という誤解を解いて、遠慮なく使ってもらう。","topic":"等級と保険料","diff":"基礎"},{"q":"記名被保険者が変わっても（例：親から子へ車を譲る）、等級は誰にでも無条件で引き継げる。","t":"ox","a":false,"exp":"等級の引継ぎは配偶者・同居の親族などに限られる。別居の子には引き継げない。車両入替や等級引継ぎの可否は変更手続きの頻出論点。","topic":"等級と保険料","diff":"応用"}]},{"id":"fire","label":"火災保険単位","full":"損保一般試験 商品単位（火災保険）","step":"商品単位","format":"CBT方式・40分","pass":"満点の70%以上で合格","note":"「何が対象か（建物・家財）」「どの災害が対象か」「いくら支払われるか（新価・免責）」の3層で整理する。地震保険の数字（30〜50%・5,000万・1,000万）は必ず出る。","next":"傷害疾病単位もあわせて取ると個人向け商品を一通り提案できる。","questions":[{"q":"火災保険で建物のみを契約した場合、家財の損害は補償されない。","t":"ox","a":true,"exp":"建物と家財は別々に契約する。持ち家は建物＋家財、賃貸は家財（＋借家人賠償）が基本形。契約時に対象を必ず確認する。","topic":"保険の対象","diff":"基礎"},{"q":"門・塀・物置・車庫は、建物の付属物として火災保険の対象に含めることができる。","t":"ox","a":true,"exp":"敷地内の付属建物・工作物は建物に含めて契約できる。台風時の塀の倒壊などで問われる実務ポイント。","topic":"保険の対象","diff":"応用"},{"q":"1個または1組30万円を超える貴金属・美術品は、申告して明記物件としなければ家財の補償対象にならないことがある。","t":"ox","a":true,"exp":"高額な貴金属等は明記が必要（金額基準は商品により異なる）。現金・預貯金証書は盗難のとき一定額まで等、家財の細かい線引きが問われる。","topic":"保険の対象","diff":"応用"},{"q":"住宅火災保険（基本型）では、火災・落雷・破裂爆発のほか、風災・雹災・雪災による損害も補償される。","t":"ox","a":true,"exp":"基本型でも自然災害のうち風・雹・雪はカバーする。水災・盗難・水濡れ等まで広げたのが住宅総合型。type の違いは頻出。","topic":"補償の範囲","diff":"重要"},{"q":"住宅火災保険（基本型）では、台風による洪水・床上浸水（水災）も補償される。","t":"ox","a":false,"exp":"水災は総合型でカバーされる補償。近年は水災を外して保険料を抑える選択も可能なため、ハザードマップとあわせた提案が必要。","topic":"補償の範囲","diff":"重要"},{"q":"水災の保険金支払いには、一般に「床上浸水または地盤面から45cmを超える浸水」「保険価額の30%以上の損害」といった支払要件がある。","t":"ox","a":true,"exp":"水災は無条件に全額出るわけではない。支払要件・支払割合は商品によって異なるため約款確認が必須。","topic":"補償の範囲","diff":"応用"},{"q":"マンション上階からの水漏れによる自室の損害は、住宅総合保険の水濡れ補償の対象になりうる。","t":"ox","a":true,"exp":"給排水設備の事故等による水濡れは総合型の補償。自然災害の水災とは別の補償項目である点を区別する。","topic":"補償の範囲","diff":"応用"},{"q":"現在の火災保険の保険金支払いは、時価ではなく再調達価額（新価）を基準とするのが主流である。","t":"ox","a":true,"exp":"新価基準なら同等の建物を建て直す費用が支払われる。時価基準では経年減価分が引かれて再建できないおそれがある。契約時の評価が重要。","topic":"保険金の支払い","diff":"重要"},{"q":"火災で全焼した場合、保険金額が適正に設定されていれば、実際の再建費用まで保険金が支払われ、利得は生じない。","t":"ox","a":true,"exp":"実損てん補の原則。保険金額の設定が低すぎると足りず、高すぎても損害額までしか出ない。適正な評価額での設定が肝心。","topic":"保険金の支払い","diff":"基礎"},{"q":"地震を原因とする火災で家が焼けた場合、火災保険から火災保険金が支払われる。","t":"ox","a":false,"exp":"地震による火災は火災保険では免責（地震火災費用保険金という見舞金程度の支払いはある）。本格的に備えるには地震保険が必要。最頻出の論点。","topic":"地震保険","diff":"重要"},{"q":"地震保険の保険金額は、主契約（火災保険）の保険金額の30〜50%の範囲で設定し、建物5,000万円・家財1,000万円が限度である。","t":"ox","a":true,"exp":"数字はそのまま出る。「半分しか掛けられないのは生活再建資金という制度趣旨だから」という説明もできるとよい。","topic":"地震保険","diff":"重要"},{"q":"地震保険の損害区分は、全損・大半損・小半損・一部損の4区分で、支払割合はそれぞれ100%・60%・30%・5%である。","t":"ox","a":true,"exp":"損害の認定区分に応じて保険金額の割合で支払う定率方式。実損の査定を待たず迅速に支払うための制度設計。","topic":"地震保険","diff":"重要"},{"q":"地震保険の保険料は、どの保険会社で契約しても、所在地（都道府県）と建物の構造が同じなら同じである。","t":"ox","a":true,"exp":"地震保険は国と民間が共同運営する公共性の高い制度で、料率は一律。耐震等級割引・建築年割引など4種の割引がある（重複適用は不可）。","topic":"地震保険","diff":"応用"},{"q":"地震保険の保険料は地震保険料控除の対象となり、所得税で最高5万円・住民税で最高2万5千円を所得から控除できる。","t":"ox","a":true,"exp":"火災保険料は対象外。年末調整・確定申告での控除証明書の案内はアフターフォローの定番。","topic":"地震保険","diff":"重要"},{"q":"隣家の火事のもらい火で自宅が焼けた場合、失火者に重大な過失がなければ損害賠償を請求できない。","t":"ox","a":true,"exp":"失火責任法により軽過失の失火者は賠償責任を負わない。だから「自分の家は自分の火災保険で守る」が大原則。募集トークの核になる知識。","topic":"賠償と費用","diff":"重要"},{"q":"賃貸住宅の借主が火事を起こして部屋を焼いた場合、大家に対する原状回復の賠償責任に備えるのが借家人賠償責任特約である。","t":"ox","a":true,"exp":"失火責任法で隣家への賠償は免れても、大家への債務不履行責任は残る。賃貸契約時にセットで加入する理由を説明できるように。","topic":"賠償と費用","diff":"重要"},{"q":"火災保険の免責事由には、契約者・被保険者の故意のほか、地震・噴火・津波、戦争などがある。","t":"ox","a":true,"exp":"巨大リスク・モラルリスクは免責。経年劣化・シロアリなど「事故性のない損害」も対象外になる点は苦情の多いポイント。","topic":"補償の範囲","diff":"基礎"},{"q":"経年劣化による雨漏りの修理費用も、火災保険の風災補償で支払われる。","t":"ox","a":false,"exp":"補償されるのは台風など偶然な事故による損害で、経年劣化は対象外。「保険で無料修理できる」と勧誘する悪質業者への注意喚起も代理店の役目。","topic":"補償の範囲","diff":"重要"},{"q":"火災保険には、損害保険金のほかに、片付け費用や仮住まい費用などに充てる費用保険金が付く商品がある。","t":"ox","a":true,"exp":"残存物取片づけ費用・臨時費用・失火見舞費用など。損害そのもの以外の出費に備える部分で、商品比較の差が出やすい。","topic":"保険金の支払い","diff":"応用"},{"q":"類焼損害特約は、自宅からの失火で隣家に損害を与えた場合に、法律上の賠償責任がなくても隣家の損害を補償する特約である。","t":"ox","a":true,"exp":"失火責任法で賠償義務がなくても、ご近所関係を守るための「見舞い」的補償。個人賠償との違い（賠償責任の有無）で整理する。","topic":"賠償と費用","diff":"応用"},{"q":"保険金額を保険価額より著しく低く設定すると、火災時に比例てん補により保険金が削減されることがある。","t":"ox","a":true,"exp":"一部保険の削減払い。評価額の80%以上で設定すれば実損払いとする商品が多い（付保割合条件）。適正付保の重要性を示す論点。","topic":"保険金の支払い","diff":"応用"},{"q":"空き家になった実家も、居住中の住宅とまったく同じ条件・保険料で火災保険を契約できる。","t":"ox","a":false,"exp":"空き家は住宅物件でなく一般物件扱いになるなど、引受条件・保険料が変わる（引受不可の場合も）。用途変更の通知義務ともつながる論点。","topic":"保険の対象","diff":"応用"},{"q":"火災保険の保険期間は、現在は最長5年である。","t":"ox","a":true,"exp":"2022年10月以降の新規契約から最長5年（それ以前は10年）。長期契約は割安だが、更新時の料率改定の影響を受けにくい点とあわせて説明する。","topic":"保険の対象","diff":"応用"},{"q":"盗難による家財の損害は、住宅総合型の火災保険で補償の対象になる。","t":"ox","a":true,"exp":"盗難・持ち出し家財・水濡れなどは総合型の守備範囲。基本型との違いを表で覚えると確実。","topic":"補償の範囲","diff":"基礎"},{"q":"火災保険の申込みにあたり、建物の構造級別（M・T・H構造など）は保険料に影響しない。","t":"ox","a":false,"exp":"構造級別は保険料を左右する基本要素。コンクリート造か木造か、耐火性能で区分される。所在地・築年数とあわせて見積りの前提になる。","topic":"保険の対象","diff":"基礎"}]},{"id":"injury","label":"傷害疾病保険単位","full":"損保一般試験 商品単位（傷害疾病保険）","step":"商品単位","format":"CBT方式・40分","pass":"満点の70%以上で合格","note":"傷害の3要件「急激・偶然・外来」がすべての出発点。対象になる例・ならない例の線引きと、旅行保険の特徴（海外は地震も疾病もOK）を押さえる。","next":"3つの商品単位が揃えば個人分野は一通り。次は損保大学課程へ。","questions":[{"q":"傷害保険の対象となるケガは、「急激・偶然・外来」の3要件をすべて満たす事故によるものである。","t":"ox","a":true,"exp":"3要件がすべての判定基準。「突発的で」「予知できず」「体の外からの作用による」事故かどうかで支払いの可否を考える。","topic":"傷害の3要件","diff":"重要"},{"q":"日常のジョギングによる靴ずれや、長年の使いすぎによる腱鞘炎も、普通傷害保険の対象になる。","t":"ox","a":false,"exp":"靴ずれは「急激性」を欠き、慢性の障害は事故性がないため対象外。3要件にあてはめて判定する練習問題の定番。","topic":"傷害の3要件","diff":"重要"},{"q":"病気（脳梗塞など）が原因で転倒してケガをした場合も、普通傷害保険で全額補償される。","t":"ox","a":false,"exp":"疾病を原因とするケガは「偶然・外来」の要件との関係で対象外となるのが原則。病気そのものも傷害保険の対象ではない。","topic":"傷害の3要件","diff":"応用"},{"q":"細菌性食中毒は、普通傷害保険では補償の対象外とされている。","t":"ox","a":true,"exp":"普通傷害では細菌性・ウイルス性食中毒は対象外（特約や国内旅行傷害保険では対象になる）。商品による違いが問われる頻出論点。","topic":"傷害の3要件","diff":"重要"},{"q":"熱中症による障害は、普通傷害保険では原則対象外だが、熱中症危険補償特約などで備えることができる。","t":"ox","a":true,"exp":"熱中症は「急激・外来」の要件を欠くとされ原則対象外。工事現場向けなど特約でカバーする設計がある。","topic":"傷害の3要件","diff":"応用"},{"q":"普通傷害保険は、国内外・業務中業務外を問わず、日常生活のケガを24時間補償する。","t":"ox","a":true,"exp":"家庭内・通勤中・旅行中・仕事中もカバー（職種級別で保険料が変わる）。この「いつでもどこでも」が普通傷害の特徴。","topic":"商品のしくみ","diff":"基礎"},{"q":"家族傷害保険の被保険者の範囲は、契約時ではなく事故発生時の続柄で判定される。","t":"ox","a":true,"exp":"本人・配偶者・生計を共にする同居親族・別居の未婚の子など。事故時に生まれていた子は自動的に対象になる。判定時点は頻出。","topic":"商品のしくみ","diff":"応用"},{"q":"交通事故傷害保険は、交通事故や乗り物の火災など交通に起因する事故に補償を限定するかわりに保険料が割安である。","t":"ox","a":true,"exp":"駅構内の事故やエレベーターの事故も対象になるなど「交通乗用具」の範囲は広い。補償を絞って保険料を抑える商品設計。","topic":"商品のしくみ","diff":"応用"},{"q":"国内旅行傷害保険では、旅行行程中の細菌性食中毒も補償の対象になる。","t":"ox","a":true,"exp":"国内旅行では食中毒が対象になる（普通傷害との違い）。旅行行程中＝家を出てから帰るまでが対象期間。","topic":"旅行の保険","diff":"重要"},{"q":"海外旅行保険（海外旅行傷害保険）では、旅行中の病気の治療費用も補償の対象になる。","t":"ox","a":true,"exp":"海外旅行保険はケガに加えて疾病治療・救援者費用・賠償・携行品までカバーする総合型。海外の医療費は高額になるため治療費用補償が中心。","topic":"旅行の保険","diff":"重要"},{"q":"海外旅行保険では、旅行中の地震・噴火・津波によるケガも補償の対象になる。","t":"ox","a":true,"exp":"普通傷害・国内旅行では地震等によるケガは原則対象外だが、海外旅行保険では対象。「海外だけ地震もOK」は最頻出の比較ポイント。","topic":"旅行の保険","diff":"重要"},{"q":"普通傷害保険では、地震・噴火・津波によるケガも当然に補償される。","t":"ox","a":false,"exp":"地震等による傷害は原則免責（天災危険補償特約で付けられる）。火災保険と同じく地震は特別扱いという構造で覚える。","topic":"傷害の3要件","diff":"重要"},{"q":"傷害保険の死亡保険金は、事故日からその日を含めて180日以内に死亡した場合に、保険金額の全額が支払われる。","t":"ox","a":true,"exp":"180日ルールは後遺障害保険金にも共通する重要な数字。事故と死亡の因果関係・期間の要件を確認する。","topic":"保険金の支払い","diff":"応用"},{"q":"後遺障害保険金は、障害の程度に応じて保険金額の一定割合（例：4%〜100%）が支払われる。","t":"ox","a":true,"exp":"後遺障害等級に応じた割合支払い。死亡・後遺障害・入院・通院という給付の種類と支払基準のセットで整理する。","topic":"保険金の支払い","diff":"基礎"},{"q":"傷害保険の入院保険金・通院保険金は、実際にかかった治療費の実費が支払われる。","t":"ox","a":false,"exp":"入院・通院は日額×日数の定額払いが基本。医療費実費型の商品もあるが、原則は定額。生保の医療保険と同じ発想。","topic":"保険金の支払い","diff":"重要"},{"q":"傷害保険の保険料は、被保険者の職業・職種によって異なる。","t":"ox","a":true,"exp":"危険度に応じた職種級別料率（事務職と建設作業者では事故率が違う）。契約後の職種変更には通知義務がある。","topic":"商品のしくみ","diff":"重要"},{"q":"傷害保険の死亡保険金（受取人＝相続人）は、みなし相続財産として相続税の課税対象となり、生命保険と同じ非課税枠が使える。","t":"ox","a":true,"exp":"契約形態により課税が変わるのは生保と同じ。傷害・所得補償など第三分野でも税務の基本は共通。","topic":"保険金の支払い","diff":"応用"},{"q":"所得補償保険は、病気やケガで働けない間の収入の減少を補償し、入院中だけでなく医師の指示による自宅療養中も対象になる。","t":"ox","a":true,"exp":"「入院していなくても働けなければ出る」のが特徴。免責期間（7日など）とてん補期間（1年など）の設定を確認する。","topic":"働けないときの保険","diff":"重要"},{"q":"所得補償保険の保険金額は、被保険者の所得の額にかかわらず自由に設定できる。","t":"ox","a":false,"exp":"平均月間所得の範囲内（所定割合まで）で設定する。実際の所得より過大な契約は引き受けられない（利得禁止）。","topic":"働けないときの保険","diff":"応用"},{"q":"医療保険（第三分野）は、生命保険会社・損害保険会社のどちらでも販売できる。","t":"ox","a":true,"exp":"医療・がん・介護・傷害などの第三分野は生損保共通の領域。損保系は実費補償型、生保系は定額給付型という設計の傾向がある。","topic":"商品のしくみ","diff":"基礎"},{"q":"がん保険には一般に90日程度の待ち期間があり、その間にがんと診断された場合は契約が無効となる。","t":"ox","a":true,"exp":"待ち期間（免責期間）は生保系・損保系とも共通の設計。乗換え時の空白リスクの説明は必須。","topic":"商品のしくみ","diff":"応用"},{"q":"傷害保険で、被保険者の泥酔運転や無免許運転中の事故によるケガは免責となる。","t":"ox","a":true,"exp":"故意・重過失に準じる免責事由。ほかに脳疾患・疾病・心神喪失に起因する事故、地震等がある。免責リストは確実に覚える。","topic":"傷害の3要件","diff":"基礎"},{"q":"海外旅行保険の携行品損害では、旅行中のカメラの盗難・破損も補償されるが、現金やクレジットカードの盗難は対象外である。","t":"ox","a":true,"exp":"携行品から現金・カード・定期券等は除外される（盗難時は別の手続きへ案内）。置き忘れ・紛失も対象外。","topic":"旅行の保険","diff":"応用"},{"q":"旅行キャンセル時の取消料をカバーする補償（旅行変更費用等）を付けられる旅行保険がある。","t":"ox","a":true,"exp":"病気や身内の不幸による旅行取消の費用に備える補償。旅行代金が高額化するなか案内価値が高い。","topic":"旅行の保険","diff":"基礎"},{"q":"傷害保険の告知事項には、被保険者の職業・他の傷害保険契約の有無などが含まれる。","t":"ox","a":true,"exp":"健康状態の診査はないが、職種と重複契約（モラルリスク防止）の告知は必要。告知義務・通知義務の枠組みは損保共通。","topic":"商品のしくみ","diff":"基礎"}]}]},{"id":"fp","label":"ファイナンシャル・プランナー（FP技能検定）","sub":"保険・年金・税金・不動産・相続まで、お客様のお金の相談に横断的に答える力の証明。3級→2級→1級の順に積み上げる。","roadmap":"FP3級（受験資格なし・CBT）→ FP2級（3級合格・実務2年・AFP研修のいずれかで受験可）→ FP1級（学科は2級合格＋実務1年 等）。2級合格＋研修でAFP、1級相当でCFPの道もある。学科は6分野：ライフ・リスク・金融・タックス・不動産・相続","exams":[{"id":"fp3","label":"FP3級","full":"3級FP技能検定（学科）","step":"STEP 1","format":"CBT方式・学科60問（○×30＋三択30）ほか実技試験","pass":"学科は36問以上（6割）で合格","note":"6分野を広く浅く。保険営業なら「リスク管理」と「相続」は満点を狙い、他分野で6割を確保する戦い方が現実的。","next":"合格したらそのまま勢いで2級へ。出題範囲はほぼ同じで深さが増すだけ。","questions":[{"q":"税理士資格を持たないFPが、顧客の依頼で確定申告書を作成することは、無償であれば認められる。","t":"ox","a":false,"exp":"個別具体的な税務相談・申告書作成は有償無償を問わず税理士の独占業務。FPができるのは一般的な税制度の説明まで。業際問題は毎回出る。","topic":"ライフプランニング","diff":"重要"},{"q":"毎年一定額を積み立てながら複利運用した場合の将来の合計額を求めるには、どの係数を使うか。","t":"mc","c":["年金終価係数","減債基金係数","資本回収係数"],"a":0,"exp":"積立の将来額＝毎年の積立額×年金終価係数。逆に目標額から毎年の積立額を出すのが減債基金係数。6つの係数は「何を求めたいか」から選ぶ。","topic":"ライフプランニング","diff":"重要"},{"q":"日本学生支援機構の貸与型奨学金のうち、第一種は無利息、第二種は利息付である。","t":"ox","a":true,"exp":"第一種は成績・所得基準が厳しめで無利息、第二種は利息付（在学中は無利息）。返済不要の給付型奨学金もある。","topic":"ライフプランニング","diff":"基礎"},{"q":"国の教育ローン（教育一般貸付）の融資限度額は、学生1人につき原則350万円である。","t":"ox","a":true,"exp":"自宅外通学・海外留学など一定の場合は450万円。固定金利で、日本学生支援機構の奨学金と併用できる。","topic":"ライフプランニング","diff":"応用"},{"q":"フラット35は、最長35年の全期間固定金利型住宅ローンで、保証人・繰上返済手数料が不要である。","t":"ox","a":true,"exp":"融資額は最高8,000万円、融資率9割超だと金利が高くなる。金利は取扱金融機関ごとに異なり、融資実行時点の金利が適用される。","topic":"ライフプランニング","diff":"重要"},{"q":"住宅ローンの繰上返済では、返済額軽減型より期間短縮型のほうが利息の軽減効果が大きい。","t":"ox","a":true,"exp":"同じ金額を繰り上げるなら期間短縮型が有利。早い時期に行うほど効果が大きい。","topic":"ライフプランニング","diff":"重要"},{"q":"退職後の健康保険の任意継続被保険者になるには、退職日の翌日から何日以内に申請が必要か。","t":"mc","c":["20日以内","14日以内","30日以内"],"a":0,"exp":"任意継続は20日以内に申請、加入期間は最長2年。保険料は全額自己負担になる。国保・家族の扶養との比較検討を案内する。","topic":"ライフプランニング","diff":"応用"},{"q":"健康保険の傷病手当金は、休業1日につき標準報酬日額の3分の2相当額が、通算1年6ヶ月支給される。","t":"ox","a":true,"exp":"連続3日の待期の後、4日目から支給。国民健康保険にはない給付なので、自営業者の就業不能リスクは大きい。","topic":"ライフプランニング","diff":"重要"},{"q":"老齢基礎年金を受け取るために必要な受給資格期間は何年か。","t":"mc","c":["10年","25年","5年"],"a":0,"exp":"2017年から25年→10年に短縮された。保険料納付済期間＋免除期間＋合算対象期間で10年あれば受給できる（額は納付に応じる）。","topic":"ライフプランニング","diff":"重要"},{"q":"確定拠出年金（iDeCo）の老齢給付金は、60歳になれば加入期間の長さにかかわらず必ず受給を開始できる。","t":"ox","a":false,"exp":"60歳受給には通算加入者等期間10年以上が必要。10年に満たないと受給開始年齢が繰り下がる。「10年ルール」として頻出。","topic":"ライフプランニング","diff":"応用"},{"q":"生命保険会社が破綻した場合、生命保険契約者保護機構により責任準備金等の90%まで補償される。","t":"ox","a":true,"exp":"高予定利率契約は除く。銀行預金の預金保険（元本1,000万円＋利息）との違いを問う問題が定番。","topic":"リスク管理","diff":"重要"},{"q":"生命保険のクーリング・オフは、申込日または書面受領日のいずれか遅い日から8日以内に、書面等で申込みを撤回できる制度である。","t":"ox","a":true,"exp":"医師の診査を受けた後などは対象外。8日という数字と起算日をセットで覚える。","topic":"リスク管理","diff":"基礎"},{"q":"遺族の生活資金として必要な死亡保障の額は、一般に末子が生まれたときに最大となり、その後は徐々に減っていく。","t":"ox","a":true,"exp":"必要保障額の山は末子誕生時。だから収入保障保険や逓減定期のような「だんだん減る保障」が形として合理的。","topic":"リスク管理","diff":"重要"},{"q":"死亡保険金と満期保険金が同額である保険はどれか。","t":"mc","c":["養老保険","定期保険","終身保険"],"a":0,"exp":"養老保険は生死混合保険で死亡・満期が同額。定期は満期金なし、終身は満期そのものがない。基本3商品の対比は必出。","topic":"リスク管理","diff":"基礎"},{"q":"2012年以後契約の生命保険料控除（新制度）で、所得税の控除限度額の組合せとして正しいものはどれか。","t":"mc","c":["一般・介護医療・個人年金 各4万円","一般・個人年金 各5万円","一般・介護医療・個人年金 各2万8千円"],"a":0,"exp":"新制度は3区分各4万円（合計12万円）。各2万8千円は住民税の限度額、各5万円は旧制度。ひっかけの作り方まで含めて頻出。","topic":"リスク管理","diff":"重要"},{"q":"契約者・被保険者が夫、受取人が妻である死亡保険金にかかる税金はどれか。","t":"mc","c":["相続税","所得税（一時所得）","贈与税"],"a":0,"exp":"契約者＝被保険者なら相続税（非課税枠500万円×法定相続人）。契約者＝受取人なら一時所得、三者別人なら贈与税。3パターンの表は丸暗記。","topic":"リスク管理","diff":"重要"},{"q":"地震保険の保険金額は火災保険の保険金額の30〜50%の範囲内で、建物5,000万円・家財1,000万円が上限である。","t":"ox","a":true,"exp":"地震保険は単独契約不可で火災保険に付帯する。数字（30〜50%・5,000万・1,000万）はそのまま出題される。","topic":"リスク管理","diff":"重要"},{"q":"自賠責保険は、対人賠償だけでなく対物賠償もカバーする。","t":"ox","a":false,"exp":"自賠責は対人賠償のみ（死亡3,000万円・傷害120万円・後遺障害最高4,000万円）。対物・自身のケガ・自車の損害は任意保険で備える。","topic":"リスク管理","diff":"重要"},{"q":"個人賠償責任保険は、業務中に生じた賠償事故も補償の対象になる。","t":"ox","a":false,"exp":"個人賠償は日常生活の事故が対象で、業務遂行中の賠償は対象外。自転車事故・子どもの物損などが典型的な支払例。","topic":"リスク管理","diff":"応用"},{"q":"被保険者本人が受け取る医療保険の入院給付金は、非課税である。","t":"ox","a":true,"exp":"身体の傷害に基因して支払われる給付金は非課税。確定申告の医療費控除では、給付金を医療費から差し引いて計算する点とセットで覚える。","topic":"リスク管理","diff":"基礎"},{"q":"景気動向指数のうち、景気の現状の大きさやテンポを示すのはCI（コンポジット・インデックス）である。","t":"ox","a":true,"exp":"CIは量感、DIは波及度（方向）を示す。現在はCI中心の公表。先行・一致・遅行の系列区分もあわせて覚える。","topic":"金融資産運用","diff":"応用"},{"q":"日銀短観の業況判断DIは、業況が「良い」と答えた企業の割合から「悪い」と答えた企業の割合を差し引いたものである。","t":"ox","a":true,"exp":"日銀が年4回、企業に直接アンケートする調査。マーケット記事を読む基礎知識としても必須。","topic":"金融資産運用","diff":"基礎"},{"q":"市場金利が上昇すると、既に発行されている固定利付債券の価格は一般に下落する。","t":"ox","a":true,"exp":"金利と債券価格はシーソーの関係。新発債の利回りが上がると、利率の低い既発債は値下がりして利回りが釣り合う。","topic":"金融資産運用","diff":"重要"},{"q":"個人向け国債（変動10年）の説明として正しいものはどれか。","t":"mc","c":["金利に年0.05%の下限があり、1万円から購入できる","満期まで一切換金できない","金利は発行時のまま10年間固定される"],"a":0,"exp":"変動10年は半年ごとに金利見直し・下限0.05%・1万円単位・発行後1年経過すれば中途換金可（直前2回分の利子相当額が差し引かれる）。","topic":"金融資産運用","diff":"応用"},{"q":"PER（株価収益率）は、株価を何で割って求めるか。","t":"mc","c":["1株当たり純利益","1株当たり純資産","1株当たり配当金"],"a":0,"exp":"PER＝株価÷1株当たり純利益（EPS）。PBRは1株当たり純資産、配当利回りは配当÷株価。指標の分母の区別が頻出。","topic":"金融資産運用","diff":"重要"},{"q":"日経平均株価などの指数に連動する運用を目指す投資信託を、インデックスファンド（パッシブ運用）という。","t":"ox","a":true,"exp":"指数を上回る成果を目指すのがアクティブ運用。一般に信託報酬はインデックス型のほうが低い。","topic":"金融資産運用","diff":"基礎"},{"q":"投資信託の収益分配金のうち、元本払戻金（特別分配金）は非課税である。","t":"ox","a":true,"exp":"元本の払戻しにあたる部分だから課税されない（そのぶん個別元本が下がる）。普通分配金は20.315%課税。分配金2種類の区別は頻出。","topic":"金融資産運用","diff":"応用"},{"q":"円をドルに換えて外貨預金をするとき（預入時）に適用される為替レートはどれか。","t":"mc","c":["TTS","TTB","TTM"],"a":0,"exp":"TTS＝顧客が円を外貨に換えるレート、TTB＝外貨を円に戻すレート（Sell/Buyは銀行から見た呼び名）。往復で為替手数料がかかる。","topic":"金融資産運用","diff":"重要"},{"q":"新NISAのつみたて投資枠は年120万円、成長投資枠は年240万円、生涯の非課税保有限度額は1,800万円である。","t":"ox","a":true,"exp":"成長投資枠はうち1,200万円まで。売却すると翌年に簿価分の枠が復活する。数字のセットで確実に得点する。","topic":"金融資産運用","diff":"重要"},{"q":"預金保険制度では、決済用預金を除き、1金融機関につき預金者1人あたり元本1,000万円までとその利息が保護される。","t":"ox","a":true,"exp":"無利息・要求払い・決済サービスの3条件を満たす決済用預金は全額保護。外貨預金は保護対象外という点もよく出る。","topic":"金融資産運用","diff":"重要"},{"q":"所得税は、所得が多くなるほど高い税率が適用される超過累進税率を採用している。","t":"ox","a":true,"exp":"5%〜45%の7段階。「超過」累進なので、高い税率は基準を超えた部分にだけかかる。","topic":"タックス","diff":"基礎"},{"q":"預貯金の利子（利子所得）は、原則として20.315%の源泉分離課税で課税関係が終了する。","t":"ox","a":true,"exp":"所得税15%＋復興特別所得税0.315%＋住民税5%。確定申告は不要。","topic":"タックス","diff":"基礎"},{"q":"一時所得は、総収入金額から支出額と特別控除50万円を差し引き、その2分の1を総所得金額に算入する。","t":"ox","a":true,"exp":"満期保険金・解約返戻金の受取りで登場する計算。2分の1にしてから合算する点がポイント。","topic":"タックス","diff":"重要"},{"q":"勤続25年で退職した場合の退職所得控除額はいくらか。","t":"mc","c":["1,150万円","1,000万円","1,250万円"],"a":0,"exp":"40万円×20年＋70万円×5年＝800万＋350万＝1,150万円。勤続20年の境目で単価が40万→70万に変わる。","topic":"タックス","diff":"重要"},{"q":"損失を他の所得と損益通算できる所得の組合せとして正しいものはどれか。","t":"mc","c":["不動産・事業・山林・譲渡","一時・雑・配当・給与","利子・退職・山林・譲渡"],"a":0,"exp":"「ふ・じ・さん・じょう」で暗記。ただし不動産所得の損失のうち土地取得の借入金利子は通算不可、生活に必要でない資産の譲渡損も不可。","topic":"タックス","diff":"重要"},{"q":"医療費控除は、原則として支払医療費が10万円（総所得200万円未満は総所得の5%）を超えた部分について、最高200万円まで控除できる。","t":"ox","a":true,"exp":"保険金などで補てんされる金額は差し引く。年末調整では受けられず確定申告が必要。","topic":"タックス","diff":"重要"},{"q":"配偶者控除は、納税者本人の合計所得金額が1,000万円を超えると適用を受けられない。","t":"ox","a":true,"exp":"本人の所得制限がある点が頻出。900万円超から控除額が段階的に縮小し、1,000万円超でゼロになる。","topic":"タックス","diff":"応用"},{"q":"住宅ローン控除（住宅借入金等特別控除）の控除額は、原則として年末のローン残高に0.7%を乗じて計算する。","t":"ox","a":true,"exp":"控除率0.7%・新築は原則13年間。入居年や住宅の省エネ性能で借入限度額が変わる。初年度は確定申告が必要（2年目以降は年末調整可）。","topic":"タックス","diff":"重要"},{"q":"給与所得者でも確定申告が必要になるのはどのような場合か。","t":"mc","c":["給与収入が2,000万円を超える場合","給与のほかに副収入が10万円ある場合","医療費が5万円かかった場合"],"a":0,"exp":"給与2,000万円超、給与以外の所得20万円超、2か所給与などは申告が必要。副収入20万円「以下」なら所得税の申告は不要（住民税は別）。","topic":"タックス","diff":"応用"},{"q":"青色申告特別控除65万円を受けるには、複式簿記による記帳に加え、e-Taxによる申告または電子帳簿保存が必要である。","t":"ox","a":true,"exp":"紙提出の複式簿記は55万円、簡易簿記は10万円。事業所得・事業的規模の不動産所得などが対象。","topic":"タックス","diff":"応用"},{"q":"不動産の登記記録に公信力はないため、登記を信じて取引しても法的に保護されない場合がある。","t":"ox","a":true,"exp":"登記に対抗力はあるが公信力はない。だから現地調査や権利関係の確認が重要になる。不動産分野の最頻出論点のひとつ。","topic":"不動産","diff":"重要"},{"q":"相続税路線価は公示価格のおおむね何%の水準に設定されているか。","t":"mc","c":["80%","70%","90%"],"a":0,"exp":"路線価＝公示価格の80%、固定資産税評価額＝70%。基準地標準価格は100%（都道府県・7月1日時点）。4つの価格の対比表で覚える。","topic":"不動産","diff":"重要"},{"q":"宅地建物取引業者と結ぶ専任媒介契約の有効期間は、3ヶ月を超えることができない。","t":"ox","a":true,"exp":"専任・専属専任とも3ヶ月以内。専任は2週間に1回以上、専属専任は1週間に1回以上の業務報告義務がある。一般媒介には法定の期間制限なし。","topic":"不動産","diff":"応用"},{"q":"解約手付が交付された売買契約では、相手方が履行に着手するまでは、買主は手付を放棄して、売主は手付の倍額を返して契約を解除できる。","t":"ox","a":true,"exp":"「買主は放棄・売主は倍返し」。相手方が履行に着手した後は手付解除できない。","topic":"不動産","diff":"重要"},{"q":"市街化調整区域とは、計画的に市街化を進める区域のことである。","t":"ox","a":false,"exp":"市街化調整区域は市街化を「抑制」する区域。積極的に市街化を図るのは市街化区域（すでに市街地＋おおむね10年以内に市街化を図る区域）。","topic":"不動産","diff":"重要"},{"q":"建築物の敷地は、原則として幅員4m以上の道路に何m以上接していなければならないか。","t":"mc","c":["2m","1m","4m"],"a":0,"exp":"接道義務。幅員4m未満の2項道路ではセットバックが必要になり、後退部分は建ぺい率・容積率の計算に入れない。","topic":"不動産","diff":"重要"},{"q":"建ぺい率とは、建築物の延べ面積の敷地面積に対する割合である。","t":"ox","a":false,"exp":"建ぺい率は「建築面積」÷敷地面積。延べ面積÷敷地面積は容積率。用語の入替えは定番のひっかけ。","topic":"不動産","diff":"重要"},{"q":"住宅用地の固定資産税は、200㎡以下の部分について課税標準が6分の1になる特例がある。","t":"ox","a":true,"exp":"小規模住宅用地の特例。200㎡超の部分は3分の1。この特例が「空き家でも建物を壊さない」動機になっている点は時事的にも重要。","topic":"不動産","diff":"応用"},{"q":"自宅（居住用財産）を売却した場合、所有期間の長短に関係なく、譲渡所得から最高3,000万円を控除できる特例がある。","t":"ox","a":true,"exp":"居住用3,000万円特別控除。配偶者や親子など特別関係者への譲渡には使えない。10年超所有なら軽減税率と併用できる。","topic":"不動産","diff":"重要"},{"q":"土地・建物の譲渡所得の長期・短期は、譲渡した年の1月1日時点の所有期間が何年を超えるかで判定するか。","t":"mc","c":["5年","10年","3年"],"a":0,"exp":"1月1日判定で5年超なら長期（税率20.315%）、5年以下は短期（39.63%）。「譲渡した日」ではなく「その年の1月1日」で数える点がひっかけ。","topic":"不動産","diff":"重要"},{"q":"相続人が配偶者と子2人の場合、配偶者の法定相続分はどれか。","t":"mc","c":["2分の1","3分の2","4分の3"],"a":0,"exp":"配偶者と子＝1/2ずつ（子は1/2を人数で等分）。配偶者と直系尊属＝2/3・1/3、配偶者と兄弟姉妹＝3/4・1/4。3パターンは瞬答できるように。","topic":"相続・事業承継","diff":"重要"},{"q":"相続の放棄や限定承認は、自己のために相続の開始があったことを知った時から3ヶ月以内に家庭裁判所に申述しなければならない。","t":"ox","a":true,"exp":"3ヶ月（熟慮期間）。放棄は単独でできるが、限定承認は相続人全員で行う必要がある。","topic":"相続・事業承継","diff":"重要"},{"q":"相続税の申告書は、相続の開始があったことを知った日の翌日から何ヶ月以内に提出しなければならないか。","t":"mc","c":["10ヶ月","4ヶ月","6ヶ月"],"a":0,"exp":"相続税の申告・納付は10ヶ月以内。所得税の準確定申告は4ヶ月以内。期限の使い分け（3・4・10ヶ月）は毎回出る。","topic":"相続・事業承継","diff":"重要"},{"q":"被相続人の兄弟姉妹には、遺留分が認められていない。","t":"ox","a":true,"exp":"遺留分があるのは配偶者・子・直系尊属のみ。割合は原則2分の1（直系尊属のみの場合は3分の1）。","topic":"相続・事業承継","diff":"重要"},{"q":"相続税の基礎控除額の計算式はどれか。","t":"mc","c":["3,000万円＋600万円×法定相続人の数","5,000万円＋1,000万円×法定相続人の数","3,000万円＋500万円×法定相続人の数"],"a":0,"exp":"現行は3,000万＋600万×人数（2015年改正後）。相続放棄した人も基礎控除の「法定相続人の数」には含める点に注意。","topic":"相続・事業承継","diff":"重要"},{"q":"相続人が受け取った死亡保険金の非課税限度額は「500万円×法定相続人の数」である。","t":"ox","a":true,"exp":"死亡退職金にも同じ非課税枠が別枠である。相続対策で生命保険が使われる最大の理由。","topic":"相続・事業承継","diff":"重要"},{"q":"配偶者の税額軽減を適用すると、配偶者が取得した財産が1億6,000万円または法定相続分のいずれか多い金額までは相続税がかからない。","t":"ox","a":true,"exp":"適用には申告が必要。軽減を最大限使うと二次相続の負担が増えることがあるため、トータルでの検討が実務では重要。","topic":"相続・事業承継","diff":"重要"},{"q":"暦年課税による贈与税の基礎控除額は、受贈者1人につき年間110万円である。","t":"ox","a":true,"exp":"「もらう人」単位で年110万円。父と母から110万円ずつもらうと合計220万円になり基礎控除を超える点がひっかけで出る。","topic":"相続・事業承継","diff":"基礎"},{"q":"贈与税の配偶者控除（最高2,000万円）の適用要件のひとつは、婚姻期間が20年以上あることである。","t":"ox","a":true,"exp":"居住用不動産またはその取得資金の贈与が対象で、基礎控除110万円と合わせて2,110万円まで非課税。同じ配偶者からは一生に一度だけ。","topic":"相続・事業承継","diff":"応用"},{"q":"小規模宅地等の特例で、被相続人の居住用宅地（特定居住用宅地等）は何㎡まで80%減額されるか。","t":"mc","c":["330㎡","400㎡","200㎡"],"a":0,"exp":"居住用330㎡・80%減。事業用400㎡・80%減、貸付用200㎡・50%減。3点セットの数字は確実に。","topic":"相続・事業承継","diff":"重要"}]},{"id":"fp2","label":"FP2級","full":"2級FP技能検定（学科）","step":"STEP 2","format":"学科は四肢択一60問（CBT）ほか実技試験","pass":"学科は36問以上（6割）で合格","note":"3級と範囲は同じで、数字の細部と組合せ問題が増える。受験には3級合格・実務経験2年・AFP研修修了のいずれかが必要。保険営業の実務に一番直結する級。","next":"2級合格＋AFP研修でAFP登録の道も。学科の貯金があるうちに1級へ。","questions":[{"q":"FPの行為として、関連法規に照らして適切なものはどれか。","t":"mc","c":["公的年金制度の一般的なしくみを顧客に説明した","社会保険労務士資格なしに年金請求書の作成を代行した","税理士資格なしに顧客の相続税額を具体的に計算して報酬を得た","弁護士資格なしに遺産分割の法律判断を示して交渉を代理した"],"a":0,"exp":"一般的な制度説明はFPの業務範囲。書類作成代行・個別の税額計算・法律事務の代理はそれぞれ社労士・税理士・弁護士の独占業務にあたる。","topic":"ライフプランニング","diff":"重要"},{"q":"2,000万円を年利2%で複利運用しながら20年間で取り崩す場合、毎年の受取額を求めるのに使う係数はどれか。","t":"mc","c":["資本回収係数","年金現価係数","減債基金係数","終価係数"],"a":0,"exp":"手元の元本×資本回収係数＝毎年取り崩せる額。逆に毎年の受取額から必要な元本を求めるのが年金現価係数。住宅ローンの年間返済額の計算にも使う。","topic":"ライフプランニング","diff":"重要"},{"q":"国の教育一般貸付と日本学生支援機構の奨学金について、正しい記述はどれか。","t":"mc","c":["両者は併用できる","教育一般貸付の申込人は学生本人に限られる","第二種奨学金は在学中も利息が発生する","教育一般貸付は変動金利のみである"],"a":0,"exp":"併用可能。教育一般貸付は保護者が申込人で固定金利、第二種の利息は在学中無利息・卒業後発生。世帯年収要件もある。","topic":"ライフプランニング","diff":"応用"},{"q":"フラット35について、誤っている記述はどれか。","t":"mc","c":["融資金利は全取扱金融機関で同一である","融資額の上限は8,000万円である","融資率が9割を超えると金利が高くなる","保証人は不要である"],"a":0,"exp":"金利は取扱金融機関ごとに異なる（申込時でなく融資実行時の金利を適用）。上限8,000万円・9割超で金利上乗せ・保証人不要・繰上返済手数料無料が特徴。","topic":"ライフプランニング","diff":"応用"},{"q":"70歳未満・標準報酬月額28〜50万円の人が、1ヶ月の医療費（総医療費）100万円・窓口負担30万円だった場合の高額療養費の自己負担限度額に最も近いものはどれか。","t":"mc","c":["約8万7千円","約30万円","約16万円","約5万7千円"],"a":0,"exp":"80,100円＋（1,000,000−267,000）×1%＝87,430円。窓口で払った30万円との差額が高額療養費として戻る。計算式ごと覚える。","topic":"ライフプランニング","diff":"重要"},{"q":"健康保険の出産育児一時金は、1児につき原則50万円である。","t":"ox","a":true,"exp":"2023年4月に42万→50万円へ引上げ。産科医療補償制度の対象外の出産は48.8万円。出産手当金（産休中の給与補てん・日額2/3）との区別も問われる。","topic":"ライフプランニング","diff":"応用"},{"q":"公的介護保険の第2号被保険者（40〜64歳）が保険給付を受けられるのは、どのような場合か。","t":"mc","c":["特定疾病（16疾病）により要介護・要支援となった場合","原因を問わず要介護認定を受けた場合","交通事故で要介護となった場合","本人が希望した場合"],"a":0,"exp":"第2号は末期がん・若年性認知症・脳血管疾患など16特定疾病が原因の場合のみ。原因を問わないのは65歳以上の第1号。","topic":"ライフプランニング","diff":"重要"},{"q":"雇用保険の基本手当について、自己都合退職の場合の所定給付日数は、被保険者期間に応じて90日〜150日である。","t":"ox","a":true,"exp":"一般受給資格者は90・120・150日。倒産・解雇等（特定受給資格者）は年齢と期間により最大330日。自己都合には待期7日に加え給付制限期間がある。","topic":"ライフプランニング","diff":"応用"},{"q":"加給年金は、厚生年金の被保険者期間が原則20年以上ある人に、65歳未満の生計維持されている配偶者等がいる場合に老齢厚生年金に加算される。","t":"ox","a":true,"exp":"「厚生年金の家族手当」。配偶者が65歳になると打ち切られ、配偶者側に振替加算が付く場合がある。繰下げ待機中は加給年金は支給されない。","topic":"ライフプランニング","diff":"応用"},{"q":"国民年金第1号被保険者（自営業者等）のiDeCoの拠出限度額は月額いくらか（付加保険料・国民年金基金との合算）。","t":"mc","c":["6万8千円","2万3千円","1万2千円","5万5千円"],"a":0,"exp":"第1号は月6.8万円（国民年金基金等と合算枠）。会社員は企業年金の有無等で月2万円〜2.3万円、専業主婦（夫）は2.3万円。区分別の限度額は頻出。","topic":"ライフプランニング","diff":"重要"},{"q":"ソルベンシー・マージン比率が200%を下回った保険会社は、金融庁による早期是正措置の対象となる。","t":"ox","a":true,"exp":"通常の予測を超えるリスクに対する支払余力の指標。200%という数字と「行政措置の基準」という意味をセットで覚える。","topic":"リスク管理","diff":"重要"},{"q":"総合福祉団体定期保険について、正しい記述はどれか。","t":"mc","c":["法人が保険料を負担し、原則として全額を損金算入できる","保険期間は最長10年である","加入に被保険者（従業員）の同意は不要である","保険金受取人は必ず法人でなければならない"],"a":0,"exp":"1年更新の定期保険で保険料は原則損金。加入には従業員の同意が必要で、受取人は遺族または法人。ヒューマン・ヴァリュー特約は法人受取。","topic":"リスク管理","diff":"応用"},{"q":"2019年7月8日以後契約の法人向け定期保険で、最高解約返戻率が70%超85%以下の場合、保険期間の当初4割の期間は支払保険料の何割を資産計上するか。","t":"mc","c":["6割","4割","全額","資産計上不要"],"a":0,"exp":"50%超70%以下→4割資産計上、70%超85%以下→6割資産計上、85%超→当初10年は支払保険料×最高解約返戻率×90%を資産計上。区分表は法人営業の必須知識。","topic":"リスク管理","diff":"重要"},{"q":"長期平準定期保険は、解約返戻金のピーク時期を役員の勇退時期に合わせることで、退職金の財源準備に活用できる。","t":"ox","a":true,"exp":"ピークで解約し返戻金を退職金に充当（益金と損金の相殺）。ピーク経過後は返戻率が下がるため、出口の時期管理が設計の肝。","topic":"リスク管理","diff":"応用"},{"q":"リビング・ニーズ特約により被保険者が生前に受け取った保険金は、非課税である。","t":"ox","a":true,"exp":"余命6ヶ月以内の生前給付は非課税。ただし使い残して死亡した分は現金として相続財産になる（死亡保険金の非課税枠は使えない）。","topic":"リスク管理","diff":"重要"},{"q":"法人が受け取った火災保険金で焼失した建物の代替建物を取得した場合、圧縮記帳により課税を繰り延べることができる。","t":"ox","a":true,"exp":"保険差益に対する課税を代替資産の取得により繰延べ。法人の損害保険税務の代表論点。","topic":"リスク管理","diff":"応用"},{"q":"事業活動に伴う賠償リスクと保険の組合せとして、最も不適切なものはどれか。","t":"mc","c":["従業員が業務中にケガをした場合の治療費 → PL保険","製造した食品による食中毒の賠償 → PL保険（生産物賠償責任保険）","店舗の看板が落下し通行人にケガをさせた賠償 → 施設所有（管理）者賠償責任保険","請負工事中に第三者に与えた損害の賠償 → 請負業者賠償責任保険"],"a":0,"exp":"従業員のケガは労災（政府労災＋上乗せ労災）の領域で、PL保険の対象外。賠償責任保険は「誰に対する賠償か」で商品を選ぶ。","topic":"リスク管理","diff":"重要"},{"q":"自動車保険の人身傷害保険では、被保険者自身の過失部分を含めた損害額が、示談を待たずに支払われる。","t":"ox","a":true,"exp":"過失相殺されない実損払いが特徴。定額払いの搭乗者傷害との違いは2級でも頻出。","topic":"リスク管理","diff":"重要"},{"q":"契約者＝夫、被保険者＝夫、年金受取人＝妻の個人年金保険で年金支払いが開始された場合の課税として、正しいものはどれか。","t":"mc","c":["年金開始時に年金受給権が贈与税の対象となり、毎年の年金は雑所得","毎年の年金全額が非課税","年金開始時に相続税、毎年の年金は非課税","毎年の年金が全額贈与税の対象"],"a":0,"exp":"契約者と受取人が異なると年金開始時に受給権評価額へ贈与税。その後の毎年の年金は課税済み部分を除き雑所得（二重課税調整あり）。","topic":"リスク管理","diff":"応用"},{"q":"先進医療特約の対象となる先進医療は、契約時点ではなく療養を受けた時点で厚生労働大臣が定めるものをいう。","t":"ox","a":true,"exp":"先進医療の対象技術は入れ替わるため「療養時点」で判定する。技術料は全額自己負担となるのが特約の存在理由。","topic":"リスク管理","diff":"応用"},{"q":"個人賠償責任補償特約の被保険者には、本人・配偶者・同居の親族のほか、別居の未婚の子も含まれるのが一般的である。","t":"ox","a":true,"exp":"下宿中の大学生の自転車事故などもカバーされる。「未婚」は婚姻歴がないことを指す点、1つの契約で家族全体を守れる点が提案のポイント。","topic":"リスク管理","diff":"応用"},{"q":"日銀短観は、日本銀行が年4回、企業の業況感などを直接調査する統計である。","t":"ox","a":true,"exp":"3・6・9・12月に調査、業況判断DI（「良い」−「悪い」）が代表指標。GDP（内閣府）・景気動向指数（内閣府）と発表元の区別も問われる。","topic":"金融資産運用","diff":"基礎"},{"q":"表面利率1%・残存期間4年の債券を額面100円あたり98円で購入し、満期まで保有した場合の最終利回り（単利・年率）に最も近いものはどれか。","t":"mc","c":["約1.53%","約1.02%","約2.04%","約0.51%"],"a":0,"exp":"（1＋（100−98）÷4）÷98×100≒1.53%。分子＝年利子＋償還差益の年割り、分母＝購入価格。利回り計算は形を覚えれば得点源。","topic":"金融資産運用","diff":"重要"},{"q":"債券の信用格付でBBB（トリプルB）格相当以上のものを、一般に投資適格債という。","t":"ox","a":true,"exp":"BB以下は投機的格付（ハイイールド債）。格付が下がると債券価格は下落し利回りは上昇する。","topic":"金融資産運用","diff":"重要"},{"q":"ROE（自己資本利益率）の計算式はどれか。","t":"mc","c":["当期純利益÷自己資本×100","当期純利益÷総資産×100","株価÷1株当たり純利益","配当金総額÷当期純利益×100"],"a":0,"exp":"ROE＝当期純利益÷自己資本。総資産で割るとROA、株価÷EPSはPER、配当÷純利益は配当性向。式の入替え問題が定番。","topic":"金融資産運用","diff":"重要"},{"q":"配当性向とは、当期純利益のうち配当金として株主に支払った割合をいう。","t":"ox","a":true,"exp":"配当性向＝配当金総額÷当期純利益。株価に対する配当の割合は配当利回りで、別物。","topic":"金融資産運用","diff":"基礎"},{"q":"ETF（上場投資信託）について、誤っている記述はどれか。","t":"mc","c":["購入は1日1回算出される基準価額で行う","証券取引所に上場され、指値・成行注文ができる","指数連動型が中心である","信用取引の対象にもなる"],"a":0,"exp":"ETFは市場価格でリアルタイムに売買する（基準価額での購入は非上場投信）。上場・指値成行・信用取引可がETFの特徴。","topic":"金融資産運用","diff":"応用"},{"q":"外貨預金の為替差益は、預入時に為替予約を付けていない場合、雑所得として総合課税の対象になる。","t":"ox","a":true,"exp":"利息は源泉分離、為替差益は雑所得（総合課税）。外貨建てMMFの売却益は申告分離20.315%と扱いが異なる点まで問われる。","topic":"金融資産運用","diff":"応用"},{"q":"2資産に分散投資する場合、相関係数がどの値のときに分散投資によるリスク低減効果が最大になるか。","t":"mc","c":["−1","0","＋1","0.5"],"a":0,"exp":"相関係数−1（完全に逆の値動き）で低減効果が最大、＋1では効果なし。ポートフォリオの期待収益率は各資産の加重平均になる。","topic":"金融資産運用","diff":"重要"},{"q":"無リスク金利1%、ポートフォリオの収益率7%・標準偏差4%のとき、シャープレシオはいくつか。","t":"mc","c":["1.5","1.75","0.67","6"],"a":0,"exp":"（7−1）÷4＝1.5。「リスク1単位あたりの超過リターン」で、数値が大きいほど効率が良い。計算は引いて割るだけ。","topic":"金融資産運用","diff":"重要"},{"q":"新NISAの成長投資枠の非課税保有限度額は、生涯限度額1,800万円のうち1,200万円までである。","t":"ox","a":true,"exp":"つみたて投資枠だけで1,800万円を使い切ることは可能。売却分の枠は翌年に簿価ベースで復活。制度の数字は完璧にしておく。","topic":"金融資産運用","diff":"重要"},{"q":"所得税における所得の種類と課税
