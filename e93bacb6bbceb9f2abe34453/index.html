<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リール制作｜Dubai Shiogensui</title>
<style>
/* ============================================================
   リール制作の管理（2026-09-20 ゼロから作り直し）
   LINEで流れていた「誰が・どこまで・いつまでに」を、順を追って見えるようにする。
   ・全体（1行＝1本のリール）→ 担当ごと → 1本の詳細、の一本の流れ
   ・地は白。担当の色は Yui＝薄い緑、Ai＝薄いオレンジ（変えない）
   ・書体は明朝。外からは読み込まない。絵文字は使わない
   ============================================================ */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F7F9; --surface3:#EEF0F3;
  --line:#E4E7EC; --line2:#CFD4DC; --track:#EDEFF2;
  --tx:#2E3239; --tx2:#585E67; --tx3:#646A73;
  --accent:#B23A48; --accent-d:#8E2A38; --accent-bg:#FBEBEE;
  --gold:#8A6410; --gold-bg:#FBF2DC;
  --ok:#137A5F; --ok-bg:#E4F3EE;
  --info:#23608F; --info-bg:#E7F0F7;
  --jp-bg:#EFF7F1; --jp-ed:#CFE5D6; --jp-tx:#38684A;
  --db-bg:#FEF3EA; --db-ed:#F2D9C2; --db-tx:#95521F;
  --r:18px; --r-sm:12px;
  --lift:0 1px 2px rgba(30,34,40,.04);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body,button,input,select,textarea{
  font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho",
    "Noto Serif JP","Source Han Serif JP","MS PMincho","MS Mincho",serif;
}
body{margin:0;background:var(--bg);color:var(--tx);font-size:1rem;line-height:1.85;letter-spacing:.03em;}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;letter-spacing:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--line2);outline-offset:2px;}
input,textarea{font-size:1rem;color:var(--tx);}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;}
em{font-style:normal;font-weight:700;color:var(--gold);}
.mute{color:var(--tx3);}

/* ---- 頭 ---- */
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);}
.hd-in{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px;}
.hd-t{flex:1;min-width:0;}
.hd-t b{display:block;font-size:1.02rem;line-height:1.3;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-t small{display:block;font-size:.74rem;color:var(--tx3);letter-spacing:.08em;}
.me{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 6px;font-size:.86rem;font-weight:700;}
.me:hover{background:var(--surface2);}
.ava{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:.8rem;font-weight:700;}
.ava.jp{background:var(--jp-bg);color:var(--jp-tx);box-shadow:inset 0 0 0 1px var(--jp-ed);}
.ava.db{background:var(--db-bg);color:var(--db-tx);box-shadow:inset 0 0 0 1px var(--db-ed);}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--tx3);letter-spacing:.06em;}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line2);}
.sync.on i{background:var(--ok);} .sync.err i{background:var(--accent);}

/* ---- 切り替え ---- */
.nav{position:sticky;top:57px;z-index:19;background:#fff;border-bottom:1px solid var(--line);}
.nav-in{max-width:960px;margin:0 auto;padding:0 18px;display:flex;gap:4px;}
.nav button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px 11px;font-size:.86rem;font-weight:700;letter-spacing:.08em;color:var(--tx3);border-bottom:2px solid transparent;position:relative;}
.nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);}
.nav button svg{width:16px;height:16px;}
/* 4つ並ぶと、狭い画面で「担当ごと」が折れる */
.nav button{white-space:nowrap;}
@media(max-width:430px){.nav button{font-size:.78rem;gap:4px;padding:12px 2px 11px;letter-spacing:0;} .nav button svg{width:14px;height:14px;} .nav .dot{right:calc(50% - 34px);}}
.nav .dot{position:absolute;top:7px;right:calc(50% - 30px);min-width:17px;height:17px;border-radius:9px;background:var(--info);color:#fff;font-size:.68rem;line-height:17px;text-align:center;padding:0 5px;}
/* いまの時刻。ノートの右に置く */
.clk{flex:none;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:14px;margin-left:4px;border-left:1px solid var(--line);font-size:.66rem;line-height:1.35;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums;}
@media(max-width:430px){.clk{font-size:.56rem;padding-left:7px;margin-left:2px;}}

/* ---- 本文 ---- */
#main{max-width:960px;margin:0 auto;padding:16px 18px 60px;}
/* 今月の画面だけ、暦を広く使う */
body.mon #main{max-width:1240px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;}
.top h1{margin:0;font-size:1.28rem;letter-spacing:.06em;font-weight:700;}
.top .sub{font-size:.78rem;color:var(--tx3);margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font-size:.86rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.btn-main{background:var(--accent);color:#fff;}
.btn-main:hover{background:var(--accent-d);}
.btn-line{border:1px solid var(--line2);color:var(--tx2);background:#fff;}
.btn-line:hover{background:var(--surface2);color:var(--tx);}
.btn-sm{padding:6px 12px;font-size:.78rem;}
.btn svg{width:14px;height:14px;}

.band{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;letter-spacing:.1em;color:var(--tx2);border-bottom:1px solid var(--line);padding:0 2px 8px;margin:22px 0 4px;}
.band svg{width:15px;height:15px;color:var(--tx3);}
.band b{margin-left:auto;font-size:.92rem;color:var(--tx);font-variant-numeric:tabular-nums;}
.band.done{color:var(--ok);} .band.done svg{color:var(--ok);}
.cols{display:grid;grid-template-columns:18px 1fr auto;gap:10px;font-size:.7rem;color:var(--tx3);letter-spacing:.1em;padding:6px 4px 2px;}
.cols span:last-child{text-align:right;}
.empty{padding:22px 10px;text-align:center;color:var(--tx3);font-size:.86rem;}

/* 1行＝1本 */
.li{cursor:pointer;position:relative;display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:11px 10px;border-bottom:1px solid var(--surface3);background:var(--wtint,transparent);border-radius:0 10px 10px 0;}
/* 濃い色の帯は置かない。地の薄い色（左＝薄い緑／右＝薄いオレンジ）だけで誰のものかを出す */
.li:last-child{border-bottom:0;}
.chk{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;background:#fff;margin-top:5px;position:relative;}
.chk:hover{border-color:var(--ok);}
.chk.on{background:var(--ok);border-color:var(--ok);}
.chk.on:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.li .t{display:block;text-align:left;font-size:1rem;font-weight:700;line-height:1.55;color:var(--tx);}
.li .t:hover{color:var(--accent);}
.li .t u{text-decoration:none;box-shadow:inset 0 -1px 0 var(--line2);}
.li .t:hover u{box-shadow:inset 0 -1px 0 var(--accent);}
.li .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center;}
.li .r{display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap;}
.li .whos{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;}
.with{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;color:var(--tx3);margin-top:3px;}
.with svg{width:11px;height:11px;}
.li.done .t{color:var(--tx3);font-weight:400;text-decoration:line-through;text-decoration-color:var(--line2);}
.li.done .t:hover{color:var(--tx);}
.who{display:inline-block;font-size:.74rem;font-weight:700;border-radius:6px;padding:1px 9px;line-height:1.75;}
.who.jp{background:var(--jp-bg);color:var(--jp-tx);border:1px solid var(--jp-ed);}
.who.db{background:var(--db-bg);color:var(--db-tx);border:1px solid var(--db-ed);}
.tg{display:inline-block;font-size:.7rem;font-weight:700;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 7px;line-height:1.75;}
.tg i{font-style:normal;margin-left:5px;opacity:.85;font-variant-numeric:tabular-nums;}
.tg.late{color:var(--accent);background:var(--accent-bg);border-color:var(--accent);}
.tg svg{width:11px;height:11px;margin-right:3px;}
.tx{display:inline-block;font-size:.7rem;font-weight:700;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold);border-radius:5px;padding:0 7px;line-height:1.75;}
.warn{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--accent);}
.warn svg{width:11px;height:11px;}
.d{font-size:.76rem;color:var(--tx3);font-variant-numeric:tabular-nums;}
.d b{color:var(--tx);}
.d.hot,.d.hot b{color:var(--accent);}
.d.ok,.d.ok b{color:var(--ok);}
.pri{display:inline-block;font-size:.66rem;font-weight:700;border-radius:5px;padding:0 6px;line-height:1.7;}
.pri.high{color:var(--accent);background:var(--accent-bg);}
.pri.mid{color:var(--gold);background:var(--gold-bg);}
.pri.low{color:var(--tx3);background:var(--surface2);}
.un{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--info);}
.un svg{width:12px;height:12px;}

/* 担当ごと */
/* 担当を横に並べた箱 */
.asg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:2px 0 6px;}
.asg-c{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 9px;}
.asg-c.jp{border-color:var(--jp-ed);background:#FAFDFB;} .asg-c.db{border-color:var(--db-ed);background:#FFFBF7;}
.asg-h{display:flex;align-items:center;gap:7px;width:100%;}
.asg-h b{font-size:1.3rem;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;}
.asg-h i{font-style:normal;font-size:.72rem;color:var(--tx3);margin-left:-3px;}
.asg-h svg{width:14px;height:14px;color:var(--tx3);margin-left:auto;}
.asg-s{font-size:.74rem;color:var(--tx3);margin-top:2px;}
.asg-s.hot{color:var(--accent);font-weight:700;}
.asg-a{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--tx2);}
.asg-a:hover{color:var(--accent);}
.asg-a svg{width:12px;height:12px;}
.addl{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:.84rem;font-weight:700;color:var(--tx2);margin-bottom:10px;}
.addl:hover{border-color:var(--line2);color:var(--tx);}
.addl svg{width:14px;height:14px;}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px;}
@media(max-width:600px){.two{grid-template-columns:1fr;}}
.col{border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;box-shadow:var(--lift);}
.col.jp{border-color:var(--jp-ed);background:#FAFDFB;} .col.db{border-color:var(--db-ed);background:#FFFBF7;}
.col h3{margin:0 0 8px;font-size:.92rem;display:flex;align-items:center;gap:8px;}
.col h3 b{margin-left:auto;font-size:.8rem;color:var(--tx3);font-variant-numeric:tabular-nums;}
.mi{position:relative;overflow:hidden;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:8px;background:var(--wtint,#fff);border:1px solid var(--line);border-radius:12px;padding:9px 10px 8px;margin-bottom:8px;}
.mi .t{display:block;text-align:left;font-size:.94rem;font-weight:700;line-height:1.5;color:var(--tx);}
.mi .t:hover{color:var(--accent);}
.mi .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center;}
.mi .d{margin-top:4px;display:block;}

/* ---- シート ---- */
/* スマホのブラウザは下の道具バーの分だけ見える高さが縮む。vh のままだとシートの頭（×）が画面の上に隠れる。
   見えている高さ（dvh）で測り、上には必ず少し余白を残す */
.ov{position:fixed;inset:0;z-index:40;background:rgba(30,34,40,.28);display:flex;align-items:flex-end;justify-content:center;padding-top:max(14px,env(safe-area-inset-top));}
@media(min-width:700px){.ov{align-items:center;padding:24px;}}
.sheet{width:100%;max-width:720px;max-height:94vh;max-height:calc(100dvh - max(14px,env(safe-area-inset-top)));background:#fff;border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column;border:1px solid var(--line);}
@media(min-width:700px){.sheet{border-radius:var(--r);max-height:90vh;max-height:90dvh;}}
.sh-hd{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
.sh-hd h2{flex:1;min-width:0;margin:0;font-size:1.06rem;line-height:1.4;letter-spacing:.03em;}
.sh-x{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);background:var(--surface2);border:1px solid var(--line);flex:none;}
.sh-x:hover{background:var(--surface2);color:var(--tx);}
.sh-x svg{width:17px;height:17px;}
.sh-bd{flex:1;min-height:0;overflow:auto;padding:18px 18px 24px;overscroll-behavior:contain;}
.sh-ft{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
body.has-sheet{position:fixed;width:100%;overflow:hidden;}

.frm{display:flex;flex-direction:column;gap:18px;}
.frm label{display:block;}
.frm [hidden]{display:none!important;}
.rec{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ok);background:var(--ok-bg);border-radius:12px;padding:10px 13px;}
.rec svg{width:15px;height:15px;flex:none;}
/* 期日と、継続する予定 */
.dgrp{display:flex;flex-direction:column;gap:10px;}
.fspan{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.spanb{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:4px 11px;}
.spanb svg{width:12px;height:12px;}
.spanb:hover{color:var(--tx);border-color:var(--line2);}
.spanb[aria-pressed="true"]{color:var(--info);border-color:var(--info);background:var(--info-bg);}
.frm .jp{display:block;font-size:.76rem;font-weight:700;letter-spacing:.1em;color:var(--tx2);margin-bottom:7px;}
.frm .jp i{font-style:normal;font-weight:400;color:var(--tx3);}
.frm input[type=text],.frm input[type=url],.frm input[type=date],.frm textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 12px;background:#fff;line-height:1.7;}
.frm textarea{resize:vertical;min-height:80px;}
/* 追加のときに開く詳細 */
.fmore{display:flex;align-items:center;gap:7px;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.88rem;font-weight:700;color:var(--tx2);background:var(--surface2);}
.fmore:hover{border-color:var(--line2);color:var(--tx);}
.fmore svg{width:14px;height:14px;transition:transform .15s;}
.fmore[aria-expanded="true"] svg{transform:rotate(90deg);}
.fmore i{font-style:normal;font-weight:400;font-size:.76rem;color:var(--tx3);margin-left:auto;}
.fmore-b{display:flex;flex-direction:column;gap:16px;margin-top:-2px;}
.fmore-b textarea{width:100%;box-sizing:border-box;}
.seg{display:flex;flex-wrap:wrap;gap:7px;}
.seg button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:.86rem;font-weight:700;color:var(--tx2);background:#fff;}
.seg button svg{width:13px;height:13px;}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg button.jp[aria-pressed="true"]{background:var(--jp-bg);border-color:var(--jp-tx);color:var(--jp-tx);box-shadow:inset 0 0 0 1.5px var(--jp-tx);}
.seg button.db[aria-pressed="true"]{background:var(--db-bg);border-color:var(--db-tx);color:var(--db-tx);box-shadow:inset 0 0 0 1.5px var(--db-tx);}
/* 一覧：左から「日付とタイトル」「ステータス」「担当者」 */
.lh{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(160px,1.25fr) minmax(110px,auto);gap:12px;padding:0 13px 6px;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--tx3);}
.li2{cursor:pointer;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(160px,1.25fr) minmax(110px,auto);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:var(--wtint,#fff);}
.li2 .c1{display:flex;flex-direction:column;gap:3px;min-width:0;}
.li2 .c1 .t{text-align:left;font-size:.98rem;font-weight:700;color:var(--tx);line-height:1.6;}
.li2 .c1 .d{font-size:.78rem;}
.li2 .c2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;text-align:left;}
.li2 .c2 .none{font-size:.78rem;color:var(--tx3);border:1px dashed var(--line2);border-radius:999px;padding:3px 10px;}
.li2 .c3{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;}
.li2.done{opacity:.92;}
.li2.done .c1 .t{font-weight:400;}
@media(max-width:620px){
  .lh{display:none;}
  .li2{grid-template-columns:1fr;gap:7px;}
  .li2 .c3{justify-content:flex-start;}
}
.hint{display:flex;gap:7px;align-items:flex-start;font-size:.78rem;line-height:1.75;color:var(--tx3);margin-top:12px;}
.hint svg{width:13px;height:13px;flex:none;margin-top:5px;}

/* ---- 1本の詳細 ---- */
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:6px;}
.meta .d{font-size:.84rem;}
.rule{display:flex;align-items:flex-start;gap:7px;font-size:.8rem;line-height:1.75;color:var(--tx2);background:var(--surface2);border-radius:10px;padding:9px 12px;margin:10px 0 4px;}
.rule svg{width:14px;height:14px;flex:none;margin-top:5px;color:var(--gold);}
.rule.bad{color:var(--accent);background:var(--accent-bg);} .rule.bad svg{color:var(--accent);}
/* 手書きの図の並び */
.bx{margin-top:14px;}
.bx-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.bx-h h3{margin:0;flex:1;min-width:0;font-size:.9rem;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px;}
.bx textarea,.bx input[type=text],.bx input[type=url]{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:10px;padding:10px 11px;background:#fff;font-size:.94rem;line-height:1.8;resize:none;overflow:hidden;}
.bx .rttl{font-size:1.02rem;font-weight:700;}
.tkm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:700;color:var(--tx3);background:#fff;}
.tkm svg{width:13px;height:13px;}
.tkm b{background:var(--info);color:#fff;border-radius:999px;padding:0 6px;font-size:.68rem;}
.tkm.un{border-color:var(--info);color:var(--info);}
.zone{margin-top:14px;background:#F1F5FA;border:1.5px solid #D3E0EC;border-radius:14px;padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;}
.zone .zk{font-size:.78rem;font-weight:700;color:var(--tx2);letter-spacing:.08em;}
.zone .zk+.zr+.zk{margin-top:4px;}
.zr{display:flex;flex-wrap:wrap;gap:7px;}
.zc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:700;color:var(--tx3);background:#fff;min-height:36px;}
.zc svg{width:13px;height:13px;}
.zc.jp[aria-pressed="true"]{background:var(--jp-bg);border-color:var(--jp-tx);color:var(--jp-tx);box-shadow:inset 0 0 0 1px var(--jp-tx);}
.zc.db[aria-pressed="true"]{background:var(--db-bg);border-color:var(--db-tx);color:var(--db-tx);box-shadow:inset 0 0 0 1px var(--db-tx);}
.zc.tg2[aria-pressed="true"]{background:var(--info-bg);border-color:var(--info);color:var(--info);box-shadow:inset 0 0 0 1px var(--info);}
.zone .zx{font-size:.8rem;color:var(--tx2);}
.fx{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;font-size:.74rem;color:var(--tx3);}
.fx i{font-style:normal;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap;}
.fx .fu{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14em;}
.drv{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--info);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--info);background:var(--info-bg);text-decoration:none;}
.drv svg{width:14px;height:14px;}
.engh{display:flex;align-items:center;gap:7px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:.98rem;font-weight:700;letter-spacing:.08em;}
.engh svg{width:16px;height:16px;color:var(--tx3);}
.oth{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;}
.oth summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--tx2);}
.oth summary::-webkit-details-marker{display:none;}
.oth summary svg{width:13px;height:13px;transition:transform .15s;}
.oth[open] summary svg{transform:rotate(90deg);}
.bx .udrop .sub{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start;}
.bx .udrop .sub em{font-size:.7rem;font-weight:700;color:var(--tx3);letter-spacing:.1em;padding-top:11px;}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;margin-top:12px;box-shadow:var(--lift);}
.sec.ok{border-color:var(--ok);}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.sec-h h3{margin:0;font-size:.92rem;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px;}
.sec-h h3 svg{width:15px;height:15px;color:var(--tx3);}
.sec-h .sp{flex:1;}
.wseg{display:inline-flex;gap:4px;}
.wseg button{font-size:.7rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--tx3);background:#fff;line-height:1.75;}
.wseg button.jp[aria-pressed="true"]{background:var(--jp-bg);color:var(--jp-tx);border-color:var(--jp-ed);}
.wseg button.db[aria-pressed="true"]{background:var(--db-bg);color:var(--db-tx);border-color:var(--db-ed);}
.okb{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--tx3);border:1px solid var(--line2);border-radius:999px;padding:2px 10px 2px 6px;line-height:1.8;}
.okb .chk{width:15px;height:15px;margin:0;border-radius:4px;}
.okb .chk.on:after{left:4px;top:1px;width:4px;height:8px;}
.okb.on{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
.sec textarea,.sec input[type=url],.sec input[type=text]{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 11px;background:#fff;font-size:.94rem;line-height:1.8;resize:none;overflow:hidden;}
.sec .sub{display:grid;grid-template-columns:44px 1fr;gap:8px 8px;align-items:start;margin-top:6px;}
.sec .sub em{font-size:.7rem;font-weight:700;color:var(--tx3);letter-spacing:.1em;padding-top:11px;}
.sec-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap;}
.okat{font-size:.72rem;color:var(--tx3);}
.talk{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface2);}
.talk:hover{color:var(--tx);border-color:var(--line2);}
.talk svg{width:13px;height:13px;}
.talk.un{color:var(--info);border-color:var(--info);background:var(--info-bg);}
.talk b{background:var(--info);color:#fff;border-radius:8px;padding:0 6px;font-size:.68rem;line-height:1.7;}
/* 投稿／企画の切り替え。.seg は押すと勝手に色が変わる部品なので、別の名前にしてある */
.mode{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:0 0 12px;}
.mode button{padding:7px 16px;font-size:.84rem;font-weight:700;color:var(--tx2);background:#fff;}
.mode button+button{border-left:1px solid var(--line2);}
.mode button[aria-selected="true"]{background:var(--accent);color:#fff;}
.mode button b{font-size:.72rem;background:rgba(255,255,255,.28);border-radius:8px;padding:0 6px;margin-left:4px;}
.mode button[aria-selected="false"] b{background:var(--accent-bg);color:var(--accent);}
.li .mv,.li .chk,.mi .chk{cursor:pointer;}
.li .mv{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);margin-top:2px;}
.li .mv:hover{border-color:var(--accent);color:var(--accent);}
.li .mv svg{width:12px;height:12px;}
.done-row{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;}
.done-row .btn-ok{background:var(--ok);color:#fff;}
.done-row .btn-ok:hover{background:#0E6A51;}
.done-txt{font-size:.82rem;color:var(--ok);font-weight:700;}

/* 新しい版の知らせ */
.verbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99990;background:var(--info);color:#fff;font-size:.84rem;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:11px 20px;box-shadow:0 4px 16px rgba(30,34,40,.18);white-space:nowrap;}
/* ---- 更新のお知らせ ---- */
.fd{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 8px;margin:2px 0 12px;}
.fd-h{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--tx2);padding-bottom:6px;}
.fd-h svg{width:15px;height:15px;color:var(--tx3);}
.fd-r{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:3px 11px;}
.fd-r:hover{color:var(--tx);border-color:var(--line2);}
.fd-i{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--surface3);}
.fd-i:hover{background:var(--surface2);}
.fd-i .ava{width:22px;height:22px;font-size:.7rem;margin-top:1px;}
.fd-t{font-size:.84rem;font-weight:700;color:var(--tx);line-height:1.5;}
.fd-s{font-size:.76rem;color:var(--tx2);line-height:1.6;margin-top:1px;word-break:break-word;}
.fd-d{margin-left:auto;display:flex;flex-direction:column;flex:none;font-size:.6rem;color:var(--tx3);line-height:1.45;text-align:right;}
.fd-i.newrow .fd-t:after{content:"新";font-size:.62rem;color:#fff;background:#D62828;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;}
.fd-m{width:100%;font-size:.76rem;font-weight:700;color:var(--tx3);border-top:1px solid var(--surface3);padding:8px 0 4px;}
.fd-m:hover{color:var(--tx);}
.nw{display:inline-block;font-size:.62rem;font-weight:700;color:#fff;background:#D62828;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:1.7;}
@media(max-width:520px){ .fd-d{display:none;} }
/* ---- やり取り ---- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--tx2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin-bottom:12px;}
.back:hover{background:var(--surface2);color:var(--tx);}
.back svg{width:13px;height:13px;}
.src{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px 14px;font-size:.88rem;line-height:1.85;color:var(--tx2);white-space:pre-wrap;margin-bottom:6px;}
.src.none{color:var(--tx3);}
.thread{display:flex;flex-direction:column;gap:14px;margin-top:14px;background:#F2F2EF;border-radius:16px;padding:16px 13px;}
.daysep{text-align:center;}
.daysep span{display:inline-block;font-size:.7rem;color:#fff;background:rgba(46,50,57,.28);border-radius:999px;padding:2px 12px;letter-spacing:.08em;}
.msg{display:flex;gap:8px;align-items:flex-start;}
.msg.me{flex-direction:row-reverse;}
.msg .ava{flex:none;margin-top:18px;}
.msg.cont .ava{margin-top:0;}
.msg .ava.sp{background:transparent;box-shadow:none;}
.msg.cont .bub:after{display:none;}
.msg .bx{max-width:84%;min-width:0;}
.msg.me .bx{margin-left:auto;}
.msg .nm{font-size:.72rem;color:var(--tx2);margin-bottom:3px;padding-left:2px;}
/* 吹き出しと時刻を横に並べる。自分の分は左右を入れ替える */
.msg .row{display:flex;align-items:flex-end;gap:6px;min-width:0;}
.msg.me .row{flex-direction:row-reverse;}
.bub{position:relative;border:0;border-radius:16px;padding:9px 13px;font-size:.92rem;line-height:1.8;color:var(--tx);background:var(--b,#fff);white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px rgba(30,34,40,.06);min-width:0;}
/* しっぽ。誰が言ったかを形でも分かるようにする */
.bub:after{content:"";position:absolute;top:11px;left:-5px;width:9px;height:11px;background:var(--b,#fff);clip-path:polygon(100% 0,100% 100%,0 35%);}
.msg.me .bub:after{left:auto;right:-5px;clip-path:polygon(0 0,0 100%,100% 35%);}
.msg .ts{display:flex;flex-direction:column;flex:none;font-size:.6rem;line-height:1.4;color:var(--tx3);padding-bottom:2px;}
.msg.me .ts{text-align:right;}
.composer{position:sticky;bottom:0;background:#fff;padding-top:12px;margin-top:14px;border-top:1px solid var(--line);}
.cbox{display:flex;gap:8px;align-items:flex-end;}
.cbox textarea{flex:1;border:1px solid var(--line2);border-radius:14px;padding:10px 13px;min-height:44px;max-height:160px;resize:none;line-height:1.7;}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.send svg{width:18px;height:18px;}
.send:hover{background:var(--accent-d);}

/* ---- 操作者 ---- */
.aclist{display:flex;flex-direction:column;gap:8px;}
.acrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;width:100%;}
.acrow:hover{background:var(--surface2);}
.acrow b{font-size:1rem;}
.acrow small{margin-left:auto;font-size:.76rem;color:var(--tx3);}
.acrow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
a{color:var(--info);word-break:break-all;}
/* ---- 今月 ---- */
.delb{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
.delb:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-bg);}
.delb svg{width:13px;height:13px;}
.dir{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);padding:16px 18px 14px;box-shadow:var(--lift);}
.dir .k{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--gold);}
.dir .t{font-size:1.1rem;font-weight:700;line-height:1.75;margin:2px 0 8px;}
.dir .s{font-size:.88rem;line-height:1.9;color:var(--tx2);white-space:pre-wrap;margin-bottom:10px;}
.dir .t2{font-size:1rem;font-weight:700;line-height:1.75;margin:2px 0 10px;white-space:pre-wrap;}
.dir{cursor:pointer;position:relative;}
.dir .k:first-child{padding-right:48px;}
/* 「書く」は枠の右上に置く。読むところと、直すところを分ける */
.dir-b{position:absolute;top:11px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);background:#fff;}
.dir-b:hover{color:var(--tx);border-color:var(--tx3);}
.dir-b svg{width:15px;height:15px;}
.dir .k+.k{margin-top:10px;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;}
.cal-hd h2{margin:0;font-size:1.22rem;letter-spacing:.08em;}
.cal-nav{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);border:1px solid var(--line);}
.cal-nav:hover{background:var(--surface2);}
.cal-nav svg{width:16px;height:16px;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal .dow{font-size:.8rem;color:var(--tx3);text-align:center;letter-spacing:.08em;padding-bottom:5px;}
.cal .dow.sun{color:var(--accent);} .cal .dow.sat{color:var(--info);}
.cal .c{min-width:0;overflow:visible;min-height:112px;border:1px solid var(--surface3);border-radius:10px;padding:6px 7px;font-size:.86rem;color:var(--tx3);text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;font-variant-numeric:tabular-nums;}
/* 日付は必ず升の左上。升の高さが変わっても動かない */
.cal .c .n{align-self:flex-start;flex:none;}
.cal .c{position:relative;}
.cal .c .pl{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--tx3);border:1px solid var(--line);background:#fff;}
.cal .c .pl:hover{color:var(--accent);border-color:var(--accent);}
.cal .c .pl svg{width:11px;height:11px;}
@media(max-width:520px){ .cal .c .pl{top:3px;right:3px;width:16px;height:16px;} .cal .c .pl svg{width:9px;height:9px;} }
.cal .c:hover{border-color:var(--line2);background:var(--surface2);}
.cal .c.pad{border-color:transparent;pointer-events:none;}
.cal .c.today{border-color:var(--accent);} .cal .c.today .n{color:var(--accent);font-weight:700;}
.cal .c.fut{background:#FAFAFB;}
.chip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.72rem;font-weight:700;color:var(--tx2);background:#F1F2F4;border:1px solid rgba(0,0,0,.08);border-radius:5px;padding:2px 5px;line-height:1.45;margin-top:3px;overflow:hidden;word-break:break-all;}
/* 赤い点＝まだ終わっていない印。白い縁を付けて、どの地の色の上でも見えるようにする */
.chip .dot,.legend .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#D62828;box-shadow:0 0 0 1.5px rgba(255,255,255,.9);margin-right:4px;vertical-align:1px;}
.legend .dot.lg{width:8px;height:8px;box-shadow:none;vertical-align:0;}
/* 何日間か続くもの。升の端まで伸ばして、隣の日と1本の帯に見せる */
/* 右へは升のすき間（5px）の分まで伸ばして、隣の日の帯とすき間なくつなげる */
.chip.span{-webkit-line-clamp:1;margin-left:-8px;margin-right:-13px;border-radius:0;border-top-color:var(--bc);border-bottom-color:var(--bc);border-left-color:transparent;border-right-color:transparent;}
.chip.span.s-head{border-radius:5px 0 0 5px;border-left-color:var(--bc);}
.chip.span.s-tail{margin-right:-8px;border-radius:0 5px 5px 0;border-right-color:var(--bc);}
.chip.span.s-head.s-tail{border-radius:5px;}
.chip{cursor:pointer;}
.chip:hover{filter:brightness(.94);}
/* 狭い画面では1枚1行。全部載せても暦が縦に伸びすぎないようにする */
@media(max-width:520px){
  .chip{-webkit-line-clamp:1;font-size:.58rem;padding:1px 3px;margin-top:2px;}
  .chip .dot{width:5px;height:5px;margin-right:2px;}
  .cal{gap:3px;} .cal .c{padding:3px 3px;min-height:74px;font-size:.76rem;}
  .chip.span{margin-left:-4px;margin-right:-7px;} .chip.span.s-tail{margin-right:-4px;}
  .cal .dow{font-size:.72rem;}
}
/* ---- ノート。教科書の目次 ---- */
.ncat{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--gold);margin:18px 2px 6px;}
.nrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--surface3);}
.nrow:hover{background:var(--surface2);}
.nrow-n{flex:none;font-size:.78rem;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums;padding-top:3px;letter-spacing:.06em;}
.nrow-b{flex:1;min-width:0;}
.nrow-t{display:block;font-size:.98rem;font-weight:700;line-height:1.5;color:var(--tx);}
.nrow-s{display:block;font-size:.78rem;line-height:1.7;color:var(--tx2);margin-top:3px;}
.nrow-r{flex:none;display:inline-flex;align-items:center;gap:8px;color:var(--tx3);padding-top:3px;}
.nrow-r svg{width:15px;height:15px;}
.nrow-u{background:var(--info);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:.72rem;font-weight:700;text-align:center;}
.nrow-m{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:.72rem;font-weight:700;color:var(--info);}
.nrow-m svg{width:12px;height:12px;}
/* ---- ノートの本文。なぞってコメントする場所 ---- */
.note-hd{border-bottom:1px solid var(--line);padding-bottom:14px;margin:12px 0 18px;}
.note-c{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--gold);background:var(--gold-bg);border-radius:5px;padding:2px 8px;}
.note-hd h3{font-size:1.3rem;font-weight:700;line-height:1.5;letter-spacing:.02em;color:var(--tx);margin:9px 0 0;}
.note-hd p{font-size:.86rem;line-height:1.85;color:var(--tx2);margin:8px 0 0;}
.note-body{-webkit-user-select:text;user-select:text;}
.nb{position:relative;font-size:.95rem;line-height:2.05;color:var(--tx);margin:0 0 15px;padding-right:2px;}
.nb em{font-style:normal;font-weight:700;color:var(--tx);box-shadow:inset 0 -3px 0 var(--gold-bg);}
.nb-h{font-size:1.06rem;font-weight:700;line-height:1.6;letter-spacing:.04em;margin:26px 0 12px;padding-left:12px;border-left:3px solid var(--gold);}
.nb-li{padding-left:16px;border-left:2px solid var(--line);}
/* なぜ大事か。読み飛ばされると、やり方だけが残って理由が消える */
.nb-why{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface2);border-radius:10px;padding:14px 16px;font-size:.9rem;line-height:1.95;color:var(--tx2);margin:18px 0;}
.nb-why em{color:var(--accent);box-shadow:none;}
.nb-do,.nb-ng{display:flex;align-items:flex-start;gap:9px;font-size:.9rem;line-height:1.8;margin:0 0 7px;padding-left:2px;}
.nb-do:before{content:"";flex:none;width:7px;height:7px;margin-top:.72em;background:var(--ok);}
.nb-ng:before{content:"";flex:none;width:7px;height:7px;margin-top:.72em;background:var(--accent);}
.nb-num{display:flex;align-items:baseline;gap:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:12px 14px;margin:0 0 8px;font-size:.84rem;line-height:1.75;color:var(--tx2);}
.nb-num .nb-x{flex:1;min-width:0;}
.nb-v{flex:none;font-size:1.28rem;font-weight:700;color:var(--info);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.nb-qa{border-top:1px solid var(--line);padding-top:14px;margin:0 0 14px;font-size:.9rem;line-height:1.9;color:var(--tx2);}
.nb-q{display:block;font-size:1rem;font-weight:700;color:var(--tx);margin-bottom:6px;}
.nb-q:before{content:"Q　";color:var(--accent);font-weight:700;}
/* なぞられた場所。明朝の字面を塗りつぶさず、下に線を引く */
mark.ncm{background:var(--info-bg);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--info);cursor:pointer;}

/* 教科書をノートに分け直したもの。段落ごとにコメントを付けられるので、
   一段落に一つのことだけを書く。cat＝背表紙の分類、say＝何の話かの一行 */
var SHOP_NOTES=[{"id":"nt-who","cat":"前提","ttl":"ドバイのお客さんは誰か","say":"日本の常識で撮ると、ドバイでは伝わらない。まず「画面の向こうに誰がいるか」を揃える。","bl":[{"id":"nt-who-1","t":"num","v":"88.5%","x":"UAE に住んでいる人のうち、外国人が占める割合"},{"id":"nt-who-2","t":"num","v":"38%","x":"いちばん多い出身国はインド。次いでパキスタン・バングラデシュ・フィリピン"},{"id":"nt-who-3","t":"num","v":"8.05M","x":"UAE の Instagram 利用者数。人口のおよそ7割"},{"id":"nt-who-4","t":"num","v":"2h58m","x":"UAE に住む人が、1日にSNSを見ている時間"},{"id":"nt-who-5","t":"p","x":"画面の向こうにいる大半は、日本食を【寿司としてしか知らない人】です。ラーメンを食べたことがない人、そもそも「熱いスープに麺を入れて、音を立ててすする料理」という考え方を持っていない人が、普通にいます。"},{"id":"nt-who-6","t":"h","x":"お客さんは4種類いる。同じ動画で全員は取れない"},{"id":"nt-who-7","t":"li","x":"【① JLTで働く人】平日11時半から13時。徒歩5分以内しか候補にしない。5人前後の同僚と相談して決める。効くのは、今日やっている・今空いているを伝えるストーリーと、位置情報と、友達に送れる短い動画。"},{"id":"nt-who-8","t":"li","x":"【② 近隣タワーの住人】平日の夜と週末。外に出たくない日はデリバリー。効くのは、夜の雰囲気、持ち帰りと配達の見せ方、家族向けの量。"},{"id":"nt-who-9","t":"li","x":"【③ 日本食を知っている層】日本人駐在・アジア系・日本好き。本物かどうかを探していて、他のラーメン店ももう知っている。効くのは、大阪・20年以上・自家製麺・スープの仕込みといった、作り手の事実。"},{"id":"nt-who-10","t":"li","x":"【④ ラーメンを知らない人】いちばん人数が多い。「何これ」で止まる。味の説明では動かない。効くのは、湯気・すする動き・音。そして「これは何か」を5語で言う英語のテロップ。"},{"id":"nt-who-11","t":"why","x":"ドバイは人が入れ替わり続ける街です。駐在の任期が終われば常連は国に帰ります。日本の商店街の「10年通ってくれる常連」は、ここでは前提にできません。だから集客は一度知られたら終わりではなく、【毎月、新しく来た人に見つけてもらい直す作業】になります。これが、毎日投稿するいちばん現実的な理由です。"},{"id":"nt-who-12","t":"h","x":"競合は増え続けている"},{"id":"nt-who-13","t":"p","x":"2026年のドバイでは、ラーメン店の出店が続いています。英国発の Maki & Ramen が中東初出店、Dubai Opera に Ramen Hisa、Jumeirah の新しいモールに Tora Tora。Daikan は市内4拠点に広がり、【同じJLTのレイクショアタワーにもラーメンバーがあります】。"},{"id":"nt-who-14","t":"p","x":"味で勝っていても、思い出してもらえなければ負けます。「ラーメンが食べたい」と思った瞬間に頭に浮かぶかどうか。その勝負をしています。"}]},{"id":"nt-tool","cat":"原理","ttl":"インスタは何をする道具か","say":"「宣伝する場所」だと思うと手が止まる。実際には、仕事の違う3つの道具が入っている。","bl":[{"id":"nt-tool-1","t":"li","x":"【リール】見つけてもらう道具。まだ店を知らない人の画面に、こちらから出ていける唯一の手段。届く相手はフォロワーの外がほとんど。【手を抜いてはいけない】。最初の2秒とテロップに全力を使う。"},{"id":"nt-tool-2","t":"li","x":"【ストーリー】忘れられないための道具。すでに知っている人に「今日もやってるよ」を届ける。届く相手はフォロワーだけ。【抜いていい】。10秒・手持ち・音なしで合格。"},{"id":"nt-tool-3","t":"li","x":"【フィード】信用されるための道具。リールで気になった人が必ず見に来る、店の顔。届く相手は検討中の人。頻度は抜いていいが、見た目の統一は抜かない。"},{"id":"nt-tool-4","t":"li","x":"【口コミ返信】不安を消す道具。読むのは書いた本人ではなく、次に来る客。24時間以内に返す。文は短くていい。"},{"id":"nt-tool-5","t":"h","x":"お客さんが来店するまでの6歩"},{"id":"nt-tool-6","t":"p","x":"自分が店を選ぶときを思い出してください。この順番を飛ばすことはできません。"},{"id":"nt-tool-7","t":"li","x":"【1. リールが流れてくる】本人は店を探していない。スクロールの途中に「何これ」で指が止まる。ここが入口の9割。"},{"id":"nt-tool-8","t":"li","x":"【2. プロフィールを開く】3秒で「行ける店かどうか」を決める。場所・営業時間・何の店か・写真の並び。"},{"id":"nt-tool-9","t":"li","x":"【3. 保存する、友達に送る】その場では来ない。「今度行こう」で保存、または同僚に送る。送信されることが最強の合図。"},{"id":"nt-tool-10","t":"li","x":"【4. ストーリーで思い出す】保存したことを人は忘れる。毎日のストーリーが「そういえば」を作る。"},{"id":"nt-tool-11","t":"li","x":"【5. 地図を開く、予約する】位置情報タグと Google マップ。ドバイでは地図アプリが飲食店探しの主戦場。"},{"id":"nt-tool-12","t":"li","x":"【6. 来店して、また撮られる】来た人が撮って上げる。その投稿がまた1に戻る。ここまで来て、やっと回り始める。"},{"id":"nt-tool-13","t":"why","x":"リールは新しい人、ストーリーは知っている人、フィードは迷っている人。どれか一つだけやっても回りません。3つ揃って初めて「来店」という1本の線になります。"}]},{"id":"nt-story","cat":"中核","ttl":"なぜ毎日ストーリーなのか","say":"この教科書でいちばん伝えたいところ。理由は7つあって、どれも店の都合ではなくお客さん側の都合です。","bl":[{"id":"nt-story-1","t":"li","x":"【1. お客さんは今日やっているかを知りたい】ドバイは閉店・移転・休業・時間変更が日常的に起きる街です。初めての店に行く人がいちばん怖いのは「行ったら閉まっていた」。毎日ストーリーが上がっている店は、それだけで今日確実に開いているという証明になります。これは営業時間の表示より強い。"},{"id":"nt-story-2","t":"li","x":"【2. 判断の窓は1日に2回、数十分しかない】人が飲食店を選ぶのは、空腹になった瞬間だけです。11時半から13時と、19時から21時。その数十分に画面に出ていなければ、存在していないのと同じです。"},{"id":"nt-story-3","t":"li","x":"【3. ラーメンを知らない人は、1回では理解できない】初めて見る料理は、1本の動画では食べ物として認識されません。麺を上げる、スープを注ぐ、客がすする、器が湯気を立てる。毎日ちがう角度で見て、5回目くらいでやっと「あれは美味しいものだ」に変わります。教えているのであって、宣伝しているのではありません。"},{"id":"nt-story-4","t":"li","x":"【4. 知っている店にしないと、外国の料理は怖い】知らない国の、知らない料理の、知らない店。ハードルが3つあります。毎日ストーリーを見ている人にとっては、少なくとも店は知っているものに変わります。ハードルが1つ減るだけで、来店率はまったく違います。"},{"id":"nt-story-5","t":"li","x":"【5. 1人が見て、5人が来る】JLTのランチは、たいてい同僚と相談して決まります。ストーリーを見た1人が「ここ行かない？」とDMで転送する。飲食店にとって、この転送が実質的な集客の本体です。"},{"id":"nt-story-6","t":"li","x":"【6. 更新を止めると、フォロワーはいないのと同じになる】ストーリー欄は、よく見る順に前から並びます。更新が止まると後ろに送られ、やがて表示されなくなります。フォロワーは減っていないのに、届かなくなる。"},{"id":"nt-story-7","t":"li","x":"【7. 24時間で消えるから、練習になる】失敗が残りません。だから毎日撮る人だけが、構図・光・テロップが上手くなります。リールがうまい人は例外なく、ストーリーで数百回練習した人です。ストーリーは本番ではなく、毎日の素振りです。"},{"id":"nt-story-8","t":"num","v":"+23%","x":"毎日投稿する店の、フォロワー定着率（週3回未満との比較）"},{"id":"nt-story-9","t":"num","v":"約70%","x":"ストーリーの平均完走率。ただし最初の1枚で約24%が離脱する"},{"id":"nt-story-10","t":"num","v":"2〜3本","x":"1日の現実的な本数。多い日で4本まで"},{"id":"nt-story-11","t":"h","x":"ストーリーは、雑でいい"},{"id":"nt-story-12","t":"p","x":"ここを誤解して止まる人がいちばん多い。【ストーリーに作品を求めないでください。】"},{"id":"nt-story-13","t":"do","x":"縦・手持ち・10秒以内"},{"id":"nt-story-14","t":"do","x":"音は入れなくていい"},{"id":"nt-story-15","t":"do","x":"編集ゼロ。撮って出し"},{"id":"nt-story-16","t":"do","x":"文字は英語で3語から5語だけ"},{"id":"nt-story-17","t":"do","x":"仕込み中・開店前の30秒で撮る"},{"id":"nt-story-18","t":"ng","x":"BGM探し（5分溶ける）"},{"id":"nt-story-19","t":"ng","x":"凝った効果・スタンプの山"},{"id":"nt-story-20","t":"ng","x":"長い日本語の説明文"},{"id":"nt-story-21","t":"ng","x":"いい絵が撮れる日を待つこと"},{"id":"nt-story-22","t":"ng","x":"1本に2つ以上のことを言う"},{"id":"nt-story-23","t":"h","x":"1日の3本。これを毎日回すだけ"},{"id":"nt-story-24","t":"li","x":"【11時ごろ】今日やってます。スープの湯気、麺を茹でる、看板の明かり。文字は OPEN NOW · 11:30。"},{"id":"nt-story-25","t":"li","x":"【18時半ごろ】今夜の一杯。いちばん押したい丼を1つ。寄りで10秒。文字は TONIGHT: SHIO。"},{"id":"nt-story-26","t":"li","x":"【不定期】参加できるもの。アンケート（Shio or Shoyu?）、質問箱、「明日は何を食べたい？」。"},{"id":"nt-story-27","t":"p","x":"アンケートや質問への回答は、DMの会話として扱われます。一度でも反応してくれた人には、その後の投稿が届きやすくなります。スタンプは遊びではなく、届く経路を作る作業です。"},{"id":"nt-story-28","t":"why","x":"1週間止めると、フォロワーのストーリー欄から後ろに下がります。1か月止めると、たいていの人にはもう表示されません。その状態からの再起動は、ゼロから始めるより重い。一度やめた店として見られるからです。毎日やることのいちばんの値打ちは、実は【やめないこと】にあります。"}]},{"id":"nt-reel","cat":"リール","ttl":"リールは最初の1.7秒で決まる","say":"なぜ「つかみ」にそこまでこだわるのか。飛ばされる仕組みを知れば納得できます。","bl":[{"id":"nt-reel-1","t":"p","x":"リールを見ている人は、店を探していません。暇つぶしに指を動かしているだけです。その人に対して、こちらは【見続ける理由を1.7秒以内に差し出す】必要があります。"},{"id":"nt-reel-2","t":"num","v":"1.7秒","x":"見続けるか飛ばすかを決めるまでの時間"},{"id":"nt-reel-3","t":"num","v":"5〜10倍","x":"3秒残存率60%超の動画が、40%未満の動画より稼ぐ表示回数"},{"id":"nt-reel-4","t":"num","v":"20%未満","x":"目標とすべき3秒離脱率。40%を超えたら作り直し"},{"id":"nt-reel-5","t":"h","x":"インスタが伸ばす動画を決める3つの合図"},{"id":"nt-reel-6","t":"p","x":"運営が公表している主な判断材料は、【合計視聴時間】（繰り返し再生も足される）、【リーチあたりの送信数】（DM転送）、【リーチあたりのいいね】の3つです。"},{"id":"nt-reel-7","t":"p","x":"大事なのは、再生回数ではなく秒数で測られることです。15秒の動画を3回見られたほうが、60秒を1回より強い。だから【短くしてループさせる】のが正解です。"},{"id":"nt-reel-8","t":"h","x":"使えるつかみの型"},{"id":"nt-reel-9","t":"li","x":"【パターン破り】予想外の絵で止める。3秒残存の目安は72〜84%。例：真っ白な湯気の中から丼がぬっと出てくる。麺を1.5メートルの高さまで持ち上げる。"},{"id":"nt-reel-10","t":"li","x":"【知りたくさせる】答えを最後に置く。目安65〜78%。例：Why Dubai queues for THIS bowl。スープを18時間煮る鍋をいきなり映す。"},{"id":"nt-reel-11","t":"li","x":"【直球の質問】目安58〜72%。例：Ever had ramen without pork? ／ Spicy or clean?"},{"id":"nt-reel-12","t":"li","x":"【言い切り】目安55〜70%。例：Osaka's No.1 shio ramen. Now in JLT."},{"id":"nt-reel-13","t":"li","x":"【悩みから入る】目安50〜65%。例：Too hot to go outside? We deliver.（5月から9月）"},{"id":"nt-reel-14","t":"li","x":"【行列・人気を見せる】目安45〜60%。例：満席の店内。すすっている外国人客の笑顔。"},{"id":"nt-reel-15","t":"why","x":"最初の1カットに絶対に入れてはいけないもの。ロゴ、店名、外観、暗い店内、無人の空の席、静止画。これが出た瞬間に「広告だ」と判断されて飛ばされます。【ロゴを出すなら最後の1秒です。】"},{"id":"nt-reel-16","t":"h","x":"尺・ループ・音の決まりごと"},{"id":"nt-reel-17","t":"li","x":"【尺は7秒から15秒を基本に。】長くても30秒。90秒を超えると伸びません。"},{"id":"nt-reel-18","t":"li","x":"【最後のコマを最初のコマに似せる。】ループで2周目に入ると視聴秒数が倍になります。丼の寄りで始めて丼の寄りで終わるだけで効きます。"},{"id":"nt-reel-19","t":"li","x":"【音は流行っている音を最初から鳴らす。】冒頭から音を入れた動画は、途中から入れた動画より残存率が高いという報告があります。ただし音に頼らない。"},{"id":"nt-reel-20","t":"li","x":"【使い回しはしない。】他人の動画の転載や再利用は配信が落ちます。30日間に転載が10本を超えると、おすすめ枠から外れます。撮るのが面倒でも、自分で撮るほうが結局速い。"},{"id":"nt-reel-21","t":"li","x":"【テスト投稿（Trial Reels）を使う。】フォロワーには出さず、知らない人にだけ先に出して反応を見られます。この口座は約4,500人なので使えます。新しい型を試すときは必ずこれから。"}]},{"id":"nt-telop","cat":"テロップ","ttl":"音は出ていない","say":"「面倒だから今日はテロップなしで」が、いちばん高くつく手抜きです。","bl":[{"id":"nt-telop-1","t":"li","x":"【そもそも音を出していない】電車・オフィス・家族の横。SNSは無音で見られるのが普通です。音声で説明した内容は、そのまま消えます。"},{"id":"nt-telop-2","t":"li","x":"【英語が母語でない人が大半】ドバイの共通語は英語ですが、多くの人にとって第二言語です。耳で聞く英語より、目で読む英語のほうが圧倒的に伝わります。しかも短い文なら、インド系・アラブ系・フィリピン系、誰にでも届きます。"},{"id":"nt-telop-3","t":"li","x":"【数字がはっきり出ている】字幕のある動画は、ない動画より平均視聴維持が約38%長く、完走されやすさは約80%高いという結果が出ています。テロップを入れるだけで、同じ動画が1.4倍働きます。"},{"id":"nt-telop-4","t":"h","x":"テロップの書き方。守るのはこれだけ"},{"id":"nt-telop-5","t":"li","x":"【英語が主、日本語は飾り。】意味を伝えるのは英語。日本語は本物っぽさの演出として、器や暖簾と一緒に少しだけ。"},{"id":"nt-telop-6","t":"li","x":"【1画面7語以内。】読み切れない文は、無いのと同じ。"},{"id":"nt-telop-7","t":"li","x":"【画面の上下は空ける。】上下それぞれ約15%は画面の飾りに隠れます。文字は真ん中の帯に。"},{"id":"nt-telop-8","t":"li","x":"【自動で作られる字幕は必ず直す。】店名・料理名（shio / shoyu / paitan / wonton）はほぼ間違って変換されます。"},{"id":"nt-telop-9","t":"li","x":"【最初の1枚に「これは何か」を書く。】Japanese noodle soup, made in Osaka style。ラーメンを知らない人に対して、これを省略しない。"}]},{"id":"nt-shoot","cat":"撮影","ttl":"「美味しそう」の正体","say":"なぜ味の説明ではなく、湯気と照りと音なのか。人が食べ物を選ぶ仕組みの話です。","bl":[{"id":"nt-shoot-1","t":"p","x":"人は、飲食店を理屈で選んでいません。空腹のときの判断は、ほぼ反射です。調べてから決める人は少数派で、大半は【見た瞬間の体の反応】で決めます。"},{"id":"nt-shoot-2","t":"p","x":"そして【ラーメンを知らない人ほど、この反射の比重が上がります】。味の知識がないぶん、目に映るものだけで判断するからです。ドバイで「美味しそうに撮る」ことが日本より大事なのは、このためです。"},{"id":"nt-shoot-3","t":"h","x":"食欲が動く5つの物理"},{"id":"nt-shoot-4","t":"li","x":"【湯気】熱い、今できた、安全で旨い、と直につながる。冷めた料理は本能的に避けられる。撮り方は、逆光ぎみに、暗い背景で。湯気は光に透かさないと写らない。"},{"id":"nt-shoot-5","t":"li","x":"【照り（脂と油の光）】脳が「高カロリーだから旨い」と判断する最短の合図。撮り方は、スープの表面の丸い油に光を当てる。真上からではなく斜め45度。"},{"id":"nt-shoot-6","t":"li","x":"【動き】止まった写真より、動いているものに目が留まる。麺のリフト、スープを注ぐ、卵を割る。動きの途中から撮り始める。"},{"id":"nt-shoot-7","t":"li","x":"【音】すする音・揚げる音は、聞いた人の唾液を増やす。できるだけ現場の音を残す。BGMで消さない。"},{"id":"nt-shoot-8","t":"li","x":"【人】食べている人の表情は「安全」の証明。知らない料理ほど必要。客とスタッフの手と顔。国籍が多様なほど「自分も入れる店」に見える。"},{"id":"nt-shoot-9","t":"do","x":"配膳から30秒以内に撮る（湯気の寿命）"},{"id":"nt-shoot-10","t":"do","x":"丼に近づく。画面いっぱいに麺"},{"id":"nt-shoot-11","t":"do","x":"光に向かって（逆光ぎみ）"},{"id":"nt-shoot-12","t":"do","x":"スマホは両手。肘を台につける"},{"id":"nt-shoot-13","t":"do","x":"縦。9対16以外は撮らない"},{"id":"nt-shoot-14","t":"ng","x":"真上からテーブル全景だけ"},{"id":"nt-shoot-15","t":"ng","x":"麺が伸びてから撮り直す"},{"id":"nt-shoot-16","t":"ng","x":"暗い店内で照明を足さない"},{"id":"nt-shoot-17","t":"ng","x":"歩きながらの手ブレ撮り"},{"id":"nt-shoot-18","t":"ng","x":"店名ロゴから始める"},{"id":"nt-shoot-19","t":"h","x":"毎日回せる撮影の型 10本"},{"id":"nt-shoot-20","t":"p","x":"「ネタがない」は、型を持っていないだけです。この10本を順番に回せば、10日分の素材が出ます。"},{"id":"nt-shoot-21","t":"li","x":"【01 麺リフト】湯気と麺と箸。近い。3秒。リールの冒頭向き。"},{"id":"nt-shoot-22","t":"li","x":"【02 スープ注ぎ】注ぐ動作の途中から。音つき。リールの冒頭向き。"},{"id":"nt-shoot-23","t":"li","x":"【03 仕込み】鍋・寸胴・火。作り手の手。ストーリー向き。"},{"id":"nt-shoot-24","t":"li","x":"【04 自家製麺】製麺機・切り出し・打ち粉。リールとフィード向き。"},{"id":"nt-shoot-25","t":"li","x":"【05 完成の寄り】丼の全景は撮らない。具材の一点。フィード向き。"},{"id":"nt-shoot-26","t":"li","x":"【06 お客さんの一口】すする顔。必ず許可を取る。リール向き。"},{"id":"nt-shoot-27","t":"li","x":"【07 開店の合図】暖簾・照明・OPEN。朝。ストーリー向き。"},{"id":"nt-shoot-28","t":"li","x":"【08 スタッフ】顔と名前。1人ずつ。ストーリーとフィード向き。"},{"id":"nt-shoot-29","t":"li","x":"【09 説明もの】Shio と Shoyu の違いを15秒。リール向き。"},{"id":"nt-shoot-30","t":"li","x":"【10 持ち帰り・配達】容器・封・外に出る絵。夏場のストーリー向き。"}]},{"id":"nt-dubai","cat":"現地","ttl":"ドバイ翻訳。日本と違うところ","say":"日本の店のやり方をそのまま持ってくると外す点を、先に潰しておきます。","bl":[{"id":"nt-dubai-1","t":"h","x":"豚を使わないことは、弱点ではなく最大の武器"},{"id":"nt-dubai-2","t":"p","x":"この店のスープは鶏をもとにしています。日本の感覚では「豚骨がない」は制約に聞こえますが、【ドバイでは逆です】。人口の大半を占めるムスリムの方にとって、豚が入っている可能性は、最初から候補に入らない理由になります。"},{"id":"nt-dubai-3","t":"p","x":"【豚を使わないラーメンは、この街でいちばん多くの人が食べられるラーメンです。】"},{"id":"nt-dubai-4","t":"why","x":"表記のきまり。ここだけは厳守です。ハラル認証・アルコールの有無・アレルギーは、【店が公式に確かめている事実だけ】を、店が決めた文言で書きます。スタッフの推測で「ハラルです」と書かない。はっきりしないときは書かずに、DMで問い合わせてもらう。一度の誤表記で、取り返しのつかない信用の損を出します。"},{"id":"nt-dubai-5","t":"h","x":"「ラーメンとは何か」から説明する"},{"id":"nt-dubai-6","t":"p","x":"月に1回は、初めての人向けの説明を出してください。知っている人向けの投稿ばかりでは、いちばん人数の多い「ラーメンを知らない層」に届きません。"},{"id":"nt-dubai-7","t":"li","x":"What is ramen? Noodles + broth, 3 minutes to make, 18 hours to prepare."},{"id":"nt-dubai-8","t":"li","x":"How to eat it: slurp. Loud is polite in Japan.（音を立てて食べていい、は外国人にとって驚きであり、体験として売れる）"},{"id":"nt-dubai-9","t":"li","x":"Shio / Shoyu / Spicy Miso / Paitan — which one are you?（選べるようにする）"},{"id":"nt-dubai-10","t":"h","x":"季節と曜日が日本と違う"},{"id":"nt-dubai-11","t":"li","x":"【5月から9月・猛暑】昼間に外を歩かない。移動はタワーの中か車かデリバリー。出す内容は、涼しい店内、配達の見せ方、タワーから濡れずに来られる道順。"},{"id":"nt-dubai-12","t":"li","x":"【10月から4月・いちばんいい季節】観光客が増え、外で過ごす。新しい駐在も入ってくる。新規向けのリールの比率を上げる。テラス・夜の絵。"},{"id":"nt-dubai-13","t":"li","x":"【ラマダン】2027年は2月7日ごろから3月8日ごろ。日中の飲食の扱いに配慮が要る。日没後の食事（イフタール）が主戦場。日中は食べる動画を控えめに、仕込みや作り手側の絵へ。夜の投稿を増やす。"},{"id":"nt-dubai-14","t":"li","x":"【週末】UAEの休みは土日。金曜の午後から空気が変わる。木曜の夜と金曜の夜に「週末の一杯」。家族連れ向けの量と席。"},{"id":"nt-dubai-15","t":"h","x":"JLTという土地の特殊性"},{"id":"nt-dubai-16","t":"p","x":"JLTはオフィスと住居のタワーが密集した区画です。ランチの候補は【徒歩5分圏】で決まり、駐車と移動が面倒なぶん、どのタワーの、どのクラスターかが来店の可否を左右します。"},{"id":"nt-dubai-17","t":"p","x":"投稿には必ず位置情報を付け、キャプションに Cluster Y · Lake Shore Tower のような目印を入れてください。ドバイでは飲食店探しが地図アプリ中心に動いていて、インスタと地図の両方に同じ情報が載っていることが効きます。"}]},{"id":"nt-cap","cat":"文章","ttl":"キャプションと検索","say":"キャプションは感想文ではなく、探している人に見つけてもらうための道具です。","bl":[{"id":"nt-cap-1","t":"li","x":"【1行目が全て。】2行目から先は、開かないと読めません。言いたいことは1行目に。"},{"id":"nt-cap-2","t":"li","x":"【英語が主。】日本語は下に2行か3行そえる程度。"},{"id":"nt-cap-3","t":"li","x":"【検索される言葉を、文章の中に入れる。】インスタは今、キャプションの文字そのものを検索の対象にします。ramen in JLT ／ Japanese restaurant Dubai ／ shio ramen を、自然な文として入れる。"},{"id":"nt-cap-4","t":"li","x":"【ハッシュタグは3個から5個。】30個並べる時代は終わりました。地名と料理名で十分（例：#jltdubai #ramendubai #dubaifoodie）。"},{"id":"nt-cap-5","t":"li","x":"【位置情報タグは毎回。】これが地図と来店に直結します。"},{"id":"nt-cap-6","t":"li","x":"【お願いごとは1つだけ。】保存してか、友達に送ってか、来てか。3つ書くと0になります。いちばん効くのは【送って】。DMの転送は、いいねの3倍から5倍の重みで扱われます。"}]},{"id":"nt-review","cat":"口コミ","ttl":"口コミ返信","say":"返信を読むのは、書いた本人ではありません。これから行くかどうか迷っている次の客です。","bl":[{"id":"nt-review-1","t":"li","x":"【24時間以内に、全件。】星だけの評価にも一言。"},{"id":"nt-review-2","t":"li","x":"【名乗る。】— Kenji, Shiogensui JLT のように人の名前で返すと、店が人に見えます。"},{"id":"nt-review-3","t":"li","x":"【具体的に触れる。】「ご来店ありがとうございます」だけの定型文は逆効果。何を食べたかに触れる。"},{"id":"nt-review-4","t":"li","x":"【低い評価には、言い訳せず、事実だけ、直し方だけ。】1に謝る、2に何が起きたかの事実、3にどう直すか、4に来店のお願い。4行で終わらせる。【反論は絶対にしない。】次の客が読んでいます。"}]},{"id":"nt-num","cat":"数字","ttl":"数字の見方","say":"全部の数字を見ると疲れて続きません。見るのは5つだけ。","bl":[{"id":"nt-num-1","t":"li","x":"【3秒残存率】（視聴維持のグラフの出だし）最初のカットが効いているか。悪いときは、冒頭の1カットを撮り直す。それだけ。"},{"id":"nt-num-2","t":"li","x":"【送信数】（DMの転送）人に教えたいと思われたか。いちばん大事。悪いときは、誰かと来たくなる絵にする。量・席・2人分。"},{"id":"nt-num-3","t":"li","x":"【保存数】今度行くと思われたか。悪いときは、場所・営業時間・値段を画面に入れる。"},{"id":"nt-num-4","t":"li","x":"【プロフィールへのアクセス】動画から店へ興味が移ったか。悪いときは、動画の最後に店名と場所を1秒。"},{"id":"nt-num-5","t":"li","x":"【ストーリーの完走率】最後まで見られているか。悪いときは、1枚目を変える。24%はそこで抜けます。"},{"id":"nt-num-6","t":"p","x":"【見なくていいもの】いいねの数、日々のフォロワーの増減。どちらも来店とほとんど関係がなく、気分だけ揺さぶられます。"},{"id":"nt-num-7","t":"why","x":"週に1回、3つだけ確かめる。1つ、今週いちばん送信された投稿はどれか。2つ、それは何の型だったか（10本のうち）。3つ、来週その型を2本撮る。これだけで運用は回ります。分析は増やさないでください。増やすと撮影の時間がなくなります。"}]},{"id":"nt-week","cat":"運用","ttl":"1日と1週間の型","say":"「時間があるときにやる」では絶対に続きません。時刻に紐づけます。","bl":[{"id":"nt-week-1","t":"h","x":"1日。合計15分"},{"id":"nt-week-2","t":"li","x":"【10時50分】仕込みを30秒だけ撮る。鍋・麺・火。あとで使う素材。編集しない。"},{"id":"nt-week-3","t":"li","x":"【11時00分】ストーリー1本目「今日やってます」。撮って出し。英語3語。所要1分。"},{"id":"nt-week-4","t":"li","x":"【13時30分】ピークのあとに1本ためる。混んでいた店内、空いた丼、客の笑顔（許可を取る）。"},{"id":"nt-week-5","t":"li","x":"【18時30分】ストーリー2本目「今夜の一杯」。押したい丼を寄りで10秒。"},{"id":"nt-week-6","t":"li","x":"【21時30分】口コミとDMに返信。全件。1件30秒。"},{"id":"nt-week-7","t":"h","x":"1週間"},{"id":"nt-week-8","t":"li","x":"【月】リール1本（新規向け・つかみ重視）"},{"id":"nt-week-9","t":"li","x":"【火】ストーリーのみ"},{"id":"nt-week-10","t":"li","x":"【水】フィード1枚（完成の寄り・見た目の統一）"},{"id":"nt-week-11","t":"li","x":"【木】リール1本（週末の告知・家族向け）"},{"id":"nt-week-12","t":"li","x":"【金】ストーリーのみ（夜に厚く）"},{"id":"nt-week-13","t":"li","x":"【土】お客さんの投稿を共有、またはスタッフ紹介"},{"id":"nt-week-14","t":"li","x":"【日】今週の振り返り3問と、来週の撮影メモ"},{"id":"nt-week-15","t":"p","x":"【毎日必ずやるのはストーリーだけ。】リールは週2本で十分です。週2本を12か月続けた店が勝ちます。毎日10本上げて3週間でやめる店ではなく。"}]},{"id":"nt-faq","cat":"想定問答","ttl":"言い訳への回答","say":"出てくる言葉は毎回同じです。先に答えを書いておきます。","bl":[{"id":"nt-faq-1","t":"qa","q":"毎日なんてムリ。忙しい","x":"ストーリー2本＝合計20秒の動画と、英語5語。所要2分です。仕込みの手を止めずに撮れます。ムリなのは毎日リールを作ることで、それは誰も求めていません。"},{"id":"nt-faq-2","t":"qa","q":"ネタがない","x":"撮影の型10本を順に回してください。10日分あります。お客さんは昨日のあなたの投稿を覚えていません。同じ麺リフトでも、人・光・日が違えば別の動画です。"},{"id":"nt-faq-3","t":"qa","q":"料理が良ければ、そのうち来る","x":"日本ならある程度そうです。ドバイは違います。住民の9割が外国人で、常連は数年で帰国します。しかも同じタワー街に競合のラーメン店があります   r3.rev=0; r3.at=now()-9*864e5; r3.sd=1;

/* 投稿予定日まであと何日。過ぎたら負の数 */
function daysLeft(r){ return r.d?diffDays(r.d,today()):null; }
function dlHtml(r){
  /* 出し終えたものに「何日 過ぎています」は出さない。出した日を出す */
  if(r.done) return '<span class="d ok">'+fmtMd(ymdTZ(r.done.at,TZ_DUBAI))+'　<b>投稿済み</b></span>';
  var n=daysLeft(r);
  if(n===null) return '<span class="d">日付なし</span>';
  var hot=(n<=2);
  /* 過ぎているものは「いつから」を書く。何日過ぎたかだけでは、どこから遅れたのか分からない */
  if(n<0){
    var w0='<b>'+fmtMd(r.d)+'から'+(-n)+'日 過ぎています</b>';
    return '<span class="d hot">'+w0+(r.d2?'　'+fmtMd(r.d2)+'まで':'')+'</span>';
  }
  var w=n===0?'<b>今日</b>':('<b>あと'+n+'日</b>');
  /* 何日から何日まで、のものは期間で出す */
  if(r.d2) return '<span class="d'+(hot?' hot':'')+'">'+fmtMd(r.d)+'〜'+fmtMd(r.d2)+'　'+w+'</span>';
  return '<span class="d'+(hot?' hot':'')+'">'+fmtMd(r.d)+'　'+w+'</span>';
}
/* 投稿の1週間前を過ぎているのに、目的か台本が空。撮る側が待たされる合図 */
function lateScript(r){
  if(r.done||!r.d) return false;
  if(daysLeft(r)>7) return false;
  return !(r.sec.purpose.tx||'').trim()||!(r.sec.script.tx||'').trim();
}
function ref(rid,k){ return rid+'|'+k; }
function msgsOf(rf){ return S.msgs.filter(function(m){ return m.ref===rf; }).sort(function(a,b){ return a.at-b.at; }); }
function rkey(rf){ return (S.me.id||'-')+'|'+rf; }
/* 同じドバイ側でも Ai と Ryuki は別の人。役ではなく名前で「自分以外」を数える */
function unreadOf(rf){ var r0=S.read[rkey(rf)]||0, nm=meName();
  return msgsOf(rf).filter(function(m){ return m.at>r0&&m.name!==nm; }).length; }
function markRead(rf){ S.read[rkey(rf)]=now(); save0(); }
/* ---- 更新のお知らせ ----
   誰が・どの1本の・どこを直したかを1行ずつ残す。
   ばらばらの道具に散らばっていた「言った／聞いていない」を、ここ1か所に集める */
function logAdd(kind,r,k,tx){
  if(!S||!S.log) return;
  var nm=meName(); if(!nm) return;
  S.log.push({id:uid('g'),at:now(),by:nm,role:meRole(),kind:kind,
    rid:r?r.id:'',ttl:r?r.ttl:'',k:k||'',tx:tx||''});
  if(S.log.length>400) S.log=S.log.slice(-400);
}
/* 見たしるし。全部まとめて見たときと、その1本を開いたときの両方で消える */
function evSeen(e){
  var g=S.read[rkey('feed')]||0;
  var p=e.rid?(S.read[rkey('fd|'+e.rid)]||0):0;
  /* やり取りは、その話の画面を開いた時点で見たことになる（ノートのコメントもここ） */
  var q=(e.kind==='msg'&&e.rid&&e.k)?(S.read[rkey(e.rid+'|'+e.k)]||0):0;
  return e.at<=Math.max(g,p,q);
}
function evNew(e){ return e.by!==meName()&&!evSeen(e); }
function feedAll(){
  var out=(S.log||[]).slice();
  /* やり取りも同じ並びに混ぜる。別の場所を見に行かせない */
  S.msgs.forEach(function(m){
    var pr=(m.ref||'').split('|');
    out.push({id:m.id,at:m.at,by:m.name,role:m.role,kind:'msg',rid:pr[0]||'',k:pr[1]||'',ttl:'',tx:m.tx});
  });
  return out.sort(function(a,b){ return b.at-a.at; });
}
function secL(k){
  if(k==='all') return '全体';
  if(k==='after') return '投稿してどうだったか';
  var s2=secOf(k); return s2?s2.l:'';
}
function evTtl(e){
  if((e.rid||'').indexOf('nt-')===0){ var n2=noteOf(e.rid); return n2?n2.ttl:'ノート'; }
  var r=byId(S.reels,e.rid); return r?r.ttl:(e.ttl||'');
}
function evTx(e){
  var L=secL(e.k);
  if(e.kind==='add')   return '新しく追加しました';
  if(e.kind==='edit')  return 'タイトルや日付を直しました';
  if(e.kind==='sec')   return L+'を書きました';
  if(e.kind==='ok')    return L+'にチェックが付きました';
  if(e.kind==='unok')  return L+'のチェックが外れました';
  if(e.kind==='who')   return L+'の担当が変わりました';
  if(e.kind==='rwho')  return '担当者が変わりました';
  if(e.kind==='rtag')  return '進捗：'+(e.tx||'');
  if(e.kind==='done')  return '投稿済みになりました';
  if(e.kind==='undone')return '制作中に戻りました';
  if(e.kind==='toPost')return '企画から制作中に移りました';
  if(e.kind==='del')   return '消しました';
  if(e.kind==='goal')  return '目標を直しました';
  if(e.kind==='msg')   return (L&&L!=='全体'?'［'+L+'］':'')+(e.tx||'');
  return '';
}
/* 1回の描き直しで何度も数え直さないよう、まとめて作る */
function newMap(){
  var m={r:{},s:{},n:0};
  feedAll().forEach(function(e){
    if(!evNew(e)) return;
    m.n++;
    if(!e.rid) return;
    m.r[e.rid]=(m.r[e.rid]||0)+1;
    if(e.k) m.s[e.rid+'|'+e.k]=(m.s[e.rid+'|'+e.k]||0)+1;
  });

var NM={r:{},s:{},n:0};

function whoPill(role){ return '<span class="who '+ROLE[role]+'">'+esc(roleName(role))+'</span>'; }
/* 行全体を担当の色にする。名前の札だけだと、並んだときに誰のものか読み取れない。
   左の帯は濃い色、地は薄い色。2人で持つものは2色を分け合う */
function whoTint(r){
  var cs=chipCols(r,WBG); if(!cs.length) return '#fff';

}
function whoStyle(r){ return 'style="--wtint:'+whoTint(r)+'"'; }
/* 1本を2人で持つことがある。並べて出さないと、片方だけの仕事に見える */

/* 札には、付けてからの日数を添える。3日を超えたら赤（録音「3日超えたら赤くなる」） */
function tagsHtml(r){

}
function priHtml(r){ return r.pri?'<span class="pri '+r.pri+'">優先度 '+PRI[r.pri]+'</span>':''; }
function unHtml(r){ var n=unreadReel(r); return n?'<span class="un">'+ic('chat')+n+'</span>':''; }
/* ステータスだけを出す（台本がまだ、の赤い字は一覧では出さない） */
function stOnly(r){

/* 出した日（ドバイ基準）。予定は投稿予定日 */
function doneYmd(r){ return r.done?ymdTZ(r.done.at,TZ_DUBAI):''; }
/* 暦は投稿の記録。載せるのは投稿済みだけ（その日に出したもの）。
   まだのもの・何日も続く予定は、全体の一覧とストックで見る */
function reelsOn(ds){
  var out=[];
  alive(S.reels).forEach(function(r){ if(r.done&&doneYmd(r)===ds) out.push({r:r,plan:false}); });
  return out;
}
function viewMonth(){
  if(!CAL){ var d0=fromYmd(today()); CAL={y:d0.getUTCFullYear(),m:d0.getUTCMonth()}; }
  var g=S.goal||{};
  /* いちばん上は「何のためにやっているか」。見失ったときに戻る場所 */
  var h='<div class="top"><div><h1>今月</h1></div></div>';

  var mg=monGoal(calKey());
  h+='<div class="dir" data-act="goal"><div class="k">目標</div>'+
    (g.s?'<div class="s">'+emph(g.s)+'</div>':'')+
    '<div class="k">'+calMon()+'月の目標</div>'+
    (mg?'<div class="t2">'+emph(mg)+'</div>':'')+

  for(var p=0;p<first.getUTCDay();p++) h+='<span class="c pad"></span>';

    var chips=on.map(function(o){ return chipHtml(o); }).join('');
    /* ＋はその日の投稿を記録する入口。まだ来ていない日には、投稿済みは付けられないので出さない */
    var pl=(ds<=td)?'<span class="pl" data-act="addday" data-d="'+ds+'" role="button" aria-label="'+fmtMd(ds)+'の投稿を記録" title="この日の投稿を記録">'+ic('plus')+'</span>':'';
    h+='<button class="c'+(ds===td?' today':'')+(ds>td?' fut':'')+'" data-act="day" data-d="'+ds+'"><span class="n">'+day+'</span>'+pl+chips+'</button>';

/* 暦の中の1枚。誰のものかを色で、出したか予定かを塗りと点線で分ける。
   2人で持っているものは、2色を半分ずつ */
var WCOL={ops:'#38684A',shop:'#95521F',mgr:'#95521F'};
var WBG ={ops:'#EFF7F1',shop:'#FEF3EA',mgr:'#FEF3EA'};
function chipCols(r,map){
  /* 並びは担当の名簿順に固める。いつも Yui が左、Ai が右に来るようにする */
  var w=(r.whos||[r.who]), cs=[];
  WHOK.forEach(function(k){ if(w.indexOf(k)<0) return; var c=map[k]; if(c&&cs.indexOf(c)<0) cs.push(c); });
  return cs;
}
function chipHtml(o){
  var st=chipCols(o.r,WCOL), bg=chipCols(o.r,WBG);
  if(!st.length){ st=['#585E67']; bg=['#F1F2F4']; }
  /* 地は薄い色だけ。2人のものは、左半分が薄い緑（Yui）、右半分が薄いオレンジ（Ai）。
     終わったか、まだかは、赤い点があるかどうかだけで見分ける */
  var fill=bg.length>1?'linear-gradient(90deg,'+bg[0]+' 50%,'+bg[1]+' 50%)':bg[0];
  var css='background:'+fill+';color:'+st[0]+';border-color:'+st[0];
  if(o.span){
    /* 題名は始まりの日と、週のあたまだけ。間の日は帯だけにして、1つの予定に見せる */
    var show=o.head||o.week;
    var cls='chip span'+(o.head?' s-head':'')+(o.tail?' s-tail':'')+(o.plan?' yet':' fin');
    /* 帯の縁は上下だけ。左右は続きの日で消すので、色は変数で渡す（書き込みの style に負けないように） */
    var css2='background:'+fill+';color:'+st[0]+';--bc:'+st[0];
    return '<span class="'+cls+'" style="'+css2+'" data-act="open" data-id="'+o.r.id+'" '+
      'title="'+esc(o.r.ttl)+(o.r.d2?'（'+fmtMd(o.r.d)+'〜'+fmtMd(o.r.d2)+'）':'')+'">'+
      (show?((o.plan&&o.head?'<i class="dot"></i>':'')+esc(o.r.ttl)):'&nbsp;')+'</span>';
  }
  return '<span class="chip'+(o.plan?' yet':' fin')+'" style="'+css+'" '+
    'data-act="open" data-id="'+o.r.id+'" title="'+esc(o.r.ttl)+'">'+
    (o.plan?'<i class="dot"></i>':'')+esc(o.r.ttl)+'</span>';
}
/* その日の投稿。出したものはメモつき、予定は題名と担当 */
function sheetDay(ds){
  var on=reelsOn(ds);
  var h='';
  if(!on.length) h+='<div class="empty">この日の投稿はありません</div>';

/* ============================================================
   7-b. ノート（インスタ運用の教科書）
   紙で配ると読まれない。読んだ人が「ここが分からない」と言える形にする。
   段落をなぞると、その段落のやり取りが開く。ref は 記事id|段落id
   ============================================================ */
function noteRef(nid,bid){ return nid+'|'+bid; }
function noteOf(nid){ return byId(SHOP_NOTES,nid); }
function noteCmt(n2){ var c=0; (n2.bl||[]).forEach(function(b2){ c+=msgsOf(noteRef(n2.id,b2.id)).length; }); return c; }
function noteUn(n2){ var c=0; (n2.bl||[]).forEach(function(b2){ c+=unreadOf(noteRef(n2.id,b2.id)); }); return c; }
/* 段落の数だけ数えると重いので、届いた文のほうから数える */
function unreadNote(){
  var nm=meName(), q=0;
  S.msgs.forEach(function(m){
    if(m.name===nm||(m.ref||'').indexOf('nt-')!==0) return;
    if(m.at>(S.read[rkey(m.ref)]||0)) q++; });
  return q;
}
function viewNote(){
  var h='<div class="top"><div><h1>ノート</h1></div></div>';
  var cat='';

      '<span class="nrow-r">'+(un?'<b class="nrow-u">'+un+'</b>':cm?'<i class="nrow-m">'+ic('quote')+cm+'</i>':'')+ic('arrowR')+'</span>'+
      '</button>';

}
/* 【】は強調。なぞられた文字には印を付ける。
   印の位置は、【】を取り除いた「画面に見えている文字列」で数える。
   強調の途中で印が始まると入れ子が壊れるので、境目でいったん閉じて開き直す */
function nbHtml(x,qts){
  x=(x==null?'':x)+'';
  var plain='', map=[], i;
  for(i=0;i<x.length;i++){ var c0=x.charAt(i);
    if(c0==='【'||c0==='】') continue;
    map.push(i); plain+=c0; }
  var mk=[];
  (qts||[]).forEach(function(q){
    if(!q||q.length<2) return;
    var j=plain.indexOf(q); if(j<0) return;
    mk.push([map[j], map[j+q.length-1]+1]); });
  mk.sort(function(a,b){ return a[0]-b[0]; });
  var mg=[]; mk.forEach(function(r){ var l=mg[mg.length-1];
    if(l&&r[0]<=l[1]){ if(r[1]>l[1]) l[1]=r[1]; } else mg.push([r[0],r[1]]); });
  var out='', inm=false, mi=0;
  for(i=0;i<x.length;i++){
    while(mi<mg.length&&mg[mi][1]<=i) mi++;
    var want=(mi<mg.length&&i>=mg[mi][0]&&i<mg[mi][1]);
    if(want&&!inm){ out+='<mark class="ncm">'; inm=true; }
    else if(!want&&inm){ out+='</mark>'; inm=false; }
    var ch=x.charAt(i);
    if(ch==='【'||ch==='】'){
      if(inm) out+='</mark>';
      out+=(ch==='【'?'<em>':'</em>');
      if(inm) out+='<mark class="ncm">';
      continue;
    }
    out+=esc(ch);
  }
  if(inm) out+='</mark>';
  return out;
}

/* 落とされたものから住所を取り出す。ドライブからの持ち出し方は環境で変わるので、拾える口は全部見る */
function dropUrl(dt){
  if(!dt) return '';
  var t='';
  try{ t=dt.getData('text/uri-list')||''; }catch(e){}
  if(!t){ try{ t=dt.getData('text/plain')||''; }catch(e){} }
  if(!t){ var h=''; try{ h=dt.getData('text/html')||''; }catch(e){}
    var m=h.match(/href\s*=\s*["']([^"']+)["']/i); if(m) t=m[1]; }
  /* uri-list は複数行で来ることがある。先頭の一本だけ使う */
  t=((t||'')+'').split(/[\r\n]+/).filter(function(x){ return x&&x.charAt(0)!=='#'; })[0]||'';
  return t.trim();
}
/* 「drive.google.com/…」のように https:// を書き落とすのは日常なので補う */
function fixUrl(u){
  u=((u||'')+'').trim(); if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  if(/^[a-z0-9]([a-z0-9\-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9\-]*[a-z0-9])?)+([\/?#]|$)/i.test(u)) return 'https://'+u;
  return '';
}
var UDZ=null;
function udOff(){ if(UDZ){ UDZ.classList.remove('over'); UDZ=null; } }
/* 枠を外したときに、画面ごとファイルへ飛ばされるのがいちばん困る。

  if(!z){ udOff(); return; }

document.addEventListener('drop',function(e){

/* ============================================================
   10. 同期（Firebase の REST と EventSource。SDK は使わない）
   端末ごとに自分の持ち物を丸ごと置き、相手のものは id と rev で取り込む
   ============================================================ */
function fnv(s){ var h=0x811c9dc5; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return h>>>0; }
var FBDEV='', FBES=null, FBQ=null, FBIN=false, FBST='off', FBER=0;
function fbDev(){
  if(FBDEV) return FBDEV;
  try{ FBDEV=localStorage.getItem(STORE+'_dev')||''; }catch(e){}
  if(!FBDEV){ FBDEV='d'+Math.random().toString(36).slice(2,10)+(''+now()).slice(-5);
    try{ localStorage.setItem(STORE+'_dev',FBDEV); }catch(e){} }
  return FBDEV;
}
function fbSet(s){ if(FBST===s) return; FBST=s; paintSync(); }
function paintSync(){
  var el=$('#sync'); if(!el) return;
  el.className='sync '+(FBST==='on'?'on':FBST==='err'?'err':'');
  $('#syncTx').textContent=!FB_URL?'手元だけ':FBST==='on'?'同期中':FBST==='err'?'つながらない':'同期';
}
function payload(){
  /* 見本（sd）は送らない。相手の端末にも同じ見本があり、二重になる */
  return {v:1,at:now(),shop:S.shop,
    A:S.accounts.filter(function(x){ return !x.sd; }),
    R:S.reels.filter(function(x){ return !x.sd; }),   /* d2（終わりの日）も一緒に回る */
    M:S.msgs, L:(S.log||[]).slice(-200), G:S.goal, sig:fnv(SECRET)};
}
function fbSend(){
  if(!FB_URL||FBIN||!S) return;
  clearTimeout(FBQ);
  FBQ=setTimeout(function(){
    var body; try{ body=JSON.stringify({at:now(),by:meName(),j:JSON.stringify(payload())}); }catch(e){ return; }
    fetch(FB_URL+'/'+FB_ROOM+'/d/'+fbDev()+'.json',{method:'PUT',body:body})
      .then(function(r){ if(r.ok){ FBER=0; S.lastShare=now(); save0(); fbSet('on'); } else fbSet('err'); })
      .catch(function(){ fbSet('err'); });
  },1500);
}
/* 取り込み。id が同じなら rev の新しいほうが勝つ。項目（sec）は項目ごとに比べる */
function mergeIn(d){
  if(!d||d.sig!==fnv(SECRET)) return false;
  var hit=false;
  (d.A||[]).forEach(function(x){ var ex=byId(S.accounts,x.id);
    if(!ex){ S.accounts.push(x); hit=true; } else if((x.rev||0)>(ex.rev||0)){ Object.assign(ex,x); hit=true; } });
  (d.R||[]).forEach(function(x){
    fixReel(x);
    var ex=byId(S.reels,x.id);
    if(!ex){ S.reels.push(x); hit=true; return; }
    if((x.rev||0)>(ex.rev||0)){
      var keep=ex.sec; Object.assign(ex,x); ex.sec=keep; hit=true;
    }
    SECS.map(function(s){ return s.k; }).concat(['after']).forEach(function(k){ var a=x.sec[k], b=ex.sec[k];
      if(a&&b&&(a.rev||0)>(b.rev||0)){ Object.assign(b,a); hit=true; } });
  });
  var have={}; S.msgs.forEach(function(m){ have[m.id]=1; });
  (d.M||[]).forEach(function(m){ if(m&&m.id&&!have[m.id]){ S.msgs.push(m); have[m.id]=1; hit=true; } });
  /* 更新のお知らせも同じように、まだ持っていないものだけ足す */
  var hl={}; (S.log||[]).forEach(function(e){ hl[e.id]=1; });
  (d.L||[]).forEach(function(e){ if(e&&e.id&&!hl[e.id]){ S.log.push(e); hl[e.id]=1; hit=true; } });
  if(S.log.length>400){ S.log.sort(function(a,b){ return a.at-b.at; }); S.log=S.log.slice(-400); }
  if(d.shop&&d.shop!==S.shop){ S.shop=d.shop; hit=true; }
  if(d.G&&(d.G.rev||0)>((S.goal&&S.goal.rev)||0)){
    var keep=(S.goal&&S.goal.mt)||{};
    S.goal=d.G;
    if(!S.goal.mt||typeof S.goal.mt!=='object'){
      S.goal.mt={}; Object.keys(keep).forEach(function(x){ S.goal.mt[x]=keep[x]; });
      if(S.goal.t) S.goal.mt[today().slice(0,7)]=S.goal.t;
    }
    hit=true;
  }
  return hit;
}
function fbTake(path,data){
  if(data==null||!S) return;
  var got=[];
  if(path==='/'){ Object.keys(data).forEach(function(k){ if(k!==fbDev()&&data[k]) got.push(data[k]); }); }
  else{ var k=(path||'').replace(/^\//,'').split('/')[0]; if(!k||k===fbDev()) return; got.push(data); }
  var hit=false; FBIN=true;
  try{ got.forEach(function(x){ if(!x||typeof x.j!=='string') return; var d=null;
    try{ d=JSON.parse(x.j); }catch(e2){} if(d&&mergeIn(d)) hit=true; }); }catch(e){}
  FBIN=false; fbSet('on');
  if(hit){ S.gotAt=now(); save0(); if(!$('#modal').innerHTML) render(); else render(); }
}
function fbStart(){
  if(!FB_URL||FBES) return;
  try{ FBES=new EventSource(FB_URL+'/'+FB_ROOM+'/d.json'); }catch(e){ fbSet('err'); return; }
  FBES.addEventListener('open',function(){ FBER=0; fbSet('on'); fbSend(); });
  FBES.addEventListener('error',function(){
    fbSet('err'); if(FBES){ try{ FBES.close(); }catch(e){} FBES=null; }
    FBER++; setTimeout(fbStart,Math.min(60000,3000*FBER));
  });
  ['put','patch'].forEach(function(k){ FBES.addEventListener(k,function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; } fbTake(m.path,m.data); }); });
}

/* ---- 版の見比べ ----
   ブラウザは前に開いた版をしばらく持ち続けるので、直しても画面が古いままになる。
   配る版には公開のたびに印（BUILD）が入る。置いてある版の印と違えば、新しい版が出ている */
var BUILD='20260923-094302', VERNEW=false;
function verCheck(){
  if(BUILD==='dev'||VERNEW||location.protocol==='file:'||!window.fetch) return;
  fetch(location.pathname+'?v='+now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
    var m=(t||'').match(/var BUILD='([^']+)'/);
    if(!m||m[1]===BUILD||m[1]==='dev') return;
    VERNEW=true;
    /* 書きかけ（シートが開いている・入力中）なら、勝手には切り替えない */
    var busy=!!$('#modal').innerHTML||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName));
    if(!busy){ location.reload(); return; }
    var bar=document.createElement('button');
    bar.className='verbar'; bar.type='button';
    bar.textContent='新しい版があります。押すと切り替わります';
    bar.addEventListener('click',function(){ location.reload(); });
    document.body.appendChild(bar);
  }).catch(function(){});
}

/* ============================================================
   11. 起動
   ============================================================ */
load(); render(); fbStart();
/* いまの時刻は、描き直さなくても進む */
setInterval(clkTick,20000);
/* 新しい版が出ていないか、裏でときどき見比べる */
verCheck(); setInterval(verCheck,3*60*1000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) verCheck(); });
if(!me()) sheetMe();
})();
</script>

<script>
(function(){
  /* 合言葉は形を変えて持つ。読めば分かるところに、そのまま書かない */
  function fnv(t){ var h=0x811c9dc5;
    for(var i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; }
    return h>>>0; }
  var KEY='jltGateOK', H=4274414375;
  var g=document.getElementById('gate'), inp=document.getElementById('gatePin'),
      go=document.getElementById('gateGo'), ng=document.getElementById('gateNg');
  function open_(){ g.hidden=true; document.documentElement.style.overflow=''; try{ localStorage.setItem(KEY,'1'); }catch(e){} }
  var ok=false; try{ ok=localStorage.getItem(KEY)==='1'; }catch(e){}
  if(ok){ open_(); return; }
  document.documentElement.style.overflow='hidden';
  function tryIt(){
    var v=(inp.value||'').trim();
    if(!v){ inp.focus(); return; }
    if(fnv(v)===H){ open_(); return; }
    ng.textContent='合言葉が違います。日本チームに確認してください。';
    inp.value=''; inp.focus();
  }
  go.addEventListener('click',tryIt);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') tryIt(); });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },120);
})();
</script>
